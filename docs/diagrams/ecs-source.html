          release: release_rx,\n                contents: console_contents.clone(),\n                first_write: true,\n            }),\n            \"controlled-console\".to_owned(),\n            \"demo-log-test-console\",\n        )\n        .unwrap();\n        let subscriber = tracing_subscriber::registry()\n            .with(\n                tracing_subscriber::fmt::layer()\n                    .with_ansi(false)\n                    .with_writer(file.writer.clone()),\n            )\n            .with(\n                tracing_subscriber::fmt::layer()\n                    .with_ansi(false)\n                    .with_writer(console.writer.clone()),\n            );\n        let dispatch = bevy::log::tracing::Dispatch::new(subscriber);\n        let initial_dispatch = dispatch.clone();\n        let initial = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026initial_dispatch, || {\n                info!(target: \"demo::test\", \"Blocking console entered\");\n            });\n        });\n        entered_rx.recv_timeout(Duration::from_secs(2)).unwrap();\n        let file_writer = file.writer.clone();\n        let producer = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026dispatch, || {\n                info!(target: \"demo::gameplay\", grounded_after = true, \"Character grounded state changed\");\n                info!(target: \"demo::gameplay\", \"Character landed\");\n                info!(target: \"demo::session_log\", \"Session exited normally\");\n            });\n            done_tx.send(file_writer.flush_output()).unwrap();\n        });\n        // 控制台门闩保持关闭时，生产与文件刷新都必须完成。\n        let completed = done_rx.recv_timeout(Duration::from_secs(2));\n        let file_contents = fs::read_to_string(\u0026path).unwrap();\n        release_tx.send(()).unwrap();\n        initial.join().unwrap();\n        producer.join().unwrap();\n        file.shutdown().unwrap();\n        console.shutdown().unwrap();\n        let console_contents = String::from_utf8(console_contents.lock().unwrap().clone()).unwrap();\n        fs::remove_file(\u0026path).unwrap();\n        remove_test_directory(directory);\n\n        completed\n            .expect(\"Blocked console stalled file or producer\")\n            .unwrap();\n        for contents in [file_contents, console_contents] {\n            let mut previous = 0;\n            for expected in [\n                \"Blocking console entered\",\n                \"Character grounded state changed\",\n                \"Character landed\",\n                \"Session exited normally\",\n            ] {\n                let offset = contents.find(expected).unwrap();\n                assert!(offset \u003e= previous, \"Log order changed: {contents}\");\n                previous = offset;\n                assert_eq!(contents.matches(expected).count(), 1);\n            }\n        }\n    }\n\n    #[test]\n    fn shutdown_drains_all_queued_records() {\n        let directory = test_directory();\n        let guard = create_session_file(\u0026directory).unwrap();\n        let path = guard.writer.path.as_ref().clone();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(guard.writer.clone())\n            .finish();\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            for sequence in 0..1_000 {\n                info!(target: \"demo::test\", sequence, \"Queued state change\");\n            }\n        });\n        // 不提前刷新，直接析构必须排空所有已提交记录并关闭文件。\n        drop(guard);\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        assert_eq!(contents.lines().count(), 1_000);\n        for (sequence, line) in contents.lines().enumerate() {\n            assert!(line.ends_with(\u0026format!(\"sequence={sequence}\")));\n        }\n        fs::remove_file(path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn shutdown_rejects_new_records_and_drains_accepted_records() {\n        let (entered_tx, entered_rx) = mpsc::channel();\n        let (release_tx, release_rx) = mpsc::channel();\n        let (closed_tx, closed_rx) = mpsc::channel();\n        let contents = Arc::new(Mutex::new(Vec::new()));\n        let mut worker = LogWorker::spawn(\n            Box::new(BlockedSink {\n                entered: entered_tx,\n                release: release_rx,\n                contents: contents.clone(),\n                first_write: true,\n            }),\n            \"controlled-close-sink\".to_owned(),\n            \"demo-log-test-close\",\n        )\n        .unwrap();\n        worker.writer.write_all(b\"Accepted record\\n\").unwrap();\n        entered_rx.recv_timeout(Duration::from_secs(2)).unwrap();\n        let mut writer = worker.writer.clone();\n        let closing = thread::spawn(move || {\n            let result = worker.shutdown();\n            closed_tx.send(result).unwrap();\n        });\n        // 等到关闭命令入队；设备仍在门闩中，所以不能依赖 join 已完成才检测拒收。\n        let deadline = std::time::Instant::now() + Duration::from_secs(2);\n        let mut closed = false;\n        while std::time::Instant::now() \u003c deadline {\n            closed = writer.queue.lock().unwrap().closing;\n            if closed {\n                break;\n            }\n            thread::yield_now();\n        }\n        let rejected = writer.write_all(b\"Rejected record\\n\");\n        let waiting_for_drain = matches!(closed_rx.try_recv(), Err(mpsc::TryRecvError::Empty));\n        release_tx.send(()).unwrap();\n        closing.join().unwrap();\n        closed_rx.recv().unwrap().unwrap();\n        assert!(closed, \"Shutdown was not queued\");\n        assert!(\n            waiting_for_drain,\n            \"Shutdown did not wait for the accepted record\"\n        );\n        assert_eq!(rejected.unwrap_err().kind(), io::ErrorKind::BrokenPipe);\n        assert_eq!(*contents.lock().unwrap(), b\"Accepted record\\n\");\n    }\n\n    #[derive(Clone, Copy)]\n    enum Fault {\n        Write,\n        Flush,\n        Sync,\n        Panic,\n    }\n\n    struct FaultSink(Fault);\n\n    impl Write for FaultSink {\n        fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n            match self.0 {\n                Fault::Write =\u003e Err(io::Error::new(io::ErrorKind::StorageFull, \"Test disk full\")),\n                Fault::Panic =\u003e panic!(\"Test writer panic\"),\n                _ =\u003e Ok(buffer.len()),\n            }\n        }\n\n        fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            match self.0 {\n                Fault::Flush =\u003e Err(io::Error::other(\"Test flush failure\")),\n                _ =\u003e Ok(()),\n            }\n        }\n    }\n\n    impl LogSink for FaultSink {\n        fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            match self.0 {\n                Fault::Sync =\u003e Err(io::Error::other(\"Test sync failure\")),\n                _ =\u003e self.flush(),\n            }\n        }\n    }\n\n    #[test]\n    fn output_failures_are_reported_and_workers_join() {\n        for (fault, expected) in [\n            (Fault::Write, \"Test disk full\"),\n            (Fault::Flush, \"Test flush failure\"),\n            (Fault::Sync, \"Test sync failure\"),\n            (Fault::Panic, \"Test writer panic\"),\n        ] {\n            let mut worker = LogWorker::spawn(\n                Box::new(FaultSink(fault)),\n                \"controlled-failed-sink\".to_owned(),\n                \"demo-log-test-failure\",\n            )\n            .unwrap();\n            worker.writer.write_all(b\"Critical state change\\n\").unwrap();\n            let error = worker.writer.barrier(Barrier::Sync).unwrap_err();\n            assert!(error.to_string().contains(expected), \"{error}\");\n            assert!(error.to_string().contains(\"controlled-failed-sink\"));\n            assert!(worker.writer.write_all(b\"Next state\\n\").is_err());\n            assert!(\n                worker\n                    .shutdown()\n                    .unwrap_err()\n                    .to_string()\n                    .contains(expected)\n            );\n            assert!(worker.thread.is_none());\n        }\n    }\n\n    struct SyncSink {\n        contents: Arc\u003cMutex\u003cVec\u003cu8\u003e\u003e\u003e,\n        synced_contents: Arc\u003cMutex\u003cVec\u003cu8\u003e\u003e\u003e,\n    }\n\n    impl Write for SyncSink {\n        fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n            // 模拟短写，确认后台使用 write_all 而不是忽略未写完的尾部。\n            let length = buffer.len().min(7);\n            self.contents\n                .lock()\n                .unwrap()\n                .extend_from_slice(\u0026buffer[..length]);\n            Ok(length)\n        }\n\n        fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            Ok(())\n        }\n    }\n\n    impl LogSink for SyncSink {\n        fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            *self.synced_contents.lock().unwrap() = self.contents.lock().unwrap().clone();\n            Ok(())\n        }\n    }\n\n    #[test]\n    fn sync_barrier_waits_for_complete_prior_records() {\n        let contents = Arc::new(Mutex::new(Vec::new()));\n        let synced_contents = Arc::new(Mutex::new(Vec::new()));\n        let mut worker = LogWorker::spawn(\n            Box::new(SyncSink {\n                contents,\n                synced_contents: synced_contents.clone(),\n            }),\n            \"controlled-sync-sink\".to_owned(),\n            \"demo-log-test-sync\",\n        )\n        .unwrap();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(worker.writer.clone())\n            .finish();\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            info!(target: \"demo::test\", \"Prior state change\");\n            error!(target: \"demo::session_log\", \"Session panicked\");\n        });\n        worker.writer.barrier(Barrier::Sync).unwrap();\n        let synced = String::from_utf8(synced_contents.lock().unwrap().clone()).unwrap();\n        assert_eq!(synced.lines().count(), 2);\n        assert!(\n            synced.find(\"Prior state change\").unwrap() \u003c synced.find(\"Session panicked\").unwrap()\n        );\n        worker.shutdown().unwrap();\n    }\n\n    #[test]\n    fn log_plugin_records_session_lifecycle() {\n        // 子进程只运行本测试并注册 LogPlugin，隔离全局 subscriber 和 panic hook。\n        // 不注册窗口、渲染或玩法插件，也不调用 App::run。\n        if std::env::var_os(\"DEMO_LOG_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let guard = prepare(\u0026mut app).unwrap();\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            info!(target: \"bevy::test\", \"Test engine initialized\");\n            info!(target: \"demo::test\", entity_id = 42, reason = \"pickup\", \"Test event recorded\");\n            bevy::log::debug!(target: \"demo::test\", \"Filtered debug event\");\n            bevy::log::warn!(target: \"wgpu\", \"Filtered graphics warning\");\n            assert!(std::panic::catch_unwind(|| panic!(\"Test panic context\")).is_err());\n            // panic hook 返回前已同步文件，不能依赖随后退出时的刷新才看到异常。\n            let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n            assert!(contents.contains(\"Session panicked\"));\n            assert!(contents.contains(\"Test panic context\"));\n            // 安装真实 Session hook 后，日志工作线程自身异常仍能结束，不能自等 Sync。\n            let mut failed_worker = LogWorker::spawn(\n                Box::new(FaultSink(Fault::Panic)),\n                \"controlled-hook-panic\".to_owned(),\n                \"demo-log-test-hook-panic\",\n            )\n            .unwrap();\n            failed_worker.writer.write_all(b\"Worker panic\\n\").unwrap();\n            assert!(failed_worker.writer.flush_output().is_err());\n            assert!(failed_worker.shutdown().is_err());\n            guard.record_exit(\u0026AppExit::Success).unwrap();\n            guard.record_exit(\u0026AppExit::error()).unwrap();\n            return;\n        }\n\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::log_plugin_records_session_lifecycle\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_TEST_CHILD\", \"1\")\n            .env_remove(\"RUST_LOG\")\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        for expected in [\n            \"Session started\",\n            \"version=\",\n            \"bevy_version=\",\n            \"session_id=\",\n            \"Test engine initialized\",\n            \"entity_id=42\",\n            \"reason=\\\"pickup\\\"\",\n            \"Session panicked\",\n            \"Test panic context\",\n            \"Session exited normally\",\n            \"Session exited with an error\",\n            \"exit_code=1\",\n        ] {\n            assert!(\n                contents.contains(expected),\n                \"Missing {expected}: {contents}\"\n            );\n        }\n        assert!(!contents.contains(\"Filtered debug event\"));\n        assert!(!contents.contains(\"Filtered graphics warning\"));\n        assert!(!contents.contains('\\u{1b}'));\n        assert!(stderr.contains(\"Session started\"));\n        assert!(stderr.contains(\"Test event recorded\"));\n        assert!(!stderr.contains(\"Could not set global\"));\n\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn log_plugin_preserves_explicit_rust_log_filter() {\n        if std::env::var_os(\"DEMO_LOG_FILTER_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let guard = prepare(\u0026mut app).unwrap();\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            info!(target: \"demo::quiet\", \"Filtered explicit info event\");\n            bevy::log::debug!(target: \"demo::test\", \"Enabled explicit debug event\");\n            bevy::log::warn!(target: \"wgpu\", \"Enabled explicit graphics warning\");\n            guard.record_exit(\u0026AppExit::Success).unwrap();\n            return;\n        }\n\n        // 子进程避免注册全局 subscriber；两路格式层应共享同一 Bevy EnvFilter。\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::log_plugin_preserves_explicit_rust_log_filter\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_FILTER_TEST_CHILD\", \"1\")\n            .env(\n                \"RUST_LOG\",\n                \"warn,demo::test=debug,demo::session_log=info,wgpu=warn\",\n            )\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        for contents in [\u0026contents, stderr.as_ref()] {\n            assert!(contents.contains(\"Enabled explicit debug event\"));\n            assert!(contents.contains(\"Enabled explicit graphics warning\"));\n            assert!(contents.contains(\"Session exited normally\"));\n            assert!(!contents.contains(\"Filtered explicit info event\"));\n        }\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn failed_console_does_not_fallback_to_synchronous_stderr_or_block_panic_file_sync() {\n        if std::env::var_os(\"DEMO_LOG_FAILED_CONSOLE_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let mut guard = prepare(\u0026mut app).unwrap();\n            // 保留真实文件与 panic hook，只用可控 Write 故障替换控制台设备。\n            guard.console_worker.shutdown().unwrap();\n            guard.console_worker = LogWorker::spawn(\n                Box::new(FaultSink(Fault::Write)),\n                \"controlled-failed-console\".to_owned(),\n                \"demo-log-test-failed-console\",\n            )\n            .unwrap();\n            guard.console = ConsoleWriter(guard.console_worker.writer.clone());\n            app.insert_resource(guard.console.clone());\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            assert!(guard.console.0.flush_output().is_err());\n            // 已知设备故障后仍走实际格式化路径，文件必须收到完整事件。\n            info!(target: \"demo::test\", \"Info event after console failure\");\n            error!(target: \"demo::test\", \"Error event after console failure\");\n            assert!(std::panic::catch_unwind(|| panic!(\"Panic after console failure\")).is_err());\n            let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n            for expected in [\n                \"Info event after console failure\",\n                \"Error event after console failure\",\n                \"Session panicked\",\n                \"Panic after console failure\",\n            ] {\n                assert!(\n                    contents.contains(expected),\n                    \"Missing {expected}: {contents}\"\n                );\n            }\n            // 故障保持可观察，不能为避免同步回退而把关闭结果误报为成功。\n            let error = guard.record_exit(\u0026AppExit::Success).unwrap_err();\n            assert!(error.to_string().contains(\"controlled-failed-console\"));\n            return;\n        }\n\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::failed_console_does_not_fallback_to_synchronous_stderr_or_block_panic_file_sync\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_FAILED_CONSOLE_TEST_CHILD\", \"1\")\n            .env_remove(\"RUST_LOG\")\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        assert!(!stderr.contains(\"[tracing-subscriber]\"), \"{stderr}\");\n        assert!(!stderr.contains(\"Unable to write\"), \"{stderr}\");\n        assert!(\n            stderr.contains(\"Failed to close console logging\"),\n            \"{stderr}\"\n        );\n        assert!(stderr.contains(\"Test disk full\"), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        assert!(contents.contains(\"Session exited normally\"));\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn independent_sessions_preserve_previous_logs() {\n        let directory = test_directory();\n        let first = create_session_file(\u0026directory).unwrap();\n        let mut first_writer = first.writer.clone();\n        first_writer.write_all(b\"first session\\n\").unwrap();\n        first_writer.flush().unwrap();\n        let second = create_session_file(\u0026directory).unwrap();\n\n        assert_ne!(first.session_id, second.session_id);\n        assert_ne!(first.writer.path, second.writer.path);\n        // 刷新屏障保证磁盘已收到记录，后续会话也不会覆盖前次内容。\n        assert_eq!(\n            fs::read_to_string(first.writer.path.as_ref()).unwrap(),\n            \"first session\\n\"\n        );\n        assert!(\n            first\n                .writer\n                .path\n                .file_name()\n                .unwrap()\n                .to_str()\n                .unwrap()\n                .starts_with(\"unix-\")\n        );\n\n        let first_path = first.writer.path.as_ref().clone();\n        let second_path = second.writer.path.as_ref().clone();\n        drop(first_writer);\n        drop(first);\n        drop(second);\n        fs::remove_file(first_path).unwrap();\n        fs::remove_file(second_path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn tracing_events_include_time_level_target_and_fields() {\n        let directory = test_directory();\n        let guard = create_session_file(\u0026directory).unwrap();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(guard.writer.clone())\n            .finish();\n        // 局部 subscriber 不修改进程级日志设施，也不创建游戏 App 或窗口。\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            info!(target: \"demo::test\", entity_id = 42, reason = \"pickup\", \"Test event recorded\");\n        });\n        guard.writer.flush_file().unwrap();\n        let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n        assert!(contents.contains(\"INFO\"));\n        assert!(contents.contains(\"demo::test\"));\n        assert!(contents.contains(\"entity_id=42\"));\n        assert!(contents.contains(\"pickup\"));\n        assert!(contents.contains('T') \u0026\u0026 contents.contains('Z'));\n\n        let path = guard.writer.path.as_ref().clone();\n        drop(guard);\n        fs::remove_file(path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    fn test_directory() -\u003e PathBuf {\n        let directory = Path::new(env!(\"CARGO_MANIFEST_DIR\"))\n            .join(\"tmp\")\n            .join(format!(\"session-log-test-{}\", Uuid::new_v4()));\n        fs::create_dir_all(\u0026directory).unwrap();\n        directory\n    }\n\n    fn remove_test_directory(directory: PathBuf) {\n        // Windows 删除文件成功后，目录项仍可能短暂处于待删除状态；只重试非递归清理。\n        let deadline = std::time::Instant::now() + Duration::from_secs(2);\n        loop {\n            match fs::remove_dir(\u0026directory) {\n                Err(error)\n                    if error.kind() == io::ErrorKind::DirectoryNotEmpty\n                        \u0026\u0026 std::time::Instant::now() \u003c deadline =\u003e\n                {\n                    thread::sleep(Duration::from_millis(10));\n                }\n                result =\u003e {\n                    result.unwrap();\n                    return;\n                }\n            }\n        }\n    }\n}\n"},{"path":"src/settings.rs","text":"//! 加载玩家设置，并通过帧间等待限制渲染循环；不改变固定步模拟频率。\n\nuse std::{\n    fs, io,\n    num::NonZeroU32,\n    path::Path,\n    time::{Duration, Instant},\n};\n\nuse bevy::{prelude::*, time::TimeSystems};\nuse serde::{Deserialize, Deserializer, de::Error};\n\n/// 全局玩家设置；非零类型保证帧率上限始终能够转换为等待间隔。\n#[derive(Resource, Debug, Deserialize)]\n#[serde(default, deny_unknown_fields)]\npub struct GameSettings {\n    /// 渲染循环每秒最多更新的次数，默认 60，配置值不得低于 60；不影响 `Time\u003cFixed\u003e`。\n    #[serde(deserialize_with = \"deserialize_max_fps\")]\n    pub max_fps: NonZeroU32,\n    /// 自由视角的鼠标灵敏度与纵轴方向。\n    pub camera: CameraSettings,\n}\n\nimpl Default for GameSettings {\n    fn default() -\u003e Self {\n        Self {\n            max_fps: NonZeroU32::new(60).unwrap(),\n            camera: CameraSettings::default(),\n        }\n    }\n}\n\n/// 自由视角配置；旧配置缺少本节或字段时使用默认值。\n#[derive(Debug, Clone, Copy, Deserialize)]\n#[serde(default, deny_unknown_fields)]\npub struct CameraSettings {\n    /// 每像素对应的旋转弧度，必须是有限的正数。\n    #[serde(deserialize_with = \"deserialize_mouse_sensitivity\")]\n    pub mouse_sensitivity: f32,\n    /// 是否反转鼠标纵向移动对应的俯仰方向。\n    pub invert_y: bool,\n}\n\nimpl Default for CameraSettings {\n    fn default() -\u003e Self {\n        Self {\n            mouse_sensitivity: 0.003,\n            invert_y: false,\n        }\n    }\n}\n\nfn deserialize_max_fps\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cNonZeroU32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = NonZeroU32::deserialize(deserializer)?;\n    // 在加载边界检查下限，避免低于支持范围的配置进入限帧系统。\n    if value.get() \u003c 60 {\n        return Err(D::Error::custom(\"max_fps must be at least 60\"));\n    }\n    Ok(value)\n}\n\nfn deserialize_mouse_sensitivity\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cf32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = f32::deserialize(deserializer)?;\n    // 在加载边界拒绝无效角速度，避免非有限值进入 Transform 的旋转计算。\n    if !value.is_finite() || value \u003c= 0.0 {\n        return Err(D::Error::custom(\n            \"camera mouse_sensitivity must be finite and greater than zero\",\n        ));\n    }\n    Ok(value)\n}\n\nimpl GameSettings {\n    /// 读取 JSON 设置；缺失或读取、解析失败时记录原因并使用默认值，不覆盖原文件。\n    pub fn load(path: \u0026Path) -\u003e Self {\n        let settings = match read_settings(path) {\n            Ok(settings) =\u003e settings,\n            Err(error) if error.kind() == io::ErrorKind::NotFound =\u003e {\n                info!(\n                    target: \"demo::settings\",\n                    path = %path.display(),\n                    reason = \"settings_file_missing\",\n                    \"Using default game settings\"\n                );\n                Self::default()\n            }\n            Err(error) =\u003e {\n                warn!(\n                    target: \"demo::settings\",\n                    operation = \"load_settings\",\n                    path = %path.display(),\n                    %error,\n                    fallback_max_fps = Self::default().max_fps.get(),\n                    fallback_camera_mouse_sensitivity = CameraSettings::default().mouse_sensitivity,\n                    fallback_camera_invert_y = CameraSettings::default().invert_y,\n                    reason = \"settings_load_failed\",\n                    \"Failed to load game settings; using defaults\"\n                );\n                Self::default()\n            }\n        };\n        info!(\n            target: \"demo::settings\",\n            path = %path.display(),\n            max_fps = settings.max_fps.get(),\n            camera_mouse_sensitivity = settings.camera.mouse_sensitivity,\n            camera_invert_y = settings.camera.invert_y,\n            \"Game settings initialized\"\n        );\n        settings\n    }\n}\n\n/// 注册帧率限制系统；设置资源也可由后续设置界面在运行期间修改。\npub struct SettingsPlugin;\n\nimpl Plugin for SettingsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.init_resource::\u003cGameSettings\u003e()\n            // 等待在时间与业务系统之前完成；固定步仍由引擎时钟驱动，不改写模拟时间步。\n            .add_systems(First, limit_frame_rate.before(TimeSystems));\n    }\n}\n\n/// 等待和日志去重只属于帧率系统，使用 Local 而非共享的游戏状态。\n#[derive(Default)]\nstruct FramePacing {\n    last_started: Option\u003cInstant\u003e,\n    applied_max_fps: Option\u003cNonZeroU32\u003e,\n}\n\nfn read_settings(path: \u0026Path) -\u003e io::Result\u003cGameSettings\u003e {\n    let contents = fs::read_to_string(path)?;\n    serde_json::from_str(\u0026contents)\n        .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))\n}\n\n/// 只补足上一帧起点以来剩余的间隔；计算本身已超时时立即继续，不叠加等待。\nfn limit_frame_rate(settings: Res\u003cGameSettings\u003e, mut pacing: Local\u003cFramePacing\u003e) {\n    if pacing.applied_max_fps != Some(settings.max_fps) {\n        info!(\n            target: \"demo::settings\",\n            max_fps_before = ?pacing.applied_max_fps.map(NonZeroU32::get),\n            max_fps_after = settings.max_fps.get(),\n            reason = if pacing.applied_max_fps.is_some() {\n                \"settings_changed\"\n            } else {\n                \"initialization\"\n            },\n            \"Frame rate limit applied\"\n        );\n        pacing.applied_max_fps = Some(settings.max_fps);\n    }\n\n    if let Some(last_started) = pacing.last_started {\n        let wait = remaining_frame_time(last_started.elapsed(), settings.max_fps);\n        if !wait.is_zero() {\n            std::thread::sleep(wait);\n        }\n    }\n    // 卡顿后从实际起点重新计时，避免为了追赶期限连续提交超出上限的帧。\n    pacing.last_started = Some(Instant::now());\n}\n\nfn remaining_frame_time(elapsed: Duration, max_fps: NonZeroU32) -\u003e Duration {\n    // 向上取整到纳秒，避免舍入使允许的间隔略短于帧率上限要求。\n    let interval = Duration::from_nanos(1_000_000_000_u64.div_ceil(u64::from(max_fps.get())));\n    interval.saturating_sub(elapsed)\n}\n\n#[cfg(test)]\nmod tests {\n    use bevy::time::{TimePlugin, TimeUpdateStrategy};\n    use uuid::Uuid;\n\n    use super::*;\n\n    #[test]\n    fn defaults_and_json_validate_frame_rate_limit() {\n        assert_eq!(GameSettings::default().max_fps.get(), 60);\n        let omitted: GameSettings = serde_json::from_str(\"{}\").unwrap();\n        assert_eq!(omitted.max_fps.get(), 60);\n        for max_fps in [60, 120, 144] {\n            let json = format!(r#\"{{\"max_fps\": {max_fps}}}\"#);\n            let custom: GameSettings = serde_json::from_str(\u0026json).unwrap();\n            assert_eq!(custom.max_fps.get(), max_fps);\n        }\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n            r#\"{\"max_fps\": -60}\"#,\n            r#\"{\"max_fps\": 60.5}\"#,\n            r#\"{\"max_fps\": \"120\"}\"#,\n            r#\"{\"max_fp\": 120}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n        }\n    }\n\n    #[test]\n    fn camera_settings_default_legacy_and_custom_values() {\n        let defaults = GameSettings::default();\n        assert_eq!(defaults.camera.mouse_sensitivity, 0.003);\n        assert!(!defaults.camera.invert_y);\n        for legacy in [\"{}\", r#\"{\"max_fps\": 144}\"#, r#\"{\"camera\": {}}\"#] {\n            let settings: GameSettings = serde_json::from_str(legacy).unwrap();\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n        }\n        let custom: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"mouse_sensitivity\": 0.006, \"invert_y\": true}}\"#)\n                .unwrap();\n        assert_eq!(custom.camera.mouse_sensitivity, 0.006);\n        assert!(custom.camera.invert_y);\n        let partial: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"invert_y\": true}}\"#).unwrap();\n        assert_eq!(partial.camera.mouse_sensitivity, 0.003);\n        assert!(partial.camera.invert_y);\n    }\n\n    #[test]\n    fn invalid_camera_settings_fall_back_without_overwriting_file() {\n        let path =\n            std::env::temp_dir().join(format!(\"demo-camera-settings-{}.json\", Uuid::new_v4()));\n        for invalid in [\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 0}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": -0.003}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 1e39}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": \"NaN\"}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"invert_y\": 1}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"sensitivity\": 0.003}}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n            fs::write(\u0026path, invalid).unwrap();\n            let settings = GameSettings::load(\u0026path);\n            assert_eq!(settings.max_fps.get(), 60);\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn settings_file_and_failure_fallback_preserve_original_contents() {\n        let path = std::env::temp_dir().join(format!(\"demo-settings-{}.json\", Uuid::new_v4()));\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n        assert!(!path.exists());\n        fs::write(\u0026path, r#\"{\"max_fps\": 240}\"#).unwrap();\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 240);\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n        ] {\n            fs::write(\u0026path, invalid).unwrap();\n            assert_eq!(\n                read_settings(\u0026path).unwrap_err().kind(),\n                io::ErrorKind::InvalidData\n            );\n            assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn pacing_waits_only_for_remaining_time_and_never_catches_up() {\n        let limit = NonZeroU32::new(120).unwrap();\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), limit),\n            Duration::from_nanos(5_333_334)\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(20), limit),\n            Duration::ZERO\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), NonZeroU32::new(60).unwrap()),\n            Duration::from_nanos(13_666_667)\n        );\n    }\n\n    #[test]\n    fn changing_render_limit_preserves_fixed_simulation_timestep() {\n        // 只运行最小 App；手动推进时间，不加载窗口、渲染器或完整游戏。\n        let mut app = App::new();\n        app.add_plugins(TimePlugin)\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_millis(\n                20,\n            )))\n            .add_plugins(SettingsPlugin);\n        app.update();\n        let timestep = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().timestep();\n        app.world_mut().resource_mut::\u003cGameSettings\u003e().max_fps = NonZeroU32::new(120).unwrap();\n        app.update();\n        let fixed = app.world().resource::\u003cTime\u003cFixed\u003e\u003e();\n        assert_eq!(fixed.timestep(), timestep);\n        assert!((1.0 / fixed.timestep().as_secs_f64() - 60.0).abs() \u003c 0.001);\n        assert!(fixed.elapsed() \u003e= timestep);\n    }\n}\n"},{"path":"src/startup_log.rs","text":"//! 汇总启动时的配置与环境日志，沿用统一会话日志设施。\n\nuse bevy::prelude::*;\n\nuse crate::gameplay::PrototypeConfig;\n\n/// 注册一次性的启动日志；玩法配置与固定时间步由应用组装时提供。\npub struct StartupLogPlugin;\n\nimpl Plugin for StartupLogPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        // 四条日志只报告配置，不依赖场景实体，也不建立彼此的执行顺序。\n        app.add_systems(\n            Startup,\n            (\n                log_configuration,\n                log_simulation_timestep,\n                log_pose_synchronization,\n                log_world_inspector,\n            ),\n        );\n    }\n}\n\n/// 记录实际玩法配置；显式保留迁移前的日志分类，兼容现有过滤设置。\nfn log_configuration(config: Res\u003cPrototypeConfig\u003e) {\n    // 刚体与持握方式属于本次玩法配置，合并到原有记录便于沿用日志筛选。\n    info!(target: \"demo::gameplay\", ?config,\n        physics_engine = \"avian3d\", physics_version = \"0.7.0\",\n        character_body = \"dynamic\", parcel_body = \"dynamic\",\n        grip_mode = \"spring_damper\", release_mode = \"preserve_velocity\",\n        \"Prototype gameplay initialized\");\n}\n\n/// 记录模拟频率，直接读取应用配置的固定时间步。\nfn log_simulation_timestep(time: Res\u003cTime\u003cFixed\u003e\u003e) {\n    info!(\n        target: \"demo::settings\",\n        simulation_hz = 1.0 / time.timestep().as_secs_f64(),\n        \"Fixed simulation timestep initialized\"\n    );\n}\n\n/// 将模拟和逐帧姿态同步的调度约定写入统一会话日志，便于排查帧率相关问题。\nfn log_pose_synchronization() {\n    info!(target: \"demo::camera\", simulation_schedule = \"FixedUpdate\",\n        grip_force_schedule = \"FixedUpdate\", physics_schedule = \"FixedPostUpdate\",\n        presentation_schedule = \"RunFixedMainLoop\",\n        presentation_order = \"interpolation_character_facing_hold_target_camera_visibility\", reason = \"initialization\",\n        \"Camera pose synchronization configured\");\n}\n\n/// 检查器的启用信息沿用统一会话日志，方便核对本次调试环境。\nfn log_world_inspector() {\n    info!(target: \"demo::inspector\", plugin = \"WorldInspectorPlugin\", reason = \"initialization\",\n        \"World inspector enabled\");\n}\n\n#[cfg(test)]\nmod tests {\n    use std::{fs, sync::Arc};\n\n    use bevy::{\n        ecs::schedule::SingleThreadedExecutor,\n        log::{tracing, tracing_subscriber},\n    };\n    use uuid::Uuid;\n\n    use super::*;\n\n    #[test]\n    fn startup_logs_preserve_targets_and_config_and_run_once() {\n        let directory =\n            std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"tmp/startup-log-tests\");\n        fs::create_dir_all(\u0026directory).unwrap();\n        let path = directory.join(format!(\"{}.log\", Uuid::new_v4()));\n        let subscriber = tracing_subscriber::fmt()\n            .without_time()\n            .with_ansi(false)\n            .with_writer(Arc::new(fs::File::create_new(\u0026path).unwrap()))\n            .finish();\n\n        // 使用局部日志设施和最小 App；单线程启动调度确保日志捕获不跨线程。\n        tracing::subscriber::with_default(subscriber, || {\n            let mut app = App::new();\n            app.insert_resource(PrototypeConfig {\n                move_speed: 9.0,\n                acceleration: 36.0,\n                character_mass: 75.0,\n                parcel_mass: 3.0,\n                hold_frequency: 5.0,\n                hold_damping_ratio: 0.8,\n                hold_max_force: 240.0,\n                ..default()\n            })\n            .insert_resource(Time::\u003cFixed\u003e::from_seconds(0.25))\n            .add_plugins(StartupLogPlugin)\n            .edit_schedule(Startup, |schedule| {\n                schedule.set_executor(SingleThreadedExecutor::new());\n            });\n            app.update();\n            app.update();\n        });\n\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        fs::remove_file(path).unwrap();\n        for (target, message, fields) in [\n            (\n                \"demo::gameplay\",\n                \"Prototype gameplay initialized\",\n                vec![\n                    \"move_speed: 9.0\",\n                    \"acceleration: 36.0\",\n                    \"character_mass: 75.0\",\n                    \"parcel_mass: 3.0\",\n                    \"hold_frequency: 5.0\",\n                    \"hold_damping_ratio: 0.8\",\n                    \"hold_max_force: 240.0\",\n                    \"physics_engine=\\\"avian3d\\\"\",\n                    \"physics_version=\\\"0.7.0\\\"\",\n                    \"character_body=\\\"dynamic\\\"\",\n                    \"parcel_body=\\\"dynamic\\\"\",\n                    \"grip_mode=\\\"spring_damper\\\"\",\n                    \"release_mode=\\\"preserve_velocity\\\"\",\n                ],\n            ),\n            (\n                \"demo::settings\",\n                \"Fixed simulation timestep initialized\",\n                vec![\"simulation_hz=4\"],\n            ),\n            (\n                \"demo::camera\",\n                \"Camera pose synchronization configured\",\n                vec![\n                    \"simulation_schedule=\\\"FixedUpdate\\\"\",\n                    \"grip_force_schedule=\\\"FixedUpdate\\\"\",\n                    \"physics_schedule=\\\"FixedPostUpdate\\\"\",\n                    \"presentation_schedule=\\\"RunFixedMainLoop\\\"\",\n                    \"presentation_order=\\\"interpolation_character_facing_hold_target_camera_visibility\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n            (\n                \"demo::inspector\",\n                \"World inspector enabled\",\n                vec![\n                    \"plugin=\\\"WorldInspectorPlugin\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n        ] {\n            let records: Vec\u003c_\u003e = contents\n                .lines()\n                .filter(|line| line.contains(message))\n                .collect();\n            assert_eq!(records.len(), 1, \"Unexpected startup log count: {contents}\");\n            let record = records[0];\n            assert!(\n                record.contains(\"INFO\") \u0026\u0026 record.contains(target),\n                \"{record}\"\n            );\n            for field in fields {\n                assert!(record.contains(field), \"Missing {field}: {record}\");\n            }\n        }\n    }\n}\n"}]</script>
<script>
const sources = JSON.parse(document.getElementById('sources').textContent);
const files = new Map(sources.map(source => [source.path, source.text]));
const selector = document.getElementById('file');
const scroller = document.getElementById('scroller');
const code = document.getElementById('code');
const empty = document.getElementById('empty');
const summary = document.getElementById('summary');
const status = document.getElementById('status');
let selectedLine;
const placeholder = document.createElement('option');
placeholder.value = '';
placeholder.textContent = '请选择源码文件';
selector.append(placeholder);
for (const file of files.keys()) {
  const option = document.createElement('option');
  option.value = file;
  option.textContent = file;
  selector.append(option);
}

function locateLine() {
  selectedLine?.classList.remove('selected');
  selectedLine = undefined;
  status.textContent = '';
  if (!location.hash || !code.children.length) return;
  const match = /^#L([1-9][0-9]*)$/.exec(location.hash);
  const line = match ? Number(match[1]) : 0;
  const row = Number.isSafeInteger(line) ? code.children[line - 1] : undefined;
  if (!row) {
    status.textContent = '定位行不存在，请点击有效的行号。';
    return;
  }
  selectedLine = row;
  row.classList.add('selected');
  status.textContent = '已定位到第 ' + line + ' 行。';
  // 只滚动源码容器，保留顶部文件选择与定位提示。
  scroller.scrollTop = row.offsetTop - (scroller.clientHeight - row.offsetHeight) / 2;
}

function showFile() {
  const requested = new URLSearchParams(location.search).get('file');
  const file = requested === null ? sources[0]?.path : requested;
  const text = files.get(file);
  code.replaceChildren();
  scroller.scrollTop = 0;
  selector.value = files.has(file) ? file : '';
  empty.hidden = true;
  summary.textContent = '这是生成架构图时保存的源码快照。点击行号可以更新当前定位链接。';
  if (text === undefined || text === '') {
    empty.hidden = false;
    empty.textContent = text === '' ? '此文件为空。' : !sources.length ? '此快照未包含源码文件。' : file ? '快照中找不到文件：' + file : '请选择一个源码文件。';
    if (files.has(file)) summary.textContent = file + ' · 空文件 · 生成时的源码快照';
    locateLine();
    return;
  }
  // 统一换行以正确编号，保留空行与末尾空行；全部内容通过 textContent 写入。
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const fragment = document.createDocumentFragment();
  lines.forEach((line, index) => {
    const number = index + 1;
    const row = document.createElement('div');
    row.className = 'code-line';
    row.id = 'L' + number;
    const anchor = document.createElement('a');
    anchor.className = 'line-number';
    anchor.href = '#L' + number;
    anchor.textContent = number;
    anchor.setAttribute('aria-label', '定位到第 ' + number + ' 行');
    const content = document.createElement('code');
    content.textContent = line;
    row.append(anchor, content);
    fragment.append(row);
  });
  code.append(fragment);
  summary.textContent = file + ' · ' + lines.length + ' 行 · 生成时的源码快照';
  document.title = file + ' — ECS 架构源码';
  locateLine();
}

selector.addEventListener('change', () => {
  const url = new URL(location.href);
  url.search = '?file=' + encodeURIComponent(selector.value);
  url.hash = '';
  // 使用普通页面导航，避免本地 file:// 页面的 History API 权限差异。
  location.href = url.href;
});
code.addEventListener('click', event => {
  if (event.target.closest('.line-number')) requestAnimationFrame(locateLine);
});
addEventListener('hashchange', locateLine);
showFile();
</script>
</body>
