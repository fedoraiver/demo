 {\n            assert_button_highlight(\u0026app, *entity, false);\n        }\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowUp);\n        app.update();\n        assert_button_highlight(\u0026app, buttons[0].1, true);\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(None);\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        for (_, entity) in buttons {\n            assert_button_highlight(\u0026app, entity, false);\n        }\n    }\n\n    #[test]\n    fn page_changes_preserve_pointer_or_navigation_source() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_page_hover_cycle(\u0026mut app);\n        request(\u0026mut app, UiAction::Back);\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 2;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::Enter);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Help);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Navigation\n        );\n        let back = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cMenuButton\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        assert_button_highlight(\u0026app, back, true);\n\n        // 点击返回在下一帧消费；页面重置序号后仍保持鼠标模式，Start 不会无故常亮。\n        *app.world_mut().get_mut::\u003cInteraction\u003e(back).unwrap() = Interaction::Pressed;\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Main);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        assert_page_hover_cycle(\u0026mut app);\n    }\n\n    #[test]\n    fn rebuilt_hover_preserves_keyboard_focus_and_real_pointer_input_takes_over() {\n        // 只提供窗口组件与按钮状态，不安装原生窗口、UI 渲染器或输入后端。\n        let mut app = App::new();\n        app.init_resource::\u003cMenuState\u003e()\n            .init_resource::\u003cMenuFocus\u003e()\n            .init_resource::\u003cMenuInputSource\u003e()\n            .add_message::\u003cUiRequest\u003e()\n            .add_systems(Update, pointer_interaction);\n        let mut window = Window::default();\n        window.set_cursor_position(Some(Vec2::new(80.0, 80.0)));\n        let window = app.world_mut().spawn((window, PrimaryWindow)).id();\n        app.update();\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 4;\n        *app.world_mut().resource_mut::\u003cMenuInputSource\u003e() = MenuInputSource::Navigation;\n\n        let action = UiAction::SelectTab(SettingsTab::Graphics);\n        let mut hovered = app\n            .world_mut()\n            .spawn((MenuButton { action, index: 0 }, Interaction::Hovered))\n            .id();\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 4);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Navigation\n        );\n        for _ in 0..2 {\n            app.world_mut().despawn(hovered);\n            hovered = app\n                .world_mut()\n                .spawn((MenuButton { action, index: 0 }, Interaction::Hovered))\n                .id();\n            app.update();\n            assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 4);\n            assert_eq!(\n                *app.world().resource::\u003cMenuInputSource\u003e(),\n                MenuInputSource::Navigation\n            );\n        }\n\n        // 鼠标在同一按钮内移动时 Interaction 不变，也应重新接管焦点。\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(Some(Vec2::new(82.0, 80.0)));\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 0);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 4;\n        *app.world_mut().resource_mut::\u003cMenuInputSource\u003e() = MenuInputSource::Navigation;\n        *app.world_mut().get_mut::\u003cInteraction\u003e(hovered).unwrap() = Interaction::Pressed;\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 0);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        let requests: Vec\u003c_\u003e = app\n            .world_mut()\n            .resource_mut::\u003cMessages\u003cUiRequest\u003e\u003e()\n            .drain()\n            .map(|request| request.0)\n            .collect();\n        assert_eq!(requests, vec![action]);\n        app.update();\n        assert_eq!(\n            app.world_mut()\n                .resource_mut::\u003cMessages\u003cUiRequest\u003e\u003e()\n                .drain()\n                .count(),\n            0\n        );\n    }\n\n    #[test]\n    fn simultaneous_settings_back_and_old_button_press_remain_paused() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::StartGame);\n        request(\u0026mut app, UiAction::Back);\n        request(\u0026mut app, UiAction::OpenSettings);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Settings);\n        let old_back = app\n            .world_mut()\n            .query::\u003c(Entity, \u0026MenuButton)\u003e()\n            .iter(app.world())\n            .find_map(|(entity, button)| (button.action == UiAction::Back).then_some(entity))\n            .unwrap();\n\n        // 同一帧键盘返回与旧页按钮的点击并存；真实 Build 必须先清理旧按钮。\n        *app.world_mut().get_mut::\u003cInteraction\u003e(old_back).unwrap() = Interaction::Pressed;\n        app.world_mut().write_message(UiRequest(UiAction::Back));\n        app.update();\n        assert!(app.world().get_entity(old_back).is_err());\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n\n        // 检查帧末后再推进一帧，防止残留 Back 在暂停页被解释为 Resume。\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n    }\n\n    #[test]\n    fn settings_cancel_preserves_runtime_and_apply_commits_only_after_save() {\n        let mut app = test_app();\n        let path = PathBuf::from(\"tmp\")\n            .join(\"ui-settings-tests\")\n            .join(format!(\"{}.json\", uuid::Uuid::new_v4()));\n        std::fs::create_dir_all(path.parent().unwrap()).unwrap();\n        app.world_mut().insert_resource(SettingsFile(path.clone()));\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 90);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 60);\n        assert!(!path.exists());\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Main);\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 60);\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        request(\u0026mut app, UiAction::ApplySettings);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 90);\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 90);\n        std::fs::remove_file(\u0026path).unwrap();\n\n        // 保存目标是目录时产生真实 I/O 失败，界面保留草稿而运行设置保持原值。\n        app.world_mut()\n            .insert_resource(SettingsFile(path.parent().unwrap().to_path_buf()));\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        request(\u0026mut app, UiAction::ApplySettings);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 90);\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 120);\n        assert!(\n            app.world()\n                .resource::\u003cMenuState\u003e()\n                .status\n                .as_ref()\n                .unwrap()\n                .starts_with(\"Could not save\")\n        );\n    }\n\n    #[test]\n    fn held_confirm_fires_once_and_navigation_stops_when_window_loses_focus() {\n        let mut app = test_app();\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 1;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::Enter);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Settings);\n        for _ in 0..5 {\n            app.update();\n        }\n        assert_eq!(\n            app.world().resource::\u003cMenuState\u003e().return_page,\n            MenuPage::Main\n        );\n        let original = app.world().resource::\u003cMenuFocus\u003e().0;\n        let window = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cPrimaryWindow\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        app.world_mut().get_mut::\u003cWindow\u003e(window).unwrap().focused = false;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, original);\n    }\n\n    #[test]\n    fn pause_help_and_settings_return_to_pause_without_replacing_session() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::StartGame);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cAppState\u003e\u003e().get(),\n            AppState::InGame\n        );\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_eq!(\n            app.world().resource::\u003cMenuState\u003e().return_page,\n            MenuPage::Pause\n        );\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n        request(\u0026mut app, UiAction::Resume);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Hidden);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Running\n        );\n    }\n}\n"},{"path":"src/ui/screens.rs","text":"//! 主菜单、暂停、设置与操作说明的 BSN 页面，以及焦点的视觉呈现。\n\nuse bevy::{prelude::*, window::PrimaryWindow};\n\nuse crate::settings::SettingsDraft;\n\nuse super::{\n    MenuButton, MenuFocus, MenuInputSource, MenuPage, MenuRoot, MenuState, SettingKey, SettingsTab,\n    UiAction, UiSystems, theme::*, widgets::*,\n};\n\n#[derive(Component, Default, Clone)]\nstruct DescriptionTitle;\n\n#[derive(Component, Default, Clone)]\nstruct DescriptionBody;\n\npub(super) fn register(app: \u0026mut App) {\n    app.init_resource::\u003cUiTheme\u003e()\n        .add_systems(Update, rebuild_page.in_set(UiSystems::Build))\n        // Build 与 Style 由插件串联，保证新 BSN 子树的延迟命令先应用。\n        .add_systems(\n            Update,\n            (style_buttons, update_description, scroll_focused_button).in_set(UiSystems::Style),\n        );\n}\n\n/// 页面状态与草稿变化时重建；键盘焦点只更新样式，避免输入实体不断销毁。\nfn rebuild_page(\n    mut commands: Commands,\n    state: Res\u003cMenuState\u003e,\n    draft: Res\u003cSettingsDraft\u003e,\n    theme: Res\u003cUiTheme\u003e,\n    windows: Query\u003c\u0026Window, With\u003cPrimaryWindow\u003e\u003e,\n    roots: Query\u003cEntity, With\u003cMenuRoot\u003e\u003e,\n    mut previous_width: Local\u003cOption\u003cu32\u003e\u003e,\n) {\n    let width = windows.single().map_or(1440.0, |window| window.width());\n    let width_bucket = width.round() as u32;\n    if !state.is_changed() \u0026\u0026 !draft.is_changed() \u0026\u0026 *previous_width == Some(width_bucket) {\n        return;\n    }\n    *previous_width = Some(width_bucket);\n    for entity in \u0026roots {\n        commands.entity(entity).despawn();\n    }\n    if state.page == MenuPage::Hidden {\n        return;\n    }\n    let theme = theme.for_width(width);\n    let compact = width \u003c 1000.0;\n    let content: Box\u003cdyn Scene\u003e = match state.page {\n        MenuPage::Main =\u003e Box::new(main_page(\u0026theme, false)),\n        MenuPage::Pause =\u003e Box::new(main_page(\u0026theme, true)),\n        MenuPage::Settings =\u003e Box::new(settings_page(\u0026theme, \u0026state, \u0026draft, compact)),\n        MenuPage::Help =\u003e Box::new(help_page(\u0026theme, compact)),\n        MenuPage::Hidden =\u003e unreachable!(),\n    };\n    // 句柄作为现成组件写入 BSN，spawn_scene 不依赖异步加载任务，旧页面不会复活。\n    commands.spawn_scene(bsn! {\n        MenuRoot\n        GlobalZIndex(100)\n        Node {\n            width: percent(100),\n            height: percent(100),\n            flex_direction: FlexDirection::Column,\n        }\n        BackgroundColor({if state.page == MenuPage::Pause {\n            Color::srgba(0.06, 0.10, 0.15, 0.68)\n        } else {\n            Color::NONE\n        }})\n        Children [\n            ({content}),\n            footer(\u0026theme),\n        ]\n    });\n}\n\nfn page_area(theme: \u0026UiTheme) -\u003e impl Scene {\n    bsn! {\n        scroll_area(theme)\n        Node {\n            padding: {UiRect::axes(percent(3.5), px(theme.size(32.0)))},\n            row_gap: px(theme.size(24.0)),\n        }\n    }\n}\n\nfn main_page(theme: \u0026UiTheme, paused: bool) -\u003e impl Scene {\n    let first_title = if paused { \"Resume\" } else { \"Start Game\" };\n    let first_action = if paused {\n        UiAction::Resume\n    } else {\n        UiAction::StartGame\n    };\n    let last_title = if paused { \"Back to Main Menu\" } else { \"Quit\" };\n    let last_action = if paused {\n        UiAction::ReturnToMenu\n    } else {\n        UiAction::Quit\n    };\n    let tag_title = if paused {\n        \"TAKE A BREATHER\"\n    } else {\n        \"YOUR ISLAND. YOUR ROUTE.\"\n    };\n    let tag_body = if paused {\n        \"Your parcel will be right here.\"\n    } else {\n        \"A little sunshine. A lot to carry.\"\n    };\n    let placeholders: Box\u003cdyn SceneList\u003e = if paused {\n        Box::new(bsn_list![])\n    } else {\n        Box::new(bsn_list![\n            placeholder_row(theme, \"Continue\", true),\n            placeholder_row(theme, \"Multiplayer\", true),\n        ])\n    };\n    bsn! {\n        page_area(theme)\n        Node { flex_direction: FlexDirection::Row, align_items: AlignItems::FlexStart }\n        Children [\n            (\n                template_value(column(theme.size(30.0)))\n                Node {\n                    width: percent(32),\n                    min_width: px(theme.size(280.0)),\n                    max_width: px(theme.size(490.0)),\n                    flex_shrink: 0.0,\n                }\n                Children [\n                    logo(theme, false),\n                    (\n                        template_value(column(theme.size(12.0)))\n                        Children [\n                            menu_button(theme, first_title, \"\u003e\", first_action, 0),\n                            {placeholders},\n                            menu_button(theme, \"Settings\", \"+\", UiAction::OpenSettings, 1),\n                            menu_button(theme, \"How to Play\", \"?\", UiAction::OpenHelp, 2),\n                            menu_button(theme, last_title, \"\u003c\", last_action, 3),\n                        ]\n                    ),\n                    (\n                        Node { align_items: AlignItems::Center, column_gap: px(theme.size(8.0)) }\n                        Children [\n                            (\n                                Node {\n                                    width: px(theme.size(9.0)),\n                                    height: px(theme.size(9.0)),\n                                    border_radius: BorderRadius::MAX,\n                                }\n                                BackgroundColor(GOLD)\n                            ),\n                            label(theme, if paused { \"DELIVERIES ON HOLD\" } else { \"SINGLE PLAYER\" }, 15.0, CREAM),\n                        ]\n                    ),\n                ]\n            ),\n            (\n                Node {\n                    flex_grow: 1.0,\n                    min_width: px(0),\n                    align_self: AlignSelf::FlexEnd,\n                    justify_content: JustifyContent::FlexEnd,\n                    padding: UiRect::bottom(px(theme.size(20.0))),\n                }\n                Children [(\n                    Node {\n                        padding: px(theme.size(17.0)),\n                        border: px(1),\n                        border_radius: BorderRadius::all(px(7)),\n                        flex_direction: FlexDirection::Column,\n                        row_gap: px(theme.size(6.0)),\n                        max_width: px(theme.size(350.0)),\n                    }\n                    BackgroundColor(Color::srgba(0.09, 0.15, 0.22, 0.70))\n                    BorderColor::all(Color::srgba(0.99, 0.96, 0.87, 0.40))\n                    Children [\n                        heading(theme, tag_title, 24.0, GOLD),\n                        label(theme, tag_body, 17.0, CREAM),\n                    ]\n                )]\n            ),\n        ]\n    }\n}\n\nfn footer(theme: \u0026UiTheme) -\u003e impl Scene {\n    bsn! {\n        Node {\n            width: percent(100),\n            min_height: px(theme.size(56.0)),\n            padding: UiRect::axes(percent(3.5), px(theme.size(10.0))),\n            align_items: AlignItems::Center,\n            justify_content: JustifyContent::SpaceBetween,\n            flex_wrap: FlexWrap::Wrap,\n            row_gap: px(theme.size(7.0)),\n            column_gap: px(theme.size(18.0)),\n            flex_shrink: 0.0,\n        }\n        BackgroundColor(Color::srgba(0.07, 0.11, 0.16, 0.88))\n        Children [\n            label(theme, \"ISLAND DELIVERY CO.  /  HANDLE WITH CARE\", 14.0, CREAM),\n            (\n                Node {\n                    column_gap: px(theme.size(17.0)),\n                    row_gap: px(theme.size(8.0)),\n                    flex_wrap: FlexWrap::Wrap,\n                    align_items: AlignItems::Center,\n                }\n                Children [\n                    input_hint(theme, \"Arrows\", \"Navigate\"),\n                    input_hint(theme, \"Enter\", \"Confirm\"),\n                    input_hint(theme, \"Esc\", \"Back\"),\n                ]\n            ),\n        ]\n    }\n}\n\nfn input_hint(theme: \u0026UiTheme, key: \u0026'static str, title: \u0026'static str) -\u003e impl Scene {\n    bsn! {\n        Node { align_items: AlignItems::Center, column_gap: px(theme.size(8.0)) }\n        Children [keycap(theme, key, true), label(theme, title, 17.0, CREAM)]\n    }\n}\n\nfn sidebar(theme: \u0026UiTheme, state: \u0026MenuState) -\u003e impl Scene {\n    bsn! {\n        template_value(column(theme.size(25.0)))\n        Node { width: percent(24), min_width: px(theme.size(205.0)), flex_shrink: 0.0 }\n        Children [\n            logo(theme, true),\n            (\n                template_value(column(theme.size(12.0)))\n                Children [\n                    menu_button(theme, \"Graphics\", \"+\", UiAction::SelectTab(SettingsTab::Graphics), 0),\n                    menu_button(theme, \"Audio\", \"~\", UiAction::SelectTab(SettingsTab::Audio), 1),\n                    menu_button(theme, \"Controls\", \"\u003e\", UiAction::SelectTab(SettingsTab::Controls), 2),\n                    menu_button(theme, \"Accessibility\", \"+\", UiAction::SelectTab(SettingsTab::Accessibility), 3),\n                ]\n            ),\n            (\n                label(theme, if state.return_page == MenuPage::Pause {\n                    \"Your game is paused.\"\n                } else {\n                    \"Make yourself at home.\"\n                }, 17.0, CREAM)\n                TextShadow { offset: {Vec2::new(1.0, 1.0)}, color: INK }\n            ),\n        ]\n    }\n}\n\nfn settings_page(\n    theme: \u0026UiTheme,\n    state: \u0026MenuState,\n    draft: \u0026SettingsDraft,\n    compact: bool,\n) -\u003e impl Scene {\n    let (category, next_index) = match state.tab {\n        SettingsTab::Graphics =\u003e (\"GRAPHICS\", 6),\n        SettingsTab::Audio =\u003e (\"AUDIO\", 4),\n        SettingsTab::Controls =\u003e (\"CONTROLS\", 8),\n        SettingsTab::Accessibility =\u003e (\"ACCESSIBILITY\", 4),\n    };\n    let rows: Box\u003cdyn Scene\u003e = match state.tab {\n        SettingsTab::Graphics =\u003e Box::new(bsn! {\n            template_value(column(theme.size(13.0)))\n            Children [\n                placeholder_row(theme, \"Window Mode\", false),\n                placeholder_row(theme, \"Resolution\", false),\n                placeholder_row(theme, \"VSync\", false),\n                setting_row(theme, \"Frame Rate Limit\", format!(\"{} FPS\", draft.max_fps), SettingKey::FrameRate, 4,\n                    \"Choose the maximum frame rate. A higher limit feels smoother when your computer can keep up. This setting does not change movement speed.\"),\n                placeholder_row(theme, \"Shadow Quality\", false),\n                placeholder_row(theme, \"Anti-Aliasing\", false),\n                placeholder_row(theme, \"View Distance\", false),\n            ]\n        }),\n        SettingsTab::Audio =\u003e Box::new(bsn! {\n            template_value(column(theme.size(13.0)))\n            Children [\n                placeholder_row(theme, \"Master Volume\", false),\n                placeholder_row(theme, \"Music Volume\", false),\n                placeholder_row(theme, \"SFX Volume\", false),\n                label(theme, \"Audio controls are on their way.\", 17.0, MUTED),\n            ]\n        }),\n        SettingsTab::Controls =\u003e Box::new(bsn! {\n            template_value(column(theme.size(13.0)))\n            Children [\n                setting_row(theme, \"Mouse Sensitivity\", format!(\"{:.0}%\", draft.mouse_sensitivity / 0.003 * 100.0), SettingKey::MouseSensitivity, 4,\n                    \"Adjust how far the camera turns when you move the mouse. 100% is the default sensitivity. This affects both first-person and third-person views.\"),\n                setting_row(theme, \"Invert Camera Y\", if draft.invert_y { \"On\".into() } else { \"Off\".into() }, SettingKey::InvertY, 6,\n                    \"Reverse vertical mouse movement. When enabled, moving the mouse upward tilts the camera downward.\"),\n                placeholder_row(theme, \"Rebind Keys\", false),\n                label(theme, \"Move with WASD. Switch your view with I.\", 17.0, MUTED),\n            ]\n        }),\n        SettingsTab::Accessibility =\u003e Box::new(bsn! {\n            template_value(column(theme.size(13.0)))\n            Children [\n                placeholder_row(theme, \"UI Scale\", false),\n                placeholder_row(theme, \"Camera Shake\", false),\n                label(theme, \"More ways to make the island yours.\", 17.0, MUTED),\n            ]\n        }),\n    };\n    let status = state\n        .status\n        .clone()\n        .unwrap_or_else(|| \"Changes are saved only when you choose Apply.\".into());\n    bsn! {\n        page_area(theme)\n        Children [(\n            Node {\n                width: percent(100),\n                column_gap: px(theme.size(27.0)),\n                row_gap: px(theme.size(20.0)),\n                align_items: AlignItems::FlexStart,\n                // 内容保留自身高度，超出视口时由页面滚动，而不是压缩控件。\n                flex_shrink: 0.0,\n                flex_wrap: {if compact { FlexWrap::Wrap } else { FlexWrap::NoWrap }},\n            }\n            Children [\n                sidebar(theme, state),\n                (\n                    template_value(column(theme.size(18.0)))\n                    Node { flex_grow: 1.0, flex_basis: px(theme.size(450.0)), min_width: px(0) }\n                    Children [\n                        (\n                            paper_panel(theme)\n                            Children [\n                                heading(theme, \"SETTINGS\", 44.0, INK),\n                                (\n                                    Node {\n                                        height: px(theme.size(4.0)),\n                                        width: px(theme.size(70.0)),\n                                        border_radius: BorderRadius::MAX,\n                                    }\n                                    BackgroundColor(GOLD)\n                                ),\n                                (\n                                    Node {\n                                        column_gap: px(theme.size(18.0)),\n                                        row_gap: px(theme.size(19.0)),\n                                        flex_direction: {if compact { FlexDirection::Column } else { FlexDirection::Row }},\n                                    }\n                                    Children [\n                                        (\n                                            template_value(column(theme.size(21.0)))\n                                            Node {\n                                                flex_grow: 1.0,\n                                                flex_basis: {if compact { Val::Auto } else { percent(66) }},\n                                                min_width: px(0),\n                                            }\n                                            Children [heading(theme, category, 27.0, INK), ({rows})]\n                                        ),\n                                        description_panel(theme, compact),\n                                    ]\n                                ),\n                                label(theme, status, 17.0, MUTED),\n                            ]\n                        ),\n                        (\n                            Node {\n                                width: percent(100),\n                                justify_content: JustifyContent::SpaceBetween,\n                                column_gap: px(theme.size(12.0)),\n                                row_gap: px(theme.size(10.0)),\n                                flex_wrap: FlexWrap::Wrap,\n                            }\n                            Children [\n                                small_button(theme, \"Restore Defaults\", UiAction::RestoreDefaults, next_index),\n                                (\n                                    Node {\n                                        column_gap: px(theme.size(12.0)),\n                                        row_gap: px(theme.size(10.0)),\n                                        flex_wrap: FlexWrap::Wrap,\n                                    }\n                                    Children [\n                                        small_button(theme, \"Apply\", UiAction::ApplySettings, next_index + 1),\n                                        small_button(theme, \"Back\", UiAction::Back, next_index + 2),\n                                    ]\n                                ),\n                            ]\n                        ),\n                    ]\n                ),\n            ]\n        )]\n    }\n}\n\nfn description_panel(theme: \u0026UiTheme, compact: bool) -\u003e impl Scene {\n    bsn! {\n        template_value(column(theme.size(14.0)))\n        Node {\n            flex_basis: {if compact { Val::Auto } else { percent(30) }},\n            flex_grow: 1.0,\n            min_width: px(0),\n            padding: px(theme.size(18.0)),\n            border_radius: BorderRadius::all(px(7)),\n        }\n        BackgroundColor(SUBTLE)\n        Children [\n            (\n                heading(theme, \"A LITTLE FINE-TUNING\", 25.0, INK)\n                DescriptionTitle\n            ),\n            (\n                label(theme, \"Select a setting to see what it does. Use the arrows to change its value, then Apply to save.\", 18.0, MUTED)\n                DescriptionBody\n            ),\n            (\n                Node {\n                    margin: UiRect::top(px(theme.size(12.0))),\n                    align_items: AlignItems::Center,\n                    column_gap: px(theme.size(9.0)),\n                }\n                Children [parcel_stamp(theme), heading(theme, \"HANDLE WITH CARE\", 17.0, INK)]\n            ),\n        ]\n    }\n}\n\nfn help_page(theme: \u0026UiTheme, compact: bool) -\u003e impl Scene {\n    bsn! {\n        page_area(theme)\n        Children [\n            (\n                Node {\n                    align_items: AlignItems::Center,\n                    column_gap: px(theme.size(45.0)),\n                    row_gap: px(theme.size(16.0)),\n                    flex_wrap: FlexWrap::Wrap,\n                    flex_shrink: 0.0,\n                }\n                Children [\n                    (\n                        logo(theme, true)\n                        Node { width: percent(26), min_width: px(theme.size(210.0)) }\n                    ),\n                    (\n                        paper_panel(theme)\n                        Node { flex_grow: 1.0 }\n                        Children [\n                            heading(theme, \"HOW TO PLAY\", 48.0, INK),\n                            label(theme, \"Grab a parcel. Find your stride. Enjoy the island.\", 22.0, MUTED),\n                        ]\n                    ),\n                ]\n            ),\n            (\n                Node {\n                    column_gap: px(theme.size(20.0)),\n                    row_gap: px(theme.size(20.0)),\n                    flex_wrap: FlexWrap::Wrap,\n                    flex_shrink: 0.0,\n                }\n                Children [\n                    help_card(theme, \"01\", \"MOVE \u0026 JUMP\", \"WASD\", \"Space\", \"Move\", \"Jump\",\n                        \"Move relative to the camera. Build up speed, coast to a stop, and jump while grounded.\", compact),\n                    help_card(theme, \"02\", \"CARRY \u0026 DROP\", \"E\", \"E again\", \"Pick up\", \"Release\",\n                        \"Get close to a parcel with a clear path. Hold it with physics, then release it to let gravity do the rest.\", compact),\n                    help_card(theme, \"03\", \"CAMERA\", \"Mouse\", \"I\", \"Look around\", \"Switch view\",\n                        \"Use the mouse to look around. Switch between first-person and third-person. Press Esc to pause.\", compact),\n                ]\n            ),\n            (\n                paper_panel(theme)\n                Node {\n                    flex_direction: FlexDirection::Row,\n                    align_items: AlignItems::Center,\n                    flex_wrap: FlexWrap::Wrap,\n                    flex_shrink: 0.0,\n                }\n                Children [\n                    (\n                        label(theme, \"One courier. One box at a time. Take it easy out there.\", 19.0, INK)\n                        Node { flex_grow: 1.0 }\n                    ),\n                    small_button(theme, \"Back\", UiAction::Back, 0),\n                ]\n            ),\n        ]\n    }\n}\n\n#[allow(clippy::too_many_arguments)]\nfn help_card(\n    theme: \u0026UiTheme,\n    number: \u0026'static str,\n    title: \u0026'static str,\n    key_one: \u0026'static str,\n    key_two: \u0026'static str,\n    action_one: \u0026'static str,\n    action_two: \u0026'static str,\n    details: \u0026'static str,\n    compact: bool,\n) -\u003e impl Scene {\n    bsn! {\n        paper_panel(theme)\n        Node {\n            flex_grow: 1.0,\n            flex_basis: {if compact { percent(100) } else { percent(30) }},\n            min_height: px(theme.size(245.0)),\n            border: px(3),\n            row_gap: px(theme.size(21.0)),\n        }\n        Children [\n            (\n                Node { align_items: AlignItems::Center, column_gap: px(theme.size(15.0)) }\n                Children [\n                    (\n                        Node {\n                            width: px(theme.size(46.0)),\n                            height: px(theme.size(42.0)),\n                            border_radius: BorderRadius::all(px(5)),\n                            justify_content: JustifyContent::Center,\n                            align_items: AlignItems::Center,\n                            flex_shrink: 0.0,\n                        }\n                        BackgroundColor(GOLD)\n                        Children [heading(theme, number, 26.0, INK)]\n                    ),\n                    heading(theme, title, 30.0, INK),\n                ]\n            ),\n            (\n                Node {\n                    column_gap: px(theme.size(17.0)),\n                    row_gap: px(theme.size(10.0)),\n                    flex_wrap: FlexWrap::Wrap,\n                }\n                Children [\n                    help_hint(theme, key_one, action_one),\n                    help_hint(theme, key_two, action_two),\n                ]\n            ),\n            label(theme, details, 19.0, MUTED),\n        ]\n    }\n}\n\nfn help_hint(theme: \u0026UiTheme, key: \u0026'static str, title: \u0026'static str) -\u003e impl Scene {\n    bsn! {\n        Node { align_items: AlignItems::Center, column_gap: px(theme.size(8.0)) }\n        Children [keycap(theme, key, false), label(theme, title, 18.0, INK)]\n    }\n}\n\nfn style_buttons(\n    focus: Res\u003cMenuFocus\u003e,\n    source: Res\u003cMenuInputSource\u003e,\n    mut buttons: Query\u003c(\n        \u0026MenuButton,\n        \u0026Interaction,\n        \u0026mut BackgroundColor,\n        \u0026mut BorderColor,\n    )\u003e,\n) {\n    for (button, interaction, mut background, mut border) in \u0026mut buttons {\n        // 只显示当前输入来源的焦点；分类和 Apply 也在鼠标离开后恢复普通纸色。\n        let focused = match *source {\n            MenuInputSource::Pointer =\u003e *interaction != Interaction::None,\n            MenuInputSource::Navigation =\u003e button.index == focus.0,\n        };\n        let color = if *interaction == Interaction::Pressed {\n            Color::srgb(0.94, 0.65, 0.20)\n        } else if focused {\n            GOLD\n        } else {\n            PAPER\n        };\n        let edge = if focused { INK } else { CREAM };\n        // 只在颜色确有改变时写入，减少 Bevy UI 的无效变化与重绘。\n        if background.0 != color {\n            background.0 = color;\n        }\n        if *border != BorderColor::all(edge) {\n            *border = BorderColor::all(edge);\n        }\n    }\n}\n\nfn update_description(\n    focus: Res\u003cMenuFocus\u003e,\n    buttons: Query\u003c(\u0026MenuButton, \u0026SettingDescription)\u003e,\n    mut text: Query\u003c\n        (\u0026mut Text, Has\u003cDescriptionTitle\u003e),\n        Or\u003c(With\u003cDescriptionTitle\u003e, With\u003cDescriptionBody\u003e)\u003e,\n    \u003e,\n) {\n    let details = buttons\n        .iter()\n        .find_map(|(button, details)| (button.index == focus.0).then_some(details));\n    let Some(details) = details else {\n        return;\n    };\n    for (mut text, title) in \u0026mut text {\n        let value = if title { details.title } else { details.body };\n        if text.0 != value {\n            text.0 = value.into();\n        }\n    }\n}\n\n/// 短窗口中键盘仍能访问所有按钮；新页面先等布局完成，再滚到焦点所在区域。\nfn scroll_focused_button(\n    focus: Res\u003cMenuFocus\u003e,\n    buttons: Query\u003c(Entity, \u0026MenuButton, \u0026ComputedNode, \u0026UiGlobalTransform)\u003e,\n    parents: Query\u003c\u0026ChildOf\u003e,\n    mut scrolls: Query\u003c(\u0026ComputedNode, \u0026UiGlobalTransform, \u0026mut ScrollPosition), With\u003cMenuScroll\u003e\u003e,\n    mut previous: Local\u003cOption\u003cEntity\u003e\u003e,\n) {\n    let Some((entity, _, button_node, button_transform)) = buttons\n        .iter()\n        .find(|(_, button, _, _)| button.index == focus.0)\n    else {\n        return;\n    };\n    if *previous == Some(entity) || button_node.size().y == 0.0 {\n        return;\n    }\n    let mut ancestor = entity;\n    while let Ok(parent) = parents.get(ancestor) {\n        ancestor = parent.parent();\n        let Ok((node, transform, mut scroll)) = scrolls.get_mut(ancestor) else {\n            continue;\n        };\n        if node.size().y == 0.0 {\n            return;\n        }\n        let top = transform.affine().translation.y - node.size().y / 2.0;\n        let bottom = top + node.size().y;\n        let button_top = button_transform.affine().translation.y - button_node.size().y / 2.0;\n        let button_bottom = button_top + button_node.size().y;\n        let delta = if button_top \u003c top {\n            button_top - top\n        } else if button_bottom \u003e bottom {\n            button_bottom - bottom\n        } else {\n            0.0\n        };\n        let range = (node.content_size().y - node.size().y).max(0.0) * node.inverse_scale_factor();\n        scroll.y = (scroll.y + delta * node.inverse_scale_factor()).clamp(0.0, range);\n        break;\n    }\n    *previous = Some(entity);\n}\n\n#[cfg(test)]\nmod tests {\n    use bevy::{asset::AssetPlugin, scene::ScenePlugin};\n\n    use super::*;\n\n    fn test_theme() -\u003e UiTheme {\n        UiTheme {\n            heading: Handle::default(),\n            body: Handle::default(),\n            scale: 1.0,\n        }\n    }\n\n    /// 只启用 BSN 所需资产资源；生成 ECS 树时不加载字体文件、渲染器或窗口。\n    fn actions(scene: impl Scene) -\u003e Vec\u003cUiAction\u003e {\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, AssetPlugin::default(), ScenePlugin))\n            .init_asset::\u003cFont\u003e();\n        app.finish();\n        app.cleanup();\n        let world = app.world_mut();\n        world.spawn_scene(scene).unwrap();\n        let mut buttons: Vec\u003c_\u003e = world\n            .query::\u003c\u0026MenuButton\u003e()\n            .iter(world)\n            .map(|button| (button.index, button.action))\n            .collect();\n        buttons.sort_by_key(|(index, _)| *index);\n        for (expected, (actual, _)) in buttons.iter().enumerate() {\n            assert_eq!(*actual, expected, \"Navigation indices must be consecutive\");\n        }\n        buttons.into_iter().map(|(_, action)| action).collect()\n    }\n\n    #[test]\n    fn bsn_pages_expose_supported_actions_with_stable_navigation() {\n        let theme = test_theme();\n        assert_eq!(\n            actions(main_page(\u0026theme, false)),\n            vec![\n                UiAction::StartGame,\n                UiAction::OpenSettings,\n                UiAction::OpenHelp,\n                UiAction::Quit\n            ]\n        );\n        assert_eq!(\n            actions(main_page(\u0026theme, true)),\n            vec![\n                UiAction::Resume,\n                UiAction::OpenSettings,\n                UiAction::OpenHelp,\n                UiAction::ReturnToMenu\n            ]\n        );\n        assert_eq!(actions(help_page(\u0026theme, false)), vec![UiAction::Back]);\n        let mut state = MenuState {\n            page: MenuPage::Settings,\n            ..default()\n        };\n        let graphics = actions(settings_page(\n            \u0026theme,\n            \u0026state,\n            \u0026SettingsDraft::default(),\n            false,\n        ));\n        assert_eq!(\n            \u0026graphics[4..6],\n            \u0026[\n                UiAction::Adjust(SettingKey::FrameRate, -1),\n                UiAction::Adjust(SettingKey::FrameRate, 1)\n            ]\n        );\n        assert_eq!(\n            \u0026graphics[6..],\n            \u0026[\n                UiAction::RestoreDefaults,\n                UiAction::ApplySettings,\n                UiAction::Back\n            ]\n        );\n        state.tab = SettingsTab::Controls;\n        let controls = actions(settings_page(\n            \u0026theme,\n            \u0026state,\n            \u0026SettingsDraft::default(),\n            true,\n        ));\n        assert_eq!(\n            \u0026controls[4..8],\n            \u0026[\n                UiAction::Adjust(SettingKey::MouseSensitivity, -1),\n                UiAction::Adjust(SettingKey::MouseSensitivity, 1),\n                UiAction::Adjust(SettingKey::InvertY, -1),\n                UiAction::Adjust(SettingKey::InvertY, 1)\n            ]\n        );\n        assert_eq!(\n            \u0026controls[8..],\n            \u0026[\n                UiAction::RestoreDefaults,\n                UiAction::ApplySettings,\n                UiAction::Back\n            ]\n        );\n        for tab in [SettingsTab::Audio, SettingsTab::Accessibility] {\n            state.tab = tab;\n            let placeholders = actions(settings_page(\n                \u0026theme,\n                \u0026state,\n                \u0026SettingsDraft::default(),\n                false,\n            ));\n            assert_eq!(\n                \u0026placeholders[4..],\n                \u0026[\n                    UiAction::RestoreDefaults,\n                    UiAction::ApplySettings,\n                    UiAction::Back\n                ]\n            );\n        }\n    }\n\n    #[test]\n    fn keyboard_focus_is_visible_only_for_navigation_source() {\n        let mut app = App::new();\n        app.insert_resource(MenuFocus(1))\n            .insert_resource(MenuInputSource::Navigation)\n            .add_systems(Update, style_buttons);\n        let category = app\n            .world_mut()\n            .spawn((\n                Button,\n                MenuButton {\n                    action: UiAction::SelectTab(SettingsTab::Graphics),\n                    index: 0,\n                },\n            ))\n            .id();\n        let apply = app\n            .world_mut()\n            .spawn((\n                Button,\n                MenuButton {\n                    action: UiAction::ApplySettings,\n                    index: 1,\n                },\n            ))\n            .id();\n        app.update();\n        assert_eq!(\n            app.world().get::\u003cBackgroundColor\u003e(category).unwrap().0,\n            PAPER\n        );\n        assert_eq!(\n            *app.world().get::\u003cBorderColor\u003e(category).unwrap(),\n            BorderColor::all(CREAM)\n        );\n        assert_eq!(\n            *app.world().get::\u003cBorderColor\u003e(apply).unwrap(),\n            BorderColor::all(INK)\n        );\n        assert_eq!(app.world().get::\u003cBackgroundColor\u003e(apply).unwrap().0, GOLD);\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 0;\n        app.update();\n        assert_eq!(\n            *app.world().get::\u003cBorderColor\u003e(category).unwrap(),\n            BorderColor::all(INK)\n        );\n        assert_eq!(\n            *app.world().get::\u003cBorderColor\u003e(apply).unwrap(),\n            BorderColor::all(CREAM)\n        );\n        assert_eq!(app.world().get::\u003cBackgroundColor\u003e(apply).unwrap().0, PAPER);\n        *app.world_mut().resource_mut::\u003cMenuInputSource\u003e() = MenuInputSource::Pointer;\n        app.update();\n        for entity in [category, apply] {\n            assert_eq!(app.world().get::\u003cBackgroundColor\u003e(entity).unwrap().0, PAPER);\n            assert_eq!(\n                *app.world().get::\u003cBorderColor\u003e(entity).unwrap(),\n                BorderColor::all(CREAM)\n            );\n        }\n    }\n}\n"},{"path":"src/ui/theme.rs","text":"//! 菜单共用的纸张、制服和包裹配色，以及预加载字体。\n\nuse bevy::prelude::*;\n\npub(super) const INK: Color = Color::srgb(0.12, 0.16, 0.22);\npub(super) const CREAM: Color = Color::srgb(0.98, 0.95, 0.86);\npub(super) const PAPER: Color = Color::srgba(0.98, 0.96, 0.90, 0.96);\npub(super) const GOLD: Color = Color::srgb(1.0, 0.78, 0.30);\npub(super) const MUTED: Color = Color::srgb(0.38, 0.41, 0.45);\npub(super) const SUBTLE: Color = Color::srgba(0.43, 0.45, 0.48, 0.12);\n\n/// 字体只加载一次；页面 BSN 直接引用句柄，不启动异步场景任务。\n#[derive(Resource, Clone)]\npub(super) struct UiTheme {\n    pub heading: Handle\u003cFont\u003e,\n    pub body: Handle\u003cFont\u003e,\n    pub scale: f32,\n}\n\nimpl FromWorld for UiTheme {\n    fn from_world(world: \u0026mut World) -\u003e Self {\n        let assets = world.resource::\u003cAssetServer\u003e();\n        Self {\n            heading: assets.load(\"ui/fonts/heading.ttf\"),\n            body: assets.load(\"ui/fonts/body.ttf\"),\n            scale: 1.0,\n        }\n    }\n}\n\nimpl UiTheme {\n    /// 宽度较小时缩小字号；高度不足交给滚动区域，避免整页文字过小。\n    pub fn for_width(\u0026self, width: f32) -\u003e Self {\n        Self {\n            scale: (width / 1440.0).clamp(0.68, 1.15),\n            ..self.clone()\n        }\n    }\n\n    pub fn size(\u0026self, size: f32) -\u003e f32 {\n        size * self.scale\n    }\n}\n\n/// 低模风格使用清楚的下投影，保证浅色控件在海天背景上可辨认。\npub(super) fn paper_shadow(scale: f32) -\u003e BoxShadow {\n    BoxShadow(vec![ShadowStyle {\n        color: Color::srgba(0.07, 0.11, 0.18, 0.25),\n        x_offset: px(0),\n        y_offset: px(5.0 * scale),\n        spread_radius: px(0),\n        blur_radius: px(10.0 * scale),\n    }])\n}\n"},{"path":"src/ui/widgets.rs","text":"//! BSN 控件只声明实体结构；按钮行为由菜单输入与请求系统处理。\n\nuse bevy::{input::mouse::MouseScrollUnit, prelude::*, text::FontSourceTemplate};\n\nuse super::{MenuButton, SettingKey, UiAction, theme::*};\n\n/// 说明文本属于按钮实体，焦点变化时只更新右侧说明，不重建页面。\n#[derive(Component, Default, Clone)]\npub(super) struct SettingDescription {\n    pub title: \u0026'static str,\n    pub body: \u0026'static str,\n}\n\n/// 可滚动区域的标记；用于键盘导航时把当前按钮滚入视野。\n#[derive(Component, Default, Clone)]\npub(super) struct MenuScroll;\n\n/// 用于图形和文字的标准间距，不承担输入或跨实体行为。\npub(super) fn column(gap: f32) -\u003e Node {\n    Node {\n        flex_direction: FlexDirection::Column,\n        row_gap: px(gap),\n        min_width: px(0),\n        ..default()\n    }\n}\n\npub(super) fn label(\n    theme: \u0026UiTheme,\n    value: impl Into\u003cString\u003e,\n    size: f32,\n    color: Color,\n) -\u003e impl Scene {\n    let value = value.into();\n    bsn! {\n        Text(value)\n        TextFont {\n            font: {FontSourceTemplate::Handle(theme.body.clone().into())},\n            font_size: px(theme.size(size).max(14.0)),\n        }\n        TextColor(color)\n        // 文字保留自动最小宽度；显式设为 0 会让 Bevy 0.19 把横排测量宽度也解析成 0。\n        Node { flex_shrink: 1.0 }\n    }\n}\n\npub(super) fn heading(\n    theme: \u0026UiTheme,\n    value: impl Into\u003cString\u003e,\n    size: f32,\n    color: Color,\n) -\u003e impl Scene {\n    let value = value.into();\n    bsn! {\n        Text(value)\n        TextFont {\n            font: {FontSourceTemplate::Handle(theme.heading.clone().into())},\n            font_size: px(theme.size(size).max(14.0)),\n        }\n        TextColor(color)\n        Node { flex_shrink: 1.0 }\n    }\n}\n\npub(super) fn paper_panel(theme: \u0026UiTheme) -\u003e impl Scene {\n    bsn! {\n        Node {\n            padding: px(theme.size(24.0)),\n            border: px(2),\n            border_radius: BorderRadius::all(px(10)),\n            flex_direction: FlexDirection::Column,\n            row_gap: px(theme.size(18.0)),\n            min_width: px(0),\n        }\n        BackgroundColor(PAPER)\n        BorderColor::all(CREAM)\n        template_value(paper_shadow(theme.scale))\n    }\n}\n\n/// 图标、文字和右侧箭头保持独立节点，长菜单名称可以正常换行。\npub(super) fn menu_button(\n    theme: \u0026UiTheme,\n    title: \u0026'static str,\n    icon: \u0026'static str,\n    action: UiAction,\n    index: usize,\n) -\u003e impl Scene {\n    bsn! {\n        Button\n        template_value(MenuButton { action, index })\n        Node {\n            width: percent(100),\n            min_height: px(theme.size(69.0)),\n            padding: UiRect::axes(px(theme.size(20.0)), px(theme.size(13.0))),\n            border: px(2),\n            border_radius: BorderRadius::all(px(8)),\n            align_items: AlignItems::Center,\n            column_gap: px(theme.size(18.0)),\n            flex_shrink: 0.0,\n        }\n        BackgroundColor(PAPER)\n        BorderColor::all(CREAM)\n        template_value(paper_shadow(theme.scale))\n        Children [\n            (\n                Node {\n                    width: px(theme.size(36.0)),\n                    justify_content: JustifyContent::Center,\n                    flex_shrink: 0.0,\n                }\n                Children [heading(theme, icon, 31.0, INK)]\n            ),\n            (\n                label(theme, title, 27.0, INK)\n                Node { flex_grow: 1.0 }\n            ),\n            heading(theme, \"\u003e\", 24.0, INK),\n        ]\n    }\n}\n\npub(super) fn small_button(\n    theme: \u0026UiTheme,\n    title: \u0026'static str,\n    action: UiAction,\n    index: usize,\n) -\u003e impl Scene {\n    bsn! {\n        Button\n        template_value(MenuButton { action, index })\n        Node {\n            min_height: px(theme.size(49.0)),\n            min_width: px(0),\n            padding: UiRect::axes(px(theme.size(19.0)), px(theme.size(11.0))),\n            border: px(2),\n            border_radius: BorderRadius::all(px(7)),\n            justify_content: JustifyContent::Center,\n            align_items: AlignItems::Center,\n        }\n        BackgroundColor(PAPER)\n        BorderColor::all(CREAM)\n        template_value(paper_shadow(theme.scale))\n        Children [label(theme, title, 21.0, INK)]\n    }\n}\n\n/// 未接通的功能不带 Button 或 MenuButton，避免鼠标和键盘误触发。\npub(super) fn placeholder_row(theme: \u0026UiTheme, title: \u0026'static str, menu: bool) -\u003e impl Scene {\n    bsn! {\n        Node {\n            width: percent(100),\n            min_height: px(theme.size(if menu { 69.0 } else { 56.0 })),\n            padding: UiRect::axes(px(theme.size(17.0)), px(theme.size(11.0))),\n            border: px(1),\n            border_radius: BorderRadius::all(px(7)),\n            align_items: AlignItems::Center,\n            column_gap: px(theme.size(12.0)),\n            row_gap: px(theme.size(6.0)),\n            flex_wrap: FlexWrap::Wrap,\n            flex_shrink: 0.0,\n        }\n        BackgroundColor({if menu { Color::srgba(0.76, 0.78, 0.79, 0.92) } else { SUBTLE }})\n        BorderColor::all(Color::srgba(0.83, 0.84, 0.83, 0.75))\n        Children [\n            (\n                label(theme, title, if menu { 25.0 } else { 20.0 }, MUTED)\n                Node { flex_grow: 1.0 }\n            ),\n            (\n                Node {\n                    padding: UiRect::axes(px(theme.size(8.0)), px(theme.size(4.0))),\n                    border_radius: BorderRadius::all(px(4)),\n                }\n                BackgroundColor(Color::srgba(0.39, 0.42, 0.46, 0.13))\n                Children [label(theme, \"Coming Soon\", 14.0, MUTED)]\n            ),\n        ]\n    }\n}\n\n/// 减少与增加按钮共享设置键，鼠标和键盘均进入同一动作路由。\npub(super) fn setting_row(\n    theme: \u0026UiTheme,\n    title: \u0026'static str,\n    value: String,\n    key: SettingKey,\n    index: usize,\n    description: \u0026'static str,\n) -\u003e impl Scene {\n    let details = SettingDescription {\n        title,\n        body: description,\n    };\n    bsn! {\n        Node {\n            width: percent(100),\n            min_height: px(theme.size(60.0)),\n            padding: px(theme.size(10.0)),\n            border_radius: BorderRadius::all(px(7)),\n            align_items: AlignItems::Center,\n            column_gap: px(theme.size(9.0)),\n            flex_wrap: FlexWrap::Wrap,\n            row_gap: px(theme.size(8.0)),\n        }\n        BackgroundColor(SUBTLE)\n        Children [\n            (\n                label(theme, title, 21.0, INK)\n                Node { flex_grow: 1.0, min_width: px(theme.size(130.0)) }\n            ),\n            (\n                Node { align_items: AlignItems::Center, column_gap: px(theme.size(8.0)) }\n                Children [\n                    (\n                        small_button(theme, \"\u003c\", UiAction::Adjust(key, -1), index)\n                        template_value(details.clone())\n                        Node { padding: px(theme.size(7.0)), min_width: px(theme.size(34.0)) }\n                    ),\n                    (\n                        Node {\n                            width: px(theme.size(130.0)),\n                            min_height: px(theme.size(43.0)),\n                            justify_content: JustifyContent::Center,\n                            align_items: AlignItems::Center,\n                            padding: px(theme.size(5.0)),\n                            border: px(1),\n                            border_radius: BorderRadius::all(px(5)),\n                        }\n                        BackgroundColor(CREAM)\n                        BorderColor::all(Color::srgba(0.2, 0.25, 0.32, 0.15))\n                        Children [label(theme, value, 20.0, INK)]\n                    ),\n                    (\n                        small_button(theme, \"\u003e\", UiAction::Adjust(key, 1), index + 1)\n                        template_value(details)\n                        Node { padding: px(theme.size(7.0)), min_width: px(theme.size(34.0)) }\n                    ),\n                ]\n            ),\n        ]\n    }\n}\n\npub(super) fn keycap(theme: \u0026UiTheme, key: \u0026'static str, light: bool) -\u003e impl Scene {\n    let color = if light { CREAM } else { INK };\n    bsn! {\n        Node {\n            min_width: px(theme.size(29.0)),\n            min_height: px(theme.size(29.0)),\n            padding: UiRect::axes(px(theme.size(8.0)), px(theme.size(4.0))),\n            border: px(1),\n            border_radius: BorderRadius::all(px(4)),\n            align_items: AlignItems::Center,\n            justify_content: JustifyContent::Center,\n        }\n        BorderColor::all(color)\n        Children [label(theme, key, 17.0, color)]\n    }\n}\n\n/// 纸箱标志由普通 UI 节点组合，避免把品牌和按钮文字烘焙进图片。\npub(super) fn parcel_stamp(theme: \u0026UiTheme) -\u003e impl Scene {\n    bsn! {\n        Node {\n            width: px(theme.size(50.0)),\n            height: px(theme.size(45.0)),\n            border: px(3),\n            border_radius: BorderRadius::all(px(4)),\n            align_items: AlignItems::Center,\n            justify_content: JustifyContent::Center,\n        }\n        BackgroundColor(Color::srgb(0.75, 0.51, 0.27))\n        BorderColor::all(INK)\n        Children [\n            (\n                Node {\n                    position_type: PositionType::Absolute,\n                    top: px(0),\n                    width: percent(30),\n                    height: percent(40),\n                }\n                BackgroundColor(Color::srgb(0.91, 0.71, 0.42))\n            ),\n            (\n                Node {\n                    width: percent(40),\n                    height: px(theme.size(6.0)),\n                    margin: UiRect::top(px(theme.size(12.0))),\n                    border_radius: BorderRadius::all(px(2)),\n                }\n                BackgroundColor(INK)\n            ),\n        ]\n    }\n}\n\npub(super) fn logo(theme: \u0026UiTheme, compact: bool) -\u003e impl Scene {\n    let title_size = if compact { 50.0 } else { 73.0 };\n    bsn! {\n        template_value(column(theme.size(3.0)))\n        Children [\n            (\n                Node { align_items: AlignItems::Center, column_gap: px(theme.size(12.0)) }\n                Children [\n                    parcel_stamp(theme),\n                    label(theme, \"ISLAND DELIVERY CO.\", 15.0, CREAM),\n                ]\n            ),\n            (\n                heading(theme, \"ISLAND\", title_size, CREAM)\n                TextShadow { offset: {Vec2::new(3.0, 4.0)}, color: INK }\n            ),\n            (\n                heading(theme, \"COURIER\", title_size, GOLD)\n                TextShadow { offset: {Vec2::new(3.0, 4.0)}, color: INK }\n            ),\n            (\n                label(theme, \"SMALL ISLAND. BIG DELIVERIES.\", 16.0, CREAM)\n                TextShadow { offset: {Vec2::new(1.0, 2.0)}, color: INK }\n                Node { margin: UiRect::top(px(theme.size(7.0))) }\n            ),\n        ]\n    }\n}\n\n/// 鼠标滚轮使用 Bevy UI 的指针事件；不另行读取底层滚轮，避免重复滚动。\npub(super) fn scroll_area(theme: \u0026UiTheme) -\u003e impl Scene {\n    bsn! {\n        MenuScroll\n        Node {\n            flex_direction: FlexDirection::Column,\n            width: percent(100),\n            min_height: px(0),\n            flex_grow: 1.0,\n            // 在页面根的纵向布局中只占剩余高度，页脚始终留在可视区域。\n            flex_basis: px(0),\n            overflow: Overflow::scroll_y(),\n            row_gap: px(theme.size(18.0)),\n            padding: px(theme.size(5.0)),\n        }\n        ScrollPosition(Vec2::ZERO)\n        on(scroll_menu)\n    }\n}\n\nfn scroll_menu(\n    mut event: On\u003cPointer\u003cScroll\u003e\u003e,\n    mut areas: Query\u003c(\u0026mut ScrollPosition, \u0026ComputedNode), With\u003cMenuScroll\u003e\u003e,\n) {\n    let Ok((mut position, node)) = areas.get_mut(event.entity) else {\n        return;\n    };\n    let delta = match event.unit {\n        MouseScrollUnit::Line =\u003e event.y * 32.0,\n        MouseScrollUnit::Pixel =\u003e event.y,\n    };\n    let range = (node.content_size().y - node.size().y).max(0.0) * node.inverse_scale_factor();\n    position.y = (position.y - delta).clamp(0.0, range);\n    event.propagate(false);\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use bevy::{\n        app::{HierarchyPropagatePlugin, PropagateSet},\n        asset::{AssetEventSystems, AssetPlugin},\n        camera::{ComputedCameraValues, RenderTargetInfo, Viewport},\n        scene::ScenePlugin,\n        text::{\n            TextLayoutInfo, TextPlugin, detect_text_needs_rerender,\n            load_font_assets_into_font_collection,\n        },\n        ui::{\n            ui_layout_system,\n            ui_surface::UiSurface,\n            update::propagate_ui_target_cameras,\n            widget::{measure_text_system, text_system},\n        },\n    };\n\n    /// 使用真实字体测量与字形布局；虚拟相机只提供尺寸，不安装窗口或渲染器。\n    fn layout_app() -\u003e App {\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            AssetPlugin::default(),\n            ScenePlugin,\n            TextPlugin,\n            HierarchyPropagatePlugin::\u003cComputedUiTargetCamera\u003e::new(PostUpdate),\n            HierarchyPropagatePlugin::\u003cComputedUiRenderTargetInfo\u003e::new(PostUpdate),\n        ))\n        .init_asset::\u003cImage\u003e()\n        .init_resource::\u003cUiScale\u003e()\n        .init_resource::\u003cUiSurface\u003e()\n        .add_systems(\n            PostUpdate,\n            (\n                propagate_ui_target_cameras,\n                measure_text_system\n                    .after(load_font_assets_into_font_collection)\n                    .after(detect_text_needs_rerender),\n                ui_layout_system,\n                text_system.before(AssetEventSystems),\n            )\n                .chain(),\n        )\n        .configure_sets(\n            PostUpdate,\n            PropagateSet::\u003cComputedUiTargetCamera\u003e::default()\n                .after(propagate_ui_target_cameras)\n                .before(measure_text_system),\n        )\n        .configure_sets(\n            PostUpdate,\n            PropagateSet::\u003cComputedUiRenderTargetInfo\u003e::default()\n                .after(propagate_ui_target_cameras)\n                .before(measure_text_system),\n        );\n        let size = UVec2::new(900, 900);\n        app.world_mut().spawn((\n            Camera2d,\n            IsDefaultUiCamera,\n            Camera {\n                computed: ComputedCameraValues {\n                    target_info: Some(RenderTargetInfo {\n                        physical_size: size,\n                        scale_factor: 1.0,\n                    }),\n                    ..default()\n                },\n                viewport: Some(Viewport {\n                    physical_size: size,\n                    ..default()\n                }),\n                ..default()\n            },\n        ));\n        app.finish();\n        app.cleanup();\n        app\n    }\n\n    #[test]\n    fn bsn_row_text_keeps_intrinsic_width_and_column_text_wraps() {\n        let mut app = layout_app();\n        // TextPlugin 的内嵌字体是真实字体，避免测试依赖本机的外部美术资产。\n        let theme = UiTheme {\n            heading: default(),\n            body: default(),\n            scale: 1.0,\n        };\n        const PARAGRAPH: \u0026str = \"Move around the island with WASD. Jump with Space. Carry a parcel to explore a new route and make your next delivery.\";\n        app.world_mut()\n            .spawn_scene(bsn! {\n                template_value(column(12.0))\n                Node { width: percent(100), height: percent(100), padding: px(16) }\n                Children [\n                    (\n                        Node { column_gap: px(12), align_items: AlignItems::Center }\n                        Children [\n                            small_button(\u0026theme, \"Restore Defaults\", UiAction::RestoreDefaults, 0),\n                            small_button(\u0026theme, \"Apply\", UiAction::ApplySettings, 1),\n                            small_button(\u0026theme, \"Back\", UiAction::Back, 2),\n                        ]\n                    ),\n                    setting_row(\u0026theme, \"Frame Rate Limit\", \"60 FPS\".into(), SettingKey::FrameRate, 3, \"Adjust the maximum frame rate.\"),\n                    placeholder_row(\u0026theme, \"Window Mode\", false),\n                    (\n                        Node { column_gap: px(9), align_items: AlignItems::Center }\n                        Children [\n                            keycap(\u0026theme, \"Arrows\", true),\n                            label(\u0026theme, \"Navigate\", 17.0, CREAM),\n                            keycap(\u0026theme, \"Enter\", true),\n                            label(\u0026theme, \"Confirm\", 17.0, CREAM),\n                            keycap(\u0026theme, \"Esc\", true),\n                            label(\u0026theme, \"Back\", 17.0, CREAM),\n                            keycap(\u0026theme, \"WASD\", false),\n                            keycap(\u0026theme, \"Space\", false),\n                            keycap(\u0026theme, \"E\", false),\n                        ]\n                    ),\n                    (\n                        Node { column_gap: px(9), align_items: AlignItems::Center }\n                        Children [\n                            (\n                                Node { width: px(49), height: px(49), align_items: AlignItems::Center, justify_content: JustifyContent::Center }\n                                BackgroundColor(GOLD)\n                                Children [heading(\u0026theme, \"01\", 26.0, INK)]\n                            ),\n                            heading(\u0026theme, \"MOVE \u0026 JUMP\", 27.0, INK),\n                        ]\n                    ),\n                    (\n                        Node { column_gap: px(9), align_items: AlignItems::Center }\n                        Children [\n                            parcel_stamp(\u0026theme),\n                            label(\u0026theme, \"ISLAND DELIVERY CO.\", 15.0, CREAM),\n                        ]\n                    ),\n                    (\n                        template_value(column(8.0))\n                        Node { width: px(240), padding: px(12), flex_shrink: 0.0 }\n                        Children [heading(\u0026theme, \"HOW TO PLAY\", 25.0, INK), label(\u0026theme, PARAGRAPH, 18.0, INK)]\n                    ),\n                ]\n            })\n            .unwrap();\n        // 资产事件首帧进入字体集合，后续更新完成实际字形与布局计算。\n        for _ in 0..3 {\n            app.update();\n        }\n        let world = app.world_mut();\n        let mut texts = world.query::\u003c(\u0026Text, \u0026ComputedNode, \u0026TextLayoutInfo)\u003e();\n        let invisible: Vec\u003c_\u003e = texts\n            .iter(world)\n            .filter(|(_, node, layout)| {\n                node.size().x \u003c= 0.0 || node.size().y \u003c= 0.0 || layout.glyphs.is_empty()\n            })\n            .map(|(text, node, layout)| (text.0.as_str(), node.size(), layout.glyphs.len()))\n            .collect();\n        assert!(\n            invisible.is_empty(),\n            \"Text needs visible layout: {invisible:?}\"\n        );\n        let (_, paragraph, glyphs) = texts\n            .iter(world)\n            .find(|(text, _, _)| text.0 == PARAGRAPH)\n            .unwrap();\n        assert!(paragraph.size().x \u003c= 216.0);\n        assert!(\n            paragraph.size().y \u003e 36.0,\n            \"Description must wrap into multiple lines\"\n        );\n        assert!(!glyphs.glyphs.is_empty());\n    }\n}\n"}]</script>
<script>
const sources = JSON.parse(document.getElementById('sources').textContent);
const files = new Map(sources.map(source => [source.path, source.text]));
const selector = document.getElementById('file');
const scroller = document.getElementById('scroller');
const code = document.getElementById('code');
const empty = document.getElementById('empty');
const summary = document.getElementById('summary');
const status = document.getElementById('status');
let selectedLine;
const placeholder = document.createElement('option');
placeholder.value = '';
placeholder.textContent = '请选择源码文件';
selector.append(placeholder);
for (const file of files.keys()) {
  const option = document.createElement('option');
  option.value = file;
  option.textContent = file;
  selector.append(option);
}

function locateLine() {
  selectedLine?.classList.remove('selected');
  selectedLine = undefined;
  status.textContent = '';
  if (!location.hash || !code.children.length) return;
  const match = /^#L([1-9][0-9]*)$/.exec(location.hash);
  const line = match ? Number(match[1]) : 0;
  const row = Number.isSafeInteger(line) ? code.children[line - 1] : undefined;
  if (!row) {
    status.textContent = '定位行不存在，请点击有效的行号。';
    return;
  }
  selectedLine = row;
  row.classList.add('selected');
  status.textContent = '已定位到第 ' + line + ' 行。';
  // 只滚动源码容器，保留顶部文件选择与定位提示。
  scroller.scrollTop = row.offsetTop - (scroller.clientHeight - row.offsetHeight) / 2;
}

function showFile() {
  const requested = new URLSearchParams(location.search).get('file');
  const file = requested === null ? sources[0]?.path : requested;
  const text = files.get(file);
  code.replaceChildren();
  scroller.scrollTop = 0;
  selector.value = files.has(file) ? file : '';
  empty.hidden = true;
  summary.textContent = '这是生成架构图时保存的源码快照。点击行号可以更新当前定位链接。';
  if (text === undefined || text === '') {
    empty.hidden = false;
    empty.textContent = text === '' ? '此文件为空。' : !sources.length ? '此快照未包含源码文件。' : file ? '快照中找不到文件：' + file : '请选择一个源码文件。';
    if (files.has(file)) summary.textContent = file + ' · 空文件 · 生成时的源码快照';
    locateLine();
    return;
  }
  // 统一换行以正确编号，保留空行与末尾空行；全部内容通过 textContent 写入。
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const fragment = document.createDocumentFragment();
  lines.forEach((line, index) => {
    const number = index + 1;
    const row = document.createElement('div');
    row.className = 'code-line';
    row.id = 'L' + number;
    const anchor = document.createElement('a');
    anchor.className = 'line-number';
    anchor.href = '#L' + number;
    anchor.textContent = number;
    anchor.setAttribute('aria-label', '定位到第 ' + number + ' 行');
    const content = document.createElement('code');
    content.textContent = line;
    row.append(anchor, content);
    fragment.append(row);
  });
  code.append(fragment);
  summary.textContent = file + ' · ' + lines.length + ' 行 · 生成时的源码快照';
  document.title = file + ' — ECS 架构源码';
  locateLine();
}

selector.addEventListener('change', () => {
  const url = new URL(location.href);
  url.search = '?file=' + encodeURIComponent(selector.value);
  url.hash = '';
  // 使用普通页面导航，避免本地 file:// 页面的 History API 权限差异。
  location.href = url.href;
});
code.addEventListener('click', event => {
  if (event.target.closest('.line-number')) requestAnimationFrame(locateLine);
});
addEventListener('hashchange', locateLine);
showFile();
</script>
</body>
