            if let Ok(mut item_transform) = held_items.get_mut(item) {\n                let before = item_transform.translation;\n                let mut drop_position =\n                    transform.translation + transform.rotation * Vec3::new(0.0, 0.0, -1.2);\n                drop_position.y = config.ground_y + config.parcel_half_height;\n                item_transform.translation = drop_position;\n                commands.entity(item).remove::\u003cHeldBy\u003e();\n                info!(\n                    ?character,\n                    ?item,\n                    before = ?before,\n                    after = ?drop_position,\n                    holding_before = \"held\",\n                    holding_after = \"free\",\n                    reason = \"interact_action_drop\",\n                    \"Wooden crate dropped\"\n                );\n            }\n            continue;\n        }\n\n        let nearest = pickables\n            .iter()\n            .map(|(entity, item_transform)| {\n                (\n                    entity,\n                    transform\n                        .translation\n                        .distance_squared(item_transform.translation),\n                )\n            })\n            .filter(|(_, distance)| *distance \u003c= config.pickup_radius.powi(2))\n            .min_by(|(_, a), (_, b)| a.total_cmp(b));\n\n        if let Some((item, distance_squared)) = nearest {\n            commands.entity(item).insert(HeldBy(character));\n            info!(\n                ?character,\n                ?item,\n                before = \"free\",\n                after = \"held\",\n                distance = distance_squared.sqrt(),\n                reason = \"interact_action_pickup\",\n                \"Wooden crate picked up\"\n            );\n        } else {\n            info!(\n                ?character,\n                reason = \"no_pickable_in_range\",\n                \"No pickable item in range\"\n            );\n        }\n    }\n}\n\n/// 持箱使用世界空间位置，自定义关系不改变箱子的 Transform 父子层级。\n/// 固定步在交互命令应用后同步；相机插件也在逐帧转向后注册此系统，补齐无固定步的帧。\npub(crate) fn sync_held_objects(\n    config: Res\u003cPrototypeConfig\u003e,\n    characters: Query\u003c\u0026Transform, (With\u003cCharacter\u003e, Without\u003cPickable\u003e)\u003e,\n    mut items: Query\u003c(\u0026HeldBy, \u0026mut Transform), (With\u003cPickable\u003e, Without\u003cCharacter\u003e)\u003e,\n) {\n    for (held_by, mut transform) in \u0026mut items {\n        if let Ok(character) = characters.get(held_by.0) {\n            transform.translation = character.translation + character.rotation * config.hold_offset;\n            transform.rotation = character.rotation;\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::time::Duration;\n\n    fn test_app() -\u003e App {\n        let mut app = App::new();\n        app.insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .add_plugins(GameplayPlugin);\n        app\n    }\n\n    fn step(app: \u0026mut App) {\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n            .advance_by(Duration::from_secs_f64(1.0 / 60.0));\n        app.world_mut().run_schedule(FixedUpdate);\n    }\n\n    fn spawn_character(app: \u0026mut App, position: Vec3, intent: CharacterIntent) -\u003e Entity {\n        app.world_mut()\n            .spawn((\n                Character,\n                intent,\n                CharacterMotion {\n                    grounded: true,\n                    ..default()\n                },\n                Transform::from_translation(position),\n            ))\n            .id()\n    }\n\n    fn interact(app: \u0026mut App, character: Entity) {\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .interact_pending = true;\n        step(app);\n    }\n\n    #[test]\n    fn diagonal_movement_has_same_speed_and_characters_move_independently() {\n        let mut app = test_app();\n        let straight = spawn_character(\n            \u0026mut app,\n            Vec3::ZERO,\n            CharacterIntent {\n                movement: Vec2::Y,\n                ..default()\n            },\n        );\n        let diagonal = spawn_character(\n            \u0026mut app,\n            Vec3::ZERO,\n            CharacterIntent {\n                movement: Vec2::ONE,\n                ..default()\n            },\n        );\n        step(\u0026mut app);\n        let straight_position = app.world().get::\u003cTransform\u003e(straight).unwrap().translation;\n        let diagonal_position = app.world().get::\u003cTransform\u003e(diagonal).unwrap().translation;\n        assert!((straight_position.length() - diagonal_position.length()).abs() \u003c 0.0001);\n        assert!(straight_position.z \u003c 0.0);\n        assert_eq!(straight_position.x, 0.0);\n        assert!(diagonal_position.x \u003e 0.0);\n    }\n\n    #[test]\n    fn held_forward_input_follows_character_yaw_across_fixed_steps() {\n        let mut app = test_app();\n        let character = spawn_character(\n            \u0026mut app,\n            Vec3::ZERO,\n            CharacterIntent {\n                movement: Vec2::Y,\n                ..default()\n            },\n        );\n        step(\u0026mut app);\n        let first_position = app.world().get::\u003cTransform\u003e(character).unwrap().translation;\n        let rotation = Quat::from_rotation_y(std::f32::consts::FRAC_PI_2);\n        app.world_mut()\n            .get_mut::\u003cTransform\u003e(character)\n            .unwrap()\n            .rotation = rotation;\n\n        // 固定步可多次读取同一移动意图，转动视角后无需新的按键事件即可改变世界方向。\n        step(\u0026mut app);\n        let transform = app.world().get::\u003cTransform\u003e(character).unwrap();\n        let displacement = transform.translation - first_position;\n        let distance = app.world().resource::\u003cPrototypeConfig\u003e().move_speed / 60.0;\n        assert!(displacement.abs_diff_eq(-Vec3::X * distance, 0.0001));\n        assert_eq!(transform.rotation, rotation);\n        assert_eq!(\n            app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .movement,\n            Vec2::Y\n        );\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .horizontal_velocity\n                .abs_diff_eq(\n                    -Vec3::X * app.world().resource::\u003cPrototypeConfig\u003e().move_speed,\n                    0.0001,\n                )\n        );\n    }\n\n    #[test]\n    fn strafing_and_backing_up_use_local_axes_without_changing_facing() {\n        let mut app = test_app();\n        let rotation = Quat::from_rotation_y(std::f32::consts::FRAC_PI_2);\n        let distance = app.world().resource::\u003cPrototypeConfig\u003e().move_speed / 60.0;\n        for (axes, direction) in [\n            (Vec2::X, -Vec3::Z),\n            (-Vec2::X, Vec3::Z),\n            (-Vec2::Y, Vec3::X),\n        ] {\n            let character = spawn_character(\n                \u0026mut app,\n                Vec3::ZERO,\n                CharacterIntent {\n                    movement: axes,\n                    ..default()\n                },\n            );\n            app.world_mut()\n                .get_mut::\u003cTransform\u003e(character)\n                .unwrap()\n                .rotation = rotation;\n            step(\u0026mut app);\n            let transform = app.world().get::\u003cTransform\u003e(character).unwrap();\n            assert!(\n                transform\n                    .translation\n                    .abs_diff_eq(direction * distance, 0.0001)\n            );\n            assert_eq!(transform.rotation, rotation);\n        }\n    }\n\n    #[test]\n    fn jump_is_consumed_once_and_airborne_request_does_not_rejump_on_landing() {\n        let mut app = test_app();\n        let character = spawn_character(\n            \u0026mut app,\n            Vec3::ZERO,\n            CharacterIntent {\n                jump_pending: true,\n                ..default()\n            },\n        );\n        step(\u0026mut app);\n        assert!(\n            app.world()\n                .get::\u003cTransform\u003e(character)\n                .unwrap()\n                .translation\n                .y\n                \u003e 0.0\n        );\n        assert!(\n            !app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .jump_pending\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .jump_pending = true;\n        for _ in 0..90 {\n            step(\u0026mut app);\n        }\n        let motion = app.world().get::\u003cCharacterMotion\u003e(character).unwrap();\n        assert!(motion.grounded);\n        assert_eq!(motion.vertical_velocity, 0.0);\n        assert_eq!(\n            app.world()\n                .get::\u003cTransform\u003e(character)\n                .unwrap()\n                .translation\n                .y,\n            0.0\n        );\n    }\n\n    #[test]\n    fn pickup_filters_capability_and_updates_relationship_before_following() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let not_pickable = app\n            .world_mut()\n            .spawn((Parcel, Transform::from_xyz(0.0, 0.3, -0.5)))\n            .id();\n        interact(\u0026mut app, character);\n        assert!(app.world().get::\u003cHeldBy\u003e(not_pickable).is_none());\n\n        let item = app\n            .world_mut()\n            .spawn((Parcel, Pickable, Transform::from_xyz(0.0, 0.3, -1.3)))\n            .id();\n        interact(\u0026mut app, character);\n        assert_eq!(app.world().get::\u003cHeldBy\u003e(item).unwrap().0, character);\n        assert_eq!(\n            app.world()\n                .get::\u003cHoldingItems\u003e(character)\n                .unwrap()\n                .iter()\n                .collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![item]\n        );\n        let hold_offset = app.world().resource::\u003cPrototypeConfig\u003e().hold_offset;\n        assert_eq!(\n            app.world().get::\u003cTransform\u003e(item).unwrap().translation,\n            hold_offset\n        );\n        assert!(app.world().get::\u003cHeldBy\u003e(not_pickable).is_none());\n\n        interact(\u0026mut app, character);\n        assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n        assert!(\n            app.world()\n                .get::\u003cHoldingItems\u003e(character)\n                .is_none_or(|items| items.is_empty())\n        );\n        assert_eq!(\n            app.world().get::\u003cTransform\u003e(item).unwrap().translation,\n            Vec3::new(0.0, 0.3, -1.2)\n        );\n    }\n\n    #[test]\n    fn separate_characters_can_hold_their_own_boxes() {\n        let mut app = test_app();\n        let first = spawn_character(\n            \u0026mut app,\n            Vec3::ZERO,\n            CharacterIntent {\n                interact_pending: true,\n                ..default()\n            },\n        );\n        let second = spawn_character(\n            \u0026mut app,\n            Vec3::X * 6.0,\n            CharacterIntent {\n                interact_pending: true,\n                ..default()\n            },\n        );\n        let first_box = app\n            .world_mut()\n            .spawn((Pickable, Transform::from_xyz(0.0, 0.3, -1.3)))\n            .id();\n        let second_box = app\n            .world_mut()\n            .spawn((Pickable, Transform::from_xyz(6.0, 0.3, -1.3)))\n            .id();\n        step(\u0026mut app);\n        assert_eq!(app.world().get::\u003cHeldBy\u003e(first_box).unwrap().0, first);\n        assert_eq!(app.world().get::\u003cHeldBy\u003e(second_box).unwrap().0, second);\n    }\n}\n"},{"path":"src/input.rs","text":"//! 注册 Enhanced Input 动作；键盘意图按控制者路由，观察与视角切换动作由相机模块消费。\n\nuse bevy::prelude::*;\nuse bevy_enhanced_input::prelude::{Cancel, Press, *};\n\nuse crate::gameplay::{Character, CharacterIntent, ControlsCharacter, PlayerId};\n\n/// 注册玩家输入上下文和动作观察者。\npub struct PlayerInputPlugin;\n\nimpl Plugin for PlayerInputPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_plugins(EnhancedInputPlugin)\n            // 默认在 PreUpdate 评估；玩法请求交给 FixedUpdate，相机动作在同帧更新。\n            .add_input_context::\u003cGameplayContext\u003e()\n            .add_observer(record_movement)\n            .add_observer(clear_completed_movement)\n            .add_observer(clear_cancelled_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n    }\n}\n\n/// 控制者的步行输入上下文；角色实体不直接持有设备绑定。\n#[derive(Component)]\npub struct GameplayContext;\n\n/// 地面移动方向，X 为左右、Y 为前后。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct MoveAction;\n\n/// 鼠标观察动作，输出本帧汇总位移，由相机 Observer 直接处理。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct LookAction;\n\n/// 每次按下产生一次跳跃请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct JumpAction;\n\n/// 每次按下产生一次拾取或放下请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct InteractAction;\n\n/// 每次按下请求切换第一人称与第三人称，由相机 Observer 接收，再由同帧系统消费。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct TogglePerspectiveAction;\n\n/// 为指定玩家与角色创建键盘控制者，返回本次运行的控制者实体。\n///\n/// 场景只为获得键盘控制权的玩家调用一次；后续手柄或远程控制者单独配置。\npub fn spawn_keyboard_controller(\n    commands: \u0026mut Commands,\n    player_id: PlayerId,\n    character: Entity,\n) -\u003e Entity {\n    let id = player_id.0;\n    let controller = commands\n        .spawn((\n            Name::new(format!(\"Keyboard controller {id}\")),\n            player_id,\n            ControlsCharacter(character),\n            keyboard_context(),\n        ))\n        .id();\n    info!(\n        target: \"demo::input\",\n        player_id = id,\n        ?controller,\n        ?character,\n        \"Keyboard controller spawned: WASD to move, Space to jump, E to pick up or drop, I to toggle perspective\"\n    );\n    controller\n}\n\nfn keyboard_context() -\u003e impl Bundle {\n    (\n        GameplayContext,\n        GamepadDevice::None,\n        actions!(GameplayContext[\n            (\n                Action::\u003cLookAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                bindings![Binding::mouse_motion()],\n            ),\n            (\n                Action::\u003cMoveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                Bindings::spawn(Cardinal::wasd_keys()),\n            ),\n            (\n                Action::\u003cJumpAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::Space],\n            ),\n            (\n                Action::\u003cInteractAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyE],\n            ),\n            (\n                Action::\u003cTogglePerspectiveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyI],\n            ),\n        ]),\n    )\n}\n\n/// 按事件所属的上下文查找角色，避免把一个玩家的动作写给其他角色。\nfn record_movement(\n    event: On\u003cFire\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != event.value {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?event.value, reason = \"move_action\",\n            \"Character movement input changed\");\n        intent.movement = event.value;\n    }\n}\n\nfn clear_completed_movement(\n    event: On\u003cComplete\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_completed\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\nfn clear_cancelled_movement(\n    event: On\u003cCancel\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_cancelled\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\n/// 一次性请求保留到固定步消费，即使本渲染帧没有固定步也不会丢失。\nfn request_jump(\n    event: On\u003cFire\u003cJumpAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.jump_pending = true;\n}\n\nfn request_interaction(\n    event: On\u003cFire\u003cInteractAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.interact_pending = true;\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::Duration;\n\n    use bevy::{ecs::relationship::RelationshipTarget, input::InputPlugin};\n\n    use crate::gameplay::{\n        CharacterMotion, GameplayPlugin, HoldingItems, Pickable, PrototypeConfig,\n    };\n\n    use super::*;\n\n    fn fire\u003cA: InputAction\u003e(context: Entity, value: A::Output) -\u003e Fire\u003cA\u003e {\n        Fire {\n            context,\n            action: Entity::PLACEHOLDER,\n            value,\n            state: TriggerState::Fired,\n            fired_secs: 0.0,\n            elapsed_secs: 0.0,\n        }\n    }\n\n    #[test]\n    fn actions_are_routed_to_their_own_character() {\n        let mut app = App::new();\n        app.add_observer(record_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n        let first = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let second = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let first_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(first)))\n            .id();\n        let second_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(second)))\n            .id();\n\n        app.world_mut()\n            .trigger(fire::\u003cMoveAction\u003e(first_context, Vec2::X));\n        app.world_mut()\n            .trigger(fire::\u003cJumpAction\u003e(second_context, true));\n        app.world_mut()\n            .trigger(fire::\u003cInteractAction\u003e(first_context, true));\n\n        let first_intent = app.world().get::\u003cCharacterIntent\u003e(first).unwrap();\n        let second_intent = app.world().get::\u003cCharacterIntent\u003e(second).unwrap();\n        assert_eq!(first_intent.movement, Vec2::X);\n        assert!(!first_intent.jump_pending);\n        assert!(first_intent.interact_pending);\n        assert_eq!(second_intent.movement, Vec2::ZERO);\n        assert!(second_intent.jump_pending);\n        assert!(!second_intent.interact_pending);\n    }\n\n    #[test]\n    fn movement_completion_and_cancellation_clear_only_their_character() {\n        let mut app = App::new();\n        app.add_observer(clear_completed_movement)\n            .add_observer(clear_cancelled_movement);\n        let first = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent {\n                    movement: Vec2::X,\n                    ..default()\n                },\n            ))\n            .id();\n        let second = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent {\n                    movement: Vec2::Y,\n                    ..default()\n                },\n            ))\n            .id();\n        let first_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(first)))\n            .id();\n        let second_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(second)))\n            .id();\n\n        app.world_mut().trigger(Complete::\u003cMoveAction\u003e {\n            context: first_context,\n            action: Entity::PLACEHOLDER,\n            value: Vec2::ZERO,\n            state: TriggerState::None,\n            fired_secs: 0.0,\n            elapsed_secs: 0.0,\n        });\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(first).unwrap().movement,\n            Vec2::ZERO\n        );\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(second).unwrap().movement,\n            Vec2::Y\n        );\n        app.world_mut().trigger(Cancel::\u003cMoveAction\u003e {\n            context: second_context,\n            action: Entity::PLACEHOLDER,\n            value: Vec2::ZERO,\n            state: TriggerState::None,\n            elapsed_secs: 0.0,\n        });\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(second).unwrap().movement,\n            Vec2::ZERO\n        );\n    }\n\n    #[test]\n    fn keyboard_press_fires_once_and_requests_survive_until_consumed() {\n        // 仅初始化时间、输入和动作插件，不创建窗口或完整游戏场景。\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, InputPlugin, PlayerInputPlugin));\n        // Enhanced Input 在 finish 创建上下文运行资源，完成后才能插入上下文。\n        app.finish();\n        app.cleanup();\n        let character = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        app.world_mut()\n            .spawn((ControlsCharacter(character), keyboard_context()));\n        app.update();\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::Space);\n            keys.press(KeyCode::KeyE);\n            keys.press(KeyCode::KeyW);\n        }\n        app.update();\n        app.update();\n        {\n            let mut intent = app\n                .world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap();\n            assert!(intent.jump_pending);\n            assert!(intent.interact_pending);\n            assert_eq!(intent.movement, Vec2::Y);\n            intent.jump_pending = false;\n            intent.interact_pending = false;\n        }\n        app.update();\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(!intent.jump_pending);\n        assert!(!intent.interact_pending);\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.release(KeyCode::Space);\n            keys.release(KeyCode::KeyE);\n            keys.release(KeyCode::KeyW);\n        }\n        app.update();\n        assert_eq!(\n            app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .movement,\n            Vec2::ZERO\n        );\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::Space);\n            keys.press(KeyCode::KeyE);\n        }\n        app.update();\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(intent.jump_pending);\n        assert!(intent.interact_pending);\n    }\n\n    #[test]\n    fn perspective_key_fires_once_per_press() {\n        // 只观察实际键盘绑定产生的动作，验证长按不会重复切换。\n        #[derive(Resource, Default)]\n        struct PerspectivePresses(u32);\n\n        fn count_perspective_presses(\n            _event: On\u003cFire\u003cTogglePerspectiveAction\u003e\u003e,\n            mut presses: ResMut\u003cPerspectivePresses\u003e,\n        ) {\n            presses.0 += 1;\n        }\n\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, InputPlugin, PlayerInputPlugin))\n            .init_resource::\u003cPerspectivePresses\u003e()\n            .add_observer(count_perspective_presses);\n        app.finish();\n        app.cleanup();\n        // 上下文激活时已按住 I，require_reset 应阻止意外切换，直到松开后重新按下。\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        app.world_mut().spawn(keyboard_context());\n        for _ in 0..3 {\n            app.update();\n        }\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 0);\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::KeyI);\n        app.update();\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        for _ in 0..3 {\n            app.update();\n        }\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 1);\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::KeyI);\n        app.update();\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        app.update();\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 2);\n    }\n\n    #[test]\n    fn keyboard_actions_drive_fixed_step_pickup_jump_and_following() {\n        // 串起实际输入与玩法插件，显式推进固定步；不加载场景或窗口插件。\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            InputPlugin,\n            PlayerInputPlugin,\n            GameplayPlugin,\n        ));\n        app.finish();\n        app.cleanup();\n        let character = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent::default(),\n                CharacterMotion {\n                    grounded: true,\n                    ..default()\n                },\n                Transform::default(),\n            ))\n            .id();\n        let item = app\n            .world_mut()\n            .spawn((Pickable, Transform::from_xyz(0.0, 0.3, -1.0)))\n            .id();\n        app.world_mut()\n            .spawn((ControlsCharacter(character), keyboard_context()));\n        app.update();\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::KeyE);\n            keys.press(KeyCode::KeyW);\n            keys.press(KeyCode::Space);\n        }\n        app.world_mut().run_schedule(PreUpdate);\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(intent.jump_pending \u0026\u0026 intent.interact_pending);\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n            .advance_by(Duration::from_secs_f64(1.0 / 60.0));\n        app.world_mut().run_schedule(FixedUpdate);\n\n        assert_eq!(\n            app.world()\n                .get::\u003cHoldingItems\u003e(character)\n                .unwrap()\n                .iter()\n                .collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![item]\n        );\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(!intent.jump_pending \u0026\u0026 !intent.interact_pending);\n        let character_before = *app.world().get::\u003cTransform\u003e(character).unwrap();\n        let item_before = *app.world().get::\u003cTransform\u003e(item).unwrap();\n        assert!(character_before.translation.y \u003e 0.0);\n        assert!(character_before.translation.z \u003c 0.0);\n        let offset = app.world().resource::\u003cPrototypeConfig\u003e().hold_offset;\n        assert!(item_before.translation.abs_diff_eq(\n            character_before.translation + character_before.rotation * offset,\n            0.0001,\n        ));\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.release(KeyCode::Space);\n            keys.release(KeyCode::KeyE);\n        }\n        app.world_mut().run_schedule(PreUpdate);\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n            .advance_by(Duration::from_secs_f64(1.0 / 60.0));\n        app.world_mut().run_schedule(FixedUpdate);\n        let character_after = app.world().get::\u003cTransform\u003e(character).unwrap();\n        let item_after = app.world().get::\u003cTransform\u003e(item).unwrap();\n        assert!(character_after.translation.z \u003c character_before.translation.z);\n        assert!(\n            (item_after.translation - item_before.translation).abs_diff_eq(\n                character_after.translation - character_before.translation,\n                0.0001,\n            )\n        );\n    }\n}\n"},{"path":"src/main.rs","text":"//! 使用简易资产启动移动、跳跃和木箱拾取原型。\n\nmod camera;\nmod gameplay;\nmod input;\nmod scene;\nmod session_log;\nmod settings;\nmod startup_log;\n\nuse bevy::{log::LogPlugin, prelude::*, window::PresentMode};\nuse bevy_inspector_egui::{bevy_egui::EguiPlugin, quick::WorldInspectorPlugin};\nuse camera::CameraControlPlugin;\nuse gameplay::GameplayPlugin;\nuse input::PlayerInputPlugin;\nuse scene::PrototypeScenePlugin;\nuse settings::{GameSettings, SettingsPlugin};\nuse startup_log::StartupLogPlugin;\n\nfn main() -\u003e AppExit {\n    let mut app = App::new();\n    // 先准备会话文件，再交给 LogPlugin 安装日志；守护对象保留到退出记录写入后。\n    let session = match session_log::prepare(\u0026mut app) {\n        Ok(session) =\u003e session,\n        Err(error) =\u003e {\n            eprintln!(\"Failed to initialize session logging; game startup aborted: {error}\");\n            return AppExit::error();\n        }\n    };\n\n    app.add_plugins(\n        DefaultPlugins\n            .set(LogPlugin {\n                custom_layer: session_log::file_layer,\n                ..default()\n            })\n            .set(WindowPlugin {\n                primary_window: Some(Window {\n                    // 避免垂直同步把玩家设置的帧率上限额外限制为显示器的刷新率。\n                    present_mode: PresentMode::AutoNoVsync,\n                    ..default()\n                }),\n                ..default()\n            }),\n    );\n    // LogPlugin 已完成初始化，此后的会话与玩法日志会同时写入控制台和文件。\n    session.start();\n\n    let exit = app\n        .insert_resource(GameSettings::load(std::path::Path::new(\"settings.json\")))\n        // 统一由玩家上限限速，避免失焦时再被默认的 60 Hz 更新策略限制。\n        .insert_resource(bevy::winit::WinitSettings::continuous())\n        // 固定步只控制移动、重力和交互模拟，独立于玩家设置的渲染上限。\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .add_plugins((\n            // 检查器复用同一主窗口与相机，Egui 必须先于世界检查器注册。\n            EguiPlugin::default(),\n            WorldInspectorPlugin::new(),\n            SettingsPlugin,\n            GameplayPlugin,\n            PlayerInputPlugin,\n            CameraControlPlugin,\n            PrototypeScenePlugin,\n            StartupLogPlugin,\n        ))\n        .run();\n\n    if let Err(error) = session.record_exit(\u0026exit) {\n        eprintln!(\"Failed to flush session log on exit: {error}\");\n        return AppExit::error();\n    }\n    exit\n}\n"},{"path":"src/scene.rs","text":"//! 原型场景与占位资产；业务实体保持独立，后续只需替换视觉子实体。\n\nuse bevy::prelude::*;\n\nuse crate::{\n    camera::{CharacterVisual, ControlsCamera, MouseLookState, OrbitCamera},\n    gameplay::{\n        Character, CharacterIntent, CharacterMotion, Parcel, Pickable, PlayerId, PrototypeConfig,\n    },\n    input::spawn_keyboard_controller,\n};\n\n/// 生成平地、占位角色、木箱和与控制者关联的自由视角镜头。\npub struct PrototypeScenePlugin;\n\nimpl Plugin for PrototypeScenePlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.insert_resource(ClearColor(Color::srgb(0.72, 0.84, 0.94)))\n            .insert_resource(GlobalAmbientLight {\n                color: Color::WHITE,\n                brightness: 250.0,\n                ..default()\n            })\n            .add_systems(Startup, spawn_scene);\n    }\n}\n\n/// 创建业务根实体和可替换的视觉子实体；角色根位置对应脚底，木箱根对应中心。\nfn spawn_scene(\n    mut commands: Commands,\n    config: Res\u003cPrototypeConfig\u003e,\n    mut meshes: ResMut\u003cAssets\u003cMesh\u003e\u003e,\n    mut materials: ResMut\u003cAssets\u003cStandardMaterial\u003e\u003e,\n) {\n    commands.spawn((\n        Name::new(\"Prototype ground\"),\n        Mesh3d(meshes.add(Plane3d::default().mesh().size(200.0, 200.0))),\n        MeshMaterial3d(materials.add(StandardMaterial {\n            base_color: Color::srgb(0.55, 0.66, 0.47),\n            perceptual_roughness: 1.0,\n            ..default()\n        })),\n        Transform::from_xyz(0.0, config.ground_y, 0.0),\n    ));\n\n    commands.spawn((\n        Name::new(\"Prototype daylight\"),\n        DirectionalLight {\n            illuminance: 12_000.0,\n            shadow_maps_enabled: true,\n            ..default()\n        },\n        Transform::from_xyz(6.0, 10.0, 8.0).looking_at(Vec3::ZERO, Vec3::Y),\n    ));\n\n    let character = commands\n        .spawn((\n            Name::new(\"Prototype character\"),\n            Character,\n            CharacterIntent::default(),\n            CharacterMotion {\n                grounded: true,\n                ..default()\n            },\n            Transform::from_xyz(0.0, config.ground_y, 0.0),\n            Visibility::default(),\n        ))\n        .id();\n\n    // 只标记人物的视觉子实体，第一人称隐藏模型时保留角色业务根和独立的持有物。\n    commands.spawn((\n        Name::new(\"Placeholder body\"),\n        CharacterVisual,\n        Mesh3d(meshes.add(Capsule3d::new(0.32, 0.8))),\n        MeshMaterial3d(materials.add(Color::srgb(0.12, 0.35, 0.74))),\n        Transform::from_xyz(0.0, 0.72, 0.0),\n        ChildOf(character),\n    ));\n    commands.spawn((\n        Name::new(\"Placeholder head\"),\n        CharacterVisual,\n        Mesh3d(meshes.add(Sphere::new(0.24))),\n        MeshMaterial3d(materials.add(Color::srgb(0.94, 0.77, 0.59))),\n        Transform::from_xyz(0.0, 1.65, 0.0),\n        ChildOf(character),\n    ));\n    // 角色的局部 -Z 是前方，标记帮助观察移动后朝向是否正确。\n    commands.spawn((\n        Name::new(\"Placeholder facing marker\"),\n        CharacterVisual,\n        Mesh3d(meshes.add(Cuboid::new(0.16, 0.12, 0.16))),\n        MeshMaterial3d(materials.add(Color::srgb(0.99, 0.70, 0.18))),\n        Transform::from_xyz(0.0, 1.64, -0.24),\n        ChildOf(character),\n    ));\n\n    let player_id = PlayerId(1);\n    let controller = spawn_keyboard_controller(\u0026mut commands, player_id, character);\n    let parcel_position = Vec3::new(0.0, config.ground_y + config.parcel_half_height, -1.3);\n    let parcel = commands\n        .spawn((\n            Name::new(\"Prototype parcel\"),\n            Parcel,\n            Pickable,\n            Transform::from_translation(parcel_position),\n            Visibility::default(),\n        ))\n        .id();\n    let crate_size = config.parcel_half_height * 2.0;\n    commands.spawn((\n        Name::new(\"Placeholder wooden crate\"),\n        Mesh3d(meshes.add(Cuboid::from_length(crate_size))),\n        MeshMaterial3d(materials.add(StandardMaterial {\n            base_color: Color::srgb(0.48, 0.27, 0.11),\n            perceptual_roughness: 0.95,\n            ..default()\n        })),\n        Transform::default(),\n        ChildOf(parcel),\n    ));\n    let strip_mesh = meshes.add(Cuboid::new(crate_size + 0.02, 0.07, crate_size + 0.02));\n    let strip_material = materials.add(Color::srgb(0.71, 0.47, 0.22));\n    for height in [-crate_size * 0.3, crate_size * 0.3] {\n        commands.spawn((\n            Name::new(\"Placeholder crate strip\"),\n            Mesh3d(strip_mesh.clone()),\n            MeshMaterial3d(strip_material.clone()),\n            Transform::from_xyz(0.0, height, 0.0),\n            ChildOf(parcel),\n        ));\n    }\n\n    let start_position = Vec3::new(0.0, config.ground_y, 0.0);\n    let orbit = OrbitCamera::new(character);\n    let camera_transform = orbit.transform(start_position);\n    let camera = commands\n        .spawn((\n            Name::new(\"Prototype orbit camera\"),\n            Camera3d::default(),\n            orbit,\n            MouseLookState::default(),\n            camera_transform,\n        ))\n        .id();\n    commands.entity(controller).insert(ControlsCamera(camera));\n    info!(target: \"demo::camera\", ?camera, ?character, ?controller,\n        position = ?camera_transform.translation, perspective = \"third_person\", reason = \"scene_startup\",\n        \"Orbit camera spawned\");\n\n    info!(\n        target: \"demo::scene\",\n        player_id = player_id.0,\n        ?character,\n        ?controller,\n        position = ?start_position,\n        reason = \"scene_startup\",\n        \"Character and local controller spawned\"\n    );\n    info!(\n        target: \"demo::scene\",\n        ?parcel,\n        position = ?parcel_position,\n        reason = \"scene_startup\",\n        \"Wooden crate spawned\"\n    );\n    info!(target: \"demo::scene\", config = ?*config, \"Prototype scene initialized\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    use bevy_enhanced_input::prelude::{EnhancedInputPlugin, InputContextAppExt};\n\n    use crate::{gameplay::ControlsCharacter, input::GameplayContext};\n\n    #[test]\n    fn startup_assembles_independent_roots_with_replaceable_visuals() {\n        // 只注册资源与输入上下文，然后直接运行场景调度，不加载窗口或渲染插件。\n        let mut app = App::new();\n        app.init_resource::\u003cAssets\u003cMesh\u003e\u003e()\n            .init_resource::\u003cAssets\u003cStandardMaterial\u003e\u003e()\n            .init_resource::\u003cPrototypeConfig\u003e()\n            // 复用可见性插件的组件要求，不加载渲染器或窗口后端。\n            .register_required_components::\u003cMesh3d, Visibility\u003e()\n            .add_plugins(EnhancedInputPlugin)\n            .add_input_context::\u003cGameplayContext\u003e()\n            .add_plugins(PrototypeScenePlugin);\n        app.finish();\n        app.cleanup();\n        app.world_mut().run_schedule(Startup);\n\n        let world = app.world_mut();\n        let character = world\n            .query_filtered::\u003cEntity, With\u003cCharacter\u003e\u003e()\n            .single(world)\n            .unwrap();\n        let parcel = world\n            .query_filtered::\u003cEntity, With\u003cParcel\u003e\u003e()\n            .single(world)\n            .unwrap();\n        let (player_id, controlled_character) = world\n            .query_filtered::\u003c(\u0026PlayerId, \u0026ControlsCharacter), With\u003cGameplayContext\u003e\u003e()\n            .single(world)\n            .map(|(id, controlled)| (*id, controlled.0))\n            .unwrap();\n        assert_eq!(player_id, PlayerId(1));\n        assert_eq!(controlled_character, character);\n        assert!(world.get::\u003cPickable\u003e(parcel).is_some());\n\n        for root in [character, parcel] {\n            assert!(world.get::\u003cChildOf\u003e(root).is_none());\n            assert!(world.get::\u003cMesh3d\u003e(root).is_none());\n            assert!(world.get::\u003cCharacterVisual\u003e(root).is_none());\n            let children = world.get::\u003cChildren\u003e(root).unwrap();\n            assert!(!children.is_empty());\n            for \u0026child in children {\n                assert_eq!(world.get::\u003cChildOf\u003e(child).unwrap().parent(), root);\n                assert!(world.get::\u003cMesh3d\u003e(child).is_some());\n                assert!(world.get::\u003cCharacter\u003e(child).is_none());\n                assert!(world.get::\u003cParcel\u003e(child).is_none());\n                assert_eq!(\n                    world.get::\u003cCharacterVisual\u003e(child).is_some(),\n                    root == character\n                );\n                assert_eq!(world.get::\u003cVisibility\u003e(child), Some(\u0026Visibility::Inherited));\n            }\n        }\n        let config = world.resource::\u003cPrototypeConfig\u003e();\n        assert_eq!(\n            world.get::\u003cTransform\u003e(character).unwrap().translation.y,\n            config.ground_y\n        );\n        assert_eq!(\n            world.get::\u003cTransform\u003e(parcel).unwrap().translation.y,\n            config.ground_y + config.parcel_half_height\n        );\n        assert_eq!(\n            world\n                .query_filtered::\u003c\u0026OrbitCamera, With\u003cCamera3d\u003e\u003e()\n                .single(world)\n                .unwrap()\n                .target,\n            character\n        );\n        let controlled_camera = world\n            .query_filtered::\u003c\u0026ControlsCamera, With\u003cGameplayContext\u003e\u003e()\n            .single(world)\n            .unwrap()\n            .0;\n        assert_eq!(\n            world.get::\u003cOrbitCamera\u003e(controlled_camera).unwrap().target,\n            character\n        );\n    }\n}\n"},{"path":"src/settings.rs","text":"//! 加载玩家设置，并通过帧间等待限制渲染循环；不改变固定步模拟频率。\n\nuse std::{\n    fs, io,\n    num::NonZeroU32,\n    path::Path,\n    time::{Duration, Instant},\n};\n\nuse bevy::{prelude::*, time::TimeSystems};\nuse serde::{Deserialize, Deserializer, de::Error};\n\n/// 全局玩家设置；非零类型保证帧率上限始终能够转换为等待间隔。\n#[derive(Resource, Debug, Deserialize)]\n#[serde(default, deny_unknown_fields)]\npub struct GameSettings {\n    /// 渲染循环每秒最多更新的次数，默认 60，配置值不得低于 60；不影响 `Time\u003cFixed\u003e`。\n    #[serde(deserialize_with = \"deserialize_max_fps\")]\n    pub max_fps: NonZeroU32,\n    /// 自由视角的鼠标灵敏度与纵轴方向。\n    pub camera: CameraSettings,\n}\n\nimpl Default for GameSettings {\n    fn default() -\u003e Self {\n        Self {\n            max_fps: NonZeroU32::new(60).unwrap(),\n            camera: CameraSettings::default(),\n        }\n    }\n}\n\n/// 自由视角配置；旧配置缺少本节或字段时使用默认值。\n#[derive(Debug, Clone, Copy, Deserialize)]\n#[serde(default, deny_unknown_fields)]\npub struct CameraSettings {\n    /// 每像素对应的旋转弧度，必须是有限的正数。\n    #[serde(deserialize_with = \"deserialize_mouse_sensitivity\")]\n    pub mouse_sensitivity: f32,\n    /// 是否反转鼠标纵向移动对应的俯仰方向。\n    pub invert_y: bool,\n}\n\nimpl Default for CameraSettings {\n    fn default() -\u003e Self {\n        Self {\n            mouse_sensitivity: 0.003,\n            invert_y: false,\n        }\n    }\n}\n\nfn deserialize_max_fps\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cNonZeroU32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = NonZeroU32::deserialize(deserializer)?;\n    // 在加载边界检查下限，避免低于支持范围的配置进入限帧系统。\n    if value.get() \u003c 60 {\n        return Err(D::Error::custom(\"max_fps must be at least 60\"));\n    }\n    Ok(value)\n}\n\nfn deserialize_mouse_sensitivity\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cf32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = f32::deserialize(deserializer)?;\n    // 在加载边界拒绝无效角速度，避免非有限值进入 Transform 的旋转计算。\n    if !value.is_finite() || value \u003c= 0.0 {\n        return Err(D::Error::custom(\n            \"camera mouse_sensitivity must be finite and greater than zero\",\n        ));\n    }\n    Ok(value)\n}\n\nimpl GameSettings {\n    /// 读取 JSON 设置；缺失或读取、解析失败时记录原因并使用默认值，不覆盖原文件。\n    pub fn load(path: \u0026Path) -\u003e Self {\n        let settings = match read_settings(path) {\n            Ok(settings) =\u003e settings,\n            Err(error) if error.kind() == io::ErrorKind::NotFound =\u003e {\n                info!(\n                    target: \"demo::settings\",\n                    path = %path.display(),\n                    reason = \"settings_file_missing\",\n                    \"Using default game settings\"\n                );\n                Self::default()\n            }\n            Err(error) =\u003e {\n                warn!(\n                    target: \"demo::settings\",\n                    operation = \"load_settings\",\n                    path = %path.display(),\n                    %error,\n                    fallback_max_fps = Self::default().max_fps.get(),\n                    fallback_camera_mouse_sensitivity = CameraSettings::default().mouse_sensitivity,\n                    fallback_camera_invert_y = CameraSettings::default().invert_y,\n                    reason = \"settings_load_failed\",\n                    \"Failed to load game settings; using defaults\"\n                );\n                Self::default()\n            }\n        };\n        info!(\n            target: \"demo::settings\",\n            path = %path.display(),\n            max_fps = settings.max_fps.get(),\n            camera_mouse_sensitivity = settings.camera.mouse_sensitivity,\n            camera_invert_y = settings.camera.invert_y,\n            \"Game settings initialized\"\n        );\n        settings\n    }\n}\n\n/// 注册帧率限制系统；设置资源也可由后续设置界面在运行期间修改。\npub struct SettingsPlugin;\n\nimpl Plugin for SettingsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.init_resource::\u003cGameSettings\u003e()\n            // 等待在时间与业务系统之前完成；固定步仍由引擎时钟驱动，不改写模拟时间步。\n            .add_systems(First, limit_frame_rate.before(TimeSystems));\n    }\n}\n\n/// 等待和日志去重只属于帧率系统，使用 Local 而非共享的游戏状态。\n#[derive(Default)]\nstruct FramePacing {\n    last_started: Option\u003cInstant\u003e,\n    applied_max_fps: Option\u003cNonZeroU32\u003e,\n}\n\nfn read_settings(path: \u0026Path) -\u003e io::Result\u003cGameSettings\u003e {\n    let contents = fs::read_to_string(path)?;\n    serde_json::from_str(\u0026contents)\n        .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))\n}\n\n/// 只补足上一帧起点以来剩余的间隔；计算本身已超时时立即继续，不叠加等待。\nfn limit_frame_rate(settings: Res\u003cGameSettings\u003e, mut pacing: Local\u003cFramePacing\u003e) {\n    if pacing.applied_max_fps != Some(settings.max_fps) {\n        info!(\n            target: \"demo::settings\",\n            max_fps_before = ?pacing.applied_max_fps.map(NonZeroU32::get),\n            max_fps_after = settings.max_fps.get(),\n            reason = if pacing.applied_max_fps.is_some() {\n                \"settings_changed\"\n            } else {\n                \"initialization\"\n            },\n            \"Frame rate limit applied\"\n        );\n        pacing.applied_max_fps = Some(settings.max_fps);\n    }\n\n    if let Some(last_started) = pacing.last_started {\n        let wait = remaining_frame_time(last_started.elapsed(), settings.max_fps);\n        if !wait.is_zero() {\n            std::thread::sleep(wait);\n        }\n    }\n    // 卡顿后从实际起点重新计时，避免为了追赶期限连续提交超出上限的帧。\n    pacing.last_started = Some(Instant::now());\n}\n\nfn remaining_frame_time(elapsed: Duration, max_fps: NonZeroU32) -\u003e Duration {\n    // 向上取整到纳秒，避免舍入使允许的间隔略短于帧率上限要求。\n    let interval = Duration::from_nanos(1_000_000_000_u64.div_ceil(u64::from(max_fps.get())));\n    interval.saturating_sub(elapsed)\n}\n\n#[cfg(test)]\nmod tests {\n    use bevy::time::{TimePlugin, TimeUpdateStrategy};\n    use uuid::Uuid;\n\n    use super::*;\n\n    #[test]\n    fn defaults_and_json_validate_frame_rate_limit() {\n        assert_eq!(GameSettings::default().max_fps.get(), 60);\n        let omitted: GameSettings = serde_json::from_str(\"{}\").unwrap();\n        assert_eq!(omitted.max_fps.get(), 60);\n        for max_fps in [60, 120, 144] {\n            let json = format!(r#\"{{\"max_fps\": {max_fps}}}\"#);\n            let custom: GameSettings = serde_json::from_str(\u0026json).unwrap();\n            assert_eq!(custom.max_fps.get(), max_fps);\n        }\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n            r#\"{\"max_fps\": -60}\"#,\n            r#\"{\"max_fps\": 60.5}\"#,\n            r#\"{\"max_fps\": \"120\"}\"#,\n            r#\"{\"max_fp\": 120}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n        }\n    }\n\n    #[test]\n    fn camera_settings_default_legacy_and_custom_values() {\n        let defaults = GameSettings::default();\n        assert_eq!(defaults.camera.mouse_sensitivity, 0.003);\n        assert!(!defaults.camera.invert_y);\n        for legacy in [\"{}\", r#\"{\"max_fps\": 144}\"#, r#\"{\"camera\": {}}\"#] {\n            let settings: GameSettings = serde_json::from_str(legacy).unwrap();\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n        }\n        let custom: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"mouse_sensitivity\": 0.006, \"invert_y\": true}}\"#)\n                .unwrap();\n        assert_eq!(custom.camera.mouse_sensitivity, 0.006);\n        assert!(custom.camera.invert_y);\n        let partial: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"invert_y\": true}}\"#).unwrap();\n        assert_eq!(partial.camera.mouse_sensitivity, 0.003);\n        assert!(partial.camera.invert_y);\n    }\n\n    #[test]\n    fn invalid_camera_settings_fall_back_without_overwriting_file() {\n        let path =\n            std::env::temp_dir().join(format!(\"demo-camera-settings-{}.json\", Uuid::new_v4()));\n        for invalid in [\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 0}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": -0.003}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 1e39}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": \"NaN\"}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"invert_y\": 1}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"sensitivity\": 0.003}}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n            fs::write(\u0026path, invalid).unwrap();\n            let settings = GameSettings::load(\u0026path);\n            assert_eq!(settings.max_fps.get(), 60);\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn settings_file_and_failure_fallback_preserve_original_contents() {\n        let path = std::env::temp_dir().join(format!(\"demo-settings-{}.json\", Uuid::new_v4()));\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n        assert!(!path.exists());\n        fs::write(\u0026path, r#\"{\"max_fps\": 240}\"#).unwrap();\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 240);\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n        ] {\n            fs::write(\u0026path, invalid).unwrap();\n            assert_eq!(\n                read_settings(\u0026path).unwrap_err().kind(),\n                io::ErrorKind::InvalidData\n            );\n            assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn pacing_waits_only_for_remaining_time_and_never_catches_up() {\n        let limit = NonZeroU32::new(120).unwrap();\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), limit),\n            Duration::from_nanos(5_333_334)\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(20), limit),\n            Duration::ZERO\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), NonZeroU32::new(60).unwrap()),\n            Duration::from_nanos(13_666_667)\n        );\n    }\n\n    #[test]\n    fn changing_render_limit_preserves_fixed_simulation_timestep() {\n        // 只运行最小 App；手动推进时间，不加载窗口、渲染器或完整游戏。\n        let mut app = App::new();\n        app.add_plugins(TimePlugin)\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_millis(\n                20,\n            )))\n            .add_plugins(SettingsPlugin);\n        app.update();\n        let timestep = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().timestep();\n        app.world_mut().resource_mut::\u003cGameSettings\u003e().max_fps = NonZeroU32::new(120).unwrap();\n        app.update();\n        let fixed = app.world().resource::\u003cTime\u003cFixed\u003e\u003e();\n        assert_eq!(fixed.timestep(), timestep);\n        assert!((1.0 / fixed.timestep().as_secs_f64() - 60.0).abs() \u003c 0.001);\n        assert!(fixed.elapsed() \u003e= timestep);\n    }\n}\n"},{"path":"src/startup_log.rs","text":"//! 汇总启动时的配置与环境日志，沿用统一会话日志设施。\n\nuse bevy::prelude::*;\n\nuse crate::gameplay::PrototypeConfig;\n\n/// 注册一次性的启动日志；玩法配置与固定时间步由应用组装时提供。\npub struct StartupLogPlugin;\n\nimpl Plugin for StartupLogPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        // 四条日志只报告配置，不依赖场景实体，也不建立彼此的执行顺序。\n        app.add_systems(\n            Startup,\n            (\n                log_configuration,\n                log_simulation_timestep,\n                log_pose_synchronization,\n                log_world_inspector,\n            ),\n        );\n    }\n}\n\n/// 记录实际玩法配置；显式保留迁移前的日志分类，兼容现有过滤设置。\nfn log_configuration(config: Res\u003cPrototypeConfig\u003e) {\n    info!(target: \"demo::gameplay\", ?config, \"Prototype gameplay initialized\");\n}\n\n/// 记录模拟频率，直接读取应用配置的固定时间步。\nfn log_simulation_timestep(time: Res\u003cTime\u003cFixed\u003e\u003e) {\n    info!(\n        target: \"demo::settings\",\n        simulation_hz = 1.0 / time.timestep().as_secs_f64(),\n        \"Fixed simulation timestep initialized\"\n    );\n}\n\n/// 将模拟和逐帧姿态同步的调度约定写入统一会话日志，便于排查帧率相关问题。\nfn log_pose_synchronization() {\n    info!(target: \"demo::camera\", simulation_schedule = \"FixedUpdate\",\n        presentation_schedule = \"Update\",\n        presentation_order = \"character_facing_held_objects_camera_visibility\", reason = \"initialization\",\n        \"Camera pose synchronization configured\");\n}\n\n/// 检查器的启用信息沿用统一会话日志，方便核对本次调试环境。\nfn log_world_inspector() {\n    info!(target: \"demo::inspector\", plugin = \"WorldInspectorPlugin\", reason = \"initialization\",\n        \"World inspector enabled\");\n}\n\n#[cfg(test)]\nmod tests {\n    use std::{fs, sync::Arc};\n\n    use bevy::{\n        ecs::schedule::SingleThreadedExecutor,\n        log::{tracing, tracing_subscriber},\n    };\n    use uuid::Uuid;\n\n    use super::*;\n\n    #[test]\n    fn startup_logs_preserve_targets_and_config_and_run_once() {\n        let directory =\n            std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"tmp/startup-log-tests\");\n        fs::create_dir_all(\u0026directory).unwrap();\n        let path = directory.join(format!(\"{}.log\", Uuid::new_v4()));\n        let subscriber = tracing_subscriber::fmt()\n            .without_time()\n            .with_ansi(false)\n            .with_writer(Arc::new(fs::File::create_new(\u0026path).unwrap()))\n            .finish();\n\n        // 使用局部日志设施和最小 App；单线程启动调度确保日志捕获不跨线程。\n        tracing::subscriber::with_default(subscriber, || {\n            let mut app = App::new();\n            app.insert_resource(PrototypeConfig {\n                move_speed: 9.0,\n                ..default()\n            })\n            .insert_resource(Time::\u003cFixed\u003e::from_seconds(0.25))\n            .add_plugins(StartupLogPlugin)\n            .edit_schedule(Startup, |schedule| {\n                schedule.set_executor(SingleThreadedExecutor::new());\n            });\n            app.update();\n            app.update();\n        });\n\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        fs::remove_file(path).unwrap();\n        for (target, message, fields) in [\n            (\n                \"demo::gameplay\",\n                \"Prototype gameplay initialized\",\n                vec![\"move_speed: 9.0\"],\n            ),\n            (\n                \"demo::settings\",\n                \"Fixed simulation timestep initialized\",\n                vec![\"simulation_hz=4\"],\n            ),\n            (\n                \"demo::camera\",\n                \"Camera pose synchronization configured\",\n                vec![\n                    \"simulation_schedule=\\\"FixedUpdate\\\"\",\n                    \"presentation_schedule=\\\"Update\\\"\",\n                    \"presentation_order=\\\"character_facing_held_objects_camera_visibility\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n            (\n                \"demo::inspector\",\n                \"World inspector enabled\",\n                vec![\n                    \"plugin=\\\"WorldInspectorPlugin\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n        ] {\n            let records: Vec\u003c_\u003e = contents\n                .lines()\n                .filter(|line| line.contains(message))\n                .collect();\n            assert_eq!(records.len(), 1, \"Unexpected startup log count: {contents}\");\n            let record = records[0];\n            assert!(\n                record.contains(\"INFO\") \u0026\u0026 record.contains(target),\n                \"{record}\"\n            );\n            for field in fields {\n                assert!(record.contains(field), \"Missing {field}: {record}\");\n            }\n        }\n    }\n}\n"}]</script>
<script>
const sources = JSON.parse(document.getElementById('sources').textContent);
const files = new Map(sources.map(source => [source.path, source.text]));
const selector = document.getElementById('file');
const scroller = document.getElementById('scroller');
const code = document.getElementById('code');
const empty = document.getElementById('empty');
const summary = document.getElementById('summary');
const status = document.getElementById('status');
let selectedLine;
const placeholder = document.createElement('option');
placeholder.value = '';
placeholder.textContent = '请选择源码文件';
selector.append(placeholder);
for (const file of files.keys()) {
  const option = document.createElement('option');
  option.value = file;
  option.textContent = file;
  selector.append(option);
}

function locateLine() {
  selectedLine?.classList.remove('selected');
  selectedLine = undefined;
  status.textContent = '';
  if (!location.hash || !code.children.length) return;
  const match = /^#L([1-9][0-9]*)$/.exec(location.hash);
  const line = match ? Number(match[1]) : 0;
  const row = Number.isSafeInteger(line) ? code.children[line - 1] : undefined;
  if (!row) {
    status.textContent = '定位行不存在，请点击有效的行号。';
    return;
  }
  selectedLine = row;
  row.classList.add('selected');
  status.textContent = '已定位到第 ' + line + ' 行。';
  // 只滚动源码容器，保留顶部文件选择与定位提示。
  scroller.scrollTop = row.offsetTop - (scroller.clientHeight - row.offsetHeight) / 2;
}

function showFile() {
  const requested = new URLSearchParams(location.search).get('file');
  const file = requested === null ? sources[0]?.path : requested;
  const text = files.get(file);
  code.replaceChildren();
  scroller.scrollTop = 0;
  selector.value = files.has(file) ? file : '';
  empty.hidden = true;
  summary.textContent = '这是生成架构图时保存的源码快照。点击行号可以更新当前定位链接。';
  if (text === undefined || text === '') {
    empty.hidden = false;
    empty.textContent = text === '' ? '此文件为空。' : !sources.length ? '此快照未包含源码文件。' : file ? '快照中找不到文件：' + file : '请选择一个源码文件。';
    if (files.has(file)) summary.textContent = file + ' · 空文件 · 生成时的源码快照';
    locateLine();
    return;
  }
  // 统一换行以正确编号，保留空行与末尾空行；全部内容通过 textContent 写入。
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const fragment = document.createDocumentFragment();
  lines.forEach((line, index) => {
    const number = index + 1;
    const row = document.createElement('div');
    row.className = 'code-line';
    row.id = 'L' + number;
    const anchor = document.createElement('a');
    anchor.className = 'line-number';
    anchor.href = '#L' + number;
    anchor.textContent = number;
    anchor.setAttribute('aria-label', '定位到第 ' + number + ' 行');
    const content = document.createElement('code');
    content.textContent = line;
    row.append(anchor, content);
    fragment.append(row);
  });
  code.append(fragment);
  summary.textContent = file + ' · ' + lines.length + ' 行 · 生成时的源码快照';
  document.title = file + ' — ECS 架构源码';
  locateLine();
}

selector.addEventListener('change', () => {
  const url = new URL(location.href);
  url.search = '?file=' + encodeURIComponent(selector.value);
  url.hash = '';
  // 使用普通页面导航，避免本地 file:// 页面的 History API 权限差异。
  location.href = url.href;
});
code.addEventListener('click', event => {
  if (event.target.closest('.line-number')) requestAnimationFrame(locateLine);
});
addEventListener('hashchange', locateLine);
showFile();
</script>
</body>
