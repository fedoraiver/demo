<script id="sources" type="application/json">[{"path":"src/app_flow.rs","text":"//! 主菜单与游戏会话的生命周期；暂停只冻结模拟，不销毁玩法实体。\n\nuse std::time::Duration;\n\nuse avian3d::prelude::{Physics, PhysicsTime};\nuse bevy::{\n    prelude::*,\n    state::app::StatesPlugin,\n    window::{CursorGrabMode, CursorOptions},\n};\nuse bevy_enhanced_input::prelude::ContextActivity;\n\nuse crate::{\n    camera::MouseLookState,\n    gameplay::CharacterIntent,\n    input::GameplayContext,\n    ui::{MenuFocus, MenuPage, MenuState},\n};\n\n/// 游戏会话只在 InGame 期间存在，设置和暂停不切换该状态。\n#[derive(States, Clone, Copy, Debug, Default, PartialEq, Eq, Hash)]\npub enum AppState {\n    #[default]\n    MainMenu,\n    InGame,\n}\n\n/// 游戏内部的暂停子状态，不触发场景重新生成或清理。\n#[derive(SubStates, Clone, Copy, Debug, Default, PartialEq, Eq, Hash)]\n#[source(AppState = AppState::InGame)]\npub enum PlayState {\n    #[default]\n    Running,\n    Paused,\n}\n\n/// 注册状态入口与退出行为；无窗口测试也可复用相同生命周期。\npub struct AppFlowPlugin;\n\nimpl Plugin for AppFlowPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        if !app.is_plugin_added::\u003cStatesPlugin\u003e() {\n            app.add_plugins(StatesPlugin);\n        }\n        app.init_state::\u003cAppState\u003e()\n            .add_sub_state::\u003cPlayState\u003e()\n            .init_resource::\u003cMenuState\u003e()\n            .init_resource::\u003cMenuFocus\u003e()\n            .add_systems(\n                OnEnter(AppState::MainMenu),\n                (show_main_menu, suspend_input).chain(),\n            )\n            .add_systems(\n                OnEnter(PlayState::Paused),\n                (show_pause_menu, suspend_input).chain(),\n            )\n            .add_systems(OnEnter(PlayState::Running), resume_game);\n    }\n}\n\n/// 独立玩法测试不安装菜单状态；实际游戏必须同时处于会话与运行子状态。\npub fn gameplay_running(\n    app_state: Option\u003cRes\u003cState\u003cAppState\u003e\u003e\u003e,\n    play_state: Option\u003cRes\u003cState\u003cPlayState\u003e\u003e\u003e,\n) -\u003e bool {\n    app_state.is_none_or(|state| {\n        *state.get() == AppState::InGame\n            \u0026\u0026 play_state.is_some_and(|state| *state.get() == PlayState::Running)\n    })\n}\n\nfn show_main_menu(\n    mut menu: ResMut\u003cMenuState\u003e,\n    mut focus: ResMut\u003cMenuFocus\u003e,\n    mut virtual_time: Option\u003cResMut\u003cTime\u003cVirtual\u003e\u003e\u003e,\n    mut transitions: MessageReader\u003cStateTransitionEvent\u003cAppState\u003e\u003e,\n) {\n    let state_before = transitions.read().last().and_then(|change| change.exited);\n    menu.page = MenuPage::Main;\n    menu.return_page = MenuPage::Main;\n    menu.status = None;\n    focus.0 = 0;\n    // 主菜单的展示动画仍使用正常虚拟时间，物理时钟由 suspend_input 单独停用。\n    if let Some(time) = virtual_time.as_mut() {\n        time.unpause();\n    }\n    info!(target: \"demo::ui\", ?state_before, state_after = \"main_menu\", reason = \"enter_main_menu\", \"Application state changed\");\n}\n\nfn show_pause_menu(mut menu: ResMut\u003cMenuState\u003e, mut focus: ResMut\u003cMenuFocus\u003e) {\n    menu.page = MenuPage::Pause;\n    menu.return_page = MenuPage::Pause;\n    menu.status = None;\n    focus.0 = 0;\n    info!(target: \"demo::ui\", state_before = \"running\", state_after = \"paused\", reason = \"pause_action\", \"Application state changed\");\n}\n\n/// 状态入口在固定循环之前执行，清理本帧待消费请求并立即冻结物理增量。\nfn suspend_input(\n    mut commands: Commands,\n    menu: Res\u003cMenuState\u003e,\n    mut virtual_time: Option\u003cResMut\u003cTime\u003cVirtual\u003e\u003e\u003e,\n    mut physics_time: Option\u003cResMut\u003cTime\u003cPhysics\u003e\u003e\u003e,\n    mut intents: Query\u003c\u0026mut CharacterIntent\u003e,\n    controllers: Query\u003cEntity, With\u003cGameplayContext\u003e\u003e,\n    mut captures: Query\u003c\u0026mut MouseLookState\u003e,\n    mut cursors: Query\u003c\u0026mut CursorOptions\u003e,\n) {\n    if menu.page == MenuPage::Pause\n        \u0026\u0026 let Some(time) = virtual_time.as_mut()\n    {\n        time.pause();\n        time.advance_by(Duration::ZERO);\n    }\n    if let Some(time) = physics_time.as_mut() {\n        time.pause();\n        // Avian 暂停后仍可能读上一非零 delta；立即清零，防止暂停当帧额外积分。\n        time.advance_by(Duration::ZERO);\n    }\n    for mut intent in \u0026mut intents {\n        *intent = CharacterIntent::default();\n    }\n    for entity in \u0026controllers {\n        commands\n            .entity(entity)\n            .insert(ContextActivity::\u003cGameplayContext\u003e::INACTIVE);\n    }\n    for mut capture in \u0026mut captures {\n        capture.active = false;\n        capture.skip_motion = true;\n    }\n    for mut cursor in \u0026mut cursors {\n        cursor.visible = true;\n        cursor.grab_mode = CursorGrabMode::None;\n    }\n}\n\nfn resume_game(\n    mut menu: ResMut\u003cMenuState\u003e,\n    mut virtual_time: Option\u003cResMut\u003cTime\u003cVirtual\u003e\u003e\u003e,\n    mut physics_time: Option\u003cResMut\u003cTime\u003cPhysics\u003e\u003e\u003e,\n    mut captures: Query\u003c\u0026mut MouseLookState\u003e,\n    mut transitions: MessageReader\u003cStateTransitionEvent\u003cPlayState\u003e\u003e,\n) {\n    let state_before = transitions.read().last().and_then(|change| change.exited);\n    menu.page = MenuPage::Hidden;\n    menu.status = None;\n    if let Some(time) = virtual_time.as_mut() {\n        time.unpause();\n    }\n    if let Some(time) = physics_time.as_mut() {\n        time.unpause();\n    }\n    // 相机的统一捕获系统在下一次输入准备时恢复锁定，并跳过自由光标阶段的位移。\n    for mut capture in \u0026mut captures {\n        capture.initialized = false;\n        capture.skip_motion = true;\n    }\n    info!(target: \"demo::ui\", ?state_before, state_after = \"running\", reason = \"enter_running\", \"Application state changed\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    use avian3d::prelude::{Collider, LinearVelocity, Position, RigidBody};\n    use bevy::time::TimeUpdateStrategy;\n\n    use crate::gameplay::GameplayPlugin;\n\n    #[test]\n    fn pause_freezes_actual_physics_immediately_and_resume_does_not_catch_up() {\n        // 使用真实 Avian 调度和单个几何刚体，直接检查每次 app.update 返回后的位姿。\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            TransformPlugin,\n            AppFlowPlugin,\n            GameplayPlugin,\n        ))\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n            1.0 / 60.0,\n        )));\n        app.finish();\n        app.cleanup();\n        app.update();\n        app.world_mut()\n            .resource_mut::\u003cNextState\u003cAppState\u003e\u003e()\n            .set(AppState::InGame);\n        app.update();\n        let body = app\n            .world_mut()\n            .spawn((\n                RigidBody::Dynamic,\n                Collider::cuboid(0.6, 0.6, 0.6),\n                LinearVelocity(Vec3::new(2.0, 0.0, 0.0)),\n                Transform::from_xyz(0.0, 10.0, 0.0),\n            ))\n            .id();\n        for _ in 0..3 {\n            app.update();\n        }\n        let position = *app.world().get::\u003cPosition\u003e(body).unwrap();\n        let velocity = *app.world().get::\u003cLinearVelocity\u003e(body).unwrap();\n        assert!(position.x \u003e 0.0);\n        assert!(velocity.y \u003c 0.0);\n        app.world_mut()\n            .resource_mut::\u003cNextState\u003cPlayState\u003e\u003e()\n            .set(PlayState::Paused);\n        for _ in 0..12 {\n            app.update();\n            assert_eq!(*app.world().get::\u003cPosition\u003e(body).unwrap(), position);\n            assert_eq!(*app.world().get::\u003cLinearVelocity\u003e(body).unwrap(), velocity);\n        }\n        app.world_mut()\n            .resource_mut::\u003cNextState\u003cPlayState\u003e\u003e()\n            .set(PlayState::Running);\n        app.update();\n        app.update();\n        let resumed = app.world().get::\u003cPosition\u003e(body).unwrap();\n        assert!(resumed.x \u003e position.x);\n        assert!(\n            resumed.x - position.x \u003c 0.08,\n            \"resume must not integrate paused wall time\"\n        );\n    }\n}\n"},{"path":"src/art_assets.rs","text":"//! 运行资源从 assets 加载；制作源文件和美术清单不参与游戏运行时依赖。\n\nuse bevy::{\n    asset::{LoadState, RecursiveDependencyLoadState, RenderAssetUsages},\n    gltf::GltfLoaderSettings,\n    prelude::*,\n};\n\npub(crate) const ISLAND_PATH: \u0026str = \"maps/courier_island.glb\";\npub(crate) const COURIER_PATH: \u0026str = \"models/characters/chr_courier.glb\";\n\n/// 物品的美术种类；搬运能力和持有关系仍由玩法组件保存。\n#[derive(Component, Reflect, Clone, Copy, Default, Debug, PartialEq, Eq)]\n#[reflect(Component)]\npub(crate) enum ItemModel {\n    #[default]\n    StandardParcel,\n    FragileParcel,\n    WoodenCrate,\n}\n\nimpl ItemModel {\n    pub(crate) fn path(self) -\u003e \u0026'static str {\n        match self {\n            Self::StandardParcel =\u003e \"models/props/prop_parcel_standard.glb\",\n            Self::FragileParcel =\u003e \"models/props/prop_parcel_fragile.glb\",\n            Self::WoodenCrate =\u003e \"models/props/prop_crate.glb\",\n        }\n    }\n\n    pub(crate) fn name(self) -\u003e \u0026'static str {\n        match self {\n            Self::StandardParcel =\u003e \"standard_parcel\",\n            Self::FragileParcel =\u003e \"fragile_parcel\",\n            Self::WoodenCrate =\u003e \"wooden_crate\",\n        }\n    }\n}\n\n/// 强句柄覆盖海岛、主角和动态道具的生命周期，NPC 与环境由组合地图提供。\n#[derive(Resource)]\npub(crate) struct ArtAssets {\n    pub(crate) island: Handle\u003cGltf\u003e,\n    pub(crate) courier: Handle\u003cGltf\u003e,\n    standard: Handle\u003cGltf\u003e,\n    fragile: Handle\u003cGltf\u003e,\n    wooden_crate: Handle\u003cGltf\u003e,\n}\n\nimpl FromWorld for ArtAssets {\n    fn from_world(world: \u0026mut World) -\u003e Self {\n        let server = world.resource::\u003cAssetServer\u003e();\n        let load = |path: \u0026'static str| {\n            server\n                .load_builder()\n                .with_settings(|settings: \u0026mut GltfLoaderSettings| {\n                    // 静态碰撞需要 CPU 顶点；禁止在上传 GPU 后丢弃地图几何。\n                    settings.load_meshes =\n                        RenderAssetUsages::MAIN_WORLD | RenderAssetUsages::RENDER_WORLD;\n                    settings.load_cameras = false;\n                    settings.load_lights = false;\n                })\n                .load(path)\n        };\n        Self {\n            island: load(ISLAND_PATH),\n            courier: load(COURIER_PATH),\n            standard: load(ItemModel::StandardParcel.path()),\n            fragile: load(ItemModel::FragileParcel.path()),\n            wooden_crate: load(ItemModel::WoodenCrate.path()),\n        }\n    }\n}\n\nimpl ArtAssets {\n    pub(crate) fn item(\u0026self, model: ItemModel) -\u003e \u0026Handle\u003cGltf\u003e {\n        match model {\n            ItemModel::StandardParcel =\u003e \u0026self.standard,\n            ItemModel::FragileParcel =\u003e \u0026self.fragile,\n            ItemModel::WoodenCrate =\u003e \u0026self.wooden_crate,\n        }\n    }\n\n    fn entries(\u0026self) -\u003e [(\u0026'static str, \u0026Handle\u003cGltf\u003e); 5] {\n        [\n            (ISLAND_PATH, \u0026self.island),\n            (COURIER_PATH, \u0026self.courier),\n            (ItemModel::StandardParcel.path(), \u0026self.standard),\n            (ItemModel::FragileParcel.path(), \u0026self.fragile),\n            (ItemModel::WoodenCrate.path(), \u0026self.wooden_crate),\n        ]\n    }\n}\n\n/// 资源就绪与地图碰撞就绪是两个门槛，不能仅凭模板已生成就推进物理。\n#[derive(Resource, Default, PartialEq, Eq)]\npub(crate) enum ArtLoadState {\n    #[default]\n    Loading,\n    Ready,\n    Failed,\n}\n\n/// 集中加载和报告失败，沿用统一会话日志。\npub(crate) struct ArtAssetsPlugin;\n\nimpl Plugin for ArtAssetsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.register_type::\u003cItemModel\u003e()\n            .init_resource::\u003cArtAssets\u003e()\n            .init_resource::\u003cArtLoadState\u003e()\n            .add_systems(Startup, log_asset_requests)\n            .add_systems(Update, poll_art_assets);\n    }\n}\n\nfn log_asset_requests(assets: Res\u003cArtAssets\u003e) {\n    for (path, _) in assets.entries() {\n        info!(target: \"demo::art_assets\", path, state = \"loading\",\n            reason = \"scene_startup\", \"Art asset requested\");\n    }\n}\n\n/// 连同子资产检查失败；只记录状态切换，避免每帧刷写相同错误。\nfn poll_art_assets(\n    server: Res\u003cAssetServer\u003e,\n    assets: Res\u003cArtAssets\u003e,\n    mut state: ResMut\u003cArtLoadState\u003e,\n) {\n    if *state != ArtLoadState::Loading {\n        return;\n    }\n    let mut ready = true;\n    for (path, handle) in assets.entries() {\n        let failure = match server.get_load_state(handle.id()) {\n            Some(LoadState::Failed(error)) =\u003e Some(error),\n            _ =\u003e match server.get_recursive_dependency_load_state(handle.id()) {\n                Some(RecursiveDependencyLoadState::Failed(error)) =\u003e Some(error),\n                _ =\u003e None,\n            },\n        };\n        if let Some(error) = failure {\n            *state = ArtLoadState::Failed;\n            error!(target: \"demo::art_assets\", path, error = %error,\n                state_before = \"loading\", state_after = \"failed\",\n                reason = \"asset_load_failed\", \"Art asset loading failed\");\n            return;\n        }\n        ready \u0026= server.is_loaded_with_dependencies(handle.id());\n    }\n    if ready {\n        *state = ArtLoadState::Ready;\n        info!(target: \"demo::art_assets\", asset_count = assets.entries().len(),\n            state_before = \"loading\", state_after = \"ready\",\n            reason = \"dependencies_loaded\", \"Art assets ready\");\n    }\n}\n"},{"path":"src/audio.rs","text":"//! Kira 播放端统一预加载、节流和限制并发；事件收集不依赖输出设备。\n\nuse std::collections::{HashMap, HashSet};\n\nuse bevy::{asset::AssetLoadFailedEvent, prelude::*};\nuse bevy_kira_audio::{\n    AudioApp, AudioChannel, AudioControl, AudioInstance, AudioPlugin as KiraAudioPlugin,\n    AudioSource, PlaybackState,\n};\nuse serde::Deserialize;\n\nuse crate::audio_events::{SoundCue, SoundRequest};\n\nconst MANIFEST: \u0026str = include_str!(\"../assets/audio/audio_manifest.json\");\n// 第一版固定混音余量与总并发，避免物理碰撞密集时叠加过响；试听页可独立调整监听音量。\nconst MASTER_GAIN: f64 = 0.25;\nconst MAX_VOICES: usize = 4;\n// 为菜单保留一个名额，不打断已播放的声音；物理反馈不能占满全部短音并发。\nconst RESERVED_UI_VOICES: usize = 1;\n\n/// 只在真正启动游戏时注册 Kira；测试可以只注册 SoundEventsPlugin。\npub(crate) struct GameAudioPlugin;\n\n#[derive(Resource)]\nstruct UiTrack;\n#[derive(Resource)]\nstruct SfxTrack;\n\nimpl Plugin for GameAudioPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_plugins(KiraAudioPlugin)\n            .add_audio_channel::\u003cUiTrack\u003e()\n            .add_audio_channel::\u003cSfxTrack\u003e()\n            .init_resource::\u003cSoundBank\u003e()\n            .add_systems(Startup, preload_sounds)\n            .add_systems(\n                Update,\n                // 鼠标导航在 UI 更新中产生消息，播放需等本帧交互处理完再消费。\n                (log_load_failures, play_requests, stop_on_exit)\n                    .chain()\n                    .after(crate::ui::UiSystems::Style),\n            );\n    }\n}\n\n#[derive(Deserialize)]\nstruct Manifest {\n    schema_version: u32,\n    assets: Vec\u003cManifestAsset\u003e,\n}\n\n#[derive(Deserialize)]\nstruct ManifestAsset {\n    id: String,\n    path: String,\n    category: String,\n    event_ids: Vec\u003cString\u003e,\n    playback: PlaybackPolicy,\n}\n\n#[derive(Deserialize, Clone)]\nstruct PlaybackPolicy {\n    volume: f64,\n    cooldown_seconds: f64,\n    max_instances: usize,\n    looped: bool,\n}\n\nimpl Manifest {\n    /// 编译时嵌入清单，但仍检查契约；破损清单只禁用反馈，不改变玩法状态。\n    fn parse(text: \u0026str) -\u003e Result\u003cSelf, String\u003e {\n        let manifest: Self = serde_json::from_str(text).map_err(|error| error.to_string())?;\n        if manifest.schema_version != 1 {\n            return Err(\"Unsupported audio manifest schema\".into());\n        }\n        let mut ids = HashSet::new();\n        for asset in \u0026manifest.assets {\n            if !ids.insert(\u0026asset.id)\n                || !asset\n                    .path\n                    .starts_with(\u0026format!(\"audio/{}/\", asset.category))\n                || asset.path.contains(\"..\")\n                || !(asset.path.ends_with(\".wav\") || asset.path.ends_with(\".ogg\"))\n                || !asset.playback.volume.is_finite()\n                || !(0.0..=1.0).contains(\u0026asset.playback.volume)\n                || !asset.playback.cooldown_seconds.is_finite()\n                || !(0.0..=10.0).contains(\u0026asset.playback.cooldown_seconds)\n                || !(1..=MAX_VOICES).contains(\u0026asset.playback.max_instances)\n            {\n                return Err(format!(\"Invalid audio asset policy: {}\", asset.id));\n            }\n        }\n        for cue in SoundCue::ALL {\n            let matches: Vec\u003c_\u003e = manifest\n                .assets\n                .iter()\n                .filter(|asset| asset.event_ids.iter().any(|id| id == cue.id()))\n                .collect();\n            if matches.len() != 1\n                || matches[0].playback.looped\n                || !matches!(matches[0].category.as_str(), \"ui\" | \"sfx\")\n            {\n                return Err(format!(\"Invalid one-shot event mapping: {}\", cue.id()));\n            }\n        }\n        Ok(manifest)\n    }\n}\n\nstruct LoadedSound {\n    handle: Handle\u003cAudioSource\u003e,\n    policy: PlaybackPolicy,\n    ui: bool,\n}\n\nstruct Voice {\n    cue: SoundCue,\n    handle: Handle\u003cAudioInstance\u003e,\n    ui: bool,\n}\n\n/// 短音的句柄生命周期与播放状态集中维护；只保留每种事件最后一次获准的播放时间。\n#[derive(Resource, Default)]\nstruct SoundBank {\n    sounds: HashMap\u003cSoundCue, LoadedSound\u003e,\n    voices: Vec\u003cVoice\u003e,\n    last_played: HashMap\u003cSoundCue, f64\u003e,\n}\n\nfn preload_sounds(server: Res\u003cAssetServer\u003e, mut bank: ResMut\u003cSoundBank\u003e) {\n    let manifest = match Manifest::parse(MANIFEST) {\n        Ok(manifest) =\u003e manifest,\n        Err(error) =\u003e {\n            error!(operation = \"load_audio_manifest\", %error, \"Audio pipeline disabled\");\n            return;\n        }\n    };\n    for asset in manifest.assets {\n        // 合成环境底声只用于试听，不随场景自动播放，也不占用短音通道。\n        if asset.category == \"ambience\" {\n            continue;\n        }\n        let handle = server.load::\u003cAudioSource\u003e(asset.path.clone());\n        for cue in SoundCue::ALL {\n            if asset.event_ids.iter().any(|id| id == cue.id()) {\n                bank.sounds.insert(\n                    cue,\n                    LoadedSound {\n                        handle: handle.clone(),\n                        policy: asset.playback.clone(),\n                        ui: asset.category == \"ui\",\n                    },\n                );\n            }\n        }\n        info!(asset_id = %asset.id, path = %asset.path, reason = \"startup_preload\", \"Audio asset requested\");\n    }\n    info!(\n        backend = \"bevy_kira_audio\",\n        backend_version = \"0.26.0\",\n        master_gain = MASTER_GAIN,\n        max_voices = MAX_VOICES,\n        reserved_ui_voices = RESERVED_UI_VOICES,\n        loaded_mappings = bank.sounds.len(),\n        \"Audio pipeline initialized\"\n    );\n}\n\nfn log_load_failures(mut failures: MessageReader\u003cAssetLoadFailedEvent\u003cAudioSource\u003e\u003e) {\n    for failure in failures.read() {\n        error!(operation = \"load_audio\", path = %failure.path, error = %failure.error, \"Audio asset failed to load\");\n    }\n}\n\n/// Queued 也算并发，避免同帧 Kira 尚未生成实例时穿过限额。\nfn allow_request(\n    policy: \u0026PlaybackPolicy,\n    now: f64,\n    last: Option\u003cf64\u003e,\n    same_cue: usize,\n    total: usize,\n) -\u003e bool {\n    total \u003c MAX_VOICES\n        \u0026\u0026 same_cue \u003c policy.max_instances\n        \u0026\u0026 last.is_none_or(|last| now - last \u003e= policy.cooldown_seconds)\n}\n\nfn play_requests(\n    mut requests: MessageReader\u003cSoundRequest\u003e,\n    // 暂停会冻结虚拟时间，菜单节流必须继续使用真实时间。\n    time: Res\u003cTime\u003cReal\u003e\u003e,\n    sources: Res\u003cAssets\u003cAudioSource\u003e\u003e,\n    ui: Res\u003cAudioChannel\u003cUiTrack\u003e\u003e,\n    sfx: Res\u003cAudioChannel\u003cSfxTrack\u003e\u003e,\n    mut bank: ResMut\u003cSoundBank\u003e,\n) {\n    bank.voices.retain(|voice| {\n        let state = if voice.ui {\n            ui.state(\u0026voice.handle)\n        } else {\n            sfx.state(\u0026voice.handle)\n        };\n        state != PlaybackState::Stopped\n    });\n    for request in requests.read() {\n        let Some(sound) = bank.sounds.get(\u0026request.cue) else {\n            continue;\n        };\n        let now = time.elapsed_secs_f64();\n        let same_cue = bank\n            .voices\n            .iter()\n            .filter(|voice| voice.cue == request.cue)\n            .count();\n        let sfx_at_capacity = !sound.ui\n            \u0026\u0026 bank.voices.iter().filter(|voice| !voice.ui).count()\n                \u003e= MAX_VOICES - RESERVED_UI_VOICES;\n        if !sources.contains(sound.handle.id())\n            || sfx_at_capacity\n            || !allow_request(\n                \u0026sound.policy,\n                now,\n                bank.last_played.get(\u0026request.cue).copied(),\n                same_cue,\n                bank.voices.len(),\n            )\n        {\n            debug!(event = request.cue.id(), source = ?request.source, reason = \"loading_or_playback_limit\", \"Audio cue skipped\");\n            continue;\n        }\n        if sound.policy.volume == 0.0 {\n            continue;\n        }\n        // Kira 0.26 接受分贝；清单音量是线性倍率，须显式换算，不能直接把倍率传成 dB。\n        let decibels = (20.0 * (MASTER_GAIN * sound.policy.volume).log10()) as f32;\n        let is_ui = sound.ui;\n        let handle = if is_ui {\n            ui.play(sound.handle.clone()).with_volume(decibels).handle()\n        } else {\n            sfx.play(sound.handle.clone())\n                .with_volume(decibels)\n                .handle()\n        };\n        bank.voices.push(Voice {\n            cue: request.cue,\n            handle,\n            ui: is_ui,\n        });\n        bank.last_played.insert(request.cue, now);\n        info!(event = request.cue.id(), source = ?request.source, volume_db = decibels,\n            reason = \"accepted_sound_request\", \"Audio cue queued\");\n    }\n}\n\nfn stop_on_exit(\n    mut exit: MessageReader\u003cAppExit\u003e,\n    ui: Res\u003cAudioChannel\u003cUiTrack\u003e\u003e,\n    sfx: Res\u003cAudioChannel\u003cSfxTrack\u003e\u003e,\n) {\n    if exit.read().next().is_some() {\n        ui.stop();\n        sfx.stop();\n        info!(reason = \"app_exit\", \"Audio channels stopped\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn shipped_manifest_maps_all_cues_once() {\n        let manifest = Manifest::parse(MANIFEST).unwrap();\n        for asset in manifest.assets {\n            let path = std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\"))\n                .join(\"assets\")\n                .join(asset.path);\n            assert!(path.is_file(), \"Missing audio asset: {}\", path.display());\n        }\n    }\n\n    #[test]\n    fn playback_limits_cover_same_frame_cooldown_and_global_cap() {\n        let policy = PlaybackPolicy {\n            volume: 0.7,\n            cooldown_seconds: 0.2,\n            max_instances: 2,\n            looped: false,\n        };\n        assert!(allow_request(\u0026policy, 1.0, None, 0, 0));\n        assert!(!allow_request(\u0026policy, 1.1, Some(1.0), 1, 1));\n        assert!(!allow_request(\u0026policy, 1.0, None, 2, 2));\n        assert!(!allow_request(\u0026policy, 1.0, None, 0, MAX_VOICES));\n        assert!(allow_request(\u0026policy, 1.3, Some(1.0), 1, 1));\n    }\n\n    /// 默认通道只排队而不会初始化设备；实际执行播放系统验证 Queued 的跨帧限额。\n    #[test]\n    fn queued_requests_obey_limits_without_audio_device() {\n        let mut app = queued_test_app();\n        let source = app.world_mut().spawn_empty().id();\n        for cue in SoundCue::ALL.into_iter().take(5) {\n            app.world_mut()\n                .write_message(SoundRequest::new(cue, source));\n        }\n        app.update();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), MAX_VOICES);\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cReal\u003e\u003e()\n            .advance_by(std::time::Duration::from_secs(2));\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::ParcelHandoff, source));\n        app.update();\n        let bank = app.world().resource::\u003cSoundBank\u003e();\n        assert_eq!(bank.voices.len(), MAX_VOICES);\n        assert!(!bank.last_played.contains_key(\u0026SoundCue::ParcelHandoff));\n        for voice in \u0026bank.voices {\n            let state = if voice.ui {\n                app.world()\n                    .resource::\u003cAudioChannel\u003cUiTrack\u003e\u003e()\n                    .state(\u0026voice.handle)\n            } else {\n                app.world()\n                    .resource::\u003cAudioChannel\u003cSfxTrack\u003e\u003e()\n                    .state(\u0026voice.handle)\n            };\n            assert_eq!(state, PlaybackState::Queued);\n        }\n    }\n\n    fn queued_test_app() -\u003e App {\n        let mut app = App::new();\n        app.init_resource::\u003cTime\u003cReal\u003e\u003e()\n            .init_resource::\u003cAssets\u003cAudioSource\u003e\u003e()\n            .init_resource::\u003cAudioChannel\u003cUiTrack\u003e\u003e()\n            .init_resource::\u003cAudioChannel\u003cSfxTrack\u003e\u003e()\n            .init_resource::\u003cSoundBank\u003e()\n            .add_message::\u003cSoundRequest\u003e()\n            .add_systems(Update, play_requests);\n        let manifest = Manifest::parse(MANIFEST).unwrap();\n        for cue in SoundCue::ALL {\n            let asset = manifest\n                .assets\n                .iter()\n                .find(|asset| asset.event_ids.iter().any(|id| id == cue.id()))\n                .unwrap();\n            let path = std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\"))\n                .join(\"assets\")\n                .join(\u0026asset.path);\n            let sound = bevy_kira_audio::prelude::StaticSoundData::from_file(path).unwrap();\n            let handle = app\n                .world_mut()\n                .resource_mut::\u003cAssets\u003cAudioSource\u003e\u003e()\n                .add(AudioSource { sound });\n            app.world_mut().resource_mut::\u003cSoundBank\u003e().sounds.insert(\n                cue,\n                LoadedSound {\n                    handle,\n                    policy: asset.playback.clone(),\n                    ui: asset.category == \"ui\",\n                },\n            );\n        }\n        app\n    }\n\n    #[test]\n    fn gameplay_queue_reserves_menu_feedback_and_keeps_global_cap() {\n        let mut app = queued_test_app();\n        let source = app.world_mut().spawn_empty().id();\n        for cue in [\n            SoundCue::ParcelPickup,\n            SoundCue::ParcelRelease,\n            SoundCue::ParcelHandoff,\n            SoundCue::ParcelLand,\n        ] {\n            app.world_mut()\n                .write_message(SoundRequest::new(cue, source));\n        }\n        app.update();\n        let bank = app.world().resource::\u003cSoundBank\u003e();\n        assert_eq!(bank.voices.len(), MAX_VOICES - RESERVED_UI_VOICES);\n        assert!(bank.voices.iter().all(|voice| !voice.ui));\n        assert!(!bank.last_played.contains_key(\u0026SoundCue::ParcelLand));\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuConfirm, source));\n        app.update();\n        let bank = app.world().resource::\u003cSoundBank\u003e();\n        assert_eq!(bank.voices.len(), MAX_VOICES);\n        let menu = bank.voices.iter().find(|voice| voice.ui).unwrap();\n        assert_eq!(menu.cue, SoundCue::MenuConfirm);\n        assert_eq!(\n            app.world()\n                .resource::\u003cAudioChannel\u003cUiTrack\u003e\u003e()\n                .state(\u0026menu.handle),\n            PlaybackState::Queued\n        );\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuCancel, source));\n        app.update();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), MAX_VOICES);\n        assert!(\n            !app.world()\n                .resource::\u003cSoundBank\u003e()\n                .last_played\n                .contains_key(\u0026SoundCue::MenuCancel)\n        );\n    }\n\n    #[test]\n    fn menu_cooldown_uses_real_time_while_virtual_time_is_paused() {\n        use bevy::time::{TimePlugin, TimeUpdateStrategy};\n        use std::time::Duration;\n\n        let mut app = queued_test_app();\n        app.add_plugins(TimePlugin)\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO));\n        app.update();\n        app.world_mut().resource_mut::\u003cTime\u003cVirtual\u003e\u003e().pause();\n        let source = app.world_mut().spawn_empty().id();\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuHover, source));\n        app.update();\n        let paused_at = app.world().resource::\u003cTime\u003e().elapsed();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), 1);\n\n        app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_millis(\n            20,\n        )));\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuHover, source));\n        app.update();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), 1);\n\n        app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_millis(\n            80,\n        )));\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuHover, source));\n        app.update();\n        assert_eq!(app.world().resource::\u003cTime\u003e().elapsed(), paused_at);\n        assert!(app.world().resource::\u003cTime\u003cReal\u003e\u003e().elapsed() \u003e paused_at);\n        let bank = app.world().resource::\u003cSoundBank\u003e();\n        assert_eq!(bank.voices.len(), 2);\n        assert!(bank.voices.iter().all(|voice| voice.ui));\n\n        // Queued 实例也受单事件上限约束，即使冷却已结束仍不增加第三条。\n        app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs(1)));\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuHover, source));\n        app.update();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), 2);\n    }\n\n    #[test]\n    fn unloaded_menu_cue_is_discarded_instead_of_replayed_after_loading() {\n        let mut app = queued_test_app();\n        let source = app.world_mut().spawn_empty().id();\n        let handle = app.world().resource::\u003cSoundBank\u003e().sounds[\u0026SoundCue::MenuConfirm]\n            .handle\n            .clone();\n        let sound = app\n            .world_mut()\n            .resource_mut::\u003cAssets\u003cAudioSource\u003e\u003e()\n            .remove(handle.id())\n            .unwrap();\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuConfirm, source));\n        app.update();\n        assert!(app.world().resource::\u003cSoundBank\u003e().voices.is_empty());\n        app.world_mut()\n            .resource_mut::\u003cAssets\u003cAudioSource\u003e\u003e()\n            .insert(handle.id(), sound)\n            .unwrap();\n        app.update();\n        assert!(app.world().resource::\u003cSoundBank\u003e().voices.is_empty());\n        app.world_mut()\n            .write_message(SoundRequest::new(SoundCue::MenuConfirm, source));\n        app.update();\n        assert_eq!(app.world().resource::\u003cSoundBank\u003e().voices.len(), 1);\n    }\n\n    #[test]\n    fn kira_decodes_every_shipped_file_without_opening_device() {\n        let manifest = Manifest::parse(MANIFEST).unwrap();\n        for asset in manifest.assets {\n            let path = std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\"))\n                .join(\"assets\")\n                .join(asset.path);\n            bevy_kira_audio::prelude::StaticSoundData::from_file(\u0026path)\n                .unwrap_or_else(|error| panic!(\"Failed to decode {}: {error}\", path.display()));\n        }\n    }\n}\n"},{"path":"src/audio_events.rs","text":"//! 玩法只发出已发生的反馈消息；无窗口测试不安装 Kira 或打开音频设备。\n\nuse std::collections::{HashMap, HashSet};\n\nuse avian3d::prelude::*;\nuse bevy::prelude::*;\n\nuse crate::{\n    app_flow::gameplay_running,\n    gameplay::{CarryGrip, Character, GameplaySystems, HeldBy, Parcel, PrototypeConfig},\n};\nuse bevy::ecs::relationship::Relationship;\n\n/// 稳定事件标识与音频清单对应；未来玩法在业务成功或失败时发送，不能从按键猜测结果。\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash)]\npub(crate) enum SoundCue {\n    MenuHover,\n    MenuConfirm,\n    MenuCancel,\n    ParcelPickup,\n    ParcelRelease,\n    ParcelHandoff,\n    ParcelLand,\n    CartCollision,\n    CharacterBounce,\n    InstabilityWarning,\n    DeliverySuccess,\n    DeliveryFailure,\n}\n\nimpl SoundCue {\n    pub(crate) const ALL: [Self; 12] = [\n        Self::MenuHover,\n        Self::MenuConfirm,\n        Self::MenuCancel,\n        Self::ParcelPickup,\n        Self::ParcelRelease,\n        Self::ParcelHandoff,\n        Self::ParcelLand,\n        Self::CartCollision,\n        Self::CharacterBounce,\n        Self::InstabilityWarning,\n        Self::DeliverySuccess,\n        Self::DeliveryFailure,\n    ];\n\n    /// 与 manifest 的 event_ids 使用同一英文标识，便于日志与资产对应。\n    pub(crate) const fn id(self) -\u003e \u0026'static str {\n        match self {\n            Self::MenuHover =\u003e \"menu_hover\",\n            Self::MenuConfirm =\u003e \"menu_confirm\",\n            Self::MenuCancel =\u003e \"menu_cancel\",\n            Self::ParcelPickup =\u003e \"parcel_pickup\",\n            Self::ParcelRelease =\u003e \"parcel_release\",\n            Self::ParcelHandoff =\u003e \"parcel_handoff\",\n            Self::ParcelLand =\u003e \"parcel_land\",\n            Self::CartCollision =\u003e \"cart_collision\",\n            Self::CharacterBounce =\u003e \"character_bounce\",\n            Self::InstabilityWarning =\u003e \"instability_warning\",\n            Self::DeliverySuccess =\u003e \"delivery_success\",\n            Self::DeliveryFailure =\u003e \"delivery_failure\",\n        }\n    }\n}\n\n/// 业务实体只用于日志和节流，不持有其组件引用，实体销毁后消息仍可被消费。\n#[derive(Message, Clone, Copy, Debug)]\npub(crate) struct SoundRequest {\n    pub cue: SoundCue,\n    pub source: Entity,\n}\n\nimpl SoundRequest {\n    pub(crate) fn new(cue: SoundCue, source: Entity) -\u003e Self {\n        Self { cue, source }\n    }\n}\n\n/// 消息与物理反馈收集独立于设备播放，使玩法最小 App 保持无窗口、无音频输出。\npub(crate) struct SoundEventsPlugin;\n\nimpl Plugin for SoundEventsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_message::\u003cSoundRequest\u003e()\n            .add_systems(\n                FixedUpdate,\n                // 复用会话条件；没有状态资源的最小物理测试仍能收集玩法反馈。\n                warn_hold_strain\n                    .after(GameplaySystems::Simulate)\n                    .run_if(gameplay_running),\n            )\n            .add_systems(\n                FixedPostUpdate,\n                emit_parcel_land\n                    .after(PhysicsSystems::StepSimulation)\n                    .run_if(gameplay_running),\n            );\n    }\n}\n\n/// 预测接触可能早于撞击；每步检查支撑冲量，并锁存到完全离开支撑，避免漏声或静置重复。\n#[derive(Default)]\nstruct LandingContacts {\n    supported: HashSet\u003cEntity\u003e,\n    reported: HashSet\u003cEntity\u003e,\n}\n\nfn emit_parcel_land(\n    contacts: Res\u003cContactGraph\u003e,\n    parcels: Query\u003c(), (With\u003cParcel\u003e, Without\u003cHeldBy\u003e)\u003e,\n    mut state: Local\u003cLandingContacts\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n) {\n    state.supported.clear();\n    for pair in contacts\n        .iter_active_touching()\n        .chain(contacts.iter_sleeping_touching())\n    {\n        for (parcel, first) in [(pair.collider1, true), (pair.collider2, false)] {\n            if !parcels.contains(parcel) {\n                continue;\n            }\n            let mut landed = false;\n            for manifold in \u0026pair.manifolds {\n                let support_y = if first {\n                    -manifold.normal.y\n                } else {\n                    manifold.normal.y\n                };\n                if support_y \u003e= 0.65 {\n                    state.supported.insert(parcel);\n                    landed |= manifold.total_normal_impulse() \u003e= 1.8;\n                }\n            }\n            if landed \u0026\u0026 state.reported.insert(parcel) {\n                sounds.write(SoundRequest::new(SoundCue::ParcelLand, parcel));\n                info!(\n                    ?parcel,\n                    event = \"parcel_land\",\n                    reason = \"support_impact\",\n                    \"Audio cue emitted\"\n                );\n            }\n        }\n    }\n    let LandingContacts {\n        supported,\n        reported,\n    } = \u0026mut *state;\n    reported.retain(|parcel| supported.contains(parcel));\n}\n\n/// 用滞回与持续时间区分正常拾取拉近、瞬时惯性和持续受阻；每次失稳只提示一次。\n#[derive(Default)]\nstruct HoldStrain {\n    holder: Option\u003cEntity\u003e,\n    age: f32,\n    strained_for: f32,\n    warned: bool,\n}\n\nfn warn_hold_strain(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    holders: Query\u003c(\u0026Position, \u0026Transform), With\u003cCharacter\u003e\u003e,\n    parcels: Query\u003c(Entity, \u0026HeldBy, \u0026Position, Option\u003c\u0026CarryGrip\u003e), With\u003cParcel\u003e\u003e,\n    mut strain: Local\u003cHashMap\u003cEntity, HoldStrain\u003e\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n) {\n    strain.retain(|entity, _| parcels.contains(*entity));\n    for (parcel, held_by, position, grip) in \u0026parcels {\n        let Ok((holder_position, holder_transform)) = holders.get(held_by.get()) else {\n            strain.remove(\u0026parcel);\n            continue;\n        };\n        // 告警与持握施力共用物品偏移；纸箱和木箱不能用旧全局目标判断恢复。\n        let offset = grip.map_or(config.hold_offset, |grip| grip.0);\n        let target = holder_position.0 + holder_transform.rotation * offset;\n        let distance = position.0.distance(target);\n        let state = strain.entry(parcel).or_default();\n        // 同一包裹切换持有者时也重启宽限，不能沿用上一持有者的警告锁存。\n        if state.holder != Some(held_by.get()) {\n            *state = HoldStrain {\n                holder: Some(held_by.get()),\n                ..default()\n            };\n        }\n        state.age += time.delta_secs();\n        if distance \u003c 0.45 {\n            state.strained_for = 0.0;\n            state.warned = false;\n        } else if distance \u003e 0.65 \u0026\u0026 state.age \u003e= 0.5 {\n            state.strained_for += time.delta_secs();\n            if state.strained_for \u003e= 0.35 \u0026\u0026 !state.warned {\n                state.warned = true;\n                sounds.write(SoundRequest::new(SoundCue::InstabilityWarning, parcel));\n                info!(\n                    ?parcel,\n                    event = \"instability_warning\",\n                    distance,\n                    reason = \"sustained_hold_error\",\n                    \"Audio cue emitted\"\n                );\n            }\n        } else {\n            state.strained_for = 0.0;\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::app_flow::{AppState, PlayState};\n\n    #[test]\n    fn gameplay_feedback_stays_silent_in_main_menu_and_pause() {\n        let mut app = App::new();\n        app.init_resource::\u003cPrototypeConfig\u003e()\n            .init_resource::\u003cContactGraph\u003e()\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(State::new(AppState::MainMenu))\n            .insert_resource(State::new(PlayState::Running))\n            .add_plugins(SoundEventsPlugin);\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n            .advance_by(std::time::Duration::from_secs_f32(0.1));\n        let holder = app\n            .world_mut()\n            .spawn((Character, Position::default(), Transform::default()))\n            .id();\n        app.world_mut().spawn((\n            Parcel,\n            \u003cHeldBy as Relationship\u003e::from(holder),\n            Position(Vec3::X * 5.0),\n        ));\n        let parcel = app.world_mut().spawn(Parcel).id();\n        let ground = app.world_mut().spawn_empty().id();\n        // 只提供已解算的接触数据，验证收集系统的会话门槛，不安装物理或输出设备。\n        let mut point = ContactPoint::new(Vec3::ZERO, Vec3::ZERO, Vec3::ZERO, 0.0);\n        point.normal_impulse = 2.0;\n        app.world_mut()\n            .resource_mut::\u003cContactGraph\u003e()\n            .add_edge_with(ContactEdge::new(parcel, ground), |pair| {\n                pair.flags.insert(ContactPairFlags::TOUCHING);\n                pair.manifolds = vec![ContactManifold::new([point], -Vec3::Y)];\n            });\n        for _ in 0..20 {\n            app.world_mut().run_schedule(FixedUpdate);\n            app.world_mut().run_schedule(FixedPostUpdate);\n        }\n        assert!(app.world().resource::\u003cMessages\u003cSoundRequest\u003e\u003e().is_empty());\n\n        app.insert_resource(State::new(AppState::InGame));\n        app.world_mut().run_schedule(FixedUpdate);\n        app.world_mut().run_schedule(FixedPostUpdate);\n        let cues: Vec\u003c_\u003e = app\n            .world_mut()\n            .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n            .drain()\n            .map(|request| request.cue)\n            .collect();\n        assert_eq!(cues, [SoundCue::ParcelLand]);\n\n        app.insert_resource(State::new(PlayState::Paused));\n        for _ in 0..20 {\n            app.world_mut().run_schedule(FixedUpdate);\n            app.world_mut().run_schedule(FixedPostUpdate);\n        }\n        assert!(app.world().resource::\u003cMessages\u003cSoundRequest\u003e\u003e().is_empty());\n        app.insert_resource(State::new(PlayState::Running));\n        for _ in 0..10 {\n            app.world_mut().run_schedule(FixedUpdate);\n            app.world_mut().run_schedule(FixedPostUpdate);\n        }\n        let cues: Vec\u003c_\u003e = app\n            .world_mut()\n            .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n            .drain()\n            .map(|request| request.cue)\n            .collect();\n        assert_eq!(cues, [SoundCue::InstabilityWarning]);\n    }\n\n    #[test]\n    fn sustained_strain_warns_once_and_recovery_rearms() {\n        let mut app = App::new();\n        app.init_resource::\u003cPrototypeConfig\u003e()\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .add_message::\u003cSoundRequest\u003e()\n            .add_systems(FixedUpdate, warn_hold_strain);\n        app.world_mut()\n            .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n            .advance_by(std::time::Duration::from_secs_f32(0.1));\n        let holder = app\n            .world_mut()\n            .spawn((Character, Position::default(), Transform::default()))\n            .id();\n        let parcel = app\n            .world_mut()\n            .spawn((\n                Parcel,\n                \u003cHeldBy as Relationship\u003e::from(holder),\n                Position(Vec3::X * 5.0),\n            ))\n            .id();\n        for _ in 0..20 {\n            app.world_mut().run_schedule(FixedUpdate);\n        }\n        let cues: Vec\u003c_\u003e = app\n            .world_mut()\n            .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n            .drain()\n            .collect();\n        assert_eq!(cues.len(), 1);\n        assert_eq!(cues[0].cue, SoundCue::InstabilityWarning);\n        let target = app.world().resource::\u003cPrototypeConfig\u003e().hold_offset;\n        app.world_mut().get_mut::\u003cPosition\u003e(parcel).unwrap().0 = target;\n        app.world_mut().run_schedule(FixedUpdate);\n        app.world_mut().get_mut::\u003cPosition\u003e(parcel).unwrap().0 = Vec3::X * 5.0;\n        for _ in 0..10 {\n            app.world_mut().run_schedule(FixedUpdate);\n        }\n        assert_eq!(\n            app.world_mut()\n                .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n                .drain()\n                .count(),\n            1\n        );\n        app.world_mut().entity_mut(parcel).remove::\u003cHeldBy\u003e();\n        app.world_mut().run_schedule(FixedUpdate);\n        assert!(app.world().resource::\u003cMessages\u003cSoundRequest\u003e\u003e().is_empty());\n    }\n\n    #[test]\n    fn item_grips_allow_normal_lag_and_rearm_after_recovery() {\n        // 运行真实反馈系统，覆盖海岛纸箱和木箱的偏移、物理位置与非零水平朝向。\n        // 不安装物理、窗口或音频设备；位姿直接表达正常持握和两次持续受阻。\n        for grip in [Vec3::new(0.0, 1.3, -0.48), Vec3::new(0.0, 1.3, -0.62)] {\n            let mut app = App::new();\n            app.init_resource::\u003cPrototypeConfig\u003e()\n                .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n                .add_message::\u003cSoundRequest\u003e()\n                .add_systems(FixedUpdate, warn_hold_strain);\n            app.world_mut()\n                .resource_mut::\u003cTime\u003cFixed\u003e\u003e()\n                .advance_by(std::time::Duration::from_secs_f32(0.1));\n            let position = Vec3::new(3.0, 0.8, -2.0);\n            let rotation = Quat::from_rotation_y(1.2);\n            let holder = app\n                .world_mut()\n                .spawn((\n                    Character,\n                    Position(position),\n                    // 模拟目标必须读 Position，不能误读经过插值的呈现位置。\n                    Transform {\n                        translation: position + Vec3::X,\n                        rotation,\n                        ..default()\n                    },\n                ))\n                .id();\n            let target = position + rotation * grip;\n            let parcel = app\n                .world_mut()\n                .spawn((\n                    Parcel,\n                    \u003cHeldBy as Relationship\u003e::from(holder),\n                    CarryGrip(grip),\n                    Position(target + rotation * Vec3::Z * 0.3),\n                ))\n                .id();\n            let take_cues = |app: \u0026mut App| {\n                app.world_mut()\n                    .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n                    .drain()\n                    .map(|request| (request.cue, request.source))\n                    .collect::\u003cVec\u003c_\u003e\u003e()\n            };\n            // 小于恢复阈值的正常惯性偏移不得被旧全局偏移放大成持续失稳。\n            for _ in 0..20 {\n                app.world_mut().run_schedule(FixedUpdate);\n            }\n            assert!(take_cues(\u0026mut app).is_empty(), \"grip={grip:?}\");\n\n            for _ in 0..2 {\n                app.world_mut().get_mut::\u003cPosition\u003e(parcel).unwrap().0 = target + Vec3::X * 2.0;\n                for _ in 0..20 {\n                    app.world_mut().run_schedule(FixedUpdate);\n                }\n                assert_eq!(\n                    take_cues(\u0026mut app),\n                    [(SoundCue::InstabilityWarning, parcel)],\n                    \"grip={grip:?}\"\n                );\n                for _ in 0..10 {\n                    app.world_mut().run_schedule(FixedUpdate);\n                }\n                assert!(take_cues(\u0026mut app).is_empty(), \"grip={grip:?}\");\n\n                // 恢复到实际物品目标后重新武装；下一轮受阻仍应发出一条警告。\n                app.world_mut().get_mut::\u003cPosition\u003e(parcel).unwrap().0 = target;\n                app.world_mut().run_schedule(FixedUpdate);\n                assert!(take_cues(\u0026mut app).is_empty(), \"grip={grip:?}\");\n            }\n        }\n    }\n}\n"},{"path":"src/camera.rs","text":"//! 第一／第三人称视角：动作更新观察状态，固定步同步朝向，物理插值后同步持握目标、镜头和模型显示。\n\nuse std::f32::consts::TAU;\n\nuse avian3d::interpolation::TransformEasingSystems;\nuse bevy::{\n    input::{InputSystems, mouse::MouseButtonInput},\n    prelude::*,\n    window::{CursorGrabMode, CursorOptions, PrimaryWindow, WindowFocused},\n};\nuse bevy_enhanced_input::prelude::{ContextActivity, EnhancedInputSystems, Fire};\nuse bevy_inspector_egui::bevy_egui::{\n    EguiContext, EguiInput, EguiPreUpdateSet, PrimaryEguiContext, egui,\n};\n\nuse crate::{\n    app_flow::{AppState, PlayState, gameplay_running},\n    gameplay::{Character, ControlsCharacter, GameplaySystems, sync_held_objects},\n    input::{GameplayContext, LookAction, ReleasePointerAction, TogglePerspectiveAction},\n    settings::GameSettings,\n};\n\n/// 控制者关联的相机，输入设备绑定仍由输入模块管理。\n#[derive(Component, Reflect)]\n#[reflect(Component)]\npub struct ControlsCamera(#[entities] pub Entity);\n\n/// 同一台相机的观察模式，角度和目标仍由相机组件保存。\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Reflect)]\npub enum CameraPerspective {\n    ThirdPerson,\n    FirstPerson,\n}\n\nimpl CameraPerspective {\n    fn name(self) -\u003e \u0026'static str {\n        match self {\n            Self::ThirdPerson =\u003e \"third_person\",\n            Self::FirstPerson =\u003e \"first_person\",\n        }\n    }\n}\n\n/// 由视角系统控制可见性的角色视觉根；所属角色使用已有的 ChildOf 关系。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct CharacterVisual;\n\n/// 两种视角共享水平朝向并分别记住俯仰；实际位置和朝向仅写入 Transform。\n#[derive(Component, Reflect)]\n#[reflect(Component)]\npub struct OrbitCamera {\n    #[entities]\n    pub target: Entity,\n    yaw: f32,\n    perspective: CameraPerspective,\n    third_person_pitch: f32,\n    first_person_pitch: f32,\n    distance: f32,\n    look_height: f32,\n    eye_height: f32,\n    #[entities]\n    #[reflect(ignore)]\n    toggle_requested_by: Option\u003cEntity\u003e,\n}\n\nimpl OrbitCamera {\n    /// 从原型原有的偏移初始化，保持初始画面和跟随距离。\n    pub fn new(target: Entity) -\u003e Self {\n        let relative_offset = Vec3::new(0.0, 5.2, 8.0);\n        Self {\n            target,\n            yaw: 0.0,\n            perspective: CameraPerspective::ThirdPerson,\n            third_person_pitch: relative_offset.y.atan2(relative_offset.z),\n            first_person_pitch: 0.0,\n            distance: relative_offset.length(),\n            look_height: 0.8,\n            eye_height: 1.65,\n            toggle_requested_by: None,\n        }\n    }\n\n    /// 根据目标的世界位置计算镜头，不读取或修改其他实体。\n    pub fn transform(\u0026self, target_position: Vec3) -\u003e Transform {\n        if self.perspective == CameraPerspective::FirstPerson {\n            // 眼位只跟随人物位置；俯仰直接决定观察方向，不能继续朝向第三人称的低处观察点。\n            return Transform::from_translation(target_position + Vec3::Y * self.eye_height)\n                .with_rotation(\n                    Quat::from_rotation_y(self.yaw)\n                        * Quat::from_rotation_x(-self.first_person_pitch),\n                );\n        }\n        let pivot = target_position + Vec3::Y * self.look_height;\n        let offset = Quat::from_rotation_y(self.yaw)\n            * Vec3::new(\n                0.0,\n                self.distance * self.third_person_pitch.sin(),\n                self.distance * self.third_person_pitch.cos(),\n            );\n        Transform::from_translation(pivot + offset).looking_at(pivot, Vec3::Y)\n    }\n\n    fn pitch(\u0026self) -\u003e f32 {\n        match self.perspective {\n            CameraPerspective::ThirdPerson =\u003e self.third_person_pitch,\n            CameraPerspective::FirstPerson =\u003e self.first_person_pitch,\n        }\n    }\n\n    fn apply_vertical_look(\u0026mut self, delta: f32) {\n        match self.perspective {\n            // 没有镜头碰撞，第三人称保持在观察点上方；第一人称允许抬头，但都避开垂直极点。\n            CameraPerspective::ThirdPerson =\u003e {\n                self.third_person_pitch = (self.third_person_pitch + delta)\n                    .clamp(5.0_f32.to_radians(), 80.0_f32.to_radians());\n            }\n            CameraPerspective::FirstPerson =\u003e {\n                self.first_person_pitch = (self.first_person_pitch + delta)\n                    .clamp(-85.0_f32.to_radians(), 85.0_f32.to_radians());\n            }\n        }\n    }\n}\n\n/// 每个本地相机的鼠标捕获状态；恢复捕获的那帧不处理自由光标阶段的增量。\n#[derive(Component, Default)]\npub struct MouseLookState {\n    pub(crate) active: bool,\n    pub(crate) initialized: bool,\n    pub(crate) skip_motion: bool,\n    target_available: bool,\n    /// 焦点消息与窗口最终状态共同决定本帧能否切换；检查器另通过输入上下文屏蔽动作。\n    focused: bool,\n}\n\n/// 注册自由视角、鼠标捕获和人物朝向同步，不创建窗口。\npub struct CameraControlPlugin;\n\nimpl Plugin for CameraControlPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.init_resource::\u003cGameSettings\u003e()\n            .register_type::\u003cControlsCamera\u003e()\n            .register_type::\u003cCharacterVisual\u003e()\n            .register_type::\u003cCameraPerspective\u003e()\n            .register_type::\u003cOrbitCamera\u003e()\n            .add_message::\u003cWindowFocused\u003e()\n            .add_observer(on_camera_look)\n            .add_observer(request_perspective_toggle)\n            .add_observer(release_pointer_for_inspector)\n            .add_systems(\n                PreUpdate,\n                filter_captured_egui_input\n                    .after(EguiPreUpdateSet::ProcessInput)\n                    .before(EguiPreUpdateSet::BeginPass),\n            )\n            .add_systems(\n                PreUpdate,\n                sync_mouse_capture\n                    // egui 输入准备后用实时光标阻止同帧穿透；默认 multipass 的焦点仍来自上一已完成 UI 帧。\n                    // 延迟上下文命令必须在动作准备前应用；BeginPass 也兼容非 multipass 的上下文。\n                    .after(InputSystems)\n                    .after(EguiPreUpdateSet::BeginPass)\n                    .before(EnhancedInputSystems::Prepare),\n            )\n            .add_systems(\n                PreUpdate,\n                // 所有动作 Observer 完成后再切换，避免 I 与鼠标同帧时依赖动作遍历顺序。\n                apply_perspective_toggle\n                    .after(EnhancedInputSystems::Apply)\n                    .run_if(gameplay_running),\n            )\n            .add_systems(\n                FixedUpdate,\n                // 默认 Main 在 PreUpdate 结束时应用动作命令，再进入固定步；此处只规定固定步内顺序。\n                sync_character_facing\n                    .before(GameplaySystems::Simulate)\n                    .run_if(gameplay_running),\n            )\n            .add_systems(\n                RunFixedMainLoop,\n                // 插值在固定循环后执行，镜头和持握目标必须读取同一份已插值的角色位置。\n                // 朝向同步在插值变化标记采样前完成，避免下一无固定步帧将它误判为位置瞬移。\n                (\n                    sync_character_facing,\n                    sync_held_objects,\n                    follow_orbit_camera,\n                    sync_character_visibility,\n                )\n                    .chain()\n                    .in_set(RunFixedMainLoopSystems::AfterFixedMainLoop)\n                    .after(TransformEasingSystems::Ease)\n                    .before(TransformEasingSystems::UpdateEasingTick)\n                    .run_if(gameplay_running),\n            );\n    }\n}\n\n/// 检查器释放使用动作事件；相机捕获系统继续负责下一帧上下文与点击恢复。\nfn release_pointer_for_inspector(\n    event: On\u003cFire\u003cReleasePointerAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCamera, With\u003cGameplayContext\u003e\u003e,\n    mut cameras: Query\u003c\u0026mut MouseLookState\u003e,\n    mut windows: Query\u003c(\u0026Window, \u0026mut CursorOptions), With\u003cPrimaryWindow\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut capture) = cameras.get_mut(controlled.0) else {\n        return;\n    };\n    let Ok((window, mut cursor)) = windows.single_mut() else {\n        return;\n    };\n    if !window.focused {\n        return;\n    }\n    let was_captured = capture.active;\n    capture.active = false;\n    capture.skip_motion = true;\n    cursor.visible = true;\n    cursor.grab_mode = CursorGrabMode::None;\n    if was_captured {\n        info!(target: \"demo::camera\", camera = ?controlled.0, before = \"captured\", after = \"released\",\n            reason = \"inspector_release_action\", \"Mouse look capture changed\");\n    }\n}\n\n/// 游戏捕获鼠标时检查器仍显示，但不能接收藏在面板上的光标点击或角色操作按键。\nfn filter_captured_egui_input(\n    keys: Res\u003cButtonInput\u003cKeyCode\u003e\u003e,\n    windows: Query\u003c(\u0026Window, \u0026CursorOptions), With\u003cPrimaryWindow\u003e\u003e,\n    mut contexts: Query\u003c(\u0026mut EguiContext, \u0026mut EguiInput), With\u003cPrimaryEguiContext\u003e\u003e,\n) {\n    let Ok((window, cursor)) = windows.single() else {\n        return;\n    };\n    // Esc 必须在本帧直接放行检查器输入，不等后续捕获同步；窗口焦点仍由 egui 的原始输入设施维护。\n    if !window.focused\n        || cursor.visible\n        || cursor.grab_mode == CursorGrabMode::None\n        || keys.just_pressed(KeyCode::Escape)\n    {\n        return;\n    }\n    for (mut context, mut input) in \u0026mut contexts {\n        let context = context.get_mut();\n        input.0.events.clear();\n        // 面板外恢复捕获的按下已进入 egui；仅补齐仍按下的释放，再移除位置，避免过滤真实松开后状态残留。\n        context.input(|state| {\n            for button in [\n                egui::PointerButton::Primary,\n                egui::PointerButton::Secondary,\n                egui::PointerButton::Middle,\n                egui::PointerButton::Extra1,\n                egui::PointerButton::Extra2,\n            ] {\n                if state.pointer.button_down(button) {\n                    input.0.events.push(egui::Event::PointerButton {\n                        pos: egui::pos2(-10000.0, -10000.0),\n                        button,\n                        pressed: false,\n                        modifiers: default(),\n                    });\n                }\n            }\n            for key in \u0026state.keys_down {\n                input.0.events.push(egui::Event::Key {\n                    key: *key,\n                    physical_key: None,\n                    pressed: false,\n                    repeat: false,\n                    modifiers: default(),\n                });\n            }\n        });\n        input.0.events.push(egui::Event::PointerGone);\n        context.stop_dragging();\n        context.memory_mut(|memory| {\n            if let Some(focused) = memory.focused() {\n                memory.surrender_focus(focused);\n            }\n        });\n    }\n}\n\n/// 同时检查窗口状态和焦点消息，避免同一帧失焦后又回焦时自动恢复捕获。\nfn sync_mouse_capture(\n    mut commands: Commands,\n    keys: Res\u003cButtonInput\u003cKeyCode\u003e\u003e,\n    mut button_events: MessageReader\u003cMouseButtonInput\u003e,\n    mut focus_events: MessageReader\u003cWindowFocused\u003e,\n    mut windows: Query\u003c(Entity, \u0026Window, \u0026mut CursorOptions), With\u003cPrimaryWindow\u003e\u003e,\n    controllers: Query\u003c\n        (\n            Entity,\n            \u0026ControlsCharacter,\n            \u0026ControlsCamera,\n            \u0026ContextActivity\u003cGameplayContext\u003e,\n        ),\n        With\u003cGameplayContext\u003e,\n    \u003e,\n    characters: Query\u003c(), With\u003cCharacter\u003e\u003e,\n    mut cameras: Query\u003c(Entity, \u0026OrbitCamera, \u0026mut MouseLookState)\u003e,\n    mut egui_contexts: Query\u003c\u0026mut EguiContext, With\u003cPrimaryEguiContext\u003e\u003e,\n    app_state: Option\u003cRes\u003cState\u003cAppState\u003e\u003e\u003e,\n    play_state: Option\u003cRes\u003cState\u003cPlayState\u003e\u003e\u003e,\n) {\n    let running = app_state.as_ref().is_none_or(|state| {\n        *state.get() == AppState::InGame\n            \u0026\u0026 play_state\n                .as_ref()\n                .is_some_and(|state| *state.get() == PlayState::Running)\n    });\n    let Ok((window_entity, window, mut cursor)) = windows.single_mut() else {\n        focus_events.clear();\n        button_events.clear();\n        for (camera, _, mut state) in \u0026mut cameras {\n            if state.active {\n                info!(target: \"demo::camera\", ?camera, before = \"captured\", after = \"released\",\n                    reason = \"window_unavailable\", \"Mouse look capture changed\");\n            }\n            state.active = false;\n            state.skip_motion = true;\n            state.focused = false;\n        }\n        for (controller, _, _, activity) in \u0026controllers {\n            if **activity {\n                commands\n                    .entity(controller)\n                    .insert(ContextActivity::\u003cGameplayContext\u003e::INACTIVE);\n            }\n        }\n        return;\n    };\n    let mut lost_focus = false;\n    for event in focus_events.read() {\n        lost_focus |= event.window == window_entity \u0026\u0026 !event.focused;\n    }\n    let mut clicked = false;\n    for event in button_events.read() {\n        // 失焦可能漏收松开消息，直接读取点击而不依赖仍残留的 pressed 状态。\n        clicked |= event.window == window_entity\n            \u0026\u0026 event.button == MouseButton::Left\n            \u0026\u0026 event.state.is_pressed();\n    }\n\n    // 捕获属于窗口生命周期；必须读取当前物理光标来区分同帧点击，不能用 PostUpdate 的旧输入摘要。\n    let mut pointer_over_ui = false;\n    let mut using_pointer = false;\n    let mut wants_keyboard = false;\n    let mut popup_open = false;\n    if let Ok(mut context) = egui_contexts.single_mut() {\n        let context = context.get_mut();\n        pointer_over_ui = window.physical_cursor_position().is_some_and(|position| {\n            let position = position / context.pixels_per_point();\n            context\n                .layer_id_at(egui::pos2(position.x, position.y))\n                .is_some_and(|layer| layer.order != egui::Order::Background)\n        });\n        using_pointer = context.egui_is_using_pointer();\n        wants_keyboard = context.egui_wants_keyboard_input();\n        popup_open = context.any_popup_open();\n    }\n    // 拖拽跨出面板或菜单仍打开时，点击不能意外恢复鼠标锁定。\n    let gameplay_clicked = clicked \u0026\u0026 !pointer_over_ui \u0026\u0026 !using_pointer \u0026\u0026 !popup_open;\n\n    let mut any_active = false;\n    for (camera, orbit, mut state) in \u0026mut cameras {\n        let available = characters.contains(orbit.target)\n            \u0026\u0026 controllers\n                .iter()\n                .any(|(_, character, controlled_camera, _)| {\n                    character.0 == orbit.target \u0026\u0026 controlled_camera.0 == camera\n                });\n        if !available \u0026\u0026 (!state.initialized || state.target_available) {\n            warn!(target: \"demo::camera\", ?camera, character = ?orbit.target,\n                before = \"available\", after = \"unavailable\", reason = \"camera_binding_unavailable\",\n                \"Camera target or controller unavailable\");\n        }\n        state.target_available = available;\n        state.focused = window.focused \u0026\u0026 !lost_focus;\n        let before = state.active;\n        let reason = if !running {\n            state.active = false;\n            \"menu_open\"\n        } else if !available {\n            state.active = false;\n            \"camera_binding_unavailable\"\n        } else if lost_focus || !window.focused {\n            state.active = false;\n            \"window_focus_lost\"\n        } else if keys.just_pressed(KeyCode::Escape) {\n            state.active = false;\n            \"escape_pressed\"\n        } else if !state.initialized || gameplay_clicked {\n            state.active = true;\n            if state.initialized {\n                \"window_clicked\"\n            } else {\n                \"initialization\"\n            }\n        } else {\n            \"unchanged\"\n        };\n        state.skip_motion = !state.initialized || before != state.active;\n        if !state.initialized || before != state.active {\n            info!(target: \"demo::camera\", ?camera, character = ?orbit.target,\n                ?window_entity, before = if before { \"captured\" } else { \"released\" },\n                after = if state.active { \"captured\" } else { \"released\" }, reason,\n                \"Mouse look capture changed\");\n        }\n        state.initialized = true;\n        any_active |= state.active;\n    }\n    cursor.visible = !any_active;\n    // Bevy 的窗口后端会在 Locked 不受支持时尝试 Confined，并将失败写入统一日志。\n    cursor.grab_mode = if any_active {\n        CursorGrabMode::Locked\n    } else {\n        CursorGrabMode::None\n    };\n    // 菜单与暂停停用玩法；Esc 的菜单动作由 Enhanced Input 处理，这里的底层判断只负责光标生命周期。\n    // ContextActivity 是不可变组件，按实际变化插入，使 require_reset 保留重新启用前的按键释放边界。\n    let gameplay_active = running\n        \u0026\u0026 window.focused\n        \u0026\u0026 !lost_focus\n        \u0026\u0026 !wants_keyboard\n        \u0026\u0026 !popup_open\n        \u0026\u0026 !using_pointer\n        \u0026\u0026 (any_active || !pointer_over_ui);\n    for (controller, character, controlled_camera, activity) in \u0026controllers {\n        let available = characters.contains(character.0)\n            \u0026\u0026 cameras\n                .get(controlled_camera.0)\n                .is_ok_and(|(_, orbit, _)| orbit.target == character.0);\n        let after = gameplay_active \u0026\u0026 available;\n        if **activity != after {\n            commands\n                .entity(controller)\n                .insert(ContextActivity::\u003cGameplayContext\u003e::new(after));\n            info!(target: \"demo::input\", ?controller, character = ?character.0,\n                before = **activity, after, reason = if after { \"gameplay_input_resumed\" }\n                    else if !window.focused || lost_focus { \"window_focus_lost\" }\n                    else if !available { \"camera_binding_unavailable\" }\n                    else if !running { \"menu_open\" }\n                    else { \"inspector_input\" }, \"Gameplay input context activity changed\");\n        }\n    }\n}\n\n/// Fire 已携带本帧汇总位移，直接更新角度；不缓存增量，也不乘固定步或帧时间。\nfn on_camera_look(\n    event: On\u003cFire\u003cLookAction\u003e\u003e,\n    settings: Res\u003cGameSettings\u003e,\n    time: Res\u003cTime\u003e,\n    mut next_log_at: Local\u003cf64\u003e,\n    controllers: Query\u003c\u0026ControlsCamera, With\u003cGameplayContext\u003e\u003e,\n    mut cameras: Query\u003c(\u0026mut OrbitCamera, \u0026MouseLookState)\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok((mut orbit, state)) = cameras.get_mut(controlled.0) else {\n        return;\n    };\n    if !state.active || state.skip_motion {\n        return;\n    }\n    let before_yaw = orbit.yaw;\n    let before_pitch = orbit.pitch();\n    let delta = event.value * settings.camera.mouse_sensitivity;\n    orbit.yaw = (orbit.yaw - delta.x).rem_euclid(TAU);\n    let vertical = if settings.camera.invert_y {\n        -delta.y\n    } else {\n        delta.y\n    };\n    orbit.apply_vertical_look(vertical);\n    // 连续角度只采样调试日志，捕获和失效状态仍逐次记录。\n    if time.elapsed_secs_f64() \u003e= *next_log_at {\n        debug!(target: \"demo::camera\", camera = ?controlled.0, character = ?orbit.target,\n            controller = ?event.context, yaw_before = before_yaw, yaw_after = orbit.yaw,\n            pitch_before = before_pitch, pitch_after = orbit.pitch(),\n            perspective = orbit.perspective.name(),\n            reason = \"mouse_motion_sample\", \"Camera look angles changed\");\n        *next_log_at = time.elapsed_secs_f64() + 0.5;\n    }\n}\n\n/// 切换请求只来自 Enhanced Input；关联有效且窗口聚焦时接收，不改变鼠标捕获状态。\nfn request_perspective_toggle(\n    event: On\u003cFire\u003cTogglePerspectiveAction\u003e\u003e,\n    controllers: Query\u003c(\u0026ControlsCharacter, \u0026ControlsCamera), With\u003cGameplayContext\u003e\u003e,\n    characters: Query\u003c(), With\u003cCharacter\u003e\u003e,\n    mut cameras: Query\u003c(\u0026mut OrbitCamera, \u0026MouseLookState)\u003e,\n) {\n    let Ok((character, controlled)) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok((mut orbit, state)) = cameras.get_mut(controlled.0) else {\n        warn!(target: \"demo::camera\", controller = ?event.context, camera = ?controlled.0,\n            character = ?character.0, reason = \"camera_binding_unavailable\",\n            \"Camera perspective toggle ignored\");\n        return;\n    };\n    if orbit.target != character.0 || !characters.contains(character.0) {\n        warn!(target: \"demo::camera\", controller = ?event.context, camera = ?controlled.0,\n            character = ?character.0, reason = \"camera_binding_unavailable\",\n            \"Camera perspective toggle ignored\");\n        return;\n    }\n    if state.focused {\n        orbit.toggle_requested_by = Some(event.context);\n    }\n}\n\n/// 在动作应用后的同一 PreUpdate 消费请求；本帧即使没有固定步也会切换一次。\nfn apply_perspective_toggle(mut cameras: Query\u003c(Entity, \u0026mut OrbitCamera)\u003e) {\n    for (camera, mut orbit) in \u0026mut cameras {\n        let Some(controller) = orbit.toggle_requested_by.take() else {\n            continue;\n        };\n        let before = orbit.perspective;\n        let pitch_before = orbit.pitch();\n        orbit.perspective = match before {\n            CameraPerspective::ThirdPerson =\u003e CameraPerspective::FirstPerson,\n            CameraPerspective::FirstPerson =\u003e CameraPerspective::ThirdPerson,\n        };\n        info!(target: \"demo::camera\", ?camera, ?controller, character = ?orbit.target,\n            perspective_before = before.name(), perspective_after = orbit.perspective.name(),\n            yaw = orbit.yaw, pitch_before, pitch_after = orbit.pitch(),\n            reason = \"toggle_perspective_action\", \"Camera perspective changed\");\n    }\n}\n\n/// 在固定模拟前及逐帧持握目标同步前设置水平朝向，站立、横移和后退时也跟随视角。\npub(crate) fn sync_character_facing(\n    controllers: Query\u003c(\u0026ControlsCharacter, \u0026ControlsCamera), With\u003cGameplayContext\u003e\u003e,\n    cameras: Query\u003c\u0026OrbitCamera\u003e,\n    mut characters: Query\u003c\u0026mut Transform, With\u003cCharacter\u003e\u003e,\n) {\n    for (controlled_character, controlled_camera) in \u0026controllers {\n        let Ok(orbit) = cameras.get(controlled_camera.0) else {\n            continue;\n        };\n        if orbit.target != controlled_character.0 {\n            continue;\n        }\n        let Ok(mut transform) = characters.get_mut(controlled_character.0) else {\n            continue;\n        };\n        let rotation = Quat::from_rotation_y(orbit.yaw);\n        if !transform.rotation.abs_diff_eq(rotation, 0.000001) {\n            transform.rotation = rotation;\n        }\n    }\n}\n\n/// 镜头使用本帧插值后的人物位置与环绕角；互斥过滤避免 Transform 查询读写冲突。\nfn follow_orbit_camera(\n    characters: Query\u003c\u0026Transform, With\u003cCharacter\u003e\u003e,\n    mut cameras: Query\u003c(\u0026OrbitCamera, \u0026mut Transform), Without\u003cCharacter\u003e\u003e,\n) {\n    for (orbit, mut transform) in \u0026mut cameras {\n        if let Ok(character) = characters.get(orbit.target) {\n            *transform = orbit.transform(character.translation);\n        }\n    }\n}\n\n/// 只隐藏角色视觉子树，保留业务根与独立木箱；相机或控制者丢失后自动恢复模型。\nfn sync_character_visibility(\n    controllers: Query\u003c(\u0026ControlsCharacter, \u0026ControlsCamera), With\u003cGameplayContext\u003e\u003e,\n    cameras: Query\u003c\u0026OrbitCamera\u003e,\n    characters: Query\u003c(), With\u003cCharacter\u003e\u003e,\n    mut visuals: Query\u003c(Entity, \u0026ChildOf, \u0026mut Visibility), With\u003cCharacterVisual\u003e\u003e,\n) {\n    for (visual, parent, mut visibility) in \u0026mut visuals {\n        let character = parent.parent();\n        let first_person = controllers\n            .iter()\n            .any(|(controlled_character, controlled_camera)| {\n                characters.contains(character)\n                    \u0026\u0026 controlled_character.0 == character\n                    \u0026\u0026 cameras.get(controlled_camera.0).is_ok_and(|orbit| {\n                        orbit.target == character\n                            \u0026\u0026 orbit.perspective == CameraPerspective::FirstPerson\n                    })\n            });\n        let after = if first_person {\n            Visibility::Hidden\n        } else {\n            Visibility::Inherited\n        };\n        if *visibility != after {\n            info!(target: \"demo::camera\", ?visual, ?character, before = ?*visibility, ?after,\n                reason = \"camera_perspective_visibility\", \"Character visual visibility changed\");\n            *visibility = after;\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use avian3d::prelude::{LinearVelocity, Position, RigidBody};\n    use std::time::Duration;\n\n    use bevy::{\n        camera::visibility::VisibilityPlugin,\n        ecs::relationship::RelationshipTarget,\n        input::{\n            ButtonState, InputPlugin,\n            keyboard::{Key, KeyboardInput},\n            mouse::{MouseButtonInput, MouseMotion},\n        },\n        mesh::skinning::SkinnedMeshInverseBindposes,\n        time::TimeUpdateStrategy,\n        transform::TransformPlugin,\n    };\n    use bevy_enhanced_input::prelude::TriggerState;\n\n    use crate::{\n        gameplay::{\n            CarryGrip, CharacterIntent, CharacterMotion, GameplayPlugin, HeldBy, HeldTarget,\n            HoldingItems, Pickable, PlayerId, PrototypeConfig,\n        },\n        input::{PlayerInputPlugin, spawn_keyboard_controller},\n        island_recovery::{IslandRecoveryPlugin, SpawnPoint},\n        physics::{character_body, ground_body, parcel_body},\n    };\n\n    use super::*;\n\n    fn test_app() -\u003e (App, Entity, Entity, Entity, Entity) {\n        // 窗口仅作为 ECS 数据存在，不安装 WinitPlugin 或渲染插件，也不启动完整游戏。\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            InputPlugin,\n            TransformPlugin,\n            // 只注册可见性计算，不安装渲染或窗口后端。\n            VisibilityPlugin,\n            GameplayPlugin,\n            PlayerInputPlugin,\n            CameraControlPlugin,\n            IslandRecoveryPlugin,\n        ))\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO))\n        .init_resource::\u003cAssets\u003cMesh\u003e\u003e()\n        .init_resource::\u003cAssets\u003cSkinnedMeshInverseBindposes\u003e\u003e();\n        app.finish();\n        app.cleanup();\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut().spawn((\n            ground_body(\u0026config),\n            Transform::from_xyz(0.0, config.ground_y, 0.0),\n        ));\n        let window = app\n            .world_mut()\n            .spawn((\n                Window {\n                    focused: true,\n                    ..default()\n                },\n                CursorOptions::default(),\n                PrimaryWindow,\n            ))\n            .id();\n        let character = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent::default(),\n                CharacterMotion { grounded: true },\n                character_body(\u0026config),\n                Transform::default(),\n                Visibility::default(),\n            ))\n            .id();\n        let orbit = OrbitCamera::new(character);\n        let transform = orbit.transform(Vec3::ZERO);\n        let camera = app\n            .world_mut()\n            .spawn((orbit, MouseLookState::default(), transform))\n            .id();\n        let controller = {\n            let mut commands = app.world_mut().commands();\n            let controller = spawn_keyboard_controller(\u0026mut commands, PlayerId(1), character);\n            commands.entity(controller).insert(ControlsCamera(camera));\n            controller\n        };\n        app.world_mut().flush();\n        // 首帧初始化捕获并丢弃增量，第二帧开始接收观察输入。\n        app.update();\n        app.update();\n        // 初始化真实物理接触和插值端点，后续输入后的帧末检查不再补跑模拟。\n        for _ in 0..6 {\n            fixed_step(\u0026mut app);\n        }\n        (app, window, character, camera, controller)\n    }\n\n    fn fixed_step(app: \u0026mut App) {\n        // 经主调度推进一固定步，覆盖 Avian 的 FixedPostUpdate 和插值，不能只执行玩法系统。\n        let strategy = app\n            .world_mut()\n            .remove_resource::\u003cTimeUpdateStrategy\u003e()\n            .unwrap();\n        app.insert_resource(TimeUpdateStrategy::FixedTimesteps(1));\n        app.update();\n        app.insert_resource(strategy);\n    }\n\n    fn spawn_test_item(app: \u0026mut App, position: Vec3) -\u003e Entity {\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut()\n            .spawn((\n                Pickable,\n                parcel_body(\u0026config),\n                Transform::from_translation(position),\n            ))\n            .id()\n    }\n\n    /// 原型默认偏移、纸箱和木箱复用相同的帧末姿态与解除关系回归。\n    fn carry_grip_cases() -\u003e [Option\u003cVec3\u003e; 3] {\n        [\n            None,\n            Some(Vec3::new(0.0, 1.3, -0.48)),\n            Some(Vec3::new(0.0, 1.3, -0.62)),\n        ]\n    }\n\n    fn mouse_motion(app: \u0026mut App, delta: Vec2) {\n        app.world_mut().write_message(MouseMotion { delta });\n    }\n\n    fn mouse_button(app: \u0026mut App, window: Entity, state: ButtonState) {\n        app.world_mut().write_message(MouseButtonInput {\n            button: MouseButton::Left,\n            state,\n            window,\n        });\n    }\n\n    #[test]\n    fn f3_releases_pointer_and_click_recapture_skips_free_cursor_motion() {\n        // 使用实际 F3 绑定验证调试释放；窗口仍只是 ECS 数据，不创建桌面窗口。\n        let (mut app, window, _, camera, _) = test_app();\n        let yaw = app.world().get::\u003cOrbitCamera\u003e(camera).unwrap().yaw;\n        app.world_mut().write_message(KeyboardInput {\n            key_code: KeyCode::F3,\n            logical_key: Key::F3,\n            state: ButtonState::Pressed,\n            text: None,\n            repeat: false,\n            window,\n        });\n        app.update();\n        assert!(!app.world().get::\u003cMouseLookState\u003e(camera).unwrap().active);\n        assert!(app.world().get::\u003cCursorOptions\u003e(window).unwrap().visible);\n        assert_eq!(\n            app.world().get::\u003cCursorOptions\u003e(window).unwrap().grab_mode,\n            CursorGrabMode::None\n        );\n        for _ in 0..3 {\n            mouse_motion(\u0026mut app, Vec2::new(50.0, 20.0));\n            app.update();\n            assert_eq!(app.world().get::\u003cOrbitCamera\u003e(camera).unwrap().yaw, yaw);\n        }\n        app.world_mut().write_message(KeyboardInput {\n            key_code: KeyCode::F3,\n            logical_key: Key::F3,\n            state: ButtonState::Released,\n            text: None,\n            repeat: false,\n            window,\n        });\n        mouse_button(\u0026mut app, window, ButtonState::Pressed);\n        mouse_motion(\u0026mut app, Vec2::new(200.0, 100.0));\n        app.update();\n        assert!(app.world().get::\u003cMouseLookState\u003e(camera).unwrap().active);\n        assert_eq!(app.world().get::\u003cOrbitCamera\u003e(camera).unwrap().yaw, yaw);\n        mouse_button(\u0026mut app, window, ButtonState::Released);\n        mouse_motion(\u0026mut app, Vec2::new(10.0, 0.0));\n        app.update();\n        assert_ne!(app.world().get::\u003cOrbitCamera\u003e(camera).unwrap().yaw, yaw);\n    }\n\n    fn escape(app: \u0026mut App, window: Entity, state: ButtonState) {\n        app.world_mut().write_message(KeyboardInput {\n            key_code: KeyCode::Escape,\n            logical_key: Key::Escape,\n            state,\n            text: None,\n            repeat: false,\n
