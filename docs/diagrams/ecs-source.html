x_fps = settings.max_fps.get(),\n            camera_mouse_sensitivity = settings.camera.mouse_sensitivity,\n            camera_invert_y = settings.camera.invert_y,\n            \"Game settings initialized\"\n        );\n        settings\n    }\n\n    /// 校验并保存完整 JSON；替换成功前不修改原文件，失败时返回原始 I/O 错误。\n    pub fn save(\u0026self, path: \u0026Path) -\u003e io::Result\u003c()\u003e {\n        self.validate()?;\n        let mut contents = serde_json::to_vec_pretty(self)\n            .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))?;\n        contents.push(b'\\n');\n\n        // 临时产物统一写入工作目录根 tmp；跨文件系统的 rename 失败时保留原配置。\n        let staging_directory = Path::new(\"tmp\").join(\"settings-save\");\n        fs::create_dir_all(\u0026staging_directory)?;\n        let staging_path = staging_directory.join(format!(\"{}.json\", uuid::Uuid::new_v4()));\n        let saved = (|| -\u003e io::Result\u003c()\u003e {\n            let mut file = fs::File::create_new(\u0026staging_path)?;\n            file.write_all(\u0026contents)?;\n            file.sync_all()?;\n            // Windows 替换前关闭临时文件句柄；rename 不先删除旧文件，错误时原文件仍完整。\n            drop(file);\n            fs::rename(\u0026staging_path, path)\n        })();\n        if let Err(error) = saved {\n            if let Err(cleanup_error) = fs::remove_file(\u0026staging_path)\n                \u0026\u0026 cleanup_error.kind() != io::ErrorKind::NotFound\n            {\n                warn!(target: \"demo::settings\", operation = \"remove_settings_staging_file\",\n                    path = %staging_path.display(), error = %cleanup_error,\n                    reason = \"settings_staging_cleanup_failed\", \"Failed to remove settings staging file\");\n            }\n            warn!(target: \"demo::settings\", operation = \"save_settings\", path = %path.display(),\n                %error, reason = \"settings_save_failed\", \"Failed to save game settings\");\n            return Err(error);\n        }\n        info!(target: \"demo::settings\", path = %path.display(), max_fps = self.max_fps.get(),\n            camera_mouse_sensitivity = self.camera.mouse_sensitivity,\n            camera_invert_y = self.camera.invert_y, reason = \"settings_saved\",\n            \"Game settings saved\");\n        Ok(())\n    }\n}\n\n/// 注册帧率限制系统；设置资源也可由后续设置界面在运行期间修改。\npub struct SettingsPlugin;\n\nimpl Plugin for SettingsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.init_resource::\u003cGameSettings\u003e()\n            .init_resource::\u003cSettingsFile\u003e()\n            // 等待在时间与业务系统之前完成；固定步仍由引擎时钟驱动，不改写模拟时间步。\n            .add_systems(First, limit_frame_rate.before(TimeSystems));\n    }\n}\n\n/// 等待和日志去重只属于帧率系统，使用 Local 而非共享的游戏状态。\n#[derive(Default)]\nstruct FramePacing {\n    last_started: Option\u003cInstant\u003e,\n    applied_max_fps: Option\u003cNonZeroU32\u003e,\n}\n\nfn read_settings(path: \u0026Path) -\u003e io::Result\u003cGameSettings\u003e {\n    let contents = fs::read_to_string(path)?;\n    serde_json::from_str(\u0026contents)\n        .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))\n}\n\n/// 只补足上一帧起点以来剩余的间隔；计算本身已超时时立即继续，不叠加等待。\nfn limit_frame_rate(settings: Res\u003cGameSettings\u003e, mut pacing: Local\u003cFramePacing\u003e) {\n    if pacing.applied_max_fps != Some(settings.max_fps) {\n        info!(\n            target: \"demo::settings\",\n            max_fps_before = ?pacing.applied_max_fps.map(NonZeroU32::get),\n            max_fps_after = settings.max_fps.get(),\n            reason = if pacing.applied_max_fps.is_some() {\n                \"settings_changed\"\n            } else {\n                \"initialization\"\n            },\n            \"Frame rate limit applied\"\n        );\n        pacing.applied_max_fps = Some(settings.max_fps);\n    }\n\n    if let Some(last_started) = pacing.last_started {\n        let wait = remaining_frame_time(last_started.elapsed(), settings.max_fps);\n        if !wait.is_zero() {\n            std::thread::sleep(wait);\n        }\n    }\n    // 卡顿后从实际起点重新计时，避免为了追赶期限连续提交超出上限的帧。\n    pacing.last_started = Some(Instant::now());\n}\n\nfn remaining_frame_time(elapsed: Duration, max_fps: NonZeroU32) -\u003e Duration {\n    // 向上取整到纳秒，避免舍入使允许的间隔略短于帧率上限要求。\n    let interval = Duration::from_nanos(1_000_000_000_u64.div_ceil(u64::from(max_fps.get())));\n    interval.saturating_sub(elapsed)\n}\n\n#[cfg(test)]\nmod tests {\n    use bevy::time::{TimePlugin, TimeUpdateStrategy};\n    use uuid::Uuid;\n\n    use super::*;\n\n    fn settings_test_path() -\u003e PathBuf {\n        let directory = Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"tmp/settings-tests\");\n        fs::create_dir_all(\u0026directory).unwrap();\n        directory.join(format!(\"{}.json\", Uuid::new_v4()))\n    }\n\n    #[test]\n    fn defaults_and_json_validate_frame_rate_limit() {\n        assert_eq!(GameSettings::default().max_fps.get(), 60);\n        let omitted: GameSettings = serde_json::from_str(\"{}\").unwrap();\n        assert_eq!(omitted.max_fps.get(), 60);\n        for max_fps in [60, 120, 144] {\n            let json = format!(r#\"{{\"max_fps\": {max_fps}}}\"#);\n            let custom: GameSettings = serde_json::from_str(\u0026json).unwrap();\n            assert_eq!(custom.max_fps.get(), max_fps);\n        }\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n            r#\"{\"max_fps\": -60}\"#,\n            r#\"{\"max_fps\": 60.5}\"#,\n            r#\"{\"max_fps\": \"120\"}\"#,\n            r#\"{\"max_fp\": 120}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n        }\n    }\n\n    #[test]\n    fn camera_settings_default_legacy_and_custom_values() {\n        let defaults = GameSettings::default();\n        assert_eq!(defaults.camera.mouse_sensitivity, 0.003);\n        assert!(!defaults.camera.invert_y);\n        for legacy in [\"{}\", r#\"{\"max_fps\": 144}\"#, r#\"{\"camera\": {}}\"#] {\n            let settings: GameSettings = serde_json::from_str(legacy).unwrap();\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n        }\n        let custom: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"mouse_sensitivity\": 0.006, \"invert_y\": true}}\"#)\n                .unwrap();\n        assert_eq!(custom.camera.mouse_sensitivity, 0.006);\n        assert!(custom.camera.invert_y);\n        let partial: GameSettings =\n            serde_json::from_str(r#\"{\"camera\": {\"invert_y\": true}}\"#).unwrap();\n        assert_eq!(partial.camera.mouse_sensitivity, 0.003);\n        assert!(partial.camera.invert_y);\n    }\n\n    #[test]\n    fn invalid_camera_settings_fall_back_without_overwriting_file() {\n        let path = settings_test_path();\n        for invalid in [\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 0}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": -0.003}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": 1e39}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"mouse_sensitivity\": \"NaN\"}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"invert_y\": 1}}\"#,\n            r#\"{\"max_fps\": 240, \"camera\": {\"sensitivity\": 0.003}}\"#,\n        ] {\n            assert!(serde_json::from_str::\u003cGameSettings\u003e(invalid).is_err());\n            fs::write(\u0026path, invalid).unwrap();\n            let settings = GameSettings::load(\u0026path);\n            assert_eq!(settings.max_fps.get(), 60);\n            assert_eq!(settings.camera.mouse_sensitivity, 0.003);\n            assert!(!settings.camera.invert_y);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn settings_file_and_failure_fallback_preserve_original_contents() {\n        let path = settings_test_path();\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n        assert!(!path.exists());\n        fs::write(\u0026path, r#\"{\"max_fps\": 240}\"#).unwrap();\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 240);\n        for invalid in [\n            r#\"{\"max_fps\": 0}\"#,\n            r#\"{\"max_fps\": 1}\"#,\n            r#\"{\"max_fps\": 30}\"#,\n            r#\"{\"max_fps\": 59}\"#,\n        ] {\n            fs::write(\u0026path, invalid).unwrap();\n            assert_eq!(\n                read_settings(\u0026path).unwrap_err().kind(),\n                io::ErrorKind::InvalidData\n            );\n            assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 60);\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), invalid);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn save_creates_and_replaces_complete_settings_json() {\n        let path = settings_test_path();\n        GameSettings::default().save(\u0026path).unwrap();\n        let draft = SettingsDraft {\n            max_fps: 165,\n            mouse_sensitivity: 0.0065,\n            invert_y: true,\n        };\n        draft.to_settings().unwrap().save(\u0026path).unwrap();\n\n        let loaded = GameSettings::load(\u0026path);\n        assert_eq!(loaded.max_fps.get(), 165);\n        assert_eq!(loaded.camera.mouse_sensitivity, 0.0065);\n        assert!(loaded.camera.invert_y);\n        assert!(fs::read_to_string(\u0026path).unwrap().ends_with('\\n'));\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn invalid_settings_cannot_replace_existing_file() {\n        let path = settings_test_path();\n        let original = r#\"{\"max_fps\": 90}\"#;\n        fs::write(\u0026path, original).unwrap();\n        let defaults = SettingsDraft::default();\n        for invalid_fps in [0, 1, 59] {\n            let invalid = SettingsDraft {\n                max_fps: invalid_fps,\n                ..defaults.clone()\n            };\n            assert_eq!(\n                invalid.to_settings().unwrap_err().kind(),\n                io::ErrorKind::InvalidInput\n            );\n        }\n        let mut settings = GameSettings::default();\n        settings.max_fps = NonZeroU32::new(59).unwrap();\n        assert!(settings.save(\u0026path).is_err());\n        assert_eq!(fs::read_to_string(\u0026path).unwrap(), original);\n        settings.max_fps = NonZeroU32::new(60).unwrap();\n        for invalid_sensitivity in [0.0, -0.003, f32::NAN, f32::INFINITY, f32::NEG_INFINITY] {\n            let invalid = SettingsDraft {\n                mouse_sensitivity: invalid_sensitivity,\n                ..defaults.clone()\n            };\n            assert_eq!(\n                invalid.to_settings().unwrap_err().kind(),\n                io::ErrorKind::InvalidInput\n            );\n            settings.camera.mouse_sensitivity = invalid_sensitivity;\n            assert!(settings.save(\u0026path).is_err());\n            assert_eq!(fs::read_to_string(\u0026path).unwrap(), original);\n        }\n        fs::remove_file(path).unwrap();\n    }\n\n    #[cfg(windows)]\n    #[test]\n    fn failed_file_replacement_preserves_original_settings() {\n        use std::os::windows::fs::OpenOptionsExt;\n\n        let path = settings_test_path();\n        let original = r#\"{\"max_fps\": 144}\"#;\n        fs::write(\u0026path, original).unwrap();\n        // Windows 的独占句柄阻止替换，检验失败时不会先删除或截断原配置。\n        let locked = fs::OpenOptions::new()\n            .read(true)\n            .share_mode(0)\n            .open(\u0026path)\n            .unwrap();\n        let draft = SettingsDraft {\n            max_fps: 240,\n            ..default()\n        };\n        assert!(draft.to_settings().unwrap().save(\u0026path).is_err());\n        assert_eq!(draft.max_fps, 240);\n        drop(locked);\n        assert_eq!(fs::read_to_string(\u0026path).unwrap(), original);\n        fs::remove_file(path).unwrap();\n    }\n\n    #[test]\n    fn draft_preserves_custom_values_until_their_field_is_adjusted() {\n        use crate::ui::SettingKey;\n\n        let custom: GameSettings =\n            serde_json::from_str(r#\"{\"max_fps\": 75, \"camera\": {\"mouse_sensitivity\": 0.03}}\"#)\n                .unwrap();\n        let mut draft = SettingsDraft::from_settings(\u0026custom);\n        let converted = draft.to_settings().unwrap();\n        assert_eq!(converted.max_fps.get(), 75);\n        assert_eq!(converted.camera.mouse_sensitivity, 0.03);\n        draft.adjust(SettingKey::InvertY, 0);\n        assert!(draft.invert_y);\n        assert_eq!(draft.max_fps, 75);\n        assert_eq!(draft.mouse_sensitivity, 0.03);\n        draft.adjust(SettingKey::FrameRate, 0);\n        draft.adjust(SettingKey::MouseSensitivity, 0);\n        assert_eq!(draft.max_fps, 75);\n        assert_eq!(draft.mouse_sensitivity, 0.03);\n\n        draft.adjust(SettingKey::FrameRate, 1);\n        assert_eq!(draft.max_fps, 90);\n        draft.adjust(SettingKey::FrameRate, -1);\n        assert_eq!(draft.max_fps, 60);\n        draft.adjust(SettingKey::MouseSensitivity, -1);\n        assert_eq!(draft.mouse_sensitivity, 0.02);\n        draft.adjust(SettingKey::InvertY, -1);\n        assert!(!draft.invert_y);\n    }\n\n    #[test]\n    fn draft_adjustments_remain_within_menu_limits() {\n        use crate::ui::SettingKey;\n\n        let mut draft = SettingsDraft::default();\n        for fps in [90, 120, 144, 165, 240, 240] {\n            draft.adjust(SettingKey::FrameRate, 1);\n            assert_eq!(draft.max_fps, fps);\n        }\n        for fps in [165, 144, 120, 90, 60, 60] {\n            draft.adjust(SettingKey::FrameRate, -1);\n            assert_eq!(draft.max_fps, fps);\n        }\n        draft.adjust(SettingKey::MouseSensitivity, 1);\n        assert!((draft.mouse_sensitivity - 0.0035).abs() \u003c 0.000001);\n        for _ in 0..100 {\n            draft.adjust(SettingKey::MouseSensitivity, 1);\n        }\n        assert_eq!(draft.mouse_sensitivity, 0.02);\n        for _ in 0..100 {\n            draft.adjust(SettingKey::MouseSensitivity, -1);\n        }\n        assert_eq!(draft.mouse_sensitivity, 0.0005);\n        assert!(draft.to_settings().is_ok());\n    }\n\n    #[test]\n    fn pacing_waits_only_for_remaining_time_and_never_catches_up() {\n        let limit = NonZeroU32::new(120).unwrap();\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), limit),\n            Duration::from_nanos(5_333_334)\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(20), limit),\n            Duration::ZERO\n        );\n        assert_eq!(\n            remaining_frame_time(Duration::from_millis(3), NonZeroU32::new(60).unwrap()),\n            Duration::from_nanos(13_666_667)\n        );\n    }\n\n    #[test]\n    fn changing_render_limit_preserves_fixed_simulation_timestep() {\n        // 只运行最小 App；手动推进时间，不加载窗口、渲染器或完整游戏。\n        let mut app = App::new();\n        app.add_plugins(TimePlugin)\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_millis(\n                20,\n            )))\n            .add_plugins(SettingsPlugin);\n        app.update();\n        let timestep = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().timestep();\n        app.world_mut().resource_mut::\u003cGameSettings\u003e().max_fps = NonZeroU32::new(120).unwrap();\n        app.update();\n        let fixed = app.world().resource::\u003cTime\u003cFixed\u003e\u003e();\n        assert_eq!(fixed.timestep(), timestep);\n        assert!((1.0 / fixed.timestep().as_secs_f64() - 60.0).abs() \u003c 0.001);\n        assert!(fixed.elapsed() \u003e= timestep);\n    }\n}\n"},{"path":"src/startup_log.rs","text":"//! 汇总启动时的配置与环境日志，沿用统一会话日志设施。\n\nuse bevy::prelude::*;\n\nuse crate::gameplay::PrototypeConfig;\n\n/// 注册一次性的启动日志；玩法配置与固定时间步由应用组装时提供。\npub struct StartupLogPlugin;\n\nimpl Plugin for StartupLogPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        // 四条日志只报告配置，不依赖场景实体，也不建立彼此的执行顺序。\n        app.add_systems(\n            Startup,\n            (\n                log_configuration,\n                log_simulation_timestep,\n                log_pose_synchronization,\n                log_world_inspector,\n            ),\n        );\n    }\n}\n\n/// 记录实际玩法配置；显式保留迁移前的日志分类，兼容现有过滤设置。\nfn log_configuration(config: Res\u003cPrototypeConfig\u003e) {\n    // 刚体与持握方式属于本次玩法配置，合并到原有记录便于沿用日志筛选。\n    info!(target: \"demo::gameplay\", ?config,\n        physics_engine = \"avian3d\", physics_version = \"0.7.0\",\n        character_body = \"dynamic\", parcel_body = \"dynamic\",\n        grip_mode = \"spring_damper\", release_mode = \"preserve_velocity\",\n        \"Prototype gameplay initialized\");\n}\n\n/// 记录模拟频率，直接读取应用配置的固定时间步。\nfn log_simulation_timestep(time: Res\u003cTime\u003cFixed\u003e\u003e) {\n    info!(\n        target: \"demo::settings\",\n        simulation_hz = 1.0 / time.timestep().as_secs_f64(),\n        \"Fixed simulation timestep initialized\"\n    );\n}\n\n/// 将模拟和逐帧姿态同步的调度约定写入统一会话日志，便于排查帧率相关问题。\nfn log_pose_synchronization() {\n    info!(target: \"demo::camera\", simulation_schedule = \"FixedUpdate\",\n        grip_force_schedule = \"FixedUpdate\", physics_schedule = \"FixedPostUpdate\",\n        presentation_schedule = \"RunFixedMainLoop\",\n        presentation_order = \"interpolation_character_facing_hold_target_camera_visibility\", reason = \"initialization\",\n        \"Camera pose synchronization configured\");\n}\n\n/// 检查器的启用信息沿用统一会话日志，方便核对本次调试环境。\nfn log_world_inspector() {\n    info!(target: \"demo::inspector\", plugin = \"WorldInspectorPlugin\", reason = \"initialization\",\n        \"World inspector enabled\");\n}\n\n#[cfg(test)]\nmod tests {\n    use std::{fs, sync::Arc};\n\n    use bevy::{\n        ecs::schedule::SingleThreadedExecutor,\n        log::{tracing, tracing_subscriber},\n    };\n    use uuid::Uuid;\n\n    use super::*;\n\n    #[test]\n    fn startup_logs_preserve_targets_and_config_and_run_once() {\n        let directory =\n            std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"tmp/startup-log-tests\");\n        fs::create_dir_all(\u0026directory).unwrap();\n        let path = directory.join(format!(\"{}.log\", Uuid::new_v4()));\n        let subscriber = tracing_subscriber::fmt()\n            .without_time()\n            .with_ansi(false)\n            .with_writer(Arc::new(fs::File::create_new(\u0026path).unwrap()))\n            .finish();\n\n        // 使用局部日志设施和最小 App；单线程启动调度确保日志捕获不跨线程。\n        tracing::subscriber::with_default(subscriber, || {\n            let mut app = App::new();\n            app.insert_resource(PrototypeConfig {\n                move_speed: 9.0,\n                acceleration: 36.0,\n                character_mass: 75.0,\n                parcel_mass: 3.0,\n                hold_frequency: 5.0,\n                hold_damping_ratio: 0.8,\n                hold_max_force: 240.0,\n                ..default()\n            })\n            .insert_resource(Time::\u003cFixed\u003e::from_seconds(0.25))\n            .add_plugins(StartupLogPlugin)\n            .edit_schedule(Startup, |schedule| {\n                schedule.set_executor(SingleThreadedExecutor::new());\n            });\n            app.update();\n            app.update();\n        });\n\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        fs::remove_file(path).unwrap();\n        for (target, message, fields) in [\n            (\n                \"demo::gameplay\",\n                \"Prototype gameplay initialized\",\n                vec![\n                    \"move_speed: 9.0\",\n                    \"acceleration: 36.0\",\n                    \"character_mass: 75.0\",\n                    \"parcel_mass: 3.0\",\n                    \"hold_frequency: 5.0\",\n                    \"hold_damping_ratio: 0.8\",\n                    \"hold_max_force: 240.0\",\n                    \"physics_engine=\\\"avian3d\\\"\",\n                    \"physics_version=\\\"0.7.0\\\"\",\n                    \"character_body=\\\"dynamic\\\"\",\n                    \"parcel_body=\\\"dynamic\\\"\",\n                    \"grip_mode=\\\"spring_damper\\\"\",\n                    \"release_mode=\\\"preserve_velocity\\\"\",\n                ],\n            ),\n            (\n                \"demo::settings\",\n                \"Fixed simulation timestep initialized\",\n                vec![\"simulation_hz=4\"],\n            ),\n            (\n                \"demo::camera\",\n                \"Camera pose synchronization configured\",\n                vec![\n                    \"simulation_schedule=\\\"FixedUpdate\\\"\",\n                    \"grip_force_schedule=\\\"FixedUpdate\\\"\",\n                    \"physics_schedule=\\\"FixedPostUpdate\\\"\",\n                    \"presentation_schedule=\\\"RunFixedMainLoop\\\"\",\n                    \"presentation_order=\\\"interpolation_character_facing_hold_target_camera_visibility\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n            (\n                \"demo::inspector\",\n                \"World inspector enabled\",\n                vec![\n                    \"plugin=\\\"WorldInspectorPlugin\\\"\",\n                    \"reason=\\\"initialization\\\"\",\n                ],\n            ),\n        ] {\n            let records: Vec\u003c_\u003e = contents\n                .lines()\n                .filter(|line| line.contains(message))\n                .collect();\n            assert_eq!(records.len(), 1, \"Unexpected startup log count: {contents}\");\n            let record = records[0];\n            assert!(\n                record.contains(\"INFO\") \u0026\u0026 record.contains(target),\n                \"{record}\"\n            );\n            for field in fields {\n                assert!(record.contains(field), \"Missing {field}: {record}\");\n            }\n        }\n    }\n}\n"},{"path":"src/ui/backdrop.rs","text":"//! 主菜单的独立海岛展示舞台；只复用美术模型，不创建玩法角色或物理实体。\n\nuse bevy::{\n    asset::{HandleTemplate, UntypedAssetLoadFailedEvent},\n    core_pipeline::tonemapping::Tonemapping,\n    prelude::*,\n    world_serialization::WorldInstanceReady,\n};\nuse bevy_inspector_egui::bevy_egui::PrimaryEguiContext;\n\nuse crate::app_flow::AppState;\n\nconst COURIER_PATH: \u0026str = \"models/characters/chr_courier.glb\";\nconst COURIER_POSITION: Vec3 = Vec3::new(3.2, 0.02, 2.6);\nconst STATION_POSITION: Vec3 = Vec3::new(4.5, 0.02, -4.5);\n\n/// 标记整个展示舞台的根，状态退出时连同相机、灯光和模型一起清理。\n#[derive(Component, Default, Clone)]\nstruct MenuBackdrop;\n\n/// 在角色 GLB 展开完成后，把展示动作接到其内部 AnimationPlayer。\n#[derive(Component, FromTemplate)]\nstruct CourierAnimation {\n    // 资产句柄使用 Bevy 的专用模板，不依赖要求 Unpin 的默认克隆模板。\n    #[template(HandleTemplate\u003cAnimationGraph\u003e)]\n    graph: Handle\u003cAnimationGraph\u003e,\n    node: AnimationNodeIndex,\n}\n\n/// 注册主菜单展示舞台与资产失败日志，暂停菜单继续使用玩法相机。\npub(super) fn register(app: \u0026mut App) {\n    app.add_systems(OnEnter(AppState::MainMenu), spawn_backdrop)\n        .add_systems(Update, log_asset_failures);\n}\n\nfn spawn_backdrop(\n    mut commands: Commands,\n    asset_server: Res\u003cAssetServer\u003e,\n    mut graphs: ResMut\u003cAssets\u003cAnimationGraph\u003e\u003e,\n) {\n    // 已检查原始 GLB：索引 0 是 Carry_Idle。组合地图没有动画，因此使用独立角色。\n    let (graph, node) = AnimationGraph::from_clip(\n        asset_server.load(GltfAssetLabel::Animation(0).from_asset(COURIER_PATH)),\n    );\n    let graph = graphs.add(graph);\n\n    let backdrop = commands\n        .spawn_scene(bsn! {\n            #MenuBackdrop\n            MenuBackdrop\n            template_value(DespawnOnExit(AppState::MainMenu))\n            Transform\n            Visibility\n            Children [\n                menu_camera(),\n                (\n                    #MenuDaylight\n                    DirectionalLight {\n                        illuminance: 12_000.0,\n                        shadow_maps_enabled: true,\n                    }\n                    template_value(Transform::from_xyz(-8.0, 14.0, 9.0)\n                        .looking_at(Vec3::ZERO, Vec3::Y))\n                ),\n                // 地形与海水保持原来的相对位置，把北岸移到据点后方形成真实海岸线。\n                model(\"MenuIsland\", \"models/environment/env_island_terrain.glb#Scene0\",\n                    Vec3::new(-8.0, 0.0, 31.0), 0.0),\n                model(\"MenuOcean\", \"models/environment/env_ocean.glb#Scene0\",\n                    Vec3::new(-8.0, 0.0, 31.0), 0.0),\n                model(\"MenuCourierStation\", \"models/buildings/bld_courier_station.glb#Scene0\",\n                    STATION_POSITION, -0.12),\n                (\n                    #MenuCourier\n                    WorldAssetRoot(\"models/characters/chr_courier.glb#Scene0\")\n                    CourierAnimation { graph: {HandleTemplate::Handle(graph)}, node }\n                    Transform {\n                        translation: COURIER_POSITION,\n                        rotation: {Quat::from_rotation_y(2.85)},\n                    }\n                    on(play_courier_animation)\n                    // 包裹是独立资产；动作没有根运动，附件保持角色本地的持握位置。\n                    Children [model(\"MenuCarriedParcel\",\n                        \"models/props/prop_parcel_standard.glb#Scene0\",\n                        Vec3::new(0.0, 1.3, -0.48), 0.0)]\n                ),\n                model(\"MenuPalmBehindStation\", \"models/environment/prop_palm_leaning.glb#Scene0\",\n                    Vec3::new(9.5, 0.02, -7.0), -0.5),\n                model(\"MenuPalmAtShore\", \"models/environment/prop_palm_crooked.glb#Scene0\",\n                    Vec3::new(1.0, 0.02, -9.0), 0.8),\n                model(\"MenuYoungPalm\", \"models/environment/prop_palm_young.glb#Scene0\",\n                    Vec3::new(11.0, 0.02, -2.0), -0.3),\n                model(\"MenuGrass\", \"models/environment/prop_wild_grass_patch.glb#Scene0\",\n                    Vec3::new(7.5, 0.02, -1.0), 0.4),\n                model(\"MenuParcelOnSand\", \"models/props/prop_parcel_fragile.glb#Scene0\",\n                    Vec3::new(5.0, 0.32, 1.5), -0.2),\n                model(\"MenuCrate\", \"models/props/prop_crate.glb#Scene0\",\n                    Vec3::new(6.0, 0.37, 1.0), 0.15),\n            ]\n        })\n        .id();\n\n    info!(target: \"demo::ui::backdrop\", ?backdrop, state = \"main_menu\",\n        character_asset = COURIER_PATH, reason = \"state_enter\",\n        \"Menu backdrop spawned\");\n}\n\n/// 镜头与环境光只属于菜单；左半边留给菜单，角色和物流站在右侧。\nfn menu_camera() -\u003e impl Scene {\n    bsn! {\n        #MenuCamera\n        Camera3d\n        Camera {\n            clear_color: {ClearColorConfig::Custom(Color::srgb(0.50, 0.68, 0.79))},\n        }\n        IsDefaultUiCamera\n        PrimaryEguiContext\n        AmbientLight {\n            color: {Color::srgb(1.0, 0.95, 0.84)},\n            brightness: 450.0,\n        }\n        template_value(Projection::Perspective(PerspectiveProjection {\n            fov: 46.0_f32.to_radians(),\n            ..default()\n        }))\n        template_value(Tonemapping::AcesFitted)\n        template_value(camera_transform())\n    }\n}\n\nfn camera_transform() -\u003e Transform {\n    Transform::from_xyz(-2.0, 4.2, 10.0).looking_at(Vec3::new(0.0, 1.5, -4.0), Vec3::Y)\n}\n\n/// 可复用的 BSN 模型声明；Bevy 0.19 的 WorldAssetRoot 即原 SceneRoot。\nfn model(name: \u0026'static str, path: \u0026'static str, position: Vec3, yaw: f32) -\u003e impl Scene {\n    bsn! {\n        Name(name)\n        WorldAssetRoot(path)\n        Transform {\n            translation: position,\n            rotation: {Quat::from_rotation_y(yaw)},\n        }\n    }\n}\n\nfn play_courier_animation(\n    ready: On\u003cWorldInstanceReady\u003e,\n    mut commands: Commands,\n    animations: Query\u003c\u0026CourierAnimation\u003e,\n    children: Query\u003c\u0026Children\u003e,\n    mut players: Query\u003c\u0026mut AnimationPlayer\u003e,\n) {\n    let Ok(animation) = animations.get(ready.entity) else {\n        return;\n    };\n    let mut player_count = 0;\n    // GLB 的 AnimationPlayer 在骨架子实体上，不能把动画组件加到展示根上代替。\n    for descendant in children.iter_descendants(ready.entity) {\n        if let Ok(mut player) = players.get_mut(descendant) {\n            player.play(animation.node).repeat();\n            commands\n                .entity(descendant)\n                .insert(AnimationGraphHandle(animation.graph.clone()));\n            player_count += 1;\n        }\n    }\n\n    if player_count == 0 {\n        warn!(target: \"demo::ui::backdrop\", entity = ?ready.entity,\n            path = COURIER_PATH, reason = \"animation_player_missing\",\n            \"Menu courier animation could not start\");\n    } else {\n        info!(target: \"demo::ui::backdrop\", entity = ?ready.entity,\n            animation = \"Carry_Idle\", player_count, reason = \"world_instance_ready\",\n            \"Menu courier animation started\");\n    }\n}\n\nfn log_asset_failures(mut failures: MessageReader\u003cUntypedAssetLoadFailedEvent\u003e) {\n    for failure in failures.read() {\n        let path = failure.path.path().to_string_lossy();\n        if path.starts_with(\"models/\") || path.starts_with(\"ui/\") {\n            error!(target: \"demo::ui::backdrop\", path = %failure.path,\n                error = %failure.error, reason = \"asset_load_failed\",\n                \"Menu asset failed to load\");\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use bevy::{asset::AssetPlugin, scene::ScenePlugin, state::app::StatesPlugin};\n\n    use super::*;\n\n    /// 用真实 BSN 相机声明验证状态清理，最小 App 不安装窗口后端或渲染器。\n    #[test]\n    fn leaving_main_menu_removes_backdrop_camera_and_preserves_other_camera() {\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            AssetPlugin::default(),\n            ScenePlugin,\n            StatesPlugin,\n        ))\n        .init_state::\u003cAppState\u003e();\n        app.update();\n        let other_camera = app.world_mut().spawn(Camera3d::default()).id();\n        let root = app\n            .world_mut()\n            .spawn_scene(bsn! {\n                MenuBackdrop\n                template_value(DespawnOnExit(AppState::MainMenu))\n                Transform\n                Children [menu_camera()]\n            })\n            .unwrap()\n            .id();\n        let menu_camera = app.world().get::\u003cChildren\u003e(root).unwrap()[0];\n        assert!(app.world().get::\u003cIsDefaultUiCamera\u003e(menu_camera).is_some());\n        assert!(app.world().get::\u003cPrimaryEguiContext\u003e(menu_camera).is_some());\n\n        app.world_mut()\n            .resource_mut::\u003cNextState\u003cAppState\u003e\u003e()\n            .set(AppState::InGame);\n        app.update();\n\n        assert!(app.world().get_entity(root).is_err());\n        assert!(app.world().get_entity(menu_camera).is_err());\n        assert!(app.world().get::\u003cCamera3d\u003e(other_camera).is_some());\n    }\n\n    /// 无窗口检查实际资产约定，防止 GLB 再导出后动作索引与菜单声明不一致。\n    #[test]\n    fn courier_asset_contains_carry_clip_and_independent_parcel() {\n        let root = std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"assets\");\n        let bytes = std::fs::read(root.join(COURIER_PATH)).unwrap();\n        assert_eq!(\u0026bytes[..4], b\"glTF\");\n        let json_len = u32::from_le_bytes(bytes[12..16].try_into().unwrap()) as usize;\n        let gltf: serde_json::Value = serde_json::from_slice(\u0026bytes[20..20 + json_len]).unwrap();\n        assert_eq!(gltf[\"animations\"][0][\"name\"], \"Carry_Idle\");\n        assert_eq!(gltf[\"scenes\"].as_array().unwrap().len(), 1);\n        assert!(\n            gltf[\"skins\"]\n                .as_array()\n                .is_some_and(|skins| !skins.is_empty())\n        );\n        assert!(root.join(\"models/props/prop_parcel_standard.glb\").is_file());\n    }\n\n    /// 投影检查只验证固定构图的数学边界，真实光照、遮挡与材质仍由用户验收。\n    #[test]\n    fn camera_frames_courier_and_station_on_right_at_wide_and_narrow_aspects() {\n        let view = camera_transform().to_matrix().inverse();\n        for aspect in [16.0 / 9.0, 4.0 / 3.0] {\n            let projection = Mat4::perspective_rh(46.0_f32.to_radians(), aspect, 0.1, 1000.0);\n            for point in [\n                COURIER_POSITION,\n                COURIER_POSITION + Vec3::Y * 1.91,\n                STATION_POSITION + Vec3::Y * 2.0,\n            ] {\n                let clip = projection * view * point.extend(1.0);\n                let ndc = clip.truncate() / clip.w;\n                assert!(ndc.x \u003e 0.0 \u0026\u0026 ndc.x \u003c 1.0, \"point={point:?}, ndc={ndc:?}\");\n                assert!(ndc.y.abs() \u003c 1.0, \"point={point:?}, ndc={ndc:?}\");\n            }\n        }\n    }\n}\n"},{"path":"src/ui/mod.rs","text":"//! 英文游戏菜单：BSN 声明页面，动作消息连接导航、设置与游戏生命周期。\n\nmod backdrop;\nmod navigation;\nmod screens;\nmod theme;\nmod widgets;\n\nuse bevy::prelude::*;\n\nuse crate::{\n    audio_events::SoundRequest,\n    settings::{SettingsDraft, SettingsFile},\n};\n\n/// 当前菜单页面；设置和帮助不改变游戏会话的生命周期。\n#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]\npub enum MenuPage {\n    #[default]\n    Main,\n    Hidden,\n    Settings,\n    Help,\n    Pause,\n}\n\n/// 设置分类只展示已接通的能力。\n#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]\npub enum SettingsTab {\n    #[default]\n    Graphics,\n    Audio,\n    Controls,\n    Accessibility,\n}\n\n/// 页面数据与返回来源；焦点单独保存，避免导航时重建整个页面。\n#[derive(Resource, Debug, Default)]\npub struct MenuState {\n    pub page: MenuPage,\n    pub tab: SettingsTab,\n    pub return_page: MenuPage,\n    pub status: Option\u003cString\u003e,\n}\n\n/// 当前可操作按钮的序号，由键盘导航和鼠标悬停共同维护。\n#[derive(Resource, Default)]\npub struct MenuFocus(pub usize);\n\n/// 输入来源单独决定焦点是否可见；鼠标离开后仍保留序号供后续导航使用。\n#[derive(Resource, Clone, Copy, Debug, Default, PartialEq, Eq)]\npub(super) enum MenuInputSource {\n    #[default]\n    Pointer,\n    Navigation,\n}\n\n/// 设置草稿中的可修改字段。\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum SettingKey {\n    FrameRate,\n    MouseSensitivity,\n    InvertY,\n}\n\n/// 鼠标与 Enhanced Input 共用的菜单语义，避免两条路径分别执行业务。\n#[derive(Clone, Copy, Debug, Default, PartialEq, Eq)]\npub enum UiAction {\n    StartGame,\n    OpenSettings,\n    OpenHelp,\n    Quit,\n    Resume,\n    ReturnToMenu,\n    #[default]\n    Back,\n    ApplySettings,\n    RestoreDefaults,\n    SelectTab(SettingsTab),\n    Adjust(SettingKey, i8),\n}\n\n/// 菜单实体保存动作与导航序号，系统不依赖显示文字或实体名称。\n#[derive(Component, Clone, Default)]\npub struct MenuButton {\n    pub action: UiAction,\n    pub index: usize,\n}\n\n/// 页面根实体；页面更换时连同视觉子树一起销毁。\n#[derive(Component, Clone, Default)]\npub struct MenuRoot;\n\n/// 输入系统只产生请求，集中处理系统修改状态或保存设置。\n#[derive(Message)]\npub struct UiRequest(pub UiAction);\n\n/// 请求在 PreUpdate 消费后，Update 依次生成 BSN 页面并更新视觉焦点。\n#[derive(SystemSet, Clone, Copy, Debug, PartialEq, Eq, Hash)]\npub enum UiSystems {\n    Build,\n    Style,\n}\n\n/// 组装菜单功能，不安装窗口或重复初始化会话日志。\npub struct GameUiPlugin;\n\nimpl Plugin for GameUiPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.init_resource::\u003cMenuState\u003e()\n            .init_resource::\u003cMenuFocus\u003e()\n            .init_resource::\u003cMenuInputSource\u003e()\n            .init_resource::\u003cSettingsDraft\u003e()\n            .init_resource::\u003cSettingsFile\u003e()\n            .add_message::\u003cUiRequest\u003e()\n            .add_message::\u003cSoundRequest\u003e()\n            .configure_sets(Update, (UiSystems::Build, UiSystems::Style).chain());\n        navigation::register(app);\n        screens::register(app);\n        backdrop::register(app);\n    }\n}\n"},{"path":"src/ui/navigation.rs","text":"//! 键盘与手柄使用 Enhanced Input，鼠标使用 Bevy UI 交互，统一产生菜单请求。\n\nuse bevy::{input::InputSystems, prelude::*, window::PrimaryWindow};\nuse bevy_enhanced_input::prelude::{Press, *};\n\nuse crate::{\n    app_flow::{AppState, PlayState},\n    audio_events::{SoundCue, SoundRequest},\n    settings::{GameSettings, SettingsDraft, SettingsFile},\n};\n\nuse super::*;\n\n#[derive(Component)]\nstruct MenuContext;\n\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct PreviousAction;\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct NextAction;\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct LeftAction;\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct RightAction;\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct ConfirmAction;\n#[derive(InputAction)]\n#[action_output(bool)]\nstruct BackAction;\n\npub(super) fn register(app: \u0026mut App) {\n    app.add_input_context::\u003cMenuContext\u003e()\n        .add_observer(previous)\n        .add_observer(next)\n        .add_observer(left)\n        .add_observer(right)\n        .add_observer(confirm)\n        .add_observer(back)\n        .add_systems(Startup, spawn_menu_controller)\n        .add_systems(\n            PreUpdate,\n            sync_context\n                .after(InputSystems)\n                .before(EnhancedInputSystems::Prepare),\n        )\n        // PreUpdate 的动作请求必须在 StateTransition 与固定循环之前处理，暂停当帧即生效。\n        .add_systems(\n            PreUpdate,\n            handle_requests.after(EnhancedInputSystems::Apply),\n        )\n        // 页面切换先销毁旧按钮并应用延迟命令，再读取点击，避免旧页面补发返回请求。\n        .add_systems(\n            Update,\n            pointer_interaction\n                .after(UiSystems::Build)\n                .before(UiSystems::Style),\n        );\n}\n\n/// 菜单上下文覆盖所有页面，Esc 在游戏运行时表达暂停，而不另读底层按键。\nfn spawn_menu_controller(mut commands: Commands) {\n    let settings = || ActionSettings {\n        require_reset: true,\n        consume_input: true,\n        ..default()\n    };\n    commands.spawn((\n        Name::new(\"Menu input controller\"),\n        MenuContext,\n        ContextPriority::\u003cMenuContext\u003e::new(10),\n        GamepadDevice::Any,\n        actions!(MenuContext[\n            (Action::\u003cPreviousAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::ArrowUp, GamepadButton::DPadUp]),\n            (Action::\u003cNextAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::ArrowDown, GamepadButton::DPadDown]),\n            (Action::\u003cLeftAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::ArrowLeft, GamepadButton::DPadLeft]),\n            (Action::\u003cRightAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::ArrowRight, GamepadButton::DPadRight]),\n            (Action::\u003cConfirmAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::Enter, GamepadButton::South]),\n            (Action::\u003cBackAction\u003e::new(), settings(), Press::default(), bindings![KeyCode::Escape, GamepadButton::East, GamepadButton::Start]),\n        ]),\n    ));\n}\n\nfn sync_context(\n    mut commands: Commands,\n    windows: Query\u003c\u0026Window, With\u003cPrimaryWindow\u003e\u003e,\n    contexts: Query\u003c(Entity, \u0026ContextActivity\u003cMenuContext\u003e)\u003e,\n) {\n    let focused = windows.single().is_ok_and(|window| window.focused);\n    for (entity, activity) in \u0026contexts {\n        if **activity != focused {\n            commands\n                .entity(entity)\n                .insert(ContextActivity::\u003cMenuContext\u003e::new(focused));\n        }\n    }\n}\n\nfn step_focus(\n    menu: \u0026MenuState,\n    focus: \u0026mut MenuFocus,\n    source: \u0026mut MenuInputSource,\n    buttons: \u0026Query\u003c(Entity, \u0026MenuButton)\u003e,\n    direction: i32,\n) -\u003e Option\u003cEntity\u003e {\n    if menu.page == MenuPage::Hidden {\n        return None;\n    }\n    let count = buttons\n        .iter()\n        .map(|(_, button)| button.index + 1)\n        .max()\n        .unwrap_or(0);\n    if count \u003e 0 {\n        *source = MenuInputSource::Navigation;\n        let before = focus.0;\n        focus.0 = (focus.0 as i32 + direction).rem_euclid(count as i32) as usize;\n        if focus.0 != before {\n            return buttons\n                .iter()\n                .find_map(|(entity, button)| (button.index == focus.0).then_some(entity));\n        }\n    }\n    None\n}\n\nfn previous(\n    _event: On\u003cFire\u003cPreviousAction\u003e\u003e,\n    menu: Res\u003cMenuState\u003e,\n    mut focus: ResMut\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    buttons: Query\u003c(Entity, \u0026MenuButton)\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n) {\n    if let Some(entity) = step_focus(\u0026menu, \u0026mut focus, \u0026mut source, \u0026buttons, -1) {\n        sounds.write(SoundRequest::new(SoundCue::MenuHover, entity));\n    }\n}\n\nfn next(\n    _event: On\u003cFire\u003cNextAction\u003e\u003e,\n    menu: Res\u003cMenuState\u003e,\n    mut focus: ResMut\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    buttons: Query\u003c(Entity, \u0026MenuButton)\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n) {\n    if let Some(entity) = step_focus(\u0026menu, \u0026mut focus, \u0026mut source, \u0026buttons, 1) {\n        sounds.write(SoundRequest::new(SoundCue::MenuHover, entity));\n    }\n}\n\nfn adjust_focused(\n    menu: \u0026MenuState,\n    focus: \u0026MenuFocus,\n    buttons: \u0026Query\u003c\u0026MenuButton\u003e,\n    requests: \u0026mut MessageWriter\u003cUiRequest\u003e,\n    direction: i8,\n) {\n    if menu.page != MenuPage::Settings {\n        return;\n    }\n    if let Some(button) = buttons.iter().find(|button| button.index == focus.0)\n        \u0026\u0026 let UiAction::Adjust(key, _) = button.action\n    {\n        requests.write(UiRequest(UiAction::Adjust(key, direction)));\n    }\n}\n\nfn left(\n    _event: On\u003cFire\u003cLeftAction\u003e\u003e,\n    menu: Res\u003cMenuState\u003e,\n    focus: Res\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    buttons: Query\u003c\u0026MenuButton\u003e,\n    mut requests: MessageWriter\u003cUiRequest\u003e,\n) {\n    if menu.page != MenuPage::Hidden {\n        *source = MenuInputSource::Navigation;\n    }\n    adjust_focused(\u0026menu, \u0026focus, \u0026buttons, \u0026mut requests, -1);\n}\n\nfn right(\n    _event: On\u003cFire\u003cRightAction\u003e\u003e,\n    menu: Res\u003cMenuState\u003e,\n    focus: Res\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    buttons: Query\u003c\u0026MenuButton\u003e,\n    mut requests: MessageWriter\u003cUiRequest\u003e,\n) {\n    if menu.page != MenuPage::Hidden {\n        *source = MenuInputSource::Navigation;\n    }\n    adjust_focused(\u0026menu, \u0026focus, \u0026buttons, \u0026mut requests, 1);\n}\n\nfn confirm(\n    _event: On\u003cFire\u003cConfirmAction\u003e\u003e,\n    menu: Res\u003cMenuState\u003e,\n    focus: Res\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    buttons: Query\u003c\u0026MenuButton\u003e,\n    mut requests: MessageWriter\u003cUiRequest\u003e,\n) {\n    if menu.page != MenuPage::Hidden\n        \u0026\u0026 let Some(button) = buttons.iter().find(|button| button.index == focus.0)\n    {\n        *source = MenuInputSource::Navigation;\n        requests.write(UiRequest(button.action));\n    }\n}\n\nfn back(\n    _event: On\u003cFire\u003cBackAction\u003e\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    mut requests: MessageWriter\u003cUiRequest\u003e,\n) {\n    *source = MenuInputSource::Navigation;\n    requests.write(UiRequest(UiAction::Back));\n}\n\n/// Bevy 原生 UI 已完成按钮命中；这里不再读取 MouseButton，防止双重触发。\nfn pointer_interaction(\n    menu: Res\u003cMenuState\u003e,\n    mut focus: ResMut\u003cMenuFocus\u003e,\n    mut source: ResMut\u003cMenuInputSource\u003e,\n    windows: Query\u003c\u0026Window, With\u003cPrimaryWindow\u003e\u003e,\n    buttons: Query\u003c(Entity, \u0026MenuButton, Ref\u003cInteraction\u003e)\u003e,\n    mut requests: MessageWriter\u003cUiRequest\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n    mut previous_cursor: Local\u003cOption\u003cVec2\u003e\u003e,\n    mut previous_hover: Local\u003cOption\u003cEntity\u003e\u003e,\n) {\n    // 原生 UI 重建也会产生 Hovered；只用窗口位置变化识别真实鼠标导航，避免抢走键盘焦点。\n    // 底层位置只区分悬停来源，键盘与手柄动作仍由 Enhanced Input 处理，点击仍用 Interaction。\n    let cursor = windows.single().ok().and_then(Window::cursor_position);\n    let pointer_moved = cursor != *previous_cursor;\n    *previous_cursor = cursor;\n    if menu.page == MenuPage::Hidden {\n        *previous_hover = None;\n        return;\n    }\n    // 移到空白或离开窗口也切回鼠标模式，避免上次鼠标序号继续被画成键盘焦点。\n    if pointer_moved {\n        *source = MenuInputSource::Pointer;\n    }\n    let hovered = buttons\n        .iter()\n        .find_map(|(entity, _, interaction)| (*interaction != Interaction::None).then_some(entity));\n    for (entity, button, interaction) in \u0026buttons {\n        match *interaction {\n            Interaction::Hovered if pointer_moved =\u003e {\n                focus.0 = button.index;\n                // 同一按钮内移动、点击释放与新页面初始悬停都不重复发出焦点音。\n                if *previous_hover != Some(entity) \u0026\u0026 !interaction.is_added() {\n                    sounds.write(SoundRequest::new(SoundCue::MenuHover, entity));\n                }\n            }\n            Interaction::Pressed if interaction.is_changed() =\u003e {\n                *source = MenuInputSource::Pointer;\n                focus.0 = button.index;\n                requests.write(UiRequest(button.action));\n            }\n            _ =\u003e {}\n        }\n    }\n    *previous_hover = hovered;\n}\n\nfn open_page(menu: \u0026mut MenuState, focus: \u0026mut MenuFocus, page: MenuPage) {\n    menu.return_page = menu.page;\n    menu.page = page;\n    menu.status = None;\n    focus.0 = 0;\n}\n\n/// 每帧只消费一项语义请求，避免鼠标与确认键同时激活，或旧页面动作穿过页面切换。\nfn handle_requests(\n    mut requests: MessageReader\u003cUiRequest\u003e,\n    mut menu: ResMut\u003cMenuState\u003e,\n    mut focus: ResMut\u003cMenuFocus\u003e,\n    mut draft: ResMut\u003cSettingsDraft\u003e,\n    mut settings: ResMut\u003cGameSettings\u003e,\n    path: Res\u003cSettingsFile\u003e,\n    mut app_state: ResMut\u003cNextState\u003cAppState\u003e\u003e,\n    mut play_state: ResMut\u003cNextState\u003cPlayState\u003e\u003e,\n    mut exits: MessageWriter\u003cAppExit\u003e,\n    controllers: Query\u003cEntity, With\u003cMenuContext\u003e\u003e,\n    mut sounds: MessageWriter\u003cSoundRequest\u003e,\n) {\n    let action = requests.read().map(|request| request.0).next();\n    requests.clear();\n    let Some(action) = action else {\n        return;\n    };\n    let before = menu.page;\n    let mut cue = SoundCue::MenuConfirm;\n    match action {\n        UiAction::StartGame if menu.page == MenuPage::Main =\u003e app_state.set(AppState::InGame),\n        UiAction::OpenSettings if matches!(menu.page, MenuPage::Main | MenuPage::Pause) =\u003e {\n            *draft = SettingsDraft::from_settings(\u0026settings);\n            menu.tab = SettingsTab::Graphics;\n            open_page(\u0026mut menu, \u0026mut focus, MenuPage::Settings);\n        }\n        UiAction::OpenHelp if matches!(menu.page, MenuPage::Main | MenuPage::Pause) =\u003e {\n            open_page(\u0026mut menu, \u0026mut focus, MenuPage::Help)\n        }\n        UiAction::Quit if menu.page == MenuPage::Main =\u003e {\n            exits.write(AppExit::Success);\n        }\n        UiAction::Resume if menu.page == MenuPage::Pause =\u003e {\n            play_state.set(PlayState::Running);\n            cue = SoundCue::MenuCancel;\n        }\n        UiAction::ReturnToMenu if menu.page == MenuPage::Pause =\u003e {\n            app_state.set(AppState::MainMenu);\n            cue = SoundCue::MenuCancel;\n        }\n        UiAction::Back =\u003e match menu.page {\n            MenuPage::Hidden =\u003e play_state.set(PlayState::Paused),\n            MenuPage::Pause =\u003e {\n                play_state.set(PlayState::Running);\n                cue = SoundCue::MenuCancel;\n            }\n            MenuPage::Settings | MenuPage::Help =\u003e {\n                *draft = SettingsDraft::from_settings(\u0026settings);\n                menu.page = menu.return_page;\n                menu.status = None;\n                focus.0 = 0;\n                cue = SoundCue::MenuCancel;\n            }\n            MenuPage::Main =\u003e return,\n        },\n        UiAction::SelectTab(tab) if menu.page == MenuPage::Settings =\u003e {\n            if menu.tab == tab {\n                return;\n            }\n            menu.tab = tab;\n            menu.status = None;\n            focus.0 = match tab {\n                SettingsTab::Graphics =\u003e 0,\n                SettingsTab::Audio =\u003e 1,\n                SettingsTab::Controls =\u003e 2,\n                SettingsTab::Accessibility =\u003e 3,\n            };\n        }\n        UiAction::Adjust(key, direction) if menu.page == MenuPage::Settings =\u003e {\n            let before = (draft.max_fps, draft.mouse_sensitivity, draft.invert_y);\n            draft.adjust(key, direction);\n            if before == (draft.max_fps, draft.mouse_sensitivity, draft.invert_y) {\n                return;\n            }\n            menu.status = None;\n        }\n        UiAction::RestoreDefaults if menu.page == MenuPage::Settings =\u003e {\n            *draft = SettingsDraft::default();\n            menu.status = Some(\"Defaults restored. Choose Apply to save.\".into());\n        }\n        UiAction::ApplySettings if menu.page == MenuPage::Settings =\u003e {\n            match draft\n                .to_settings()\n                .and_then(|updated| updated.save(\u0026path.0).map(|()| updated))\n            {\n                Ok(updated) =\u003e {\n                    info!(target: \"demo::settings\", path = %path.0.display(),\n                        max_fps_before = settings.max_fps.get(), max_fps_after = updated.max_fps.get(),\n                        sensitivity_before = settings.camera.mouse_sensitivity, sensitivity_after = updated.camera.mouse_sensitivity,\n                        invert_y_before = settings.camera.invert_y, invert_y_after = updated.camera.invert_y,\n                        reason = \"settings_apply\", \"Game settings saved and applied\");\n                    *settings = updated;\n                    menu.status = Some(\"Settings applied.\".into());\n                }\n                Err(error) =\u003e {\n                    error!(target: \"demo::settings\", path = %path.0.display(), %error, operation = \"apply_settings\", \"Failed to save settings\");\n                    menu.status = Some(\"Could not save settings. Your changes are still available; try Apply again.\".into());\n                    cue = SoundCue::MenuCancel;\n                }\n            }\n        }\n        _ =\u003e return,\n    }\n    // 只对本帧真正消费并接受的语义请求反馈，鼠标与确认键并存也只产生一次。\n    if let Ok(source) = controllers.single() {\n        sounds.write(SoundRequest::new(cue, source));\n        info!(target: \"demo::ui\", event = cue.id(), ?source, action = ?action,\n            reason = \"handled_ui_request\", \"Menu audio cue emitted\");\n    }\n    if before != menu.page {\n        info!(target: \"demo::ui\", page_before = ?before, page_after = ?menu.page, reason = ?action, \"Menu page changed\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    use crate::app_flow::AppFlowPlugin;\n    use bevy::{\n        asset::AssetPlugin, input::InputPlugin, scene::ScenePlugin, time::TimeUpdateStrategy,\n    };\n    use std::path::PathBuf;\n\n    fn test_app() -\u003e App {\n        // 使用真实输入、状态调度与 BSN 页面，只生成 ECS 数据，不安装 UI 渲染或窗口后端。\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            AssetPlugin::default(),\n            ScenePlugin,\n            InputPlugin,\n            EnhancedInputPlugin,\n            AppFlowPlugin,\n        ))\n        .init_asset::\u003cFont\u003e()\n        // 现成空句柄避免测试加载本地字体或等待异步资产任务。\n        .insert_resource(theme::UiTheme {\n            heading: Handle::default(),\n            body: Handle::default(),\n            scale: 1.0,\n        })\n        .init_resource::\u003cGameSettings\u003e()\n        .init_resource::\u003cSettingsDraft\u003e()\n        .init_resource::\u003cSettingsFile\u003e()\n        .init_resource::\u003cMenuInputSource\u003e()\n        .add_message::\u003cUiRequest\u003e()\n        .add_message::\u003cSoundRequest\u003e()\n        .add_message::\u003cAppExit\u003e()\n        .insert_resource(TimeUpdateStrategy::ManualDuration(\n            std::time::Duration::from_millis(16),\n        ))\n        .configure_sets(Update, (UiSystems::Build, UiSystems::Style).chain());\n        register(\u0026mut app);\n        screens::register(\u0026mut app);\n        app.world_mut().spawn((Window::default(), PrimaryWindow));\n        app.finish();\n        app.cleanup();\n        app.update();\n        app\n    }\n\n    fn request(app: \u0026mut App, action: UiAction) {\n        app.world_mut().write_message(UiRequest(action));\n        app.update();\n    }\n\n    fn drain_sounds(app: \u0026mut App) -\u003e Vec\u003cSoundCue\u003e {\n        app.world_mut()\n            .resource_mut::\u003cMessages\u003cSoundRequest\u003e\u003e()\n            .drain()\n            .map(|request| request.cue)\n            .collect()\n    }\n\n    #[test]\n    fn menu_sounds_follow_accepted_requests_and_skip_no_ops() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::Back);\n        request(\u0026mut app, UiAction::ApplySettings);\n        assert!(drain_sounds(\u0026mut app).is_empty());\n\n        // 同帧多种输入只消费首项，声音与最终接受的菜单动作对应。\n        app.world_mut()\n            .write_message(UiRequest(UiAction::OpenSettings));\n        app.world_mut().write_message(UiRequest(UiAction::OpenHelp));\n        app.update();\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        request(\u0026mut app, UiAction::SelectTab(SettingsTab::Graphics));\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, -1));\n        assert!(drain_sounds(\u0026mut app).is_empty());\n        request(\u0026mut app, UiAction::SelectTab(SettingsTab::Controls));\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        request(\u0026mut app, UiAction::Adjust(SettingKey::InvertY, 1));\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        request(\u0026mut app, UiAction::RestoreDefaults);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n\n        request(\u0026mut app, UiAction::StartGame);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        assert!(app.world().resource::\u003cTime\u003cVirtual\u003e\u003e().is_paused());\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        // 帮助页只有返回按钮，导航不会切换目标，也不发出焦点音。\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert!(drain_sounds(\u0026mut app).is_empty());\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::ArrowDown);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n        request(\u0026mut app, UiAction::Resume);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n        request(\u0026mut app, UiAction::Back);\n        drain_sounds(\u0026mut app);\n        request(\u0026mut app, UiAction::ReturnToMenu);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n    }\n\n    #[test]\n    fn enhanced_input_emits_one_hover_or_confirm_per_press() {\n        let mut app = test_app();\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuHover]);\n        for _ in 0..3 {\n            app.update();\n            assert!(drain_sounds(\u0026mut app).is_empty());\n        }\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::ArrowDown);\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::Enter);\n        app.update();\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        for _ in 0..3 {\n            app.update();\n            assert!(drain_sounds(\u0026mut app).is_empty());\n        }\n        let window = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cPrimaryWindow\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        app.world_mut().get_mut::\u003cWindow\u003e(window).unwrap().focused = false;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert!(drain_sounds(\u0026mut app).is_empty());\n    }\n\n    #[test]\n    fn pointer_sound_requires_entering_an_existing_button() {\n        // 只运行真实指针系统与 ECS 交互状态，不创建窗口后端或音频设备。\n        let mut app = App::new();\n        app.init_resource::\u003cMenuState\u003e()\n            .init_resource::\u003cMenuFocus\u003e()\n            .init_resource::\u003cMenuInputSource\u003e()\n            .add_message::\u003cUiRequest\u003e()\n            .add_message::\u003cSoundRequest\u003e()\n            .add_systems(Update, pointer_interaction);\n        let mut window = Window::default();\n        window.set_cursor_position(Some(Vec2::new(80.0, 80.0)));\n        let window = app.world_mut().spawn((window, PrimaryWindow)).id();\n        let button = app\n            .world_mut()\n            .spawn((MenuButton::default(), Interaction::None))\n            .id();\n        app.update();\n        let mut presses = 0;\n        for (interaction, x, expected) in [\n            (Interaction::Hovered, 82.0, vec![SoundCue::MenuHover]),\n            (Interaction::Hovered, 84.0, vec![]),\n            (Interaction::None, 86.0, vec![]),\n            (Interaction::Hovered, 88.0, vec![SoundCue::MenuHover]),\n            (Interaction::Pressed, 88.0, vec![]),\n            (Interaction::Pressed, 88.0, vec![]),\n            (Interaction::Hovered, 90.0, vec![]),\n        ] {\n            let mut current = app.world_mut().get_mut::\u003cInteraction\u003e(button).unwrap();\n            if *current != interaction {\n                *current = interaction;\n            }\n            app.world_mut()\n                .get_mut::\u003cWindow\u003e(window)\n                .unwrap()\n                .set_cursor_position(Some(Vec2::new(x, 80.0)));\n            app.update();\n            assert_eq!(drain_sounds(\u0026mut app), expected);\n            presses += app\n                .world_mut()\n                .resource_mut::\u003cMessages\u003cUiRequest\u003e\u003e()\n                .drain()\n                .count();\n        }\n        assert_eq!(presses, 1);\n        app.world_mut().despawn(button);\n        app.world_mut()\n            .spawn((MenuButton::default(), Interaction::Hovered));\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(Some(Vec2::new(92.0, 80.0)));\n        app.update();\n        assert!(drain_sounds(\u0026mut app).is_empty());\n        app.update();\n        assert!(drain_sounds(\u0026mut app).is_empty());\n    }\n\n    fn assert_button_highlight(app: \u0026App, entity: Entity, highlighted: bool) {\n        assert_eq!(\n            app.world().get::\u003cBackgroundColor\u003e(entity).unwrap().0,\n            if highlighted {\n                theme::GOLD\n            } else {\n                theme::PAPER\n            }\n        );\n        assert_eq!(\n            *app.world().get::\u003cBorderColor\u003e(entity).unwrap(),\n            BorderColor::all(if highlighted {\n                theme::INK\n            } else {\n                theme::CREAM\n            })\n        );\n    }\n\n    fn assert_page_hover_cycle(app: \u0026mut App) {\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        let buttons: Vec\u003c_\u003e = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cMenuButton\u003e\u003e()\n            .iter(app.world())\n            .collect();\n        assert!(!buttons.is_empty());\n        for entity in buttons {\n            assert_button_highlight(app, entity, false);\n            *app.world_mut().get_mut::\u003cInteraction\u003e(entity).unwrap() = Interaction::Hovered;\n            app.update();\n            assert_button_highlight(app, entity, true);\n            *app.world_mut().get_mut::\u003cInteraction\u003e(entity).unwrap() = Interaction::None;\n            app.update();\n            assert_button_highlight(app, entity, false);\n        }\n    }\n\n    #[test]\n    fn every_bsn_page_button_highlights_only_while_pointer_is_over_it() {\n        let mut app = test_app();\n        assert_page_hover_cycle(\u0026mut app);\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_page_hover_cycle(\u0026mut app);\n        request(\u0026mut app, UiAction::Back);\n        request(\u0026mut app, UiAction::OpenSettings);\n        for tab in [\n            SettingsTab::Graphics,\n            SettingsTab::Audio,\n            SettingsTab::Controls,\n            SettingsTab::Accessibility,\n        ] {\n            request(\u0026mut app, UiAction::SelectTab(tab));\n            assert_page_hover_cycle(\u0026mut app);\n        }\n        request(\u0026mut app, UiAction::Back);\n        request(\u0026mut app, UiAction::StartGame);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_page_hover_cycle(\u0026mut app);\n    }\n\n    #[test]\n    fn keyboard_focus_survives_stationary_hover_and_pointer_to_blank_clears_highlight() {\n        let mut app = test_app();\n        let window = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cPrimaryWindow\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(Some(Vec2::new(80.0, 80.0)));\n        app.update();\n        let mut buttons: Vec\u003c_\u003e = app\n            .world_mut()\n            .query::\u003c(Entity, \u0026MenuButton)\u003e()\n            .iter(app.world())\n            .map(|(entity, button)| (button.index, entity))\n            .collect();\n        buttons.sort_by_key(|(index, _)| *index);\n        *app.world_mut()\n            .get_mut::\u003cInteraction\u003e(buttons[0].1)\n            .unwrap() = Interaction::Hovered;\n        app.update();\n        assert_button_highlight(\u0026app, buttons[0].1, true);\n\n        // 真实 Enhanced Input 导航接管；静止鼠标留在另一按钮上不能产生第二个焦点。\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Navigation\n        );\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 1);\n        assert_button_highlight(\u0026app, buttons[0].1, false);\n        assert_button_highlight(\u0026app, buttons[1].1, true);\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::ArrowDown);\n        app.update();\n        assert_button_highlight(\u0026app, buttons[1].1, true);\n\n        *app.world_mut()\n            .get_mut::\u003cInteraction\u003e(buttons[0].1)\n            .unwrap() = Interaction::None;\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(Some(Vec2::new(140.0, 140.0)));\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 1);\n        for (_, entity) in \u0026buttons {\n            assert_button_highlight(\u0026app, *entity, false);\n        }\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowUp);\n        app.update();\n        assert_button_highlight(\u0026app, buttons[0].1, true);\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(None);\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        for (_, entity) in buttons {\n            assert_button_highlight(\u0026app, entity, false);\n        }\n    }\n\n    #[test]\n    fn page_changes_preserve_pointer_or_navigation_source() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_page_hover_cycle(\u0026mut app);\n        request(\u0026mut app, UiAction::Back);\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 2;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::Enter);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Help);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Navigation\n        );\n        let back = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cMenuButton\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        assert_button_highlight(\u0026app, back, true);\n\n        // 点击返回在下一帧消费；页面重置序号后仍保持鼠标模式，Start 不会无故常亮。\n        *app.world_mut().get_mut::\u003cInteraction\u003e(back).unwrap() = Interaction::Pressed;\n        app.update();\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Main);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        assert_page_hover_cycle(\u0026mut app);\n    }\n\n    #[test]\n    fn rebuilt_hover_preserves_keyboard_focus_and_real_pointer_input_takes_over() {\n        // 只提供窗口组件与按钮状态，不安装原生窗口、UI 渲染器或输入后端。\n        let mut app = App::new();\n        app.init_resource::\u003cMenuState\u003e()\n            .init_resource::\u003cMenuFocus\u003e()\n            .init_resource::\u003cMenuInputSource\u003e()\n            .add_message::\u003cUiRequest\u003e()\n            .add_message::\u003cSoundRequest\u003e()\n            .add_systems(Update, pointer_interaction);\n        let mut window = Window::default();\n        window.set_cursor_position(Some(Vec2::new(80.0, 80.0)));\n        let window = app.world_mut().spawn((window, PrimaryWindow)).id();\n        app.update();\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 4;\n        *app.world_mut().resource_mut::\u003cMenuInputSource\u003e() = MenuInputSource::Navigation;\n\n        let action = UiAction::SelectTab(SettingsTab::Graphics);\n        let mut hovered = app\n            .world_mut()\n            .spawn((MenuButton { action, index: 0 }, Interaction::Hovered))\n            .id();\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 4);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Navigation\n        );\n        for _ in 0..2 {\n            app.world_mut().despawn(hovered);\n            hovered = app\n                .world_mut()\n                .spawn((MenuButton { action, index: 0 }, Interaction::Hovered))\n                .id();\n            app.update();\n            assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 4);\n            assert_eq!(\n                *app.world().resource::\u003cMenuInputSource\u003e(),\n                MenuInputSource::Navigation\n            );\n        }\n\n        // 鼠标在同一按钮内移动时 Interaction 不变，也应重新接管焦点。\n        app.world_mut()\n            .get_mut::\u003cWindow\u003e(window)\n            .unwrap()\n            .set_cursor_position(Some(Vec2::new(82.0, 80.0)));\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 0);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 4;\n        *app.world_mut().resource_mut::\u003cMenuInputSource\u003e() = MenuInputSource::Navigation;\n        *app.world_mut().get_mut::\u003cInteraction\u003e(hovered).unwrap() = Interaction::Pressed;\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, 0);\n        assert_eq!(\n            *app.world().resource::\u003cMenuInputSource\u003e(),\n            MenuInputSource::Pointer\n        );\n        let requests: Vec\u003c_\u003e = app\n            .world_mut()\n            .resource_mut::\u003cMessages\u003cUiRequest\u003e\u003e()\n            .drain()\n            .map(|request| request.0)\n            .collect();\n        assert_eq!(requests, vec![action]);\n        app.update();\n        assert_eq!(\n            app.world_mut()\n                .resource_mut::\u003cMessages\u003cUiRequest\u003e\u003e()\n                .drain()\n                .count(),\n            0\n        );\n    }\n\n    #[test]\n    fn simultaneous_settings_back_and_old_button_press_remain_paused() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::StartGame);\n        request(\u0026mut app, UiAction::Back);\n        request(\u0026mut app, UiAction::OpenSettings);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Settings);\n        let old_back = app\n            .world_mut()\n            .query::\u003c(Entity, \u0026MenuButton)\u003e()\n            .iter(app.world())\n            .find_map(|(entity, button)| (button.action == UiAction::Back).then_some(entity))\n            .unwrap();\n        drain_sounds(\u0026mut app);\n\n        // 同一帧键盘返回与旧页按钮的点击并存；真实 Build 必须先清理旧按钮。\n        *app.world_mut().get_mut::\u003cInteraction\u003e(old_back).unwrap() = Interaction::Pressed;\n        app.world_mut().write_message(UiRequest(UiAction::Back));\n        app.update();\n        assert!(app.world().get_entity(old_back).is_err());\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n\n        // 检查帧末后再推进一帧，防止残留 Back 在暂停页被解释为 Resume。\n        app.update();\n        assert!(drain_sounds(\u0026mut app).is_empty());\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n    }\n\n    #[test]\n    fn settings_cancel_preserves_runtime_and_apply_commits_only_after_save() {\n        let mut app = test_app();\n        let path = PathBuf::from(\"tmp\")\n            .join(\"ui-settings-tests\")\n            .join(format!(\"{}.json\", uuid::Uuid::new_v4()));\n        std::fs::create_dir_all(path.parent().unwrap()).unwrap();\n        app.world_mut().insert_resource(SettingsFile(path.clone()));\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 90);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 60);\n        assert!(!path.exists());\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Main);\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 60);\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        drain_sounds(\u0026mut app);\n        request(\u0026mut app, UiAction::ApplySettings);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuConfirm]);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 90);\n        assert_eq!(GameSettings::load(\u0026path).max_fps.get(), 90);\n        std::fs::remove_file(\u0026path).unwrap();\n\n        // 保存目标是目录时产生真实 I/O 失败，界面保留草稿而运行设置保持原值。\n        app.world_mut()\n            .insert_resource(SettingsFile(path.parent().unwrap().to_path_buf()));\n        request(\u0026mut app, UiAction::Adjust(SettingKey::FrameRate, 1));\n        drain_sounds(\u0026mut app);\n        request(\u0026mut app, UiAction::ApplySettings);\n        assert_eq!(drain_sounds(\u0026mut app), [SoundCue::MenuCancel]);\n        assert_eq!(app.world().resource::\u003cGameSettings\u003e().max_fps.get(), 90);\n        assert_eq!(app.world().resource::\u003cSettingsDraft\u003e().max_fps, 120);\n        assert!(\n            app.world()\n                .resource::\u003cMenuState\u003e()\n                .status\n                .as_ref()\n                .unwrap()\n                .starts_with(\"Could not save\")\n        );\n    }\n\n    #[test]\n    fn held_confirm_fires_once_and_navigation_stops_when_window_loses_focus() {\n        let mut app = test_app();\n        app.world_mut().resource_mut::\u003cMenuFocus\u003e().0 = 1;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::Enter);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Settings);\n        for _ in 0..5 {\n            app.update();\n        }\n        assert_eq!(\n            app.world().resource::\u003cMenuState\u003e().return_page,\n            MenuPage::Main\n        );\n        let original = app.world().resource::\u003cMenuFocus\u003e().0;\n        let window = app\n            .world_mut()\n            .query_filtered::\u003cEntity, With\u003cPrimaryWindow\u003e\u003e()\n            .single(app.world())\n            .unwrap();\n        app.world_mut().get_mut::\u003cWindow\u003e(window).unwrap().focused = false;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::ArrowDown);\n        app.update();\n        assert_eq!(app.world().resource::\u003cMenuFocus\u003e().0, original);\n    }\n\n    #[test]\n    fn pause_help_and_settings_return_to_pause_without_replacing_session() {\n        let mut app = test_app();\n        request(\u0026mut app, UiAction::StartGame);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cAppState\u003e\u003e().get(),\n            AppState::InGame\n        );\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n        request(\u0026mut app, UiAction::OpenHelp);\n        assert_eq!(\n            app.world().resource::\u003cMenuState\u003e().return_page,\n            MenuPage::Pause\n        );\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        request(\u0026mut app, UiAction::OpenSettings);\n        request(\u0026mut app, UiAction::Back);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Pause);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Paused\n        );\n        request(\u0026mut app, UiAction::Resume);\n        assert_eq!(app.world().resource::\u003cMenuState\u003e().page, MenuPage::Hidden);\n        assert_eq!(\n            *app.world().resource::\u003cState\u003cPlayState\u003e\u003e().get(),\n            PlayState::Running\n        );\n    }\n}\n"},{"path":"src/ui/screens.rs","text":"//! 主菜单、暂停、设置与操作说明的 BSN 页面，以及焦点的视觉呈现。\n\nuse bevy::{prelude::*, window::PrimaryWindow};\n\nuse crate::settings::SettingsDraft;\n\nuse super::{\n    MenuButton, MenuFocus, MenuInputSource, MenuPage, MenuRoot, MenuState, SettingKey, SettingsTab,\n    UiAction, UiSystems, theme::*, widgets::*,\n};\n\n#[derive(Component, Default, Clone)]\nstruct DescriptionTitle;\n\n#[derive(Component, Default, Clone)]\nstruct DescriptionBody;\n\npub(super) fn register(app: \u0026mut App) {\n    app.init_resource::\u003cUiTheme\u003e()\n        .add_systems(Update, rebuild_page.in_set(UiSystems::Build))\n        // Build 与 Style 由插件串联，保证新 BSN 子树的延迟命令先应用。\n        .add_systems(\n            Update,\n            (style_buttons, update_description, scroll_focused_button).in_set(UiSystems::Style),\n        );\n}\n\n/// 页面状态与草稿变化时重建；键盘焦点只更新样式，避免输入实体不断销毁。\nfn rebuild_page(\n    mut commands: Commands,\n    state: Res\u003cMenuState\u003e,\n    draft: Res\u003cSettingsDraft\u003e,\n    theme: Res\u003cUiTheme\u003e,\n    windows: Query\u003c\u0026Window, With\u003cPrimaryWindow\u003e\u003e,\n    roots: Query\u003cEntity, With\u003cMenuRoot\u003e\u003e,\n    mut previous_width: Local\u003cOption\u003cu32\u003e\u003e,\n) {\n    let width = windows.single().map_or(1440.0, |window| window.width());\n    let width_bucket = width.round() as u32;\n    if !state.is_changed() \u0026\u0026 !draft.is_changed() \u0026\u0026 *previous_width == Some(width_bucket) {\n        return;\n    }\n    *previous_width = Some(width_bucket);\n    for entity in \u0026roots {\n        commands.entity(entity).despawn();\n    }\n    if state.page == MenuPage::Hidden {\n        return;\n    }\n    let theme = theme.for_width(width);\n    let compact = width \u003c 1000.0;\n    let content: Box\u003cdyn Scene\u003e = match state.page {\n        MenuPage::Main =\u003e Box::new(main_page(\u0026theme, false)),\n        MenuPage::Pause =\u003e Box::new(main_page(\u0026theme, true)),\n        MenuPage::Settings =\u003e Box::new(settings_page(\u0026theme, \u0026state, \u0026draft, compact)),\n        MenuPage::Help =\u003e Box::new(help_page(\u0026theme, compact)),\n        MenuPage::Hidden =\u003e unreachable!(),\n    };\n    // 句柄作为现成组件写入 BSN，spawn_scene 不依赖异步加载任务，旧页面不会复活。\n    commands.spawn_scene(bsn! {\n        MenuRoot\n        GlobalZIndex(100)\n        Node {\n            width: percent(100),\n            height: percent(100),\n            flex_direction: FlexDirection::Column,\n        }\n        BackgroundColor({if state.page == MenuPage::Pause {\n            Color::srgba(0.06, 0.10, 0.15, 0.68)\n        } else {\n
