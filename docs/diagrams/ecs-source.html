very;\nmod physics;\n#[cfg(test)]\nmod physics_tests;\nmod scene;\nmod session_log;\nmod settings;\nmod startup_log;\nmod ui;\n\nuse app_flow::{AppFlowPlugin, gameplay_running};\nuse art_assets::ArtAssetsPlugin;\nuse audio::GameAudioPlugin;\nuse bevy::{log::LogPlugin, prelude::*, window::PresentMode};\nuse bevy_inspector_egui::{bevy_egui::EguiPlugin, quick::WorldInspectorPlugin};\nuse camera::CameraControlPlugin;\nuse character_animation::CharacterAnimationPlugin;\nuse gameplay::GameplayPlugin;\nuse input::PlayerInputPlugin;\nuse island_recovery::IslandRecoveryPlugin;\nuse scene::PrototypeScenePlugin;\nuse settings::{GameSettings, SettingsPlugin};\nuse startup_log::StartupLogPlugin;\nuse ui::GameUiPlugin;\n\nfn main() -\u003e AppExit {\n    let mut app = App::new();\n    // 先准备会话文件，再交给 LogPlugin 安装日志；守护对象保留到退出记录写入后。\n    let session = match session_log::prepare(\u0026mut app) {\n        Ok(session) =\u003e session,\n        Err(error) =\u003e {\n            eprintln!(\"Failed to initialize session logging; game startup aborted: {error}\");\n            return AppExit::error();\n        }\n    };\n\n    app.add_plugins(\n        DefaultPlugins\n            .build()\n            // 播放统一交给 Kira，避免两套音频插件同时打开输出设备。\n            .disable::\u003cbevy::audio::AudioPlugin\u003e()\n            .set(LogPlugin {\n                custom_layer: session_log::file_layer,\n                fmt_layer: session_log::console_layer,\n                ..default()\n            })\n            .set(WindowPlugin {\n                primary_window: Some(Window {\n                    title: \"Island Courier\".into(),\n                    // 避免垂直同步把玩家设置的帧率上限额外限制为显示器的刷新率。\n                    present_mode: PresentMode::AutoNoVsync,\n                    ..default()\n                }),\n                ..default()\n            }),\n    );\n    // LogPlugin 已完成初始化，此后的会话与玩法日志会同时写入控制台和文件。\n    session.start();\n\n    let exit = app\n        .insert_resource(GameSettings::load(std::path::Path::new(\"settings.json\")))\n        // 统一由玩家上限限速，避免失焦时再被默认的 60 Hz 更新策略限制。\n        .insert_resource(bevy::winit::WinitSettings::continuous())\n        // 固定步只控制移动、重力和交互模拟，独立于玩家设置的渲染上限。\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .add_plugins((\n            // 检查器复用同一主窗口与相机，Egui 必须先于世界检查器注册。\n            EguiPlugin::default(),\n            WorldInspectorPlugin::new().run_if(gameplay_running),\n            AppFlowPlugin,\n            SettingsPlugin,\n            GameplayPlugin,\n            GameAudioPlugin,\n            PlayerInputPlugin,\n            CameraControlPlugin,\n            ArtAssetsPlugin,\n            CharacterAnimationPlugin,\n            IslandRecoveryPlugin,\n            PrototypeScenePlugin,\n            GameUiPlugin,\n            StartupLogPlugin,\n        ))\n        .run();\n\n    if let Err(error) = session.record_exit(\u0026exit) {\n        eprintln!(\"Failed to flush session log on exit: {error}\");\n        return AppExit::error();\n    }\n    exit\n}\n"},{"path":"src/physics.rs","text":"//! 统一组装 Avian 物理与刚体配置，模拟坐标由物理引擎保存，Transform 用于呈现。\n\nuse avian3d::prelude::*;\nuse bevy::prelude::*;\n\nuse crate::gameplay::{GameplaySystems, PrototypeConfig};\n\n/// 世界、角色与快递的碰撞分类；持握时箱子仍碰撞世界与其他快递。\n#[derive(PhysicsLayer, Default)]\npub(crate) enum GamePhysicsLayer {\n    #[default]\n    World,\n    Character,\n    Parcel,\n}\n\n/// 固定物理模拟和统一碰撞日志；可用于没有窗口和渲染器的最小 App。\npub(crate) struct DemoPhysicsPlugin;\n\nimpl Plugin for DemoPhysicsPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_plugins(PhysicsPlugins::default())\n            .add_systems(FixedUpdate, sync_gravity.before(GameplaySystems::Simulate))\n            .add_systems(\n                FixedPostUpdate,\n                log_collisions.after(PhysicsSystems::StepSimulation),\n            );\n    }\n}\n\n/// 检查器修改重力参数后，在本固定步求解前更新唯一的重力资源。\nfn sync_gravity(config: Res\u003cPrototypeConfig\u003e, mut gravity: ResMut\u003cGravity\u003e) {\n    if config.is_changed() {\n        gravity.0 = Vec3::NEG_Y * config.gravity;\n    }\n}\n\n/// 静态世界接受角色与快递的碰撞。\npub(crate) fn world_collision_layers() -\u003e CollisionLayers {\n    CollisionLayers::new(GamePhysicsLayer::World, LayerMask::ALL)\n}\n\n/// 自由快递参与世界、人物与快递之间的碰撞。\npub(crate) fn parcel_collision_layers() -\u003e CollisionLayers {\n    CollisionLayers::new(GamePhysicsLayer::Parcel, LayerMask::ALL)\n}\n\n/// 当前单角色持握时排除人物层，避免手中箱子与自己的身体互相挤压。\npub(crate) fn held_collision_layers() -\u003e CollisionLayers {\n    CollisionLayers::new(\n        GamePhysicsLayer::Parcel,\n        [GamePhysicsLayer::World, GamePhysicsLayer::Parcel],\n    )\n}\n\n/// 角色根保持脚底原点；偏移胶囊承载动态碰撞，锁旋转保证人物不翻倒。\npub(crate) fn character_body(config: \u0026PrototypeConfig) -\u003e impl Bundle {\n    (\n        RigidBody::Dynamic,\n        Collider::compound(vec![(\n            Vec3::Y * config.character_height * 0.5,\n            Quat::IDENTITY,\n            Collider::capsule(\n                config.character_radius,\n                config.character_height - 2.0 * config.character_radius,\n            ),\n        )]),\n        Mass(config.character_mass),\n        LockedAxes::ROTATION_LOCKED,\n        // 人物的刹车由运动控制力表达，低摩擦避免贴墙时被摩擦卡住。\n        Friction::new(0.0).with_combine_rule(CoefficientCombine::Min),\n        Restitution::new(0.0),\n        CollisionLayers::new(GamePhysicsLayer::Character, LayerMask::ALL),\n        CollisionEventsEnabled,\n        // 正常移动与跳跃的合速度低于 8m/s，现有推测接触足以覆盖每步位移。\n        // 仅高速或与旋转物体接触时执行昂贵扫掠，避免驻足时反复查询密集建筑网格。\n        // 保留非线性算法：当前依赖的线性算法在非零水平朝向下会漏掉薄墙接触。\n        SweptCcd::NON_LINEAR.with_velocity_threshold(8.0, 0.1),\n        TranslationInterpolation,\n    )\n}\n\n/// 快递根位于箱体中心；拿起和松手均保持动态刚体与原有动量。\npub(crate) fn parcel_body(config: \u0026PrototypeConfig) -\u003e impl Bundle {\n    let size = 2.0 * config.parcel_half_height;\n    (\n        RigidBody::Dynamic,\n        Collider::cuboid(size, size, size),\n        Mass(config.parcel_mass),\n        Friction::new(0.65),\n        Restitution::new(0.08),\n        AngularDamping(0.15),\n        parcel_collision_layers(),\n        CollisionEventsEnabled,\n        SweptCcd::default(),\n        TransformInterpolation,\n    )\n}\n\n/// 无窗口测试也复用有厚度的地面；调用方的 Transform 表示地面顶面。\n#[cfg(test)]\npub(crate) fn ground_body(_config: \u0026PrototypeConfig) -\u003e impl Bundle {\n    (\n        RigidBody::Static,\n        Collider::compound(vec![(\n            Vec3::NEG_Y * 0.5,\n            Quat::IDENTITY,\n            Collider::cuboid(200.0, 1.0, 200.0),\n        )]),\n        world_collision_layers(),\n    )\n}\n\n/// 接触开始和结束属于离散变化，通过现有文件日志设施记录碰撞双方。\nfn log_collisions(\n    mut started: MessageReader\u003cCollisionStart\u003e,\n    mut ended: MessageReader\u003cCollisionEnd\u003e,\n) {\n    for collision in started.read() {\n        info!(collider1 = ?collision.collider1, collider2 = ?collision.collider2,\n            reason = \"physics_contact\", \"Collision started\");\n    }\n    for collision in ended.read() {\n        info!(collider1 = ?collision.collider1, collider2 = ?collision.collider2,\n            reason = \"physics_separation\", \"Collision ended\");\n    }\n}\n"},{"path":"src/scene.rs","text":"//! BSN 组合业务实体和视觉层级；地图实例化并完成静态碰撞后才生成动态玩家。\n\nuse std::collections::BTreeMap;\n\nuse avian3d::prelude::{Collider, RigidBody, TrimeshFlags};\nuse bevy::{prelude::*, world_serialization::WorldInstanceReady};\nuse serde::Deserialize;\n\nuse crate::{\n    app_flow::{AppState, gameplay_running},\n    art_assets::{ArtAssets, ArtLoadState, ItemModel},\n    camera::{CharacterVisual, ControlsCamera, MouseLookState, OrbitCamera},\n    character_animation::CourierVisual,\n    gameplay::{\n        CarryGrip, Character, CharacterIntent, CharacterMotion, Parcel, Pickable, PlayerId,\n        PrototypeConfig,\n    },\n    input::spawn_keyboard_controller,\n    island_recovery::SpawnPoint,\n    physics::{character_body, parcel_body, world_collision_layers},\n};\n\n/// 游戏入口建立加载视图，就绪后装配完整海岛；退出时清理整套业务与视觉实体。\npub struct PrototypeScenePlugin;\n\nimpl Plugin for PrototypeScenePlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.insert_resource(ClearColor(Color::srgb(0.72, 0.84, 0.94)))\n            .insert_resource(GlobalAmbientLight {\n                color: Color::WHITE,\n                brightness: 250.0,\n                ..default()\n            })\n            // 独立无窗口场景测试不安装应用状态，沿用一次性启动入口。\n            .add_systems(\n                Startup,\n                spawn_lighting.run_if(not(resource_exists::\u003cState\u003cAppState\u003e\u003e)),\n            )\n            .add_systems(OnEnter(AppState::InGame), spawn_lighting)\n            .add_observer(mark_island_ready)\n            // 每一步应用延迟标记与碰撞命令，下一步才能观察完整的装配结果。\n            .add_systems(\n                Update,\n                (begin_island, prepare_island, spawn_actors)\n                    .chain()\n                    .run_if(gameplay_running),\n            );\n    }\n}\n\n#[derive(Component, Default, Clone)]\nstruct IslandMap;\n#[derive(Component)]\nstruct IslandPending;\n#[derive(Component)]\nstruct ActorsSpawned;\n\n/// 展示 NPC 保留在地图内，不挂玩家运动和输入组件。\n#[derive(Component)]\npub(crate) struct DisplayNpc;\n\n/// 静态碰撞独立于美术网格，随原始实例层级清理，不改动其视觉姿态。\n#[derive(Component, Default, Clone)]\npub(crate) struct IslandCollider;\n\n#[derive(Clone)]\nstruct ItemPlacement {\n    model: ItemModel,\n    pose: Transform,\n}\n\n#[derive(Component)]\nstruct IslandReady {\n    player: Transform,\n    items: Vec\u003cItemPlacement\u003e,\n}\n\n/// source_asset 仅在导入边界转换为业务组件，玩法系统不依赖模型名称。\n#[derive(Deserialize)]\nstruct MapAsset {\n    source_asset: String,\n    category: String,\n}\n\nfn lighting_scene() -\u003e impl Scene {\n    bsn! {\n        Name(\"Island daylight\")\n        template_value(DespawnOnExit(AppState::InGame))\n        DirectionalLight { illuminance: 12_000.0, shadow_maps_enabled: true }\n        template_value(Transform::from_xyz(6.0, 10.0, 8.0).looking_at(Vec3::ZERO, Vec3::Y))\n    }\n}\n\nfn spawn_lighting(mut commands: Commands) {\n    commands.spawn_scene(lighting_scene());\n    // 加载期间提供一个相机；准备好后复用同一实体，避免短暂出现两台主相机。\n    commands.spawn_scene(bsn! {\n        Name(\"Island loading camera\")\n        Camera3d\n        IsDefaultUiCamera\n        bevy_inspector_egui::bevy_egui::PrimaryEguiContext\n        template_value(DespawnOnExit(AppState::InGame))\n        LoadingCamera\n        template_value(Transform::from_xyz(-1.8, 6.0, 11.5).looking_at(Vec3::new(-1.8, 0.8, 3.5), Vec3::Y))\n    });\n}\n\n#[derive(Component, Default, Clone)]\nstruct LoadingCamera;\n\nfn island_scene(scene: Handle\u003cWorldAsset\u003e) -\u003e impl Scene {\n    bsn! {\n        Name(\"Courier island\") IslandMap WorldAssetRoot(scene)\n        template_value(DespawnOnExit(AppState::InGame))\n    }\n}\n\nfn begin_island(\n    mut commands: Commands,\n    assets: Res\u003cArtAssets\u003e,\n    gltfs: Res\u003cAssets\u003cGltf\u003e\u003e,\n    mut state: ResMut\u003cArtLoadState\u003e,\n    maps: Query\u003c(), With\u003cIslandMap\u003e\u003e,\n) {\n    if *state != ArtLoadState::Ready || !maps.is_empty() {\n        return;\n    }\n    let Some(scene) = gltfs\n        .get(\u0026assets.island)\n        .and_then(|gltf| gltf.scenes.first())\n    else {\n        *state = ArtLoadState::Failed;\n        error!(target: \"demo::scene\", reason = \"missing_map_scene\", \"Island initialization failed\");\n        return;\n    };\n    let entity = commands.spawn_scene(island_scene(scene.clone())).id();\n    info!(target: \"demo::scene\", ?entity, reason = \"assets_ready\", \"Island scene requested\");\n}\n\nfn mark_island_ready(\n    ready: On\u003cWorldInstanceReady\u003e,\n    mut commands: Commands,\n    maps: Query\u003c(), (With\u003cIslandMap\u003e, Without\u003cIslandReady\u003e)\u003e,\n) {\n    if maps.contains(ready.entity) {\n        commands.entity(ready.entity).insert(IslandPending);\n    }\n}\n\n/// 在资源 CPU 几何可用时构建碰撞；全部成功后才提交，失败时不创建动态玩家。\nfn prepare_island(\n    mut commands: Commands,\n    maps: Query\u003cEntity, With\u003cIslandPending\u003e\u003e,\n    children: Query\u003c\u0026Children\u003e,\n    metadata: Query\u003c(\u0026GltfExtras, \u0026Transform)\u003e,\n    nodes: Query\u003c(\u0026Transform, Option\u003c\u0026Name\u003e, Option\u003c\u0026Mesh3d\u003e)\u003e,\n    meshes: Res\u003cAssets\u003cMesh\u003e\u003e,\n    mut state: ResMut\u003cArtLoadState\u003e,\n) {\n    if *state != ArtLoadState::Ready {\n        return;\n    }\n    for map in \u0026maps {\n        let mut player = None;\n        let mut items = Vec::new();\n        let mut remove = Vec::new();\n        let mut npcs = Vec::new();\n        let mut colliders = Vec::new();\n        let mut ramps = Vec::new();\n        let mut floors = Vec::new();\n        let mut ramp_count = 0;\n        let mut terrain_found = false;\n        for instance in children.iter_descendants(map) {\n            let Ok((extras, pose)) = metadata.get(instance) else {\n                continue;\n            };\n            let Ok(asset) = serde_json::from_str::\u003cMapAsset\u003e(\u0026extras.value) else {\n                continue;\n            };\n            match asset.source_asset.as_str() {\n                \"chr_courier\" =\u003e {\n                    player = Some(*pose);\n                    remove.push(instance);\n                }\n                \"prop_parcel_standard\" | \"prop_parcel_fragile\" | \"prop_crate\" =\u003e {\n                    if asset.source_asset == \"prop_crate\" {\n                        // 展示位置穿进站点墙体与柜台；整体移入柜台和货架之间的净空，保留布局和朝向。\n                        let mut pose = *pose;\n                        pose.translation += Vec3::new(0.8, 0.165, -2.06);\n                        items.push(ItemPlacement {\n                            model: ItemModel::WoodenCrate,\n                            pose,\n                        });\n                    }\n                    remove.push(instance);\n                }\n                _ if asset.category == \"characters\" =\u003e npcs.push(instance),\n                _ =\u003e {\n                    let mut geometry = CollisionGeometry::default();\n                    if let Err(error) = collect_geometry(\n                        instance,\n                        Mat4::IDENTITY,\n                        false,\n                        \"\",\n                        \u0026asset.source_asset,\n                        \u0026children,\n                        \u0026nodes,\n                        \u0026meshes,\n                        \u0026mut geometry,\n                    ) {\n                        *state = ArtLoadState::Failed;\n                        error!(target: \"demo::scene\", ?instance, asset = asset.source_asset,\n                            %error, reason = \"collision_geometry_failed\", \"Island initialization failed\");\n                        return;\n                    }\n                    if let Some(bounds) = geometry.floor_bounds {\n                        floors.push(transform_bounds(bounds, pose.to_matrix()));\n                    }\n                    if !geometry.indices.is_empty() {\n                        match Collider::try_trimesh_with_config(\n                            geometry.vertices,\n                            geometry.indices,\n                            TrimeshFlags::MERGE_DUPLICATE_VERTICES\n                                | TrimeshFlags::FIX_INTERNAL_EDGES,\n                        ) {\n                            Ok(collider) =\u003e colliders.push((instance, collider)),\n                            Err(error) =\u003e {\n                                *state = ArtLoadState::Failed;\n                                error!(target: \"demo::scene\", ?instance, asset = asset.source_asset,\n                                    %error, reason = \"collider_build_failed\", \"Island initialization failed\");\n                                return;\n                            }\n                        }\n                        terrain_found |= asset.source_asset == \"env_island_terrain\";\n                    }\n                    for (min, max) in geometry.ramps.into_values() {\n                        ramps.push((instance, *pose, min, max));\n                    }\n                }\n            }\n        }\n        let Some(mut player) = player.filter(|_| terrain_found) else {\n            *state = ArtLoadState::Failed;\n            error!(target: \"demo::scene\", reason = \"missing_player_or_terrain\", \"Island initialization failed\");\n            return;\n        };\n        for (parent, pose, mut min, mut max) in ramps {\n            let inverse = pose.to_matrix().inverse();\n            let center_x = (min.x + max.x) * 0.5;\n            let floor = floors\n                .iter()\n                .map(|\u0026bounds| transform_bounds(bounds, inverse))\n                .filter(|(floor_min, floor_max)| {\n                    (floor_min.x..=floor_max.x).contains(\u0026center_x)\n                        \u0026\u0026 (0.0..=0.3).contains(\u0026(floor_max.y - max.y))\n                        \u0026\u0026 (floor_max.z - min.z).abs() \u003c 1.0\n                })\n                .min_by(|(_, a), (_, b)| (a.z - min.z).abs().total_cmp(\u0026(b.z - min.z).abs()));\n            let Some((_, floor_max)) = floor else {\n                *state = ArtLoadState::Failed;\n                error!(target: \"demo::scene\", ?parent, reason = \"missing_entry_floor\", \"Island initialization failed\");\n                return;\n            };\n            // 台阶与地板间仍有空隙和 18cm 高差；连接实际前缘并重叠 5cm，避免走入室内时腾空。\n            min.z = floor_max.z - 0.05;\n            max.y = floor_max.y;\n            colliders.push((parent, stair_ramp(min, max)));\n            ramp_count += 1;\n        }\n        player.translation.y += 0.03;\n        for (model, offset) in [\n            (ItemModel::StandardParcel, Vec3::new(0.0, 0.3, -1.3)),\n            (ItemModel::FragileParcel, Vec3::new(1.2, 0.3, -1.3)),\n        ] {\n            items.push(ItemPlacement {\n                model,\n                pose: Transform::from_translation(player.translation + offset),\n            });\n        }\n        let collider_count = colliders.len();\n        for (parent, collider) in colliders {\n            commands.spawn_scene(bsn! {\n                Name(\"Island static collider\")\n                IslandCollider\n                template_value(RigidBody::Static)\n                template_value(collider)\n                template_value(world_collision_layers())\n                ChildOf(parent)\n            });\n        }\n        for \u0026entity in \u0026remove {\n            commands.entity(entity).despawn();\n        }\n        for \u0026entity in \u0026npcs {\n            commands.entity(entity).insert(DisplayNpc);\n        }\n        commands\n            .entity(map)\n            .remove::\u003cIslandPending\u003e()\n            .insert(IslandReady { player, items });\n        info!(target: \"demo::scene\", ?map, collider_count, ramp_count,\n            npc_count = npcs.len(), replaced_instances = remove.len(),\n            reason = \"map_geometry_ready\", \"Island colliders ready\");\n    }\n}\n\n#[derive(Default)]\nstruct CollisionGeometry {\n    vertices: Vec\u003cVec3\u003e,\n    indices: Vec\u003c[u32; 3]\u003e,\n    ramps: BTreeMap\u003cString, (Vec3, Vec3)\u003e,\n    floor_bounds: Option\u003c(Vec3, Vec3)\u003e,\n}\n\n/// 包围体沿实例变换转换坐标，供不同美术根之间的入口连接匹配。\nfn transform_bounds((min, max): (Vec3, Vec3), matrix: Mat4) -\u003e (Vec3, Vec3) {\n    let mut lower = Vec3::splat(f32::INFINITY);\n    let mut upper = Vec3::splat(f32::NEG_INFINITY);\n    for x in [min.x, max.x] {\n        for y in [min.y, max.y] {\n            for z in [min.z, max.z] {\n                let point = matrix.transform_point3(Vec3::new(x, y, z));\n                lower = lower.min(point);\n                upper = upper.max(point);\n            }\n        }\n    }\n    (lower, upper)\n}\n\n/// 坐标累积使用本地 Transform，不假设场景就绪事件时已完成本帧 GlobalTransform 传播。\nfn collect_geometry(\n    entity: Entity,\n    parent_matrix: Mat4,\n    include_transform: bool,\n    part_name: \u0026str,\n    asset: \u0026str,\n    children: \u0026Query\u003c\u0026Children\u003e,\n    nodes: \u0026Query\u003c(\u0026Transform, Option\u003c\u0026Name\u003e, Option\u003c\u0026Mesh3d\u003e)\u003e,\n    meshes: \u0026Assets\u003cMesh\u003e,\n    geometry: \u0026mut CollisionGeometry,\n) -\u003e Result\u003c(), String\u003e {\n    let (transform, name, mesh) = nodes.get(entity).map_err(|error| error.to_string())?;\n    // glTF 原语是命名节点的子实体；碰撞分类沿用父节点的美术部件名，忽略原语名。\n    let part_name = if mesh.is_none() {\n        name.map_or(part_name, |name| name.as_str())\n    } else {\n        part_name\n    };\n    let matrix = if include_transform {\n        parent_matrix * transform.to_matrix()\n    } else {\n        parent_matrix\n    };\n    if let Some(mesh) = mesh {\n        let ramp = stair_group(asset, part_name);\n        if ramp.is_some() || solid_mesh(asset, part_name) {\n            let mesh = meshes\n                .get(\u0026mesh.0)\n                .ok_or_else(|| \"Collision mesh unavailable\".to_owned())?;\n            for triangle in mesh.triangles().map_err(|error| error.to_string())? {\n                let vertices = triangle\n                    .vertices\n                    .map(|point| matrix.transform_point3(point));\n                if asset.starts_with(\"bld_\")\n                    \u0026\u0026 (part_name.contains(\"Floor_board_\") || part_name.contains(\"Hut floor board\"))\n                {\n                    let bounds = geometry.floor_bounds.get_or_insert((\n                        Vec3::splat(f32::INFINITY),\n                        Vec3::splat(f32::NEG_INFINITY),\n                    ));\n                    for \u0026point in \u0026vertices {\n                        bounds.0 = bounds.0.min(point);\n                        bounds.1 = bounds.1.max(point);\n                    }\n                }\n                if let Some(group) = \u0026ramp {\n                    let bounds = geometry\n                        .ramps\n                        .entry(group.clone())\n                        .or_insert((Vec3::splat(f32::INFINITY), Vec3::splat(f32::NEG_INFINITY)));\n                    for point in vertices {\n                        bounds.0 = bounds.0.min(point);\n                        bounds.1 = bounds.1.max(point);\n                    }\n                } else {\n                    let start = geometry.vertices.len() as u32;\n                    geometry.vertices.extend(vertices);\n                    geometry.indices.push([start, start + 1, start + 2]);\n                }\n            }\n        }\n    }\n    if let Ok(children_of_entity) = children.get(entity) {\n        for \u0026child in children_of_entity {\n            collect_geometry(\n                child, matrix, true, part_name, asset, children, nodes, meshes, geometry,\n            )?;\n        }\n    }\n    Ok(())\n}\n\n/// 模型命名只在美术导入边界解释，草、海水、叶片和人物不会成为隐形障碍。\nfn solid_mesh(asset: \u0026str, name: \u0026str) -\u003e bool {\n    if asset.starts_with(\"bld_\") || asset == \"env_island_terrain\" || asset == \"env_dock\" {\n        return true;\n    }\n    if asset == \"env_stairs_railings\" {\n        return stair_group(asset, name).is_none();\n    }\n    if asset.starts_with(\"prop_palm_\") {\n        return name.contains(\"Bent trunk segment\");\n    }\n    matches!(\n        asset,\n        \"prop_mailbox\" | \"prop_bench\" | \"prop_planter\" | \"prop_street_lamp\" | \"prop_dock_bollard\"\n    )\n}\n\nfn stair_group(asset: \u0026str, name: \u0026str) -\u003e Option\u003cString\u003e {\n    if asset != \"env_stairs_railings\" || !(name.contains(\"_step_\") || name.contains(\"Home_steps_\"))\n    {\n        return None;\n    }\n    name.rsplit_once('_').map(|(group, _)| group.to_owned())\n}\n\nfn stair_ramp(min: Vec3, max: Vec3) -\u003e Collider {\n    let front = max.z + 0.36;\n    let bottom = min.y - 0.05;\n    // 楔体顶从地面升到平台，向前延长一踏面；所有当前入口朝导出坐标 +Z。\n    Collider::convex_hull(vec![\n        Vec3::new(min.x, bottom, front),\n        Vec3::new(max.x, bottom, front),\n        Vec3::new(min.x, bottom, min.z),\n        Vec3::new(max.x, bottom, min.z),\n        Vec3::new(min.x, max.y, min.z),\n        Vec3::new(max.x, max.y, min.z),\n        Vec3::new(min.x, min.y, front),\n        Vec3::new(max.x, min.y, front),\n    ])\n    .expect(\"Stair bounds must produce a non-degenerate ramp\")\n}\n\nfn courier_visual(scene: Handle\u003cWorldAsset\u003e, gltf: Handle\u003cGltf\u003e) -\u003e impl Scene {\n    bsn! { Name(\"Courier visual\") CharacterVisual CourierVisual(gltf) WorldAssetRoot(scene) }\n}\n\nfn courier_scene(pose: Transform, scene: Handle\u003cWorldAsset\u003e, gltf: Handle\u003cGltf\u003e) -\u003e impl Scene {\n    bsn! {\n        Name(\"Courier\")\n        Character\n        CharacterIntent\n        CharacterMotion { grounded: false }\n        SpawnPoint(pose)\n        template_value(pose)\n        Visibility\n        Children [courier_visual(scene, gltf)]\n    }\n}\n\nfn carryable_scene(model: ItemModel, pose: Transform, scene: Handle\u003cWorldAsset\u003e) -\u003e impl Scene {\n    let grip = Vec3::new(\n        0.0,\n        1.3,\n        if model == ItemModel::WoodenCrate {\n            -0.62\n        } else {\n            -0.48\n        },\n    );\n    bsn! {\n        Name({model.name()})\n        Parcel\n        Pickable\n        CarryGrip(grip)\n        template_value(model)\n        SpawnPoint(pose)\n        template_value(pose)\n        Visibility\n        Children [(Name(\"Carryable visual\") WorldAssetRoot(scene))]\n    }\n}\n\nfn spawn_actors(\n    mut commands: Commands,\n    maps: Query\u003c(Entity, \u0026IslandReady), Without\u003cActorsSpawned\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    assets: Res\u003cArtAssets\u003e,\n    gltfs: Res\u003cAssets\u003cGltf\u003e\u003e,\n    loading_camera: Query\u003cEntity, With\u003cLoadingCamera\u003e\u003e,\n) {\n    for (map, placement) in \u0026maps {\n        let courier = \u0026gltfs\n            .get(\u0026assets.courier)\n            .expect(\"Ready courier must be loaded\")\n            .scenes[0];\n        // BSN 负责实体结构；已有无窗口物理回归的 Bundle 工厂继续统一刚体参数。\n        let character = commands\n            .spawn_scene(courier_scene(\n                placement.player,\n                courier.clone(),\n                assets.courier.clone(),\n            ))\n            .insert((character_body(\u0026config), DespawnOnExit(AppState::InGame)))\n            .id();\n        let controller = spawn_keyboard_controller(\u0026mut commands, PlayerId(1), character);\n        commands\n            .entity(controller)\n            .insert(DespawnOnExit(AppState::InGame));\n        for item in \u0026placement.items {\n            let scene = gltfs\n                .get(assets.item(item.model))\n                .expect(\"Ready item must be loaded\")\n                .scenes[0]\n                .clone();\n            let mut entity = commands.spawn_scene(carryable_scene(item.model, item.pose, scene));\n            entity.insert((parcel_body(\u0026config), DespawnOnExit(AppState::InGame)));\n            if item.model == ItemModel::WoodenCrate {\n                // 木箱边框超出纸箱尺寸，中心偏移来自导出几何，视觉与碰撞使用相同米制比例。\n                entity.insert(Collider::compound(vec![(\n                    Vec3::new(0.0, 0.01625, 0.01625),\n                    Quat::IDENTITY,\n                    Collider::cuboid(0.84, 0.6825, 0.8145),\n                )]));\n            }\n            let parcel = entity.id();\n            info!(target: \"demo::scene\", ?parcel, model = item.model.name(), position = ?item.pose.translation,\n                reason = \"island_ready\", \"Carryable item spawned\");\n        }\n        let orbit = OrbitCamera::new(character);\n        let camera_transform = orbit.transform(placement.player.translation);\n        let camera = loading_camera\n            .single()\n            .expect(\"One loading camera must exist\");\n        commands.entity(camera).remove::\u003cLoadingCamera\u003e().insert((\n            Name::new(\"Courier orbit camera\"),\n            orbit,\n            MouseLookState::default(),\n            camera_transform,\n        ));\n        commands.entity(controller).insert(ControlsCamera(camera));\n        commands.entity(map).insert(ActorsSpawned);\n        info!(target: \"demo::camera\", ?camera, ?character, ?controller,\n            position = ?camera_transform.translation, perspective = \"third_person\", reason = \"island_ready\", \"Orbit camera spawned\");\n        info!(target: \"demo::scene\", ?character, ?controller, player_id = 1,\n            position = ?placement.player.translation, reason = \"island_ready\", \"Character and local controller spawned\");\n    }\n}\n\n#[cfg(test)]\n#[path = \"scene_tests.rs\"]\nmod tests;\n"},{"path":"src/session_log.rs","text":"//! 为每次游玩保留独立会话文件，并将文件和控制台 I/O 移出游戏线程。\n\nuse std::{\n    cell::Cell,\n    fs::{self, File, OpenOptions},\n    io::{self, Write},\n    path::{Path, PathBuf},\n    sync::{Arc, Mutex, mpsc},\n    thread::{self, JoinHandle, ThreadId},\n    time::{SystemTime, UNIX_EPOCH},\n};\n\nuse bevy::{\n    app::{App, AppExit},\n    ecs::resource::Resource,\n    log::{BoxedFmtLayer, BoxedLayer, error, info, tracing_subscriber},\n};\nuse tracing_subscriber::{fmt::MakeWriter, prelude::*};\nuse uuid::Uuid;\n\n/// 保留会话文件到应用退出，并负责退出时刷新日志。\npub struct SessionLogGuard {\n    writer: SessionWriter,\n    console: ConsoleWriter,\n    file_worker: LogWorker,\n    console_worker: LogWorker,\n    session_id: Uuid,\n}\n\n/// 准备会话文件并暂存写入器；创建目录或文件失败时返回错误。\n///\n/// 必须在添加 `LogPlugin` 前调用，并将返回值保留到退出记录写入后。\npub fn prepare(app: \u0026mut App) -\u003e io::Result\u003cSessionLogGuard\u003e {\n    let guard = create_session_file(Path::new(\"logs\"))?;\n    app.insert_resource(guard.writer.clone());\n    app.insert_resource(guard.console.clone());\n    // 先安装异常记录，覆盖 LogPlugin 就绪后其他引擎插件的初始化过程。\n    guard.install_panic_hook();\n    Ok(guard)\n}\n\n/// 为 `LogPlugin::custom_layer` 提供文件输出，沿用 Bevy 的统一日志过滤。\n///\n/// 若未调用 `prepare` 或写入器已被取走，则 panic。\npub fn file_layer(app: \u0026mut App) -\u003e Option\u003cBoxedLayer\u003e {\n    // 写入器只在插件构建时传递，随后由日志 layer 持有，不占用玩法资源。\n    let writer = app\n        .world_mut()\n        .remove_resource::\u003cSessionWriter\u003e()\n        .expect(\"Session log must be prepared before adding LogPlugin\");\n    Some(\n        tracing_subscriber::fmt::layer()\n            .with_ansi(false)\n            .with_writer(writer)\n            // 格式层不得绕过队列同步回退 stderr；写入错误由退出/关闭屏障反馈。\n            .log_internal_errors(false)\n            .boxed(),\n    )\n}\n\n/// 覆盖 Bevy 默认的同步 stderr 格式层，格式与过滤保持不变。\npub fn console_layer(app: \u0026mut App) -\u003e Option\u003cBoxedFmtLayer\u003e {\n    let writer = app\n        .world_mut()\n        .remove_resource::\u003cConsoleWriter\u003e()\n        .expect(\"Session log must be prepared before adding LogPlugin\");\n    // 返回 Some 才会覆盖默认 stderr；None 会使 Bevy 恢复同步控制台输出。\n    Some(Box::new(\n        tracing_subscriber::fmt::layer()\n            .with_writer(writer)\n            // 控制台故障也不能阻塞普通日志或 panic 的文件同步。\n            .log_internal_errors(false),\n    ))\n}\n\nimpl SessionLogGuard {\n    fn install_panic_hook(\u0026self) {\n        let previous_hook = std::panic::take_hook();\n        let panic_writer = self.writer.clone();\n        let session_id = self.session_id;\n        std::panic::set_hook(Box::new(move |panic_info| {\n            // 工作线程异常由其 catch_unwind 保存并在写入/刷新时反馈，不能等待自己排空。\n            if IN_LOG_WORKER.with(Cell::get) {\n                return;\n            }\n            error!(\n                target: \"demo::session_log\",\n                %session_id,\n                path = %panic_writer.path.display(),\n                error = %panic_info,\n                \"Session panicked\"\n            );\n            // 优先排空文件队列并 sync_data；控制台阻塞不能影响异常上下文落盘。\n            if let Err(err) = panic_writer.sync() {\n                eprintln!(\"Failed to sync log {}: {err}\", panic_writer.path.display());\n            }\n            previous_hook(panic_info);\n        }));\n    }\n\n    /// 在 `LogPlugin` 初始化后写入会话开始信息。\n    pub fn start(\u0026self) {\n        info!(\n            target: \"demo::session_log\",\n            session_id = %self.session_id,\n            path = %self.writer.path.display(),\n            version = env!(\"CARGO_PKG_VERSION\"),\n            bevy_version = \"0.19.1\",\n            state_before = \"not_started\",\n            state_after = \"initializing\",\n            reason = \"user_started_program\",\n            \"Session started\"\n        );\n    }\n\n    /// 记录 Bevy 返回的退出状态，并排空两路输出；应在 `App::run` 返回后调用。\n    pub fn record_exit(\u0026self, exit: \u0026AppExit) -\u003e io::Result\u003c()\u003e {\n        match exit {\n            AppExit::Success =\u003e info!(\n                target: \"demo::session_log\",\n                session_id = %self.session_id,\n                state_before = \"running\",\n                state_after = \"exited\",\n                reason = \"AppExit::Success\",\n                \"Session exited normally\"\n            ),\n            AppExit::Error(code) =\u003e error!(\n                target: \"demo::session_log\",\n                session_id = %self.session_id,\n                state_before = \"running\",\n                state_after = \"exited\",\n                exit_code = code.get(),\n                reason = \"AppExit::Error\",\n                \"Session exited with an error\"\n            ),\n        }\n        let file = self.writer.flush_file();\n        let console = self.console.0.flush_output();\n        file.and(console)\n    }\n}\n\nimpl Drop for SessionLogGuard {\n    fn drop(\u0026mut self) {\n        // 全局日志 layer 仍持有 sender，必须显式停止线程，不能依赖 sender 的析构。\n        if let Err(err) = self.file_worker.shutdown() {\n            eprintln!(\"Failed to close log {}: {err}\", self.writer.path.display());\n        }\n        if let Err(err) = self.console_worker.shutdown() {\n            eprintln!(\"Failed to close console logging: {err}\");\n        }\n    }\n}\n\nfn create_session_file(directory: \u0026Path) -\u003e io::Result\u003cSessionLogGuard\u003e {\n    fs::create_dir_all(directory).map_err(|err| {\n        io::Error::new(\n            err.kind(),\n            format!(\n                \"Failed to create log directory {}: {err}\",\n                directory.display()\n            ),\n        )\n    })?;\n    let timestamp = SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .map_err(io::Error::other)?;\n    let session_id = Uuid::new_v4();\n    // 文件名使用 Unix 时间戳；每条日志的时间由 tracing 格式化为可读的 UTC 时间。\n    let path = directory.join(format!(\n        \"unix-{}-{:09}_{session_id}.log\",\n        timestamp.as_secs(),\n        timestamp.subsec_nanos()\n    ));\n    let file = OpenOptions::new()\n        .write(true)\n        .create_new(true)\n        .open(\u0026path)\n        .map_err(|err| {\n            io::Error::new(\n                err.kind(),\n                format!(\"Failed to create session log {}: {err}\", path.display()),\n            )\n        })?;\n    let file_worker =\n        LogWorker::spawn(Box::new(file), path.display().to_string(), \"demo-log-file\")?;\n    let console_worker = LogWorker::spawn(\n        Box::new(io::stderr()),\n        \"stderr\".to_owned(),\n        \"demo-log-console\",\n    )?;\n    Ok(SessionLogGuard {\n        writer: SessionWriter {\n            output: file_worker.writer.clone(),\n            path: Arc::new(path),\n        },\n        console: ConsoleWriter(console_worker.writer.clone()),\n        file_worker,\n        console_worker,\n        session_id,\n    })\n}\n\n#[derive(Clone, Resource)]\nstruct SessionWriter {\n    output: QueuedWriter,\n    path: Arc\u003cPathBuf\u003e,\n}\n\nimpl SessionWriter {\n    fn flush_file(\u0026self) -\u003e io::Result\u003c()\u003e {\n        self.output.flush_output()\n    }\n\n    fn sync(\u0026self) -\u003e io::Result\u003c()\u003e {\n        self.output.barrier(Barrier::Sync)\n    }\n}\n\ntrait LogSink: Write + Send {\n    fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        self.flush()\n    }\n}\n\nimpl LogSink for File {\n    fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        self.flush()?;\n        self.sync_data()\n    }\n}\n\nimpl LogSink for io::Stderr {}\n\n#[derive(Clone, Resource)]\nstruct ConsoleWriter(QueuedWriter);\n\nimpl\u003c'a\u003e MakeWriter\u003c'a\u003e for ConsoleWriter {\n    type Writer = QueuedWriter;\n\n    fn make_writer(\u0026'a self) -\u003e Self::Writer {\n        self.0.clone()\n    }\n}\n\nimpl\u003c'a\u003e MakeWriter\u003c'a\u003e for SessionWriter {\n    type Writer = Self;\n\n    fn make_writer(\u0026'a self) -\u003e Self::Writer {\n        self.clone()\n    }\n}\n\nimpl Write for SessionWriter {\n    fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n        self.output.write(buffer)\n    }\n\n    fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        self.flush_file()\n    }\n}\n\nthread_local! {\n    static IN_LOG_WORKER: Cell\u003cbool\u003e = const { Cell::new(false) };\n}\n\n#[derive(Clone, Copy)]\nenum Barrier {\n    Flush,\n    Sync,\n    Shutdown,\n}\n\nenum OutputCommand {\n    Record(Vec\u003cu8\u003e),\n    Barrier(Barrier, mpsc::Sender\u003cio::Result\u003c()\u003e\u003e),\n}\n\n#[derive(Clone)]\nstruct OutputFailure {\n    kind: io::ErrorKind,\n    message: String,\n}\n\nimpl OutputFailure {\n    fn error(\u0026self) -\u003e io::Error {\n        io::Error::new(self.kind, self.message.clone())\n    }\n}\n\n// 锁只保护首个 I/O 错误；工作线程执行 Write 时不持锁，生产线程不会等待慢设备。\ntype FailureState = Arc\u003cMutex\u003cOption\u003cOutputFailure\u003e\u003e\u003e;\n\n#[derive(Clone)]\nstruct QueuedWriter {\n    queue: Arc\u003cMutex\u003cOutputQueue\u003e\u003e,\n    failure: FailureState,\n    worker_id: ThreadId,\n    label: Arc\u003cstr\u003e,\n}\n\nstruct OutputQueue {\n    sender: mpsc::Sender\u003cOutputCommand\u003e,\n    closing: bool,\n}\n\nimpl QueuedWriter {\n    fn failure(\u0026self) -\u003e io::Result\u003c()\u003e {\n        failure_result(\u0026self.failure)\n    }\n\n    fn disconnected(\u0026self) -\u003e io::Error {\n        self.failure().err().unwrap_or_else(|| {\n            io::Error::new(\n                io::ErrorKind::BrokenPipe,\n                format!(\"Log worker disconnected: {}\", self.label),\n            )\n        })\n    }\n\n    fn barrier(\u0026self, barrier: Barrier) -\u003e io::Result\u003c()\u003e {\n        if thread::current().id() == self.worker_id {\n            return Err(io::Error::new(\n                io::ErrorKind::WouldBlock,\n                \"Log worker cannot wait on its own queue\",\n            ));\n        }\n        let (sender, receiver) = mpsc::channel();\n        self.enqueue(OutputCommand::Barrier(barrier, sender))?;\n        receiver.recv().map_err(|_| self.disconnected())?\n    }\n\n    fn enqueue(\u0026self, command: OutputCommand) -\u003e io::Result\u003c()\u003e {\n        // 提交与关闭共用短锁，避免 Shutdown 后仍返回写入成功却遗失尾部记录。\n        // 此锁不跨越设备 I/O 或屏障等待，因此控制台/文件堵塞不会传回生产线程。\n        let mut queue = self\n            .queue\n            .lock()\n            .unwrap_or_else(|poisoned| poisoned.into_inner());\n        if queue.closing {\n            return Err(io::Error::new(\n                io::ErrorKind::BrokenPipe,\n                format!(\"Log output is closed: {}\", self.label),\n            ));\n        }\n        if matches!(command, OutputCommand::Barrier(Barrier::Shutdown, _)) {\n            queue.closing = true;\n        }\n        queue.sender.send(command).map_err(|_| self.disconnected())\n    }\n\n    fn flush_output(\u0026self) -\u003e io::Result\u003c()\u003e {\n        self.barrier(Barrier::Flush)\n    }\n}\n\nimpl\u003c'a\u003e MakeWriter\u003c'a\u003e for QueuedWriter {\n    type Writer = Self;\n\n    fn make_writer(\u0026'a self) -\u003e Self::Writer {\n        self.clone()\n    }\n}\n\nimpl Write for QueuedWriter {\n    fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n        self.failure()?;\n        // 无界队列保留每条关键状态，不使用丢弃或等待慢设备的有界队列。\n        self.enqueue(OutputCommand::Record(buffer.to_vec()))?;\n        Ok(buffer.len())\n    }\n\n    fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        self.flush_output()\n    }\n}\n\nstruct LogWorker {\n    writer: QueuedWriter,\n    thread: Option\u003cJoinHandle\u003c()\u003e\u003e,\n}\n\nimpl LogWorker {\n    fn spawn(mut sink: Box\u003cdyn LogSink\u003e, label: String, name: \u0026str) -\u003e io::Result\u003cSelf\u003e {\n        let (sender, receiver) = mpsc::channel();\n        let failure: FailureState = Arc::new(Mutex::new(None));\n        let worker_failure = failure.clone();\n        let label: Arc\u003cstr\u003e = label.into();\n        let worker_label = label.clone();\n        let thread = thread::Builder::new()\n            .name(name.to_owned())\n            .spawn(move || {\n                IN_LOG_WORKER.with(|flag| flag.set(true));\n                let result = std::panic::catch_unwind(std::panic::AssertUnwindSafe(|| {\n                    while let Ok(command) = receiver.recv() {\n                        match command {\n                            OutputCommand::Record(bytes) =\u003e {\n                                // 每条记录仍及时刷新；I/O 由独立线程执行，阻塞控制台不拖住文件。\n                                if let Err(error) =\n                                    sink.write_all(\u0026bytes).and_then(|()| sink.flush())\n                                {\n                                    record_failure(\u0026worker_failure, \u0026worker_label, error);\n                                }\n                            }\n                            OutputCommand::Barrier(barrier, reply) =\u003e {\n                                let result = match barrier {\n                                    Barrier::Sync =\u003e sink.sync(),\n                                    Barrier::Flush | Barrier::Shutdown =\u003e sink.flush(),\n                                };\n                                if let Err(error) = result {\n                                    record_failure(\u0026worker_failure, \u0026worker_label, error);\n                                }\n                                let _ = reply.send(failure_result(\u0026worker_failure));\n                                if matches!(barrier, Barrier::Shutdown) {\n                                    break;\n                                }\n                            }\n                        }\n                    }\n                }));\n                if let Err(payload) = result {\n                    let message = payload\n                        .downcast_ref::\u003c\u0026str\u003e()\n                        .copied()\n                        .or_else(|| payload.downcast_ref::\u003cString\u003e().map(String::as_str))\n                        .unwrap_or(\"Unknown panic payload\");\n                    record_failure(\n                        \u0026worker_failure,\n                        \u0026worker_label,\n                        io::Error::other(format!(\"Log worker panicked: {message}\")),\n                    );\n                }\n            })?;\n        Ok(Self {\n            writer: QueuedWriter {\n                queue: Arc::new(Mutex::new(OutputQueue {\n                    sender,\n                    closing: false,\n                })),\n                failure,\n                worker_id: thread.thread().id(),\n                label,\n            },\n            thread: Some(thread),\n        })\n    }\n\n    fn shutdown(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        let Some(thread) = self.thread.take() else {\n            return Ok(());\n        };\n        let drained = self.writer.barrier(Barrier::Shutdown);\n        let joined = thread\n            .join()\n            .map_err(|_| io::Error::other(\"Failed to join log worker\"));\n        drained.and(joined)\n    }\n}\n\nimpl Drop for LogWorker {\n    fn drop(\u0026mut self) {\n        if let Err(error) = self.shutdown() {\n            eprintln!(\"Failed to close log worker {}: {error}\", self.writer.label);\n        }\n    }\n}\n\nfn record_failure(failure: \u0026FailureState, label: \u0026str, error: io::Error) {\n    let mut failure = failure\n        .lock()\n        .unwrap_or_else(|poisoned| poisoned.into_inner());\n    if failure.is_none() {\n        *failure = Some(OutputFailure {\n            kind: error.kind(),\n            message: format!(\"Failed to write or flush log output {label}: {error}\"),\n        });\n    }\n}\n\nfn failure_result(failure: \u0026FailureState) -\u003e io::Result\u003c()\u003e {\n    let failure = failure\n        .lock()\n        .unwrap_or_else(|poisoned| poisoned.into_inner());\n    match failure.as_ref() {\n        Some(failure) =\u003e Err(failure.error()),\n        None =\u003e Ok(()),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::{sync::mpsc, thread, time::Duration};\n\n    struct BlockedSink {\n        entered: mpsc::Sender\u003c()\u003e,\n        release: mpsc::Receiver\u003c()\u003e,\n        contents: Arc\u003cMutex\u003cVec\u003cu8\u003e\u003e\u003e,\n        first_write: bool,\n    }\n\n    impl Write for BlockedSink {\n        fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n            if self.first_write {\n                self.first_write = false;\n                self.entered.send(()).unwrap();\n                self.release.recv().unwrap();\n            }\n            self.contents.lock().unwrap().extend_from_slice(buffer);\n            Ok(buffer.len())\n        }\n\n        fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            Ok(())\n        }\n    }\n\n    impl LogSink for BlockedSink {}\n\n    #[test]\n    fn blocked_sink_does_not_block_tracing_producer() {\n        let (entered_tx, entered_rx) = mpsc::channel();\n        let (release_tx, release_rx) = mpsc::channel();\n        let (done_tx, done_rx) = mpsc::channel();\n        let contents = Arc::new(Mutex::new(Vec::new()));\n        let mut worker = LogWorker::spawn(\n            Box::new(BlockedSink {\n                entered: entered_tx,\n                release: release_rx,\n                contents: contents.clone(),\n                first_write: true,\n            }),\n            \"controlled-test-sink\".to_owned(),\n            \"demo-log-test\",\n        )\n        .unwrap();\n        let writer = worker.writer.clone();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(writer.clone())\n            .finish();\n        let dispatch = bevy::log::tracing::Dispatch::new(subscriber);\n        let initial_dispatch = dispatch.clone();\n        let initial = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026initial_dispatch, || {\n                info!(target: \"demo::test\", \"Blocking sink entered\");\n            });\n        });\n        entered_rx.recv_timeout(Duration::from_secs(2)).unwrap();\n        let producer = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026dispatch, || {\n                info!(target: \"demo::gameplay\", grounded_after = true, \"Character grounded state changed\");\n                info!(target: \"demo::gameplay\", \"Character landed\");\n            });\n            done_tx.send(()).unwrap();\n        });\n        // 门闩尚未释放时确认生产线程返回；超时只用于检测死锁，不比较硬件耗时。\n        let completed_while_blocked = done_rx.recv_timeout(Duration::from_secs(2)).is_ok();\n        release_tx.send(()).unwrap();\n        initial.join().unwrap();\n        producer.join().unwrap();\n        writer.flush_output().unwrap();\n        worker.shutdown().unwrap();\n        let contents = String::from_utf8(contents.lock().unwrap().clone()).unwrap();\n        assert!(contents.contains(\"Blocking sink entered\"));\n        assert!(\n            contents.find(\"grounded state changed\").unwrap()\n                \u003c contents.find(\"Character landed\").unwrap()\n        );\n        assert!(\n            completed_while_blocked,\n            \"Tracing producer waited for blocked log I/O\"\n        );\n    }\n\n    #[test]\n    fn blocked_console_does_not_block_file_or_producer() {\n        let directory = test_directory();\n        let path = directory.join(\"independent-workers.log\");\n        let (entered_tx, entered_rx) = mpsc::channel();\n        let (release_tx, release_rx) = mpsc::channel();\n        let (done_tx, done_rx) = mpsc::channel();\n        let console_contents = Arc::new(Mutex::new(Vec::new()));\n        let mut file = LogWorker::spawn(\n            Box::new(File::create(\u0026path).unwrap()),\n            path.display().to_string(),\n            \"demo-log-test-file\",\n        )\n        .unwrap();\n        let mut console = LogWorker::spawn(\n            Box::new(BlockedSink {\n                entered: entered_tx,\n                release: release_rx,\n                contents: console_contents.clone(),\n                first_write: true,\n            }),\n            \"controlled-console\".to_owned(),\n            \"demo-log-test-console\",\n        )\n        .unwrap();\n        let subscriber = tracing_subscriber::registry()\n            .with(\n                tracing_subscriber::fmt::layer()\n                    .with_ansi(false)\n                    .with_writer(file.writer.clone()),\n            )\n            .with(\n                tracing_subscriber::fmt::layer()\n                    .with_ansi(false)\n                    .with_writer(console.writer.clone()),\n            );\n        let dispatch = bevy::log::tracing::Dispatch::new(subscriber);\n        let initial_dispatch = dispatch.clone();\n        let initial = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026initial_dispatch, || {\n                info!(target: \"demo::test\", \"Blocking console entered\");\n            });\n        });\n        entered_rx.recv_timeout(Duration::from_secs(2)).unwrap();\n        let file_writer = file.writer.clone();\n        let producer = thread::spawn(move || {\n            bevy::log::tracing::dispatcher::with_default(\u0026dispatch, || {\n                info!(target: \"demo::gameplay\", grounded_after = true, \"Character grounded state changed\");\n                info!(target: \"demo::gameplay\", \"Character landed\");\n                info!(target: \"demo::session_log\", \"Session exited normally\");\n            });\n            done_tx.send(file_writer.flush_output()).unwrap();\n        });\n        // 控制台门闩保持关闭时，生产与文件刷新都必须完成。\n        let completed = done_rx.recv_timeout(Duration::from_secs(2));\n        let file_contents = fs::read_to_string(\u0026path).unwrap();\n        release_tx.send(()).unwrap();\n        initial.join().unwrap();\n        producer.join().unwrap();\n        file.shutdown().unwrap();\n        console.shutdown().unwrap();\n        let console_contents = String::from_utf8(console_contents.lock().unwrap().clone()).unwrap();\n        fs::remove_file(\u0026path).unwrap();\n        remove_test_directory(directory);\n\n        completed\n            .expect(\"Blocked console stalled file or producer\")\n            .unwrap();\n        for contents in [file_contents, console_contents] {\n            let mut previous = 0;\n            for expected in [\n                \"Blocking console entered\",\n                \"Character grounded state changed\",\n                \"Character landed\",\n                \"Session exited normally\",\n            ] {\n                let offset = contents.find(expected).unwrap();\n                assert!(offset \u003e= previous, \"Log order changed: {contents}\");\n                previous = offset;\n                assert_eq!(contents.matches(expected).count(), 1);\n            }\n        }\n    }\n\n    #[test]\n    fn shutdown_drains_all_queued_records() {\n        let directory = test_directory();\n        let guard = create_session_file(\u0026directory).unwrap();\n        let path = guard.writer.path.as_ref().clone();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(guard.writer.clone())\n            .finish();\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            for sequence in 0..1_000 {\n                info!(target: \"demo::test\", sequence, \"Queued state change\");\n            }\n        });\n        // 不提前刷新，直接析构必须排空所有已提交记录并关闭文件。\n        drop(guard);\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        assert_eq!(contents.lines().count(), 1_000);\n        for (sequence, line) in contents.lines().enumerate() {\n            assert!(line.ends_with(\u0026format!(\"sequence={sequence}\")));\n        }\n        fs::remove_file(path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn shutdown_rejects_new_records_and_drains_accepted_records() {\n        let (entered_tx, entered_rx) = mpsc::channel();\n        let (release_tx, release_rx) = mpsc::channel();\n        let (closed_tx, closed_rx) = mpsc::channel();\n        let contents = Arc::new(Mutex::new(Vec::new()));\n        let mut worker = LogWorker::spawn(\n            Box::new(BlockedSink {\n                entered: entered_tx,\n                release: release_rx,\n                contents: contents.clone(),\n                first_write: true,\n            }),\n            \"controlled-close-sink\".to_owned(),\n            \"demo-log-test-close\",\n        )\n        .unwrap();\n        worker.writer.write_all(b\"Accepted record\\n\").unwrap();\n        entered_rx.recv_timeout(Duration::from_secs(2)).unwrap();\n        let mut writer = worker.writer.clone();\n        let closing = thread::spawn(move || {\n            let result = worker.shutdown();\n            closed_tx.send(result).unwrap();\n        });\n        // 等到关闭命令入队；设备仍在门闩中，所以不能依赖 join 已完成才检测拒收。\n        let deadline = std::time::Instant::now() + Duration::from_secs(2);\n        let mut closed = false;\n        while std::time::Instant::now() \u003c deadline {\n            closed = writer.queue.lock().unwrap().closing;\n            if closed {\n                break;\n            }\n            thread::yield_now();\n        }\n        let rejected = writer.write_all(b\"Rejected record\\n\");\n        let waiting_for_drain = matches!(closed_rx.try_recv(), Err(mpsc::TryRecvError::Empty));\n        release_tx.send(()).unwrap();\n        closing.join().unwrap();\n        closed_rx.recv().unwrap().unwrap();\n        assert!(closed, \"Shutdown was not queued\");\n        assert!(\n            waiting_for_drain,\n            \"Shutdown did not wait for the accepted record\"\n        );\n        assert_eq!(rejected.unwrap_err().kind(), io::ErrorKind::BrokenPipe);\n        assert_eq!(*contents.lock().unwrap(), b\"Accepted record\\n\");\n    }\n\n    #[derive(Clone, Copy)]\n    enum Fault {\n        Write,\n        Flush,\n        Sync,\n        Panic,\n    }\n\n    struct FaultSink(Fault);\n\n    impl Write for FaultSink {\n        fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n            match self.0 {\n                Fault::Write =\u003e Err(io::Error::new(io::ErrorKind::StorageFull, \"Test disk full\")),\n                Fault::Panic =\u003e panic!(\"Test writer panic\"),\n                _ =\u003e Ok(buffer.len()),\n            }\n        }\n\n        fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            match self.0 {\n                Fault::Flush =\u003e Err(io::Error::other(\"Test flush failure\")),\n                _ =\u003e Ok(()),\n            }\n        }\n    }\n\n    impl LogSink for FaultSink {\n        fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            match self.0 {\n                Fault::Sync =\u003e Err(io::Error::other(\"Test sync failure\")),\n                _ =\u003e self.flush(),\n            }\n        }\n    }\n\n    #[test]\n    fn output_failures_are_reported_and_workers_join() {\n        for (fault, expected) in [\n            (Fault::Write, \"Test disk full\"),\n            (Fault::Flush, \"Test flush failure\"),\n            (Fault::Sync, \"Test sync failure\"),\n            (Fault::Panic, \"Test writer panic\"),\n        ] {\n            let mut worker = LogWorker::spawn(\n                Box::new(FaultSink(fault)),\n                \"controlled-failed-sink\".to_owned(),\n                \"demo-log-test-failure\",\n            )\n            .unwrap();\n            worker.writer.write_all(b\"Critical state change\\n\").unwrap();\n            let error = worker.writer.barrier(Barrier::Sync).unwrap_err();\n            assert!(error.to_string().contains(expected), \"{error}\");\n            assert!(error.to_string().contains(\"controlled-failed-sink\"));\n            assert!(worker.writer.write_all(b\"Next state\\n\").is_err());\n            assert!(\n                worker\n                    .shutdown()\n                    .unwrap_err()\n                    .to_string()\n                    .contains(expected)\n            );\n            assert!(worker.thread.is_none());\n        }\n    }\n\n    struct SyncSink {\n        contents: Arc\u003cMutex\u003cVec\u003cu8\u003e\u003e\u003e,\n        synced_contents: Arc\u003cMutex\u003cVec\u003cu8\u003e\u003e\u003e,\n    }\n\n    impl Write for SyncSink {\n        fn write(\u0026mut self, buffer: \u0026[u8]) -\u003e io::Result\u003cusize\u003e {\n            // 模拟短写，确认后台使用 write_all 而不是忽略未写完的尾部。\n            let length = buffer.len().min(7);\n            self.contents\n                .lock()\n                .unwrap()\n                .extend_from_slice(\u0026buffer[..length]);\n            Ok(length)\n        }\n\n        fn flush(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            Ok(())\n        }\n    }\n\n    impl LogSink for SyncSink {\n        fn sync(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            *self.synced_contents.lock().unwrap() = self.contents.lock().unwrap().clone();\n            Ok(())\n        }\n    }\n\n    #[test]\n    fn sync_barrier_waits_for_complete_prior_records() {\n        let contents = Arc::new(Mutex::new(Vec::new()));\n        let synced_contents = Arc::new(Mutex::new(Vec::new()));\n        let mut worker = LogWorker::spawn(\n            Box::new(SyncSink {\n                contents,\n                synced_contents: synced_contents.clone(),\n            }),\n            \"controlled-sync-sink\".to_owned(),\n            \"demo-log-test-sync\",\n        )\n        .unwrap();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(worker.writer.clone())\n            .finish();\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            info!(target: \"demo::test\", \"Prior state change\");\n            error!(target: \"demo::session_log\", \"Session panicked\");\n        });\n        worker.writer.barrier(Barrier::Sync).unwrap();\n        let synced = String::from_utf8(synced_contents.lock().unwrap().clone()).unwrap();\n        assert_eq!(synced.lines().count(), 2);\n        assert!(\n            synced.find(\"Prior state change\").unwrap() \u003c synced.find(\"Session panicked\").unwrap()\n        );\n        worker.shutdown().unwrap();\n    }\n\n    #[test]\n    fn log_plugin_records_session_lifecycle() {\n        // 子进程只运行本测试并注册 LogPlugin，隔离全局 subscriber 和 panic hook。\n        // 不注册窗口、渲染或玩法插件，也不调用 App::run。\n        if std::env::var_os(\"DEMO_LOG_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let guard = prepare(\u0026mut app).unwrap();\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            info!(target: \"bevy::test\", \"Test engine initialized\");\n            info!(target: \"demo::test\", entity_id = 42, reason = \"pickup\", \"Test event recorded\");\n            bevy::log::debug!(target: \"demo::test\", \"Filtered debug event\");\n            bevy::log::warn!(target: \"wgpu\", \"Filtered graphics warning\");\n            assert!(std::panic::catch_unwind(|| panic!(\"Test panic context\")).is_err());\n            // panic hook 返回前已同步文件，不能依赖随后退出时的刷新才看到异常。\n            let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n            assert!(contents.contains(\"Session panicked\"));\n            assert!(contents.contains(\"Test panic context\"));\n            // 安装真实 Session hook 后，日志工作线程自身异常仍能结束，不能自等 Sync。\n            let mut failed_worker = LogWorker::spawn(\n                Box::new(FaultSink(Fault::Panic)),\n                \"controlled-hook-panic\".to_owned(),\n                \"demo-log-test-hook-panic\",\n            )\n            .unwrap();\n            failed_worker.writer.write_all(b\"Worker panic\\n\").unwrap();\n            assert!(failed_worker.writer.flush_output().is_err());\n            assert!(failed_worker.shutdown().is_err());\n            guard.record_exit(\u0026AppExit::Success).unwrap();\n            guard.record_exit(\u0026AppExit::error()).unwrap();\n            return;\n        }\n\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::log_plugin_records_session_lifecycle\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_TEST_CHILD\", \"1\")\n            .env_remove(\"RUST_LOG\")\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        for expected in [\n            \"Session started\",\n            \"version=\",\n            \"bevy_version=\",\n            \"session_id=\",\n            \"Test engine initialized\",\n            \"entity_id=42\",\n            \"reason=\\\"pickup\\\"\",\n            \"Session panicked\",\n            \"Test panic context\",\n            \"Session exited normally\",\n            \"Session exited with an error\",\n            \"exit_code=1\",\n        ] {\n            assert!(\n                contents.contains(expected),\n                \"Missing {expected}: {contents}\"\n            );\n        }\n        assert!(!contents.contains(\"Filtered debug event\"));\n        assert!(!contents.contains(\"Filtered graphics warning\"));\n        assert!(!contents.contains('\\u{1b}'));\n        assert!(stderr.contains(\"Session started\"));\n        assert!(stderr.contains(\"Test event recorded\"));\n        assert!(!stderr.contains(\"Could not set global\"));\n\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn log_plugin_preserves_explicit_rust_log_filter() {\n        if std::env::var_os(\"DEMO_LOG_FILTER_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let guard = prepare(\u0026mut app).unwrap();\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            info!(target: \"demo::quiet\", \"Filtered explicit info event\");\n            bevy::log::debug!(target: \"demo::test\", \"Enabled explicit debug event\");\n            bevy::log::warn!(target: \"wgpu\", \"Enabled explicit graphics warning\");\n            guard.record_exit(\u0026AppExit::Success).unwrap();\n            return;\n        }\n\n        // 子进程避免注册全局 subscriber；两路格式层应共享同一 Bevy EnvFilter。\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::log_plugin_preserves_explicit_rust_log_filter\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_FILTER_TEST_CHILD\", \"1\")\n            .env(\n                \"RUST_LOG\",\n                \"warn,demo::test=debug,demo::session_log=info,wgpu=warn\",\n            )\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        for contents in [\u0026contents, stderr.as_ref()] {\n            assert!(contents.contains(\"Enabled explicit debug event\"));\n            assert!(contents.contains(\"Enabled explicit graphics warning\"));\n            assert!(contents.contains(\"Session exited normally\"));\n            assert!(!contents.contains(\"Filtered explicit info event\"));\n        }\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn failed_console_does_not_fallback_to_synchronous_stderr_or_block_panic_file_sync() {\n        if std::env::var_os(\"DEMO_LOG_FAILED_CONSOLE_TEST_CHILD\").is_some() {\n            let mut app = App::new();\n            let mut guard = prepare(\u0026mut app).unwrap();\n            // 保留真实文件与 panic hook，只用可控 Write 故障替换控制台设备。\n            guard.console_worker.shutdown().unwrap();\n            guard.console_worker = LogWorker::spawn(\n                Box::new(FaultSink(Fault::Write)),\n                \"controlled-failed-console\".to_owned(),\n                \"demo-log-test-failed-console\",\n            )\n            .unwrap();\n            guard.console = ConsoleWriter(guard.console_worker.writer.clone());\n            app.insert_resource(guard.console.clone());\n            app.add_plugins(bevy::log::LogPlugin {\n                custom_layer: file_layer,\n                fmt_layer: console_layer,\n                ..Default::default()\n            });\n            guard.start();\n            assert!(guard.console.0.flush_output().is_err());\n            // 已知设备故障后仍走实际格式化路径，文件必须收到完整事件。\n            info!(target: \"demo::test\", \"Info event after console failure\");\n            error!(target: \"demo::test\", \"Error event after console failure\");\n            assert!(std::panic::catch_unwind(|| panic!(\"Panic after console failure\")).is_err());\n            let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n            for expected in [\n                \"Info event after console failure\",\n                \"Error event after console failure\",\n                \"Session panicked\",\n                \"Panic after console failure\",\n            ] {\n                assert!(\n                    contents.contains(expected),\n                    \"Missing {expected}: {contents}\"\n                );\n            }\n            // 故障保持可观察，不能为避免同步回退而把关闭结果误报为成功。\n            let error = guard.record_exit(\u0026AppExit::Success).unwrap_err();\n            assert!(error.to_string().contains(\"controlled-failed-console\"));\n            return;\n        }\n\n        let directory = test_directory();\n        let output = std::process::Command::new(std::env::current_exe().unwrap())\n            .args([\n                \"--exact\",\n                \"session_log::tests::failed_console_does_not_fallback_to_synchronous_stderr_or_block_panic_file_sync\",\n                \"--nocapture\",\n            ])\n            .env(\"DEMO_LOG_FAILED_CONSOLE_TEST_CHILD\", \"1\")\n            .env_remove(\"RUST_LOG\")\n            .current_dir(\u0026directory)\n            .output()\n            .unwrap();\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n        assert!(output.status.success(), \"{stderr}\");\n        assert!(!stderr.contains(\"[tracing-subscriber]\"), \"{stderr}\");\n        assert!(!stderr.contains(\"Unable to write\"), \"{stderr}\");\n        assert!(\n            stderr.contains(\"Failed to close console logging\"),\n            \"{stderr}\"\n        );\n        assert!(stderr.contains(\"Test disk full\"), \"{stderr}\");\n        let paths: Vec\u003c_\u003e = fs::read_dir(directory.join(\"logs\"))\n            .unwrap()\n            .map(|entry| entry.unwrap().path())\n            .collect();\n        assert_eq!(paths.len(), 1);\n        let contents = fs::read_to_string(\u0026paths[0]).unwrap();\n        assert!(contents.contains(\"Session exited normally\"));\n        fs::remove_file(\u0026paths[0]).unwrap();\n        remove_test_directory(directory.join(\"logs\"));\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn independent_sessions_preserve_previous_logs() {\n        let directory = test_directory();\n        let first = create_session_file(\u0026directory).unwrap();\n        let mut first_writer = first.writer.clone();\n        first_writer.write_all(b\"first session\\n\").unwrap();\n        first_writer.flush().unwrap();\n        let second = create_session_file(\u0026directory).unwrap();\n\n        assert_ne!(first.session_id, second.session_id);\n        assert_ne!(first.writer.path, second.writer.path);\n        // 刷新屏障保证磁盘已收到记录，后续会话也不会覆盖前次内容。\n        assert_eq!(\n            fs::read_to_string(first.writer.path.as_ref()).unwrap(),\n            \"first session\\n\"\n        );\n        assert!(\n            first\n                .writer\n                .path\n                .file_name()\n                .unwrap()\n                .to_str()\n                .unwrap()\n                .starts_with(\"unix-\")\n        );\n\n        let first_path = first.writer.path.as_ref().clone();\n        let second_path = second.writer.path.as_ref().clone();\n        drop(first_writer);\n        drop(first);\n        drop(second);\n        fs::remove_file(first_path).unwrap();\n        fs::remove_file(second_path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    #[test]\n    fn tracing_events_include_time_level_target_and_fields() {\n        let directory = test_directory();\n        let guard = create_session_file(\u0026directory).unwrap();\n        let subscriber = tracing_subscriber::fmt()\n            .with_ansi(false)\n            .with_writer(guard.writer.clone())\n            .finish();\n        // 局部 subscriber 不修改进程级日志设施，也不创建游戏 App 或窗口。\n        bevy::log::tracing::subscriber::with_default(subscriber, || {\n            info!(target: \"demo::test\", entity_id = 42, reason = \"pickup\", \"Test event recorded\");\n        });\n        guard.writer.flush_file().unwrap();\n        let contents = fs::read_to_string(guard.writer.path.as_ref()).unwrap();\n        assert!(contents.contains(\"INFO\"));\n        assert!(contents.contains(\"demo::test\"));\n        assert!(contents.contains(\"entity_id=42\"));\n        assert!(contents.contains(\"pickup\"));\n        assert!(contents.contains('T') \u0026\u0026 contents.contains('Z'));\n\n        let path = guard.writer.path.as_ref().clone();\n        drop(guard);\n        fs::remove_file(path).unwrap();\n        remove_test_directory(directory);\n    }\n\n    fn test_directory() -\u003e PathBuf {\n        let directory = Path::new(env!(\"CARGO_MANIFEST_DIR\"))\n            .join(\"tmp\")\n            .join(format!(\"session-log-test-{}\", Uuid::new_v4()));\n        fs::create_dir_all(\u0026directory).unwrap();\n        directory\n    }\n\n    fn remove_test_directory(directory: PathBuf) {\n        // Windows 删除文件成功后，目录项仍可能短暂处于待删除状态；只重试非递归清理。\n        let deadline = std::time::Instant::now() + Duration::from_secs(2);\n        loop {\n            match fs::remove_dir(\u0026directory) {\n                Err(error)\n                    if error.kind() == io::ErrorKind::DirectoryNotEmpty\n                        \u0026\u0026 std::time::Instant::now() \u003c deadline =\u003e\n                {\n                    thread::sleep(Duration::from_millis(10));\n                }\n                result =\u003e {\n                    result.unwrap();\n                    return;\n                }\n            }\n        }\n    }\n}\n"},{"path":"src/settings.rs","text":"//! 加载、编辑与保存玩家设置，并限制渲染循环；不改变固定步模拟频率。\n\nuse std::{\n    fs,\n    io::{self, Write},\n    num::NonZeroU32,\n    path::{Path, PathBuf},\n    time::{Duration, Instant},\n};\n\nuse bevy::{prelude::*, time::TimeSystems};\nuse serde::{Deserialize, Deserializer, Serialize, de::Error};\n\n/// 全局玩家设置；非零类型保证帧率上限始终能够转换为等待间隔。\n#[derive(Resource, Clone, Debug, Deserialize, Serialize)]\n#[serde(default, deny_unknown_fields)]\npub struct GameSettings {\n    /// 渲染循环每秒最多更新的次数，默认 60，配置值不得低于 60；不影响 `Time\u003cFixed\u003e`。\n    #[serde(deserialize_with = \"deserialize_max_fps\")]\n    pub max_fps: NonZeroU32,\n    /// 自由视角的鼠标灵敏度与纵轴方向。\n    pub camera: CameraSettings,\n}\n\nimpl Default for GameSettings {\n    fn default() -\u003e Self {\n        Self {\n            max_fps: NonZeroU32::new(60).unwrap(),\n            camera: CameraSettings::default(),\n        }\n    }\n}\n\n/// 自由视角配置；旧配置缺少本节或字段时使用默认值。\n#[derive(Debug, Clone, Copy, Deserialize, Serialize)]\n#[serde(default, deny_unknown_fields)]\npub struct CameraSettings {\n    /// 每像素对应的旋转弧度，必须是有限的正数。\n    #[serde(deserialize_with = \"deserialize_mouse_sensitivity\")]\n    pub mouse_sensitivity: f32,\n    /// 是否反转鼠标纵向移动对应的俯仰方向。\n    pub invert_y: bool,\n}\n\nimpl Default for CameraSettings {\n    fn default() -\u003e Self {\n        Self {\n            mouse_sensitivity: 0.003,\n            invert_y: false,\n        }\n    }\n}\n\n/// 设置文件的保存位置；测试可覆盖该资源而不触及玩家的真实配置。\n#[derive(Resource, Debug)]\npub struct SettingsFile(pub PathBuf);\n\nimpl Default for SettingsFile {\n    fn default() -\u003e Self {\n        Self(PathBuf::from(\"settings.json\"))\n    }\n}\n\n/// 菜单独立编辑的草稿；只有应用成功后才替换正在使用的设置资源。\n#[derive(Resource, Clone, Debug)]\npub struct SettingsDraft {\n    pub max_fps: u32,\n    pub mouse_sensitivity: f32,\n    pub invert_y: bool,\n}\n\nimpl Default for SettingsDraft {\n    fn default() -\u003e Self {\n        Self::from_settings(\u0026GameSettings::default())\n    }\n}\n\nimpl SettingsDraft {\n    /// 原样复制设置，打开菜单时保留文件中的有效自定义值。\n    pub fn from_settings(settings: \u0026GameSettings) -\u003e Self {\n        Self {\n            max_fps: settings.max_fps.get(),\n            mouse_sensitivity: settings.camera.mouse_sensitivity,\n            invert_y: settings.camera.invert_y,\n        }\n    }\n\n    /// 在应用边界校验草稿；文件允许的有效范围不受菜单步进范围限制。\n    pub fn to_settings(\u0026self) -\u003e io::Result\u003cGameSettings\u003e {\n        let max_fps = NonZeroU32::new(self.max_fps).ok_or_else(|| {\n            io::Error::new(io::ErrorKind::InvalidInput, \"max_fps must be at least 60\")\n        })?;\n        let settings = GameSettings {\n            max_fps,\n            camera: CameraSettings {\n                mouse_sensitivity: self.mouse_sensitivity,\n                invert_y: self.invert_y,\n            },\n        };\n        settings.validate()?;\n        Ok(settings)\n    }\n\n    /// 左右调整当前字段；自定义值只在用户实际调整该字段后进入菜单范围。\n    pub fn adjust(\u0026mut self, key: crate::ui::SettingKey, direction: i8) {\n        match key {\n            crate::ui::SettingKey::FrameRate =\u003e {\n                const OPTIONS: [u32; 6] = [60, 90, 120, 144, 165, 240];\n                if direction \u003e 0 {\n                    self.max_fps = OPTIONS\n                        .into_iter()\n                        .find(|\u0026fps| fps \u003e self.max_fps)\n                        .unwrap_or(240);\n                } else if direction \u003c 0 {\n                    self.max_fps = OPTIONS\n                        .into_iter()\n                        .rev()\n                        .find(|\u0026fps| fps \u003c self.max_fps)\n                        .unwrap_or(60);\n                }\n            }\n            crate::ui::SettingKey::MouseSensitivity =\u003e {\n                if direction != 0 {\n                    self.mouse_sensitivity = (self.mouse_sensitivity\n                        + 0.0005 * f32::from(direction.signum()))\n                    .clamp(0.0005, 0.02);\n                }\n            }\n            crate::ui::SettingKey::InvertY =\u003e self.invert_y = !self.invert_y,\n        }\n    }\n}\n\nfn deserialize_max_fps\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cNonZeroU32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = NonZeroU32::deserialize(deserializer)?;\n    // 在加载边界检查下限，避免低于支持范围的配置进入限帧系统。\n    if value.get() \u003c 60 {\n        return Err(D::Error::custom(\"max_fps must be at least 60\"));\n    }\n    Ok(value)\n}\n\nfn deserialize_mouse_sensitivity\u003c'de, D\u003e(deserializer: D) -\u003e Result\u003cf32, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let value = f32::deserialize(deserializer)?;\n    // 在加载边界拒绝无效角速度，避免非有限值进入 Transform 的旋转计算。\n    if !value.is_finite() || value \u003c= 0.0 {\n        return Err(D::Error::custom(\n            \"camera mouse_sensitivity must be finite and greater than zero\",\n        ));\n    }\n    Ok(value)\n}\n\nimpl GameSettings {\n    fn validate(\u0026self) -\u003e io::Result\u003c()\u003e {\n        if self.max_fps.get() \u003c 60 {\n            return Err(io::Error::new(\n                io::ErrorKind::InvalidInput,\n                \"max_fps must be at least 60\",\n            ));\n        }\n        if !self.camera.mouse_sensitivity.is_finite() || self.camera.mouse_sensitivity \u003c= 0.0 {\n            return Err(io::Error::new(\n                io::ErrorKind::InvalidInput,\n                \"camera mouse_sensitivity must be finite and greater than zero\",\n            ));\n        }\n        Ok(())\n    }\n\n    /// 读取 JSON 设置；缺失或读取、解析失败时记录原因并使用默认值，不覆盖原文件。\n    pub fn load(path: \u0026Path) -\u003e Self {\n        let settings = match read_settings(path) {\n            Ok(settings) =\u003e settings,\n            Err(error) if error.kind() == io::ErrorKind::NotFound =\u003e {\n                info!(\n                    target: \"demo::settings\",\n                    path = %path.display(),\n                    reason = \"settings_file_missing\",\n                    \"Using default game settings\"\n                );\n                Self::default()\n            }\n            Err(error) =\u003e {\n                warn!(\n                    target: \"demo::settings\",\n                    operation = \"load_settings\",\n                    path = %path.display(),\n                    %error,\n                    fallback_max_fps = Self::default().max_fps.get(),\n                    fallback_camera_mouse_sensitivity = CameraSettings::default().mouse_sensitivity,\n                    fallback_camera_invert_y = CameraSettings::default().invert_y,\n                    reason = \"settings_load_failed\",\n                    \"Failed to load game settings; using defaults\"\n                );\n                Self::default()\n            }\n        };\n        info!(\n            target: \"demo::settings\",\n            path = %path.display(),\n            ma
