mponent)]\npub struct Character;\n\n/// 来自控制者的玩法意图；输入状态跨帧保留，供固定步模拟读取。\n///\n/// PreUpdate 与 FixedUpdate 不一一对应：移动轴持续有效，跳跃和交互请求只消费一次。\n/// 输入 Observer 仅更新意图，不按输入事件次数积分位置，避免运动速度依赖渲染帧率。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct CharacterIntent {\n    /// 角色局部水平输入轴：x 表示左右横移，y 表示前后移动。\n    pub movement: Vec2,\n    pub jump_pending: bool,\n    pub interact_pending: bool,\n}\n\n/// 接地状态由物理查询派生；实际速度直接读取 Avian 的 LinearVelocity。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct CharacterMotion {\n    pub grounded: bool,\n}\n\n/// 可搬运快递身份；纸箱与木箱的美术种类由场景组件表达。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct Parcel;\n\n/// 允许被拾取的能力标签。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct Pickable;\n\n/// 模型对应的手前偏移；未指定时继续使用原型配置，纸箱对齐持箱动作的双手。\n#[derive(Component, Reflect, Default, Clone, Copy)]\n#[reflect(Component)]\npub(crate) struct CarryGrip(pub Vec3);\n\n/// 物体的持有者；只由交互系统插入或移除。\n#[derive(Component)]\n#[relationship(relationship_target = HoldingItems)]\npub struct HeldBy(Entity);\n\n/// Bevy 根据 HeldBy 自动维护的反向索引，业务代码只读取。\n#[derive(Component)]\n#[relationship_target(relationship = HeldBy)]\npub struct HoldingItems(Vec\u003cEntity\u003e);\n\n/// 手前的目标姿态；呈现同步只更新目标，箱子的实际位置仍由物理解算。\n#[derive(Component, Reflect)]\n#[reflect(Component)]\npub(crate) struct HeldTarget {\n    pub translation: Vec3,\n    pub rotation: Quat,\n}\n\n/// 原型的运动、平地和持箱参数。\n#[derive(Resource, Reflect, Clone, Debug)]\n#[reflect(Resource)]\npub struct PrototypeConfig {\n    pub move_speed: f32,\n    pub acceleration: f32,\n    pub braking_acceleration: f32,\n    pub air_acceleration: f32,\n    pub jump_speed: f32,\n    pub gravity: f32,\n    pub pickup_radius: f32,\n    pub hold_offset: Vec3,\n    pub ground_y: f32,\n    pub parcel_half_height: f32,\n    pub character_mass: f32,\n    pub character_height: f32,\n    pub character_radius: f32,\n    pub parcel_mass: f32,\n    pub hold_frequency: f32,\n    pub hold_damping_ratio: f32,\n    pub hold_max_force: f32,\n}\n\nimpl Default for PrototypeConfig {\n    fn default() -\u003e Self {\n        Self {\n            move_speed: 4.5,\n            acceleration: 30.0,\n            braking_acceleration: 45.0,\n            air_acceleration: 6.0,\n            jump_speed: 5.0,\n            gravity: 9.81,\n            pickup_radius: 1.8,\n            hold_offset: Vec3::new(0.0, 1.0, -0.9),\n            ground_y: 0.0,\n            parcel_half_height: 0.3,\n            character_mass: 75.0,\n            character_height: 1.9,\n            character_radius: 0.32,\n            parcel_mass: 3.0,\n            hold_frequency: 3.0,\n            hold_damping_ratio: 1.0,\n            hold_max_force: 450.0,\n        }\n    }\n}\n\n/// 注册固定步控制、交互与物理解算后的状态观察；不加载游戏窗口。\npub struct GameplayPlugin;\n\n/// 固定步先同步朝向，再准备力、冲量和持握目标，随后由 Avian 求解。\n#[derive(SystemSet, Clone, Copy, Debug, PartialEq, Eq, Hash)]\npub enum GameplaySystems {\n    Simulate,\n}\n\nimpl Plugin for GameplayPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.register_type::\u003cPlayerId\u003e()\n            .register_type::\u003cControlsCharacter\u003e()\n            .register_type::\u003cCharacter\u003e()\n            .register_type::\u003cCharacterIntent\u003e()\n            .register_type::\u003cCharacterMotion\u003e()\n            .register_type::\u003cParcel\u003e()\n            .register_type::\u003cPickable\u003e()\n            .register_type::\u003cCarryGrip\u003e()\n            .register_type::\u003cHeldTarget\u003e()\n            .register_type::\u003cPrototypeConfig\u003e()\n            .init_resource::\u003cPrototypeConfig\u003e()\n            .add_plugins((DemoPhysicsPlugin, SoundEventsPlugin))\n            .add_systems(\n                FixedUpdate,\n                (\n                    update_grounded,\n                    move_characters,\n                    jump_characters,\n                    handle_interaction,\n                    release_orphaned_items,\n                    sync_held_objects,\n                    apply_grip_forces,\n                )\n                    // 拿放的关系与碰撞层命令必须在本步施力前可见。\n                    .chain()\n                    .in_set(GameplaySystems::Simulate)\n                    .run_if(gameplay_running),\n            )\n            .add_systems(\n                FixedPostUpdate,\n                (update_grounded, log_character_velocity)\n                    .chain()\n                    .after(PhysicsSystems::Writeback)\n                    .run_if(gameplay_running),\n            );\n    }\n}\n\n/// 脚底附近的小球向下探测支撑面；墙面法线和上升中的角色不能算接地。\nfn update_grounded(\n    config: Res\u003cPrototypeConfig\u003e,\n    spatial_query: SpatialQuery,\n    colliders: Query\u003c(Option\u003c\u0026CollisionLayers\u003e, Has\u003cHeldBy\u003e, Has\u003cSensor\u003e)\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            \u0026Position,\n            \u0026LinearVelocity,\n            Option\u003c\u0026CollisionLayers\u003e,\n            \u0026mut CharacterMotion,\n        ),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    let probe = Collider::sphere(config.character_radius * 0.8);\n    for (entity, position, velocity, layers, mut motion) in \u0026mut characters {\n        let filter = SpatialQueryFilter::from_excluded_entities([entity]);\n        let character_layers = layers.copied().unwrap_or_default();\n        let mut grounded = false;\n        if velocity.y \u003c= 0.5 {\n            // 空间查询只按目标所属层过滤；支撑还必须满足双方碰撞掩码并排除持握物和传感器。\n            // 遍历所有命中，避免最近的侧墙挡住稍远的有效地面。\n            spatial_query.shape_hits_callback(\n                \u0026probe,\n                position.0 + Vec3::Y * config.character_radius,\n                Quat::IDENTITY,\n                Dir3::NEG_Y,\n                \u0026ShapeCastConfig::from_max_distance(0.12),\n                \u0026filter,\n                |hit| {\n                    if let Ok((layers, held, sensor)) = colliders.get(hit.entity) {\n                        grounded |= !held\n                            \u0026\u0026 !sensor\n                            \u0026\u0026 character_layers.interacts_with(layers.copied().unwrap_or_default())\n                            \u0026\u0026 hit.normal1.y \u003e= 0.65;\n                    }\n                    !grounded\n                },\n            );\n        }\n        if grounded != motion.grounded {\n            info!(\n                ?entity,\n                before = motion.grounded,\n                after = grounded,\n                vertical_velocity = velocity.y,\n                reason = \"support_probe\",\n                \"Character grounded state changed\"\n            );\n            if grounded {\n                info!(\n                    ?entity,\n                    landing_velocity = velocity.y,\n                    reason = \"ground_contact\",\n                    \"Character landed\"\n                );\n            }\n            motion.grounded = grounded;\n        }\n    }\n}\n\n/// 用有上限的加速度趋近目标水平速度，保留碰撞和外部冲量造成的实际运动。\nfn move_characters(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    mut characters: Query\u003c\n        (Forces, \u0026Transform, \u0026CharacterIntent, \u0026CharacterMotion),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    for (mut forces, transform, intent, motion) in \u0026mut characters {\n        let axes = intent.movement.clamp_length_max(1.0);\n        // 空中松键保留惯性，地面松键使用较快的主动刹车。\n        if !motion.grounded \u0026\u0026 axes == Vec2::ZERO {\n            continue;\n        }\n        let limit = if !motion.grounded {\n            config.air_acceleration\n        } else if axes == Vec2::ZERO {\n            config.braking_acceleration\n        } else {\n            config.acceleration\n        };\n        let target = transform.rotation * Vec3::new(axes.x, 0.0, -axes.y) * config.move_speed;\n        let velocity = forces.linear_velocity();\n        let horizontal = Vec3::new(velocity.x, 0.0, velocity.z);\n        let acceleration = ((target - horizontal) / time.delta_secs()).clamp_length_max(limit);\n        forces.apply_linear_acceleration(acceleration);\n    }\n}\n\n/// 跳跃只消费一次，通过冲量改变速度；重力和位置积分全部交给 Avian。\nfn jump_characters(\n    config: Res\u003cPrototypeConfig\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            Forces,\n            \u0026ComputedMass,\n            \u0026mut CharacterIntent,\n            \u0026mut CharacterMotion,\n        ),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    for (entity, mut forces, mass, mut intent, mut motion) in \u0026mut characters {\n        if !std::mem::take(\u0026mut intent.jump_pending) {\n            continue;\n        }\n        if motion.grounded {\n            let speed_before = forces.linear_velocity().y;\n            forces\n                .apply_linear_impulse(Vec3::Y * mass.value() * (config.jump_speed - speed_before));\n            motion.grounded = false;\n            info!(\n                ?entity,\n                before = \"grounded\",\n                after = \"airborne\",\n                jump_speed = config.jump_speed,\n                reason = \"jump_action\",\n                \"Character jumped\"\n            );\n        } else {\n            info!(?entity, reason = \"already_airborne\", \"Jump request ignored\");\n        }\n    }\n}\n\n/// 拾取建立物理持握关系；释放只解除控制，保留刚体姿态、线速度和角速度。\nfn handle_interaction(\n    mut commands: Commands,\n    config: Res\u003cPrototypeConfig\u003e,\n    spatial_query: SpatialQuery,\n    mut reserved: Local\u003cHashSet\u003cEntity\u003e\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            \u0026Position,\n            \u0026Transform,\n            \u0026mut CharacterIntent,\n            Option\u003c\u0026HoldingItems\u003e,\n        ),\n        (With\u003cCharacter\u003e, Without\u003cPickable\u003e),\n    \u003e,\n    pickables: Query\u003c(Entity, \u0026Position), (With\u003cPickable\u003e, Without\u003cHeldBy\u003e, Without\u003cCharacter\u003e)\u003e,\n    held_items: Query\u003c\n        (\u0026Position, \u0026LinearVelocity, \u0026AngularVelocity),\n        (With\u003cPickable\u003e, With\u003cHeldBy\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    reserved.clear();\n    for (character, position, transform, mut intent, holding) in \u0026mut characters {\n        if !std::mem::take(\u0026mut intent.interact_pending) {\n            continue;\n        }\n        if let Some(item) = holding.and_then(|items| items.iter().next()) {\n            if let Ok((item_position, velocity, angular_velocity)) = held_items.get(item) {\n                commands\n                    .entity(item)\n                    .remove::\u003c(HeldBy, HeldTarget)\u003e()\n                    .insert(parcel_collision_layers());\n                // 延迟消息与解除关系一起提交，播放者只能收到已接受的交互结果。\n                commands.write_message(SoundRequest::new(SoundCue::ParcelRelease, item));\n                info!(?character, ?item, position = ?item_position.0, velocity = ?velocity.0,\n                    angular_velocity = ?angular_velocity.0, before = \"held\", after = \"free\",\n                    reason = \"interact_action_release\", \"Carryable item released\");\n            }\n            continue;\n        }\n        let origin = position.0 + Vec3::Y * config.hold_offset.y;\n        let nearest = pickables\n            .iter()\n            .filter(|(item, _)| !reserved.contains(item))\n            .filter_map(|(item, item_position)| {\n                let distance = position.0.distance_squared(item_position.0);\n                if distance \u003e config.pickup_radius.powi(2) {\n                    return None;\n                }\n                // 碰撞世界也约束拾取视线，不能隔着墙抓取箱子。\n                let offset = item_position.0 - origin;\n                if let Ok(direction) = Dir3::new(offset)\n                    \u0026\u0026 let Some(hit) = spatial_query.cast_ray(\n                        origin,\n                        direction,\n                        offset.length(),\n                        true,\n                        \u0026SpatialQueryFilter::from_excluded_entities([character]),\n                    )\n                    \u0026\u0026 hit.entity != item\n                {\n                    return None;\n                }\n                Some((item, distance))\n            })\n            .min_by(|(_, a), (_, b)| a.total_cmp(b));\n        if let Some((item, distance_squared)) = nearest {\n            // 同批次延迟命令尚未应用，预留集合防止两个角色同时占用一件物体。\n            reserved.insert(item);\n            commands.entity(item).insert((\n                HeldBy(character),\n                HeldTarget {\n                    translation: position.0 + transform.rotation * config.hold_offset,\n                    rotation: transform.rotation,\n                },\n                held_collision_layers(),\n            ));\n            commands.write_message(SoundRequest::new(SoundCue::ParcelPickup, item));\n            info!(\n                ?character,\n                ?item,\n                before = \"free\",\n                after = \"held\",\n                distance = distance_squared.sqrt(),\n                reason = \"interact_action_pickup\",\n                \"Carryable item picked up\"\n            );\n        } else {\n            info!(\n                ?character,\n                reason = \"no_visible_pickable_in_range\",\n                \"No pickable item in range\"\n            );\n        }\n    }\n}\n\n/// 持有者销毁或关系被外部解除后清理目标，恢复自由碰撞；刚体始终继续模拟。\nfn release_orphaned_items(\n    mut commands: Commands,\n    characters: Query\u003c(), With\u003cCharacter\u003e\u003e,\n    items: Query\u003c(Entity, Option\u003c\u0026HeldBy\u003e), With\u003cHeldTarget\u003e\u003e,\n) {\n    for (item, held_by) in \u0026items {\n        let reason = match held_by {\n            Some(held_by) if characters.contains(held_by.0) =\u003e continue,\n            Some(_) =\u003e \"holder_missing\",\n            None =\u003e \"holding_relation_removed\",\n        };\n        commands\n            .entity(item)\n            .remove::\u003c(HeldBy, HeldTarget)\u003e()\n            .insert(parcel_collision_layers());\n        info!(\n            ?item,\n            before = \"held\",\n            after = \"free\",\n            reason,\n            \"Carryable item released\"\n        );\n    }\n}\n\n/// 固定步和本帧显示复用同一目标计算，不瞬移箱子，也不积分或消费请求。\npub(crate) fn sync_held_objects(\n    config: Res\u003cPrototypeConfig\u003e,\n    characters: Query\u003c\u0026Transform, (With\u003cCharacter\u003e, Without\u003cPickable\u003e)\u003e,\n    mut items: Query\u003c\n        (\u0026HeldBy, \u0026mut HeldTarget, Option\u003c\u0026CarryGrip\u003e),\n        (With\u003cPickable\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    for (held_by, mut target, grip) in \u0026mut items {\n        if let Ok(character) = characters.get(held_by.0) {\n            let offset = grip.map_or(config.hold_offset, |grip| grip.0);\n            target.translation = character.translation + character.rotation * offset;\n            target.rotation = character.rotation;\n        }\n    }\n}\n\n/// 弹簧阻尼手约束施加有限的力与转动驱动，碰撞求解仍能阻挡箱体。\nfn apply_grip_forces(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    gravity: Res\u003cGravity\u003e,\n    mut characters: Query\u003c(Forces, \u0026Transform), (With\u003cCharacter\u003e, Without\u003cPickable\u003e)\u003e,\n    mut items: Query\u003c\n        (Forces, \u0026ComputedMass, \u0026HeldBy, Option\u003c\u0026CarryGrip\u003e),\n        (With\u003cPickable\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    let omega = std::f32::consts::TAU * config.hold_frequency;\n    let stiffness = omega * omega;\n    let damping = 2.0 * config.hold_damping_ratio * omega;\n    // 隐式弹簧系数避免固定步较长时的高频振荡，实际力仍由质量换算并限制。\n    let denominator = 1.0 + damping * time.delta_secs() + stiffness * time.delta_secs().powi(2);\n    for (mut item, mass, held_by, grip) in \u0026mut items {\n        let Ok((mut holder, transform)) = characters.get_mut(held_by.0) else {\n            continue;\n        };\n        // 模拟读取 Position 而非已经插值的显示目标，防止呈现反馈污染物理。\n        let offset = grip.map_or(config.hold_offset, |grip| grip.0);\n        let target = holder.position().0 + transform.rotation * offset;\n        let acceleration = (stiffness * (target - item.position().0)\n            + damping * (holder.linear_velocity() - item.linear_velocity())\n            - gravity.0)\n            / denominator;\n        let force = (acceleration * mass.value()).clamp_length_max(config.hold_max_force);\n        item.apply_force(force);\n        // 持有者承受相反的力，箱子的重量和撞墙阻力会反馈到动态角色。\n        holder.apply_force(-force);\n        // q 与 -q 表示同一姿态，选择短弧，避免箱子绕一整圈追向手部朝向。\n        let mut rotation_error = transform.rotation * item.rotation().0.inverse();\n        if rotation_error.w \u003c 0.0 {\n            rotation_error = -rotation_error;\n        }\n        let error = rotation_error.to_scaled_axis();\n        let angular_acceleration = ((stiffness * error - damping * item.angular_velocity())\n            / denominator)\n            .clamp_length_max(80.0);\n        item.apply_angular_acceleration(angular_acceleration);\n    }\n}\n\n/// 采样物理解算后的实际速度，便于检查加速度、刹车和碰撞反馈。\nfn log_character_velocity(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    mut next_log_time: Local\u003cf64\u003e,\n    characters: Query\u003c(Entity, \u0026LinearVelocity, \u0026CharacterMotion), With\u003cCharacter\u003e\u003e,\n) {\n    if time.elapsed_secs_f64() \u003c *next_log_time {\n        return;\n    }\n    *next_log_time = time.elapsed_secs_f64() + 0.5;\n    for (entity, velocity, motion) in \u0026characters {\n        debug!(?entity, velocity = ?velocity.0, grounded = motion.grounded,\n            reason = \"physics_sample\", \"Character velocity sampled\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::physics::{character_body, ground_body, parcel_body, world_collision_layers};\n    use bevy::time::TimeUpdateStrategy;\n    use std::time::Duration;\n\n    fn test_app() -\u003e App {\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, TransformPlugin, GameplayPlugin))\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n                1.0 / 60.0,\n            )));\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut().spawn((\n            ground_body(\u0026config),\n            Transform::from_xyz(0.0, config.ground_y, 0.0),\n        ));\n        // 手动 update 不经过 App::run，需先完成物理插件的资源初始化。\n        app.finish();\n        app.cleanup();\n        app.update();\n        app\n    }\n\n    fn step(app: \u0026mut App, count: usize) {\n        for _ in 0..count {\n            app.update();\n        }\n    }\n\n    fn spawn_character(app: \u0026mut App, position: Vec3, intent: CharacterIntent) -\u003e Entity {\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut()\n            .spawn((\n                Character,\n                intent,\n                CharacterMotion::default(),\n                Transform::from_translation(position),\n                character_body(\u0026config),\n            ))\n            .id()\n    }\n\n    fn spawn_box(app: \u0026mut App, position: Vec3) -\u003e Entity {\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut()\n            .spawn((\n                Parcel,\n                Pickable,\n                Transform::from_translation(position),\n                parcel_body(\u0026config),\n            ))\n            .id()\n    }\n\n    fn interact(app: \u0026mut App, character: Entity) {\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .interact_pending = true;\n        step(app, 1);\n    }\n\n    #[test]\n    fn ground_probe_respects_collision_layers_and_excludes_held_boxes() {\n        let mut app = test_app();\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, 0.0));\n        let character = spawn_character(\u0026mut app, Vec3::new(0.0, 0.6, 0.0), default());\n        step(\u0026mut app, 30);\n        let grounded = |app: \u0026App| {\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        };\n        assert!(grounded(\u0026app), \"Free box must support the character\");\n\n        // 单独重跑探测，避免改变碰撞层后物理移动影响支撑过滤的断言。\n        let mut schedule = Schedule::default();\n        schedule.add_systems(update_grounded);\n        let character_layers = *app.world().get::\u003cCollisionLayers\u003e(character).unwrap();\n        app.world_mut()\n            .entity_mut(character)\n            .insert(CollisionLayers::NONE);\n        schedule.run(app.world_mut());\n        assert!(\n            !grounded(\u0026app),\n            \"Character collision filters must be respected\"\n        );\n        app.world_mut()\n            .entity_mut(character)\n            .insert(character_layers);\n        schedule.run(app.world_mut());\n        assert!(grounded(\u0026app));\n\n        let item_layers = parcel_collision_layers();\n        app.world_mut()\n            .entity_mut(item)\n            .insert(CollisionLayers::new(\n                item_layers.memberships,\n                LayerMask::NONE,\n            ));\n        schedule.run(app.world_mut());\n        assert!(\n            !grounded(\u0026app),\n            \"Support collision filters must be respected\"\n        );\n        app.world_mut().entity_mut(item).insert(item_layers);\n        schedule.run(app.world_mut());\n        assert!(grounded(\u0026app));\n\n        app.world_mut()\n            .entity_mut(item)\n            .insert((HeldBy(character), held_collision_layers()));\n        schedule.run(app.world_mut());\n        assert!(!grounded(\u0026app), \"Held box cannot support the character\");\n        // 即使外部代码误改持握碰撞层，持握身份也不能成为支撑。\n        app.world_mut().entity_mut(item).insert(item_layers);\n        schedule.run(app.world_mut());\n        assert!(!grounded(\u0026app));\n        app.world_mut().entity_mut(item).remove::\u003cHeldBy\u003e();\n        schedule.run(app.world_mut());\n        assert!(\n            grounded(\u0026app),\n            \"Released box must become valid support again\"\n        );\n    }\n\n    #[test]\n    fn ground_probe_finds_floor_after_a_nearer_wall_hit() {\n        let mut app = test_app();\n        let wall = app\n            .world_mut()\n            .spawn((\n                RigidBody::Static,\n                Collider::cuboid(0.04, 2.0, 2.0),\n                world_collision_layers(),\n                Transform::from_xyz(0.26, 1.0, 0.0),\n            ))\n            .id();\n        step(\u0026mut app, 2);\n        // 先初始化墙面，再生成角色并只跑探测，避免墙面求解先推开角色。\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let mut schedule = Schedule::default();\n        schedule.add_systems(\n            (\n                move |config: Res\u003cPrototypeConfig\u003e, spatial_query: SpatialQuery| {\n                    let closest = spatial_query\n                        .cast_shape(\n                            \u0026Collider::sphere(config.character_radius * 0.8),\n                            Vec3::Y * config.character_radius,\n                            Quat::IDENTITY,\n                            Dir3::NEG_Y,\n                            \u0026ShapeCastConfig::from_max_distance(0.12),\n                            \u0026SpatialQueryFilter::from_excluded_entities([character]),\n                        )\n                        .unwrap();\n                    assert_eq!(closest.entity, wall);\n                    assert!(closest.normal1.y \u003c 0.65);\n                },\n                update_grounded,\n            )\n                .chain(),\n        );\n        schedule.run(app.world_mut());\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded,\n            \"Side wall must not hide valid floor support\"\n        );\n    }\n\n    #[test]\n    fn movement_accelerates_brakes_and_diagonal_speed_is_bounded() {\n        let mut app = test_app();\n        let straight = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let diagonal = spawn_character(\u0026mut app, Vec3::X * 5.0, default());\n        step(\u0026mut app, 30);\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(straight)\n            .unwrap()\n            .movement = Vec2::Y;\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(diagonal)\n            .unwrap()\n            .movement = Vec2::ONE;\n        step(\u0026mut app, 1);\n        let first_speed = app\n            .world()\n            .get::\u003cLinearVelocity\u003e(straight)\n            .unwrap()\n            .0\n            .length();\n        assert!(first_speed \u003e 0.0 \u0026\u0026 first_speed \u003c 1.0, \"{first_speed}\");\n        step(\u0026mut app, 20);\n        let a = app.world().get::\u003cLinearVelocity\u003e(straight).unwrap().0;\n        let b = app.world().get::\u003cLinearVelocity\u003e(diagonal).unwrap().0;\n        assert!((a.xz().length() - 4.5).abs() \u003c 0.05, \"{a:?}\");\n        assert!(\n            (a.xz().length() - b.xz().length()).abs() \u003c 0.05,\n            \"{a:?} {b:?}\"\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(straight)\n            .unwrap()\n            .movement = Vec2::ZERO;\n        step(\u0026mut app, 1);\n        let braking = app\n            .world()\n            .get::\u003cLinearVelocity\u003e(straight)\n            .unwrap()\n            .0\n            .xz()\n            .length();\n        assert!(braking \u003e 0.0 \u0026\u0026 braking \u003c a.xz().length());\n        step(\u0026mut app, 12);\n        assert!(\n            app.world()\n                .get::\u003cLinearVelocity\u003e(straight)\n                .unwrap()\n                .0\n                .xz()\n                .length()\n                \u003c 0.05\n        );\n    }\n\n    #[test]\n    fn collision_blocks_character_and_dynamic_boxes_receive_momentum() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.2));\n        step(\u0026mut app, 30);\n        app.world_mut().spawn((\n            RigidBody::Static,\n            Collider::cuboid(8.0, 3.0, 0.5),\n            world_collision_layers(),\n            Transform::from_xyz(0.0, 1.5, -4.0),\n        ));\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .movement = Vec2::Y;\n        step(\u0026mut app, 100);\n        let position = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n        assert!(position.z \u003e -3.5, \"Character crossed wall: {position:?}\");\n        let box_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(\n            box_position.z \u003c -1.4 \u0026\u0026 box_position.z \u003e -3.8,\n            \"{box_position:?}\"\n        );\n    }\n\n    #[test]\n    fn jump_is_consumed_once_and_gravity_lands_on_collider() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        step(\u0026mut app, 30);\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .jump_pending = true;\n        step(\u0026mut app, 1);\n        let velocity = app.world().get::\u003cLinearVelocity\u003e(character).unwrap().y;\n        assert!((velocity - (5.0 - 9.81 / 60.0)).abs() \u003c 0.05, \"{velocity}\");\n        assert!(\n            !app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .jump_pending\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .jump_pending = true;\n        step(\u0026mut app, 1);\n        assert!(app.world().get::\u003cLinearVelocity\u003e(character).unwrap().y \u003c velocity);\n        step(\u0026mut app, 100);\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        );\n        assert!(app.world().get::\u003cPosition\u003e(character).unwrap().y.abs() \u003c 0.03);\n    }\n\n    #[test]\n    fn item_specific_grips_converge_through_physics_to_the_presented_targets() {\n        for grip in [Vec3::new(0.0, 1.3, -0.48), Vec3::new(0.0, 1.3, -0.62)] {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n            app.world_mut().entity_mut(item).insert(CarryGrip(grip));\n            step(\u0026mut app, 30);\n            let before_pickup = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            interact(\u0026mut app, character);\n            assert_eq!(app.world().get::\u003cHeldBy\u003e(item).unwrap().0, character);\n            assert_eq!(\n                app.world().get::\u003cRigidBody\u003e(item),\n                Some(\u0026RigidBody::Dynamic)\n            );\n            let after_pickup = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            assert!(\n                after_pickup.distance(before_pickup) \u003c 0.2,\n                \"Pickup teleported the item: {before_pickup:?} {after_pickup:?}\"\n            );\n            let initial_error =\n                after_pickup.distance(app.world().get::\u003cHeldTarget\u003e(item).unwrap().translation);\n            assert!(initial_error \u003e 0.5);\n            let fixed_before = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed();\n            // 执行真实 FixedPostUpdate，让施力、重力、反作用与碰撞共同产生收敛结果。\n            step(\u0026mut app, 120);\n            assert!(\n                app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed() - fixed_before\n                    \u003e Duration::from_secs(1)\n            );\n            let world = app.world();\n            let target = world.get::\u003cHeldTarget\u003e(item).unwrap();\n            let actual = world.get::\u003cPosition\u003e(item).unwrap().0;\n            assert!(\n                actual.distance(target.translation) \u003c 0.1,\n                \"Physics grip did not reach the presented target: {grip:?} {actual:?} {:?}\",\n                target.translation\n            );\n            // 静止角色面向 -Z；分别验证真实箱体的高度和距离，不只断言派生目标的公式。\n            let relative = actual - world.get::\u003cPosition\u003e(character).unwrap().0;\n            assert!((relative.y - 1.3).abs() \u003c 0.1, \"{grip:?} {relative:?}\");\n            assert!((relative.z - grip.z).abs() \u003c 0.08, \"{grip:?} {relative:?}\");\n            assert!(world.get::\u003cLinearVelocity\u003e(item).unwrap().0.length() \u003c 0.1);\n            let displayed_offset =\n                target.translation - world.get::\u003cTransform\u003e(character).unwrap().translation;\n            assert!(displayed_offset.abs_diff_eq(grip, 0.00001));\n        }\n    }\n\n    #[test]\n    fn grip_preserves_dynamic_body_blocks_at_wall_and_release_keeps_velocity() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n        step(\u0026mut app, 30);\n        let before = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        interact(\u0026mut app, character);\n        assert_eq!(app.world().get::\u003cHeldBy\u003e(item).unwrap().0, character);\n        assert_eq!(\n            app.world().get::\u003cRigidBody\u003e(item),\n            Some(\u0026RigidBody::Dynamic)\n        );\n        let after = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(\n            after.distance(before) \u003c 0.2,\n            \"Pickup teleported: {before:?} {after:?}\"\n        );\n        step(\u0026mut app, 100);\n        assert!((app.world().get::\u003cPosition\u003e(item).unwrap().y - 1.0).abs() \u003c 0.12);\n        app.world_mut().spawn((\n            RigidBody::Static,\n            Collider::cuboid(8.0, 3.0, 0.2),\n            world_collision_layers(),\n            Transform::from_xyz(0.0, 1.5, -1.6),\n        ));\n        app.world_mut()\n            .resource_mut::\u003cPrototypeConfig\u003e()\n            .hold_offset\n            .z = -2.4;\n        step(\u0026mut app, 90);\n        let position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(position.z \u003e -1.3, \"Held box crossed wall: {position:?}\");\n        // 直接运行交互系统验证释放瞬间不修改任何速度或位置，不混入随后重力。\n        app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = Vec3::new(1.0, 2.0, 0.5);\n        app.world_mut().get_mut::\u003cAngularVelocity\u003e(item).unwrap().0 = Vec3::new(0.5, 1.0, 0.0);\n        let before_release = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        let rotation_before_release = app.world().get::\u003cRotation\u003e(item).unwrap().0;\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .interact_pending = true;\n        let mut schedule = Schedule::default();\n        schedule.add_systems(handle_interaction);\n        schedule.run(app.world_mut());\n        assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n        assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n        assert_eq!(\n            app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0,\n            Vec3::new(1.0, 2.0, 0.5)\n        );\n        assert_eq!(app.world().get::\u003cPosition\u003e(item).unwrap().0, before_release);\n        assert_eq!(\n            app.world().get::\u003cAngularVelocity\u003e(item).unwrap().0,\n            Vec3::new(0.5, 1.0, 0.0)\n        );\n        assert_eq!(\n            app.world().get::\u003cRotation\u003e(item).unwrap().0,\n            rotation_before_release\n        );\n        step(\u0026mut app, 120);\n        assert!(app.world().get::\u003cPosition\u003e(item).unwrap().y \u003c 0.5);\n    }\n\n    #[test]\n    fn holder_despawn_and_external_relation_removal_restore_free_collisions() {\n        for despawn in [false, true] {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n            step(\u0026mut app, 30);\n            interact(\u0026mut app, character);\n            step(\u0026mut app, 60);\n            if despawn {\n                app.world_mut().despawn(character);\n            } else {\n                app.world_mut().entity_mut(item).remove::\u003cHeldBy\u003e();\n            }\n            step(\u0026mut app, 1);\n            assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n            assert_eq!(\n                *app.world().get::\u003cCollisionLayers\u003e(item).unwrap(),\n                parcel_collision_layers()\n            );\n            step(\u0026mut app, 120);\n            assert!(app.world().get::\u003cPosition\u003e(item).unwrap().y \u003c 0.5);\n        }\n    }\n\n    #[test]\n    fn no_fixed_step_preserves_requests_and_render_rates_share_physics() {\n        let simulate = |frame_hz: f64| {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            step(\u0026mut app, 30);\n            app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO));\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .jump_pending = true;\n            let before = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n            step(\u0026mut app, 3);\n            assert_eq!(app.world().get::\u003cPosition\u003e(character).unwrap().0, before);\n            assert!(\n                app.world()\n                    .get::\u003cCharacterIntent\u003e(character)\n                    .unwrap()\n                    .jump_pending\n            );\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .movement = Vec2::Y;\n            app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n                1.0 / frame_hz,\n            )));\n            step(\u0026mut app, frame_hz as usize);\n            app.world().get::\u003cPosition\u003e(character).unwrap().0\n        };\n        let a = simulate(60.0);\n        let b = simulate(120.0);\n        assert!(a.abs_diff_eq(b, 0.1), \"{a:?} {b:?}\");\n    }\n}\n"},{"path":"src/input.rs","text":"//! 注册 Enhanced Input 动作；键盘意图按控制者路由，观察与视角切换动作由相机模块消费。\n\nuse bevy::prelude::*;\nuse bevy_enhanced_input::prelude::{Cancel, Press, *};\n\nuse crate::gameplay::{Character, CharacterIntent, ControlsCharacter, PlayerId};\n\n/// 注册玩家输入上下文和动作观察者。\npub struct PlayerInputPlugin;\n\nimpl Plugin for PlayerInputPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_plugins(EnhancedInputPlugin)\n            // 默认在 PreUpdate 评估；玩法请求交给 FixedUpdate，相机动作在同帧更新。\n            .add_input_context::\u003cGameplayContext\u003e()\n            .add_observer(record_movement)\n            .add_observer(clear_completed_movement)\n            .add_observer(clear_cancelled_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n    }\n}\n\n/// 控制者的步行输入上下文；角色实体不直接持有设备绑定。\n#[derive(Component)]\npub struct GameplayContext;\n\n/// 地面移动方向，X 为左右、Y 为前后。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct MoveAction;\n\n/// 鼠标观察动作，输出本帧汇总位移，由相机 Observer 直接处理。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct LookAction;\n\n/// 每次按下产生一次跳跃请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct JumpAction;\n\n/// 每次按下产生一次拾取或放下请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct InteractAction;\n\n/// 每次按下请求切换第一人称与第三人称，由相机 Observer 接收，再由同帧系统消费。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct TogglePerspectiveAction;\n\n/// 释放光标以操作开发检查器；Esc 保留给游戏暂停菜单。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct ReleasePointerAction;\n\n/// 为指定玩家与角色创建键盘控制者，返回本次运行的控制者实体。\n///\n/// 场景只为获得键盘控制权的玩家调用一次；后续手柄或远程控制者单独配置。\npub fn spawn_keyboard_controller(\n    commands: \u0026mut Commands,\n    player_id: PlayerId,\n    character: Entity,\n) -\u003e Entity {\n    let id = player_id.0;\n    let controller = commands\n        .spawn((\n            Name::new(format!(\"Keyboard controller {id}\")),\n            player_id,\n            ControlsCharacter(character),\n            keyboard_context(),\n        ))\n        .id();\n    info!(\n        target: \"demo::input\",\n        player_id = id,\n        ?controller,\n        ?character,\n        \"Keyboard controller spawned: WASD to move, Space to jump, E to pick up or drop, I to toggle perspective\"\n    );\n    controller\n}\n\nfn keyboard_context() -\u003e impl Bundle {\n    (\n        GameplayContext,\n        GamepadDevice::None,\n        actions!(GameplayContext[\n            (\n                Action::\u003cLookAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                bindings![Binding::mouse_motion()],\n            ),\n            (\n                Action::\u003cMoveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                Bindings::spawn(Cardinal::wasd_keys()),\n            ),\n            (\n                Action::\u003cJumpAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::Space],\n            ),\n            (\n                Action::\u003cInteractAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyE],\n            ),\n            (\n                Action::\u003cTogglePerspectiveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyI],\n            ),\n            (\n                Action::\u003cReleasePointerAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::F3],\n            ),\n        ]),\n    )\n}\n\n/// 按事件所属的上下文查找角色，避免把一个玩家的动作写给其他角色。\nfn record_movement(\n    event: On\u003cFire\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != event.value {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?event.value, reason = \"move_action\",\n            \"Character movement input changed\");\n        intent.movement = event.value;\n    }\n}\n\nfn clear_completed_movement(\n    event: On\u003cComplete\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_completed\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\nfn clear_cancelled_movement(\n    event: On\u003cCancel\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_cancelled\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\n/// 一次性请求保留到固定步消费，即使本渲染帧没有固定步也不会丢失。\nfn request_jump(\n    event: On\u003cFire\u003cJumpAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.jump_pending = true;\n}\n\nfn request_interaction(\n    event: On\u003cFire\u003cInteractAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.interact_pending = true;\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::Duration;\n\n    use avian3d::prelude::{LinearVelocity, Physics, Position, RigidBody};\n    use bevy::{\n        ecs::relationship::RelationshipTarget, input::InputPlugin, time::TimeUpdateStrategy,\n    };\n\n    use crate::{\n        gameplay::{\n            CharacterMotion, GameplayPlugin, HeldBy, HeldTarget, HoldingItems, Parcel, Pickable,\n            PrototypeConfig,\n        },\n        physics::{character_body, ground_body, parcel_body},\n    };\n\n    use super::*;\n\n    fn fire\u003cA: InputAction\u003e(context: Entity, value: A::Output) -\u003e Fire\u003cA\u003e {\n        Fire {\n            context,\n            action: Entity::PLACEHOLDER,\n            value,\n            state: TriggerState::Fired,\n            fired_secs: 0.0,\n            elapsed_secs: 0.0,\n        }\n    }\n\n    #[test]\n    fn actions_are_routed_to_their_own_character() {\n        let mut app = App::new();\n        app.add_observer(record_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n        let first = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let second = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let first_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(first)))\n            .id();\n        let second_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(second)))\n            .id();\n\n        app.world_mut()\n            .trigger(fire::\u003cMoveAction\u003e(first_context, Vec2::X));\n        app.world_mut()\n            .trigger(fire::\u003cJumpAction\u003e(second_context, true));\n        app.world_mut()\n            .trigger(fire::\u003cInteractAction\u003e(first_context, true));\n\n        let first_intent = app.world().get::\u003cCharacterIntent\u003e(first).unwrap();\n        let second_intent = app.world().get::\u003cCharacterIntent\u003e(second).unwrap();\n        assert_eq!(first_intent.movement, Vec2::X);\n        assert!(!first_intent.jump_pending);\n        assert!(first_intent.interact_pending);\n        assert_eq!(second_intent.movement, Vec2::ZERO);\n        assert!(second_intent.jump_pending);\n        assert!(!second_intent.interact_pending);\n    }\n\n    #[test]\n    fn movement_completion_and_cancellation_clear_only_their_character() {\n        let mut app = App::new();\n        app.add_observer(clear_completed_movement)\n            .add_observer(clear_cancelled_movement);\n        let first = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent {\n                    movement: Vec2::X,\n                    ..default()\n                },\n            ))\n            .id();\n        let second = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent {\n                    movement: Vec2::Y,\n                    ..default()\n                },\n            ))\n            .id();\n        let first_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(first)))\n            .id();\n        let second_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(second)))\n            .id();\n\n        app.world_mut().trigger(Complete::\u003cMoveAction\u003e {\n            context: first_context,\n            action: Entity::PLACEHOLDER,\n            value: Vec2::ZERO,\n            state: TriggerState::None,\n            fired_secs: 0.0,\n            elapsed_secs: 0.0,\n        });\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(first).unwrap().movement,\n            Vec2::ZERO\n        );\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(second).unwrap().movement,\n            Vec2::Y\n        );\n        app.world_mut().trigger(Cancel::\u003cMoveAction\u003e {\n            context: second_context,\n            action: Entity::PLACEHOLDER,\n            value: Vec2::ZERO,\n            state: TriggerState::None,\n            elapsed_secs: 0.0,\n        });\n        assert_eq!(\n            app.world().get::\u003cCharacterIntent\u003e(second).unwrap().movement,\n            Vec2::ZERO\n        );\n    }\n\n    #[test]\n    fn keyboard_press_fires_once_and_requests_survive_until_consumed() {\n        // 仅初始化时间、输入和动作插件，不创建窗口或完整游戏场景。\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, InputPlugin, PlayerInputPlugin));\n        // Enhanced Input 在 finish 创建上下文运行资源，完成后才能插入上下文。\n        app.finish();\n        app.cleanup();\n        let character = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        app.world_mut()\n            .spawn((ControlsCharacter(character), keyboard_context()));\n        app.update();\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::Space);\n            keys.press(KeyCode::KeyE);\n            keys.press(KeyCode::KeyW);\n        }\n        app.update();\n        app.update();\n        {\n            let mut intent = app\n                .world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap();\n            assert!(intent.jump_pending);\n            assert!(intent.interact_pending);\n            assert_eq!(intent.movement, Vec2::Y);\n            intent.jump_pending = false;\n            intent.interact_pending = false;\n        }\n        app.update();\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(!intent.jump_pending);\n        assert!(!intent.interact_pending);\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.release(KeyCode::Space);\n            keys.release(KeyCode::KeyE);\n            keys.release(KeyCode::KeyW);\n        }\n        app.update();\n        assert_eq!(\n            app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .movement,\n            Vec2::ZERO\n        );\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::Space);\n            keys.press(KeyCode::KeyE);\n        }\n        app.update();\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(intent.jump_pending);\n        assert!(intent.interact_pending);\n    }\n\n    #[test]\n    fn perspective_key_fires_once_per_press() {\n        // 只观察实际键盘绑定产生的动作，验证长按不会重复切换。\n        #[derive(Resource, Default)]\n        struct PerspectivePresses(u32);\n\n        fn count_perspective_presses(\n            _event: On\u003cFire\u003cTogglePerspectiveAction\u003e\u003e,\n            mut presses: ResMut\u003cPerspectivePresses\u003e,\n        ) {\n            presses.0 += 1;\n        }\n\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, InputPlugin, PlayerInputPlugin))\n            .init_resource::\u003cPerspectivePresses\u003e()\n            .add_observer(count_perspective_presses);\n        app.finish();\n        app.cleanup();\n        // 上下文激活时已按住 I，require_reset 应阻止意外切换，直到松开后重新按下。\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        app.world_mut().spawn(keyboard_context());\n        for _ in 0..3 {\n            app.update();\n        }\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 0);\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::KeyI);\n        app.update();\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        for _ in 0..3 {\n            app.update();\n        }\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 1);\n\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .release(KeyCode::KeyI);\n        app.update();\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyI);\n        app.update();\n        assert_eq!(app.world().resource::\u003cPerspectivePresses\u003e().0, 2);\n    }\n\n    #[test]\n    fn keyboard_actions_drive_physics_pickup_jump_and_release() {\n        // 实际 app.update 同时经过玩法和物理固定调度，不补跑系统掩盖帧末状态。\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            TransformPlugin,\n            InputPlugin,\n            PlayerInputPlugin,\n            GameplayPlugin,\n        ))\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n            1.0 / 60.0,\n        )));\n        app.finish();\n        app.cleanup();\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut().spawn((\n            Transform::from_xyz(0.0, config.ground_y, 0.0),\n            ground_body(\u0026config),\n        ));\n        let character = app\n            .world_mut()\n            .spawn((\n                Character,\n                CharacterIntent::default(),\n                CharacterMotion::default(),\n                Transform::default(),\n                character_body(\u0026config),\n            ))\n            .id();\n        let item = app\n            .world_mut()\n            .spawn((\n                Parcel,\n                Pickable,\n                Transform::from_xyz(0.0, config.parcel_half_height, -1.0),\n                parcel_body(\u0026config),\n            ))\n            .id();\n        app.world_mut()\n            .spawn((ControlsCharacter(character), keyboard_context()));\n        // 接地由真实碰撞探测建立，测试不预先伪造 grounded。\n        for _ in 0..30 {\n            app.update();\n        }\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        );\n        let character_before = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n        let item_before = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        let physics_before = app.world().resource::\u003cTime\u003cPhysics\u003e\u003e().elapsed();\n\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.press(KeyCode::KeyE);\n            keys.press(KeyCode::KeyW);\n            keys.press(KeyCode::Space);\n        }\n        app.update();\n\n        assert!(app.world().resource::\u003cTime\u003cPhysics\u003e\u003e().elapsed() \u003e physics_before);\n        assert_eq!(\n            app.world()\n                .get::\u003cHoldingItems\u003e(character)\n                .unwrap()\n                .iter()\n                .collect::\u003cVec\u003c_\u003e\u003e(),\n            vec![item]\n        );\n        let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert!(!intent.jump_pending \u0026\u0026 !intent.interact_pending);\n        let character_after = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n        let item_after = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(character_after.y \u003e character_before.y);\n        assert!(character_after.z \u003c character_before.z);\n        assert!(app.world().get::\u003cLinearVelocity\u003e(character).unwrap().y \u003e 0.0);\n        assert_eq!(\n            app.world().get::\u003cRigidBody\u003e(item),\n            Some(\u0026RigidBody::Dynamic)\n        );\n        // 拾取只建立目标和施力，第一步木箱仍与目标有间距，不能瞬移到手中。\n        let target = app.world().get::\u003cHeldTarget\u003e(item).unwrap();\n        assert!(item_after.distance(target.translation) \u003e 0.1);\n\n        for _ in 0..12 {\n            app.update();\n            let intent = app.world().get::\u003cCharacterIntent\u003e(character).unwrap();\n            assert!(!intent.jump_pending \u0026\u0026 !intent.interact_pending);\n            assert!(app.world().get::\u003cHeldBy\u003e(item).is_some());\n        }\n        assert!(\n            app.world()\n                .get::\u003cPosition\u003e(item)\n                .unwrap()\n                .0\n                .distance(item_before)\n                \u003e 0.1\n        );\n\n        // 松开后再次按 E 才释放；下一物理步仍保留已有水平速度并自然积分。\n        {\n            let mut keys = app.world_mut().resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e();\n            keys.release(KeyCode::Space);\n            keys.release(KeyCode::KeyE);\n        }\n        app.update();\n        let release_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        let release_velocity = Vec3::new(2.0, 1.0, -1.0);\n        app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = release_velocity;\n        app.world_mut()\n            .resource_mut::\u003cButtonInput\u003cKeyCode\u003e\u003e()\n            .press(KeyCode::KeyE);\n        app.update();\n\n        assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n        assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n        assert!(\n            app.world()\n                .get::\u003cHoldingItems\u003e(character)\n                .is_none_or(|items| items.is_empty())\n        );\n        let velocity_after_release = app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0;\n        assert!((velocity_after_release.x - release_velocity.x).abs() \u003c 0.05);\n        assert!((velocity_after_release.z - release_velocity.z).abs() \u003c 0.05);\n        assert!(app.world().get::\u003cPosition\u003e(item).unwrap().0.x \u003e release_position.x);\n        for _ in 0..3 {\n            app.update();\n            assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n            assert!(\n                !app.world()\n                    .get::\u003cCharacterIntent\u003e(character)\n                    .unwrap()\n                    .interact_pending\n            );\n        }\n    }\n}\n"},{"path":"src/island_recovery.rs","text":"//! 海面下的角色和可搬物回到各自出生点，清理持握关系并避免瞬移跨岛插值。\n\nuse avian3d::{interpolation::TransformEasingSystems, prelude::*};\nuse bevy::{\n    ecs::{\n        query::QueryData,\n        relationship::Relationship,\n        system::lifetimeless::{Read, Write},\n    },\n    prelude::*,\n};\n\nuse crate::{\n    app_flow::gameplay_running,\n    gameplay::{\n        Character, CharacterIntent, CharacterMotion, GameplaySystems, HeldBy, HeldTarget, Pickable,\n    },\n    physics::parcel_collision_layers,\n};\n\n// 海面顶位于 -1.2 米；留出 0.3 米的浸没距离，避免岸边接触海面时误触发恢复。\nconst WATER_RECOVERY_Y: f32 = -1.5;\n\n/// 业务根实体的出生姿态；角色和可搬物分别保存自己的恢复位置，支持 BSN 模板。\n#[derive(Component, Clone, Default, Reflect)]\n#[reflect(Component)]\npub(crate) struct SpawnPoint(pub Transform);\n\n/// 注册固定步落水恢复，不创建窗口或额外推进模拟。\npub(crate) struct IslandRecoveryPlugin;\n\nimpl Plugin for IslandRecoveryPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.register_type::\u003cSpawnPoint\u003e()\n            .add_systems(\n                FixedFirst,\n                // 先清除旧插值端点，再恢复采样，不能让完成旧插值的系统把实体拖回海中。\n                resume_interpolation\n                    .after(TransformEasingSystems::Reset)\n                    .before(TransformEasingSystems::UpdateStart)\n                    .run_if(gameplay_running),\n            )\n            .add_systems(\n                FixedUpdate,\n                // 恢复先重设出生姿态，再按本步视角同步朝向，避免保留的移动输入使用出生方向。\n                // 延迟关系命令在模拟前同步，确保当步交互和持握施力看见解除结果。\n                recover_from_water\n                    .before(crate::camera::sync_character_facing)\n                    .before(GameplaySystems::Simulate)\n                    .run_if(gameplay_running),\n            );\n    }\n}\n\n/// 记录本次恢复临时添加的插值暂停项，不移除原先由其他功能设置的暂停组件。\n#[derive(Component)]\nstruct ResumeInterpolation {\n    translation: bool,\n    rotation: bool,\n}\n\n/// 只收集恢复需要的物理与呈现状态；未配置出生点的实体不参与恢复。\n#[derive(QueryData)]\n#[query_data(mutable)]\nstruct RecoverableBody {\n    entity: Entity,\n    spawn: Read\u003cSpawnPoint\u003e,\n    position: Write\u003cPosition\u003e,\n    rotation: Write\u003cRotation\u003e,\n    transform: Write\u003cTransform\u003e,\n    linear_velocity: Write\u003cLinearVelocity\u003e,\n    angular_velocity: Write\u003cAngularVelocity\u003e,\n    intent: Option\u003cWrite\u003cCharacterIntent\u003e\u003e,\n    motion: Option\u003cWrite\u003cCharacterMotion\u003e\u003e,\n    character: Has\u003cCharacter\u003e,\n    translation_paused: Has\u003cNoTranslationEasing\u003e,\n    rotation_paused: Has\u003cNoRotationEasing\u003e,\n}\n\n/// 恢复实体自身的出生姿态；角色落水只释放手中物品，物品落水时再独立恢复。\nfn recover_from_water(\n    mut commands: Commands,\n    mut bodies: Query\u003cRecoverableBody, Or\u003c(With\u003cCharacter\u003e, With\u003cPickable\u003e)\u003e\u003e,\n    held_items: Query\u003c(Entity, \u0026HeldBy)\u003e,\n) {\n    for mut body in \u0026mut bodies {\n        if body.position.y \u003e= WATER_RECOVERY_Y {\n            continue;\n        }\n\n        let entity = body.entity;\n        let position_before = body.position.0;\n        if body.character {\n            for (item, holder) in \u0026held_items {\n                if holder.get() == entity {\n                    commands\n                        .entity(item)\n                        .remove::\u003c(HeldBy, HeldTarget)\u003e()\n                        .insert(parcel_collision_layers());\n                    info!(target: \"demo::island_recovery\", ?item, holder = ?entity,\n                        before = \"held\", after = \"free\", reason = \"holder_water_recovery\",\n                        \"Held item released during water recovery\");\n                }\n            }\n        } else {\n            commands\n                .entity(entity)\n                .remove::\u003c(HeldBy, HeldTarget)\u003e()\n                .insert(parcel_collision_layers());\n        }\n\n        let spawn = body.spawn.0;\n        body.position.0 = spawn.translation;\n        body.rotation.0 = spawn.rotation;\n        *body.transform = spawn;\n        body.linear_velocity.0 = Vec3::ZERO;\n        body.angular_velocity.0 = Vec3::ZERO;\n        if let Some(mut intent) = body.intent {\n            // 移动轴是持续输入，保留它才能让按住的移动键在恢复后继续生效。\n            intent.jump_pending = false;\n            intent.interact_pending = false;\n        }\n        if let Some(mut motion) = body.motion {\n            motion.grounded = false;\n        }\n\n        let mut recovered = commands.entity(entity);\n        recovered.remove::\u003cSleeping\u003e().insert(ResumeInterpolation {\n            translation: !body.translation_paused,\n            rotation: !body.rotation_paused,\n        });\n        // 固定步内的瞬移默认也会插值；使用 Avian 的官方暂停组件避开旧海中端点。\n        // 暂停保持到下一固定步，因此连续没有固定步的渲染帧也不会出现跨岛拖影。\n        if !body.translation_paused {\n            recovered.insert(NoTranslationEasing);\n        }\n        if !body.rotation_paused {\n            recovered.insert(NoRotationEasing);\n        }\n\n        info!(target: \"demo::island_recovery\", ?entity, ?position_before,\n            position_after = ?spawn.translation, reason = \"water_recovery\",\n            \"Entity recovered after entering water\");\n    }\n}\n\n/// 下一固定步从恢复后的位置重新采样插值，只移除本模块临时添加的暂停项。\nfn resume_interpolation(mut commands: Commands, recovered: Query\u003c(Entity, \u0026ResumeInterpolation)\u003e) {\n    for (entity, resume) in \u0026recovered {\n        let mut entity = commands.entity(entity);\n        if resume.translation {\n            entity.remove::\u003cNoTranslationEasing\u003e();\n        }\n        if resume.rotation {\n            entity.remove::\u003cNoRotationEasing\u003e();\n        }\n        entity.remove::\u003cResumeInterpolation\u003e();\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use std::{fs, sync::Arc, time::Duration};\n\n    use bevy::{\n        ecs::{relationship::RelationshipTarget, schedule::SingleThreadedExecutor},\n        log::{tracing, tracing_subscriber},\n        time::TimeUpdateStrategy,\n    };\n\n    use crate::{\n        gameplay::{HoldingItems, PrototypeConfig},\n        physics::{character_body, held_collision_layers, parcel_body},\n    };\n\n    use super::*;\n\n    /// 只安装时间、变换与真实物理，不加载游戏场景、窗口、渲染器或输入设备。\n    fn test_app() -\u003e App {\n        let mut app = App::new();\n        app.add_plugins((\n            MinimalPlugins,\n            TransformPlugin,\n            PhysicsPlugins::default(),\n            IslandRecoveryPlugin,\n        ))\n        .insert_resource(Gravity(Vec3::ZERO))\n        .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n        .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO));\n        app.finish();\n        app.cleanup();\n        app.update();\n        app\n    }\n\n    /// 通过实际 app.update 覆盖固定物理和本帧插值，断言前不补跑额外同步系统。\n    fn fixed_step(app: \u0026mut App) {\n        app.insert_resource(TimeUpdateStrategy::FixedTimesteps(1));\n        app.update();\n        app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO));\n    }\n\n    fn spawn_character(app: \u0026mut App, position: Vec3, spawn: Transform) -\u003e Entity {\n        app.world_mut()\n            .spawn((\n                Character,\n                CharacterIntent {\n                    movement: Vec2::Y,\n                    jump_pending: true,\n                    interact_pending: true,\n                },\n                CharacterMotion { grounded: true },\n                SpawnPoint(spawn),\n                character_body(\u0026PrototypeConfig::default()),\n                Transform::from_translation(position),\n            ))\n            .id()\n    }\n\n    fn spawn_item(app: \u0026mut App, position: Vec3, spawn: Transform) -\u003e Entity {\n        app.world_mut()\n            .spawn((\n                Pickable,\n                SpawnPoint(spawn),\n                parcel_body(\u0026PrototypeConfig::default()),\n                Transform::from_translation(position),\n            ))\n            .id()\n    }\n\n    #[test]\n    fn character_recovery_clears_requests_and_releases_items_without_teleporting_them() {\n        let mut app = test_app();\n        let spawn = Transform::from_xyz(-1.8, 0.03, 3.5).with_rotation(Quat::from_rotation_y(0.4));\n        let character = spawn_character(\u0026mut app, Vec3::new(90.0, -2.0, -90.0), spawn);\n        let item = spawn_item(\n            \u0026mut app,\n            Vec3::new(92.0, 0.0, -90.0),\n            Transform::from_xyz(-9.0, 1.0, -3.0),\n        );\n        app.world_mut().entity_mut(item).insert((\n            \u003cHeldBy as Relationship\u003e::from(character),\n            HeldTarget {\n                translation: Vec3::ZERO,\n                rotation: Quat::IDENTITY,\n            },\n            held_collision_layers(),\n        ));\n        app.update();\n        app.world_mut()\n            .get_mut::\u003cLinearVelocity\u003e(character)\n            .unwrap()\n            .0 = Vec3::new(50.0, -30.0, 20.0);\n        app.world_mut()\n            .get_mut::\u003cAngularVelocity\u003e(character)\n            .unwrap()\n            .0 = Vec3::splat(8.0);\n        app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = Vec3::X;\n\n        fixed_step(\u0026mut app);\n\n        let world = app.world();\n        assert!(\n            world\n                .get::\u003cPosition\u003e(character)\n                .unwrap()\n                .0\n                .abs_diff_eq(spawn.translation, 0.0001)\n        );\n        assert_eq!(\n            world.get::\u003cLinearVelocity\u003e(character).unwrap().0,\n            Vec3::ZERO\n        );\n        assert_eq!(\n            world.get::\u003cAngularVelocity\u003e(character).unwrap().0,\n            Vec3::ZERO\n        );\n        let intent = world.get::\u003cCharacterIntent\u003e(character).unwrap();\n        assert_eq!(intent.movement, Vec2::Y);\n        assert!(!intent.jump_pending \u0026\u0026 !intent.interact_pending);\n        assert!(!world.get::\u003cCharacterMotion\u003e(character).unwrap().grounded);\n        assert!(world.get::\u003cHeldBy\u003e(item).is_none());\n        assert!(world.get::\u003cHeldTarget\u003e(item).is_none());\n        assert!(\n            world\n                .get::\u003cHoldingItems\u003e(character)\n                .is_none_or(RelationshipTarget::is_empty)\n        );\n        assert_eq!(\n            world.get::\u003cCollisionLayers\u003e(item).unwrap(),\n            \u0026parcel_collision_layers()\n        );\n        // 角色恢复不会重置仍在海面上方的物品，物品继续保持自己的位置和动量。\n        assert!(world.get::\u003cPosition\u003e(item).unwrap().x \u003e 91.0);\n        assert!(\n            world\n                .get::\u003cLinearVelocity\u003e(item)\n                .unwrap()\n                .0\n                .abs_diff_eq(Vec3::X, 0.0001)\n        );\n    }\n\n    #[test]\n    fn item_recovers_its_own_pose_and_does_not_interpolate_across_the_island() {\n        let mut app = test_app();\n        let spawn = Transform::from_xyz(-12.0, 0.3, 7.0).with_rotation(Quat::from_rotation_y(1.2));\n        let character_spawn = Transform::from_xyz(4.0, 0.03, 5.0);\n        let character = spawn_character(\u0026mut app, character_spawn.translation, character_spawn);\n        let item = spawn_item(\u0026mut app, Vec3::new(90.0, -2.0, -80.0), spawn);\n        app.world_mut().entity_mut(item).insert((\n            \u003cHeldBy as Relationship\u003e::from(character),\n            HeldTarget {\n                translation: Vec3::ZERO,\n                rotation: Quat::IDENTITY,\n            },\n            held_collision_layers(),\n        ));\n        let offset = Vec3::new(0.0, 0.15, 0.0);\n        let visual = app\n            .world_mut()\n            .spawn((Transform::from_translation(offset), ChildOf(item)))\n            .id();\n        app.update();\n        app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = Vec3::new(40.0, -20.0, 30.0);\n        app.world_mut().get_mut::\u003cAngularVelocity\u003e(item).unwrap().0 = Vec3::splat(10.0);\n\n        fixed_step(\u0026mut app);\n\n        for _ in 0..4 {\n            // 连续零固定步帧检查实际呈现姿态，旧海中端点不得重新参与插值。\n            app.update();\n            let world = app.world();\n            assert!(\n                world\n                    .get::\u003cPosition\u003e(item)\n                    .unwrap()\n                    .0\n                    .abs_diff_eq(spawn.translation, 0.0001)\n            );\n            assert!(\n                world\n                    .get::\u003cTransform\u003e(item)\n                    .unwrap()\n                    .translation\n                    .abs_diff_eq(spawn.translation, 0.0001)\n            );\n            assert!(\n                world\n                    .get::\u003cRotation\u003e(item)\n                    .unwrap()\n                    .0\n                    .abs_diff_eq(spawn.rotation, 0.0001)\n            );\n            assert!(\n                (world.get::\u003cTransform\u003e(item).unwrap().rotation * Vec3::NEG_Z)\n                    .abs_diff_eq(spawn.rotation * Vec3::NEG_Z, 0.0001)\n            );\n            assert!(\n                world\n                    .get::\u003cGlobalTransform\u003e(visual)\n                    .unwrap()\n                    .translation()\n                    .abs_diff_eq(spawn.transform_point(offset), 0.0001)\n            );\n            assert_eq!(world.get::\u003cLinearVelocity\u003e(item).unwrap().0, Vec3::ZERO);\n            assert_eq!(world.get::\u003cAngularVelocity\u003e(item).unwrap().0, Vec3::ZERO);\n            assert!(world.get::\u003cHeldBy\u003e(item).is_none());\n            assert!(world.get::\u003cHeldTarget\u003e(item).is_none());\n            assert_eq!(\n                world.get::\u003cCollisionLayers\u003e(item).unwrap(),\n                \u0026parcel_collision_layers()\n            );\n        }\n\n        fixed_step(\u0026mut app);\n        let world = app.world();\n        assert!(world.get::\u003cNoTranslationEasing\u003e(item).is_none());\n        assert!(world.get::\u003cNoRotationEasing\u003e(item).is_none());\n        assert!(world.get::\u003cResumeInterpolation\u003e(item).is_none());\n        assert!(\n            world\n                .get::\u003cPosition\u003e(item)\n                .unwrap()\n                .0\n                .abs_diff_eq(spawn.translation, 0.0001)\n        );\n        assert_eq!(world.get::\u003cLinearVelocity\u003e(item).unwrap().0, Vec3::ZERO);\n        assert_eq!(world.get::\u003cAngularVelocity\u003e(item).unwrap().0, Vec3::ZERO);\n    }\n\n    #[test]\n    fn water_threshold_does_not_recover_dry_entities_or_remove_existing_easing_pause() {\n        let mut app = test_app();\n        let dry_position = Vec3::new(0.0, WATER_RECOVERY_Y, 0.0);\n        let dry_item = spawn_item(\u0026mut app, dry_position, Transform::from_xyz(12.0, 1.0, 0.0));\n        let wet_item = spawn_item(\n            \u0026mut app,\n            Vec3::new(30.0, WATER_RECOVERY_Y - 0.01, 0.0),\n            Transform::from_xyz(-12.0, 1.0, 0.0),\n        );\n        app.world_mut()\n            .entity_mut(wet_item)\n            .insert(NoTranslationEasing);\n        app.update();\n\n        fixed_step(\u0026mut app);\n        fixed_step(\u0026mut app);\n\n        let world = app.world();\n        assert!(\n            world\n                .get::\u003cPosition\u003e(dry_item)\n                .unwrap()\n                .0\n                .abs_diff_eq(dry_position, 0.0001)\n        );\n        assert!(world.get::\u003cResumeInterpolation\u003e(dry_item).is_none());\n        assert!(world.get::\u003cNoTranslationEasing\u003e(dry_item).is_none());\n        assert!(world.get::\u003cNoTranslationEasing\u003e(wet_item).is_some());\n        assert!(world.get::\u003cNoRotationEasing\u003e(wet_item).is_none());\n        assert!(world.get::\u003cResumeInterpolation\u003e(wet_item).is_none());\n    }\n\n    #[test]\n    fn water_recovery_logs_once_and_later_physics_steps_keep_velocity_cleared() {\n        const CHILD_ENV: \u0026str = \"DEMO_WATER_RECOVERY_LOG_TEST_CHILD\";\n        // 其他落水测试会命中同一 tracing callsite；隔离共享兴趣缓存，保留局部日志设施。\n        // 子进程只执行本无窗口测试，不安装全局 subscriber，也不修改父进程环境。\n        if std::env::var_os(CHILD_ENV).is_none() {\n            let output = std::process::Command::new(std::env::current_exe().unwrap())\n                .args([\n                    \"--exact\",\n                    \"island_recovery::tests::water_recovery_logs_once_and_later_physics_steps_keep_velocity_cleared\",\n                    \"--nocapture\",\n                ])\n                .env(CHILD_ENV, \"1\")\n                .output()\n                .unwrap();\n            assert!(\n                output.status.success(),\n                \"Isolated water recovery test failed\\nstdout:\\n{}\\nstderr:\\n{}\",\n                String::from_utf8_lossy(\u0026output.stdout),\n                String::from_utf8_lossy(\u0026output.stderr)\n            );\n            return;\n        }\n\n        let directory =\n            std::path::Path::new(env!(\"CARGO_MANIFEST_DIR\")).join(\"tmp/island-recovery-tests\");\n        fs::create_dir_all(\u0026directory).unwrap();\n        let path = directory.join(format!(\"{}.log\", uuid::Uuid::new_v4()));\n        let subscriber = tracing_subscriber::fmt()\n            .without_time()\n            .with_ansi(false)\n            .with_writer(Arc::new(fs::File::create_new(\u0026path).unwrap()))\n            .finish();\n\n        tracing::subscriber::with_default(subscriber, || {\n            let mut app = test_app();\n            // 落水日志只在 FixedUpdate 输出，单线程调度让本测试捕获线程内 subscriber。\n            app.edit_schedule(FixedUpdate, |schedule| {\n                schedule.set_executor(SingleThreadedExecutor::new());\n            });\n            let spawn = Transform::from_xyz(-12.0, 0.3, 7.0);\n            let item = spawn_item(\u0026mut app, Vec3::new(30.0, -2.0, 0.0), spawn);\n            app.update();\n            app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = Vec3::splat(100.0);\n            app.world_mut().get_mut::\u003cAngularVelocity\u003e(item).unwrap().0 = Vec3::splat(50.0);\n            for _ in 0..6 {\n                fixed_step(\u0026mut app);\n                assert!(\n                    app.world()\n                        .get::\u003cPosition\u003e(item)\n                        .unwrap()\n                        .0\n                        .abs_diff_eq(spawn.translation, 0.0001)\n                );\n                assert_eq!(\n                    app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0,\n                    Vec3::ZERO\n                );\n                assert_eq!(\n                    app.world().get::\u003cAngularVelocity\u003e(item).unwrap().0,\n                    Vec3::ZERO\n                );\n            }\n        });\n\n        let contents = fs::read_to_string(\u0026path).unwrap();\n        fs::remove_file(path).unwrap();\n        let records: Vec\u003c_\u003e = contents\n            .lines()\n            .filter(|line| line.contains(\"Entity recovered after entering water\"))\n            .collect();\n        assert_eq!(\n            records.len(),\n            1,\n            \"Unexpected recovery log count: {contents}\"\n        );\n        let record = records[0];\n        for field in [\n            \"demo::island_recovery\",\n            \"entity=\",\n            \"position_before=\",\n            \"position_after=\",\n            \"reason=\\\"water_recovery\\\"\",\n        ] {\n            assert!(record.contains(field), \"Missing {field}: {record}\");\n        }\n    }\n}\n"},{"path":"src/main.rs","text":"//! 组装英文菜单、美术海岛、物理搬运与音效，并覆盖完整会话的文件日志。\n\nmod app_flow;\nmod art_assets;\nmod audio;\nmod audio_events;\nmod camera;\nmod character_animation;\nmod gameplay;\nmod input;\nmod island_reco
