n                .translation\n                .abs_diff_eq(root.transform_point(offset), 0.00001)\n        );\n        // 世界矩阵分解可能得到反号四元数，比较实际前向与上向。\n        for axis in [Vec3::NEG_Z, Vec3::Y] {\n            assert!((root_global.rotation * axis).abs_diff_eq(root.rotation * axis, 0.00001));\n            assert!((visual_global.rotation * axis).abs_diff_eq(root.rotation * axis, 0.00001));\n        }\n    }\n\n    #[test]\n    fn held_target_and_visuals_use_current_frame_without_teleporting_box() {\n        for (frame_duration, grip) in [Duration::ZERO, Duration::from_secs_f64(1.0 / 120.0)]\n            .into_iter()\n            .flat_map(|duration| carry_grip_cases().map(|grip| (duration, grip)))\n        {\n            let (mut app, window, character, camera, _) = test_app();\n            let character_visual = app\n                .world_mut()\n                .spawn((CharacterVisual, Visibility::default(), ChildOf(character)))\n                .id();\n            let item = spawn_test_item(\u0026mut app, Vec3::new(0.0, 0.3, -1.0));\n            if let Some(grip) = grip {\n                app.world_mut().entity_mut(item).insert(CarryGrip(grip));\n            }\n            let grip_offset =\n                grip.unwrap_or_else(|| app.world().resource::\u003cPrototypeConfig\u003e().hold_offset);\n            let visual_offset = Vec3::new(0.0, 0.18, 0.0);\n            app.world_mut()\n                .entity_mut(item)\n                .insert(Visibility::default());\n            let visual_child = app\n                .world_mut()\n                .spawn((\n                    Transform::from_translation(visual_offset),\n                    Visibility::default(),\n                    ChildOf(item),\n                ))\n                .id();\n            fixed_step(\u0026mut app);\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .interact_pending = true;\n            fixed_step(\u0026mut app);\n            assert_eq!(\n                app.world()\n                    .get::\u003cHoldingItems\u003e(character)\n                    .unwrap()\n                    .iter()\n                    .next(),\n                Some(item)\n            );\n            assert_eq!(\n                app.world().get::\u003cRigidBody\u003e(item),\n                Some(\u0026RigidBody::Dynamic)\n            );\n            let target = app.world().get::\u003cHeldTarget\u003e(item).unwrap();\n            assert!(\n                app.world()\n                    .get::\u003cPosition\u003e(item)\n                    .unwrap()\n                    .0\n                    .distance(target.translation)\n                    \u003e 0.1\n            );\n\n            app.insert_resource(TimeUpdateStrategy::ManualDuration(frame_duration));\n            let mut frames_without_fixed_step = 0;\n            for frame in 0..12 {\n                let fixed_time = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed();\n                let box_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n                perspective_key(\n                    \u0026mut app,\n                    window,\n                    if frame % 2 == 0 {\n                        ButtonState::Pressed\n                    } else {\n                        ButtonState::Released\n                    },\n                );\n                mouse_motion(\u0026mut app, Vec2::new(25.0, 5.0));\n                // 不补跑固定步，直接检查本帧目标、物理位置和视觉子实体传播结果。\n                app.update();\n                let world = app.world();\n                if world.resource::\u003cTime\u003cFixed\u003e\u003e().elapsed() == fixed_time {\n                    frames_without_fixed_step += 1;\n                    assert_eq!(world.get::\u003cPosition\u003e(item).unwrap().0, box_position);\n                }\n                let orbit = world.get::\u003cOrbitCamera\u003e(camera).unwrap();\n                assert_eq!(\n                    orbit.perspective,\n                    if (frame / 2) % 2 == 0 {\n                        CameraPerspective::FirstPerson\n                    } else {\n                        CameraPerspective::ThirdPerson\n                    }\n                );\n                assert_eq!(\n                    world\n                        .get::\u003cInheritedVisibility\u003e(character_visual)\n                        .unwrap()\n                        .get(),\n                    orbit.perspective == CameraPerspective::ThirdPerson\n                );\n                assert!(\n                    world\n                        .get::\u003cInheritedVisibility\u003e(visual_child)\n                        .unwrap()\n                        .get()\n                );\n                let character_transform = world.get::\u003cTransform\u003e(character).unwrap();\n                let rotation = Quat::from_rotation_y(orbit.yaw);\n                assert!(character_transform.rotation.abs_diff_eq(rotation, 0.00001));\n                let held_target = world.get::\u003cHeldTarget\u003e(item).unwrap();\n                let expected_target = character_transform.transform_point(grip_offset);\n                assert!(\n                    held_target\n                        .translation\n                        .abs_diff_eq(expected_target, 0.00001)\n                );\n                assert!(held_target.rotation.abs_diff_eq(rotation, 0.00001));\n                let expected_camera = orbit.transform(character_transform.translation);\n                let camera_transform = world.get::\u003cTransform\u003e(camera).unwrap();\n                assert!(\n                    camera_transform\n                        .translation\n                        .abs_diff_eq(expected_camera.translation, 0.00001)\n                );\n                assert!(\n                    camera_transform\n                        .rotation\n                        .abs_diff_eq(expected_camera.rotation, 0.00001)\n                );\n                assert_eq!(world.get::\u003cRigidBody\u003e(item), Some(\u0026RigidBody::Dynamic));\n                assert_item_visual_matches_root(world, item, visual_child, visual_offset);\n            }\n            assert!(\n                frames_without_fixed_step \u003e 0,\n                \"The regression must exercise frames without a simulation step\"\n            );\n        }\n    }\n\n    #[test]\n    fn turning_updates_grip_target_and_released_box_stops_following() {\n        for (perspective, grip) in [\n            CameraPerspective::ThirdPerson,\n            CameraPerspective::FirstPerson,\n        ]\n        .into_iter()\n        .flat_map(|perspective| carry_grip_cases().map(|grip| (perspective, grip)))\n        {\n            let (mut app, window, character, camera, _) = test_app();\n            if perspective == CameraPerspective::FirstPerson {\n                perspective_key(\u0026mut app, window, ButtonState::Pressed);\n                app.update();\n            }\n            let item = spawn_test_item(\u0026mut app, Vec3::new(0.0, 0.3, -1.0));\n            if let Some(grip) = grip {\n                app.world_mut().entity_mut(item).insert(CarryGrip(grip));\n            }\n            let grip_offset =\n                grip.unwrap_or_else(|| app.world().resource::\u003cPrototypeConfig\u003e().hold_offset);\n            let visual_offset = Vec3::new(0.0, 0.18, 0.0);\n            let visual_child = app\n                .world_mut()\n                .spawn((Transform::from_translation(visual_offset), ChildOf(item)))\n                .id();\n            fixed_step(\u0026mut app);\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .interact_pending = true;\n            fixed_step(\u0026mut app);\n            for _ in 0..12 {\n                fixed_step(\u0026mut app);\n            }\n            let physical_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            let fixed_before = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed();\n            mouse_motion(\u0026mut app, Vec2::new(500.0, -100.0));\n            app.update();\n            assert_eq!(\n                app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed(),\n                fixed_before\n            );\n            assert_eq!(\n                app.world().get::\u003cPosition\u003e(item).unwrap().0,\n                physical_position\n            );\n            let yaw = app.world().get::\u003cOrbitCamera\u003e(camera).unwrap().yaw;\n            let character_transform = app.world().get::\u003cTransform\u003e(character).unwrap();\n            let rotation = Quat::from_rotation_y(yaw);\n            assert!(character_transform.up().dot(Vec3::Y) \u003e 0.9999);\n            assert!(character_transform.rotation.abs_diff_eq(rotation, 0.00001));\n            let expected_target = character_transform.transform_point(grip_offset);\n            assert!(\n                app.world()\n                    .get::\u003cHeldTarget\u003e(item)\n                    .unwrap()\n                    .translation\n                    .abs_diff_eq(expected_target, 0.00001)\n            );\n            assert_item_visual_matches_root(app.world(), item, visual_child, visual_offset);\n\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .interact_pending = true;\n            fixed_step(\u0026mut app);\n            assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n            assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n            assert_eq!(\n                app.world().get::\u003cRigidBody\u003e(item),\n                Some(\u0026RigidBody::Dynamic)\n            );\n            let released_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            let released_velocity = app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0;\n            let released_transform = *app.world().get::\u003cTransform\u003e(item).unwrap();\n            assert!(\n                released_position.y\n                    \u003e app.world().resource::\u003cPrototypeConfig\u003e().parcel_half_height + 0.1\n            );\n            for _ in 0..6 {\n                mouse_motion(\u0026mut app, Vec2::new(50.0, 10.0));\n                app.update();\n                // 没有固定步时，仅更新人物和镜头；已释放箱子不得被旧目标重新拉回。\n                assert_eq!(\n                    app.world().get::\u003cPosition\u003e(item).unwrap().0,\n                    released_position\n                );\n                assert_eq!(\n                    app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0,\n                    released_velocity\n                );\n                assert_eq!(\n                    *app.world().get::\u003cTransform\u003e(item).unwrap(),\n                    released_transform\n                );\n                assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n                assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n                assert_item_visual_matches_root(app.world(), item, visual_child, visual_offset);\n            }\n        }\n    }\n\n    #[test]\n    fn missing_target_or_controller_releases_capture_and_keeps_camera_pose() {\n        for remove_target in [true, false] {\n            let (mut app, window, character, camera, controller) = test_app();\n            let before = *app.world().get::\u003cTransform\u003e(camera).unwrap();\n            app.world_mut()\n                .despawn(if remove_target { character } else { controller });\n            mouse_motion(\u0026mut app, Vec2::ONE * 100.0);\n            // 捕获释放应在当前无固定步帧完成，不能补跑物理后再检查鼠标生命周期。\n            app.update();\n            assert!(!app.world().get::\u003cMouseLookState\u003e(camera).unwrap().active);\n            assert!(app.world().get::\u003cCursorOptions\u003e(window).unwrap().visible);\n            assert_eq!(*app.world().get::\u003cTransform\u003e(camera).unwrap(), before);\n        }\n    }\n\n    #[test]\n    fn cameras_follow_their_own_characters_with_original_initial_offset() {\n        let mut app = App::new();\n        app.add_systems(Update, follow_orbit_camera);\n        for position in [Vec3::new(3.0, 1.0, -2.0), Vec3::new(-4.0, 0.0, 7.0)] {\n            let target = app\n                .world_mut()\n                .spawn((Character, Transform::from_translation(position)))\n                .id();\n            app.world_mut()\n                .spawn((OrbitCamera::new(target), Transform::default()));\n        }\n        app.update();\n        let world = app.world_mut();\n        let mut query = world.query::\u003c(\u0026OrbitCamera, \u0026Transform)\u003e();\n        for (orbit, transform) in query.iter(world) {\n            let position = world.get::\u003cTransform\u003e(orbit.target).unwrap().translation;\n            assert!(\n                transform\n                    .translation\n                    .abs_diff_eq(position + Vec3::new(0.0, 6.0, 8.0), 0.00001)\n            );\n        }\n    }\n}\n"},{"path":"src/character_animation.rs","text":"//! 快递员视觉动画读取实际物理速度和持有关系，不驱动角色业务根的运动。\n\nuse std::time::Duration;\n\nuse avian3d::prelude::LinearVelocity;\nuse bevy::{\n    ecs::relationship::RelationshipTarget, prelude::*, world_serialization::WorldInstanceReady,\n};\n\nuse crate::gameplay::{Character, HoldingItems};\n\nconst WALK_SPEED_THRESHOLD: f32 = 0.15;\nconst TRANSITION_DURATION: Duration = Duration::from_millis(180);\n\n/// 挂在 Character 直属视觉根上的 glTF 引用；只有标记的快递员接入玩法动画。\n#[derive(Component, Clone, Default, FromTemplate)]\npub struct CourierVisual(pub Handle\u003cGltf\u003e);\n\n/// 等待 glTF 场景和命名动画都可用，避免异步子资产先完成时错过初始化。\n#[derive(Component)]\nstruct CourierAnimationPending;\n\n/// 动作节点属于本次生成的图，不依赖 glTF 文件中的动画排列索引。\n#[derive(Clone, Copy)]\nstruct CourierAnimationNodes {\n    idle: AnimationNodeIndex,\n    walk: AnimationNodeIndex,\n    carry_idle: AnimationNodeIndex,\n}\n\nimpl CourierAnimationNodes {\n    fn node(self, state: CourierAnimationState) -\u003e AnimationNodeIndex {\n        match state {\n            CourierAnimationState::Idle =\u003e self.idle,\n            CourierAnimationState::Walk =\u003e self.walk,\n            CourierAnimationState::CarryIdle =\u003e self.carry_idle,\n        }\n    }\n}\n\n/// 只保存播放器关联和当前动作；速度与持物状态仍由业务组件提供。\n#[derive(Component)]\nstruct CourierAnimation {\n    character: Entity,\n    nodes: CourierAnimationNodes,\n    current: CourierAnimationState,\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nenum CourierAnimationState {\n    Idle,\n    Walk,\n    CarryIdle,\n}\n\nimpl CourierAnimationState {\n    fn name(self) -\u003e \u0026'static str {\n        match self {\n            Self::Idle =\u003e \"Idle\",\n            Self::Walk =\u003e \"Walk\",\n            Self::CarryIdle =\u003e \"Carry_Idle\",\n        }\n    }\n}\n\n/// 注册场景就绪后的动画绑定，以及固定模拟结束后逐帧读取状态的动画切换。\npub(crate) struct CharacterAnimationPlugin;\n\nimpl Plugin for CharacterAnimationPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_observer(mark_courier_animation_ready).add_systems(\n            Update,\n            // 初始化插入的关联和过渡组件须在同帧切换系统运行前可见。\n            (initialize_ready_couriers, sync_courier_animation).chain(),\n        );\n    }\n}\n\nfn mark_courier_animation_ready(\n    ready: On\u003cWorldInstanceReady\u003e,\n    mut commands: Commands,\n    couriers: Query\u003c(), With\u003cCourierVisual\u003e\u003e,\n) {\n    if couriers.contains(ready.entity) {\n        commands\n            .entity(ready.entity)\n            .insert(CourierAnimationPending);\n    }\n}\n\n/// 场景就绪后只遍历该视觉根的子树，避免把 NPC 或其他模型的播放器接到主角上。\nfn initialize_ready_couriers(\n    mut commands: Commands,\n    roots: Query\u003c(Entity, \u0026CourierVisual, \u0026ChildOf), With\u003cCourierAnimationPending\u003e\u003e,\n    characters: Query\u003c(\u0026LinearVelocity, Option\u003c\u0026HoldingItems\u003e), With\u003cCharacter\u003e\u003e,\n    children: Query\u003c\u0026Children\u003e,\n    gltfs: Res\u003cAssets\u003cGltf\u003e\u003e,\n    mut graphs: ResMut\u003cAssets\u003cAnimationGraph\u003e\u003e,\n    mut players: Query\u003c\u0026mut AnimationPlayer\u003e,\n) {\n    for (visual_root, visual, parent) in \u0026roots {\n        let character = parent.parent();\n        let Ok((velocity, holding)) = characters.get(character) else {\n            warn!(target: \"demo::character_animation\", ?visual_root, ?character,\n                reason = \"invalid_character_parent\", \"Courier animation binding skipped\");\n            commands\n                .entity(visual_root)\n                .remove::\u003cCourierAnimationPending\u003e();\n            continue;\n        };\n        let Some(gltf) = gltfs.get(\u0026visual.0) else {\n            continue;\n        };\n        let named_clip = |name: \u0026'static str| gltf.named_animations.get(name).cloned().ok_or(name);\n        let clips = (|| {\n            Ok::\u003c_, \u0026'static str\u003e([\n                named_clip(\"Idle\")?,\n                named_clip(\"Walk\")?,\n                named_clip(\"Carry_Idle\")?,\n            ])\n        })();\n        let clips = match clips {\n            Ok(clips) =\u003e clips,\n            Err(animation_name) =\u003e {\n                error!(target: \"demo::character_animation\", ?visual_root, ?character,\n                    animation_name, reason = \"missing_named_animation\",\n                    \"Courier animation binding failed\");\n                commands\n                    .entity(visual_root)\n                    .remove::\u003cCourierAnimationPending\u003e();\n                continue;\n            }\n        };\n        let (graph, indices) = AnimationGraph::from_clips(clips);\n        let nodes = CourierAnimationNodes {\n            idle: indices[0],\n            walk: indices[1],\n            carry_idle: indices[2],\n        };\n        let graph_handle = graphs.add(graph);\n        let current = choose_animation(velocity.0, holding);\n        let mut player_count = 0;\n        for descendant in children.iter_descendants(visual_root) {\n            let Ok(mut player) = players.get_mut(descendant) else {\n                continue;\n            };\n            let mut transitions = AnimationTransitions::new();\n            transitions\n                .play(\u0026mut player, nodes.node(current), Duration::ZERO)\n                .repeat();\n            commands.entity(descendant).insert((\n                AnimationGraphHandle(graph_handle.clone()),\n                transitions,\n                CourierAnimation {\n                    character,\n                    nodes,\n                    current,\n                },\n            ));\n            player_count += 1;\n        }\n        commands\n            .entity(visual_root)\n            .remove::\u003cCourierAnimationPending\u003e();\n        if player_count == 0 {\n            warn!(target: \"demo::character_animation\", ?visual_root, ?character,\n                reason = \"animation_player_missing\", \"Courier animation binding skipped\");\n        } else {\n            info!(target: \"demo::character_animation\", ?visual_root, ?character,\n                player_count, animation_after = current.name(), reason = \"world_instance_ready\",\n                \"Courier animation initialized\");\n        }\n    }\n}\n\n/// 没有 Carry_Walk 资源时，持物优先使用 Carry_Idle，保留双手搬运姿态。\nfn choose_animation(velocity: Vec3, holding: Option\u003c\u0026HoldingItems\u003e) -\u003e CourierAnimationState {\n    if holding.is_some_and(|items| items.iter().next().is_some()) {\n        CourierAnimationState::CarryIdle\n    } else if Vec2::new(velocity.x, velocity.z).length_squared()\n        \u003e WALK_SPEED_THRESHOLD * WALK_SPEED_THRESHOLD\n    {\n        CourierAnimationState::Walk\n    } else {\n        CourierAnimationState::Idle\n    }\n}\n\n/// Update 位于固定模拟之后；没有固定步的帧沿用真实速度，不按输入意图播放步行。\nfn sync_courier_animation(\n    mut commands: Commands,\n    characters: Query\u003c(\u0026LinearVelocity, Option\u003c\u0026HoldingItems\u003e), With\u003cCharacter\u003e\u003e,\n    mut players: Query\u003c(\n        Entity,\n        \u0026mut AnimationPlayer,\n        \u0026mut AnimationTransitions,\n        \u0026mut CourierAnimation,\n    )\u003e,\n) {\n    for (player_entity, mut player, mut transitions, mut animation) in \u0026mut players {\n        let Ok((velocity, holding)) = characters.get(animation.character) else {\n            player.stop_all();\n            commands.entity(player_entity).remove::\u003c(\n                CourierAnimation,\n                AnimationGraphHandle,\n                AnimationTransitions,\n            )\u003e();\n            warn!(target: \"demo::character_animation\", ?player_entity,\n                character = ?animation.character, reason = \"character_missing\",\n                \"Courier animation detached\");\n            continue;\n        };\n        let next = choose_animation(velocity.0, holding);\n        if next == animation.current {\n            continue;\n        }\n        transitions\n            .play(\u0026mut player, animation.nodes.node(next), TRANSITION_DURATION)\n            .repeat();\n        info!(target: \"demo::character_animation\", ?player_entity,\n            character = ?animation.character,\n            animation_before = animation.current.name(), animation_after = next.name(),\n            reason = \"velocity_or_holding_changed\", \"Courier animation changed\");\n        animation.current = next;\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use bevy::{\n        animation::graph::AnimationNodeType,\n        ecs::relationship::Relationship,\n        world_serialization::{WorldAsset, WorldInstanceSpawner},\n    };\n\n    use crate::{camera::CharacterVisual, gameplay::HeldBy};\n\n    fn animation_app() -\u003e App {\n        let mut app = App::new();\n        app.init_resource::\u003cAssets\u003cGltf\u003e\u003e()\n            .init_resource::\u003cAssets\u003cAnimationClip\u003e\u003e()\n            .init_resource::\u003cAssets\u003cAnimationGraph\u003e\u003e()\n            .init_resource::\u003cAssets\u003cWorldAsset\u003e\u003e()\n            .add_plugins(CharacterAnimationPlugin);\n        app\n    }\n\n    fn courier_asset(app: \u0026mut App) -\u003e Handle\u003cGltf\u003e {\n        let mut clips = app.world_mut().resource_mut::\u003cAssets\u003cAnimationClip\u003e\u003e();\n        let idle = clips.add(AnimationClip::default());\n        let walk = clips.add(AnimationClip::default());\n        let carry = clips.add(AnimationClip::default());\n        let gltf = Gltf {\n            scenes: default(),\n            named_scenes: default(),\n            meshes: default(),\n            named_meshes: default(),\n            materials: default(),\n            named_materials: default(),\n            nodes: default(),\n            named_nodes: default(),\n            skins: default(),\n            named_skins: default(),\n            default_scene: None,\n            // 排列故意与动作图不同，确保生产代码按名字绑定。\n            animations: vec![carry.clone(), walk.clone(), idle.clone()],\n            named_animations: [\n                (\"Carry_Idle\".into(), carry),\n                (\"Walk\".into(), walk),\n                (\"Idle\".into(), idle),\n            ]\n            .into_iter()\n            .collect(),\n            source: None,\n        };\n        app.world_mut().resource_mut::\u003cAssets\u003cGltf\u003e\u003e().add(gltf)\n    }\n\n    fn spawn_courier(app: \u0026mut App, asset: Handle\u003cGltf\u003e) -\u003e (Entity, Entity, Entity) {\n        let character = app\n            .world_mut()\n            .spawn((Character, LinearVelocity::ZERO))\n            .id();\n        let visual = app\n            .world_mut()\n            .spawn((CourierVisual(asset), CharacterVisual, ChildOf(character)))\n            .id();\n        let armature = app.world_mut().spawn(ChildOf(visual)).id();\n        let player = app\n            .world_mut()\n            .spawn((AnimationPlayer::default(), ChildOf(armature)))\n            .id();\n        (character, visual, player)\n    }\n\n    fn notify_ready(app: \u0026mut App, visual: Entity) {\n        // 用最小空世界取得有效实例标识；不加载窗口、渲染器或完整游戏。\n        let asset = app\n            .world_mut()\n            .resource_mut::\u003cAssets\u003cWorldAsset\u003e\u003e()\n            .add(WorldAsset::new(World::new()));\n        let instance_id = WorldInstanceSpawner::default()\n            .spawn_sync(app.world_mut(), asset.id())\n            .unwrap();\n        app.world_mut().trigger(WorldInstanceReady {\n            entity: visual,\n            instance_id,\n        });\n    }\n\n    fn current_state(app: \u0026App, player: Entity) -\u003e CourierAnimationState {\n        let animation = app.world().get::\u003cCourierAnimation\u003e(player).unwrap();\n        let node = animation.nodes.node(animation.current);\n        assert_eq!(\n            app.world()\n                .get::\u003cAnimationTransitions\u003e(player)\n                .unwrap()\n                .get_main_animation(),\n            Some(node)\n        );\n        assert!(\n            app.world()\n                .get::\u003cAnimationPlayer\u003e(player)\n                .unwrap()\n                .is_playing_animation(node)\n        );\n        animation.current\n    }\n\n    #[test]\n    fn actions_use_horizontal_physics_velocity_and_real_holding_relationship() {\n        let mut app = animation_app();\n        let asset = courier_asset(\u0026mut app);\n        let (character, visual, player) = spawn_courier(\u0026mut app, asset);\n        notify_ready(\u0026mut app, visual);\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Idle);\n\n        app.world_mut()\n            .get_mut::\u003cLinearVelocity\u003e(character)\n            .unwrap()\n            .0 = Vec3::new(0.0, 6.0, 0.0);\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Idle);\n\n        app.world_mut()\n            .get_mut::\u003cLinearVelocity\u003e(character)\n            .unwrap()\n            .0 = Vec3::new(0.1, 0.0, 0.12);\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Walk);\n\n        let item = app\n            .world_mut()\n            .spawn(\u003cHeldBy as Relationship\u003e::from(character))\n            .id();\n        app.update();\n        assert_eq!(\n            current_state(\u0026app, player),\n            CourierAnimationState::CarryIdle\n        );\n        app.world_mut().entity_mut(item).remove::\u003cHeldBy\u003e();\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Walk);\n        app.world_mut()\n            .get_mut::\u003cLinearVelocity\u003e(character)\n            .unwrap()\n            .0 = Vec3::ZERO;\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Idle);\n    }\n\n    #[test]\n    fn only_courier_subtree_binds_named_clips() {\n        let mut app = animation_app();\n        let asset = courier_asset(\u0026mut app);\n        let (_, visual, player) = spawn_courier(\u0026mut app, asset.clone());\n        let npc = app.world_mut().spawn_empty().id();\n        let npc_visual = app.world_mut().spawn(ChildOf(npc)).id();\n        let npc_player = app\n            .world_mut()\n            .spawn((AnimationPlayer::default(), ChildOf(npc_visual)))\n            .id();\n        let invalid_visual = app\n            .world_mut()\n            .spawn((CourierVisual(asset.clone()), ChildOf(npc)))\n            .id();\n        let invalid_player = app\n            .world_mut()\n            .spawn((AnimationPlayer::default(), ChildOf(invalid_visual)))\n            .id();\n        for root in [visual, npc_visual, invalid_visual] {\n            notify_ready(\u0026mut app, root);\n        }\n        app.update();\n        for other in [npc_player, invalid_player] {\n            assert!(app.world().get::\u003cCourierAnimation\u003e(other).is_none());\n            assert!(app.world().get::\u003cAnimationGraphHandle\u003e(other).is_none());\n        }\n\n        let animation = app.world().get::\u003cCourierAnimation\u003e(player).unwrap();\n        let graph_handle = app.world().get::\u003cAnimationGraphHandle\u003e(player).unwrap();\n        let graph = app\n            .world()\n            .resource::\u003cAssets\u003cAnimationGraph\u003e\u003e()\n            .get(\u0026graph_handle.0)\n            .unwrap();\n        let gltf = app.world().resource::\u003cAssets\u003cGltf\u003e\u003e().get(\u0026asset).unwrap();\n        for (state, name) in [\n            (CourierAnimationState::Idle, \"Idle\"),\n            (CourierAnimationState::Walk, \"Walk\"),\n            (CourierAnimationState::CarryIdle, \"Carry_Idle\"),\n        ] {\n            let AnimationNodeType::Clip(clip) = \u0026graph[animation.nodes.node(state)].node_type\n            else {\n                panic!(\"expected a clip node\");\n            };\n            assert_eq!(clip.id(), gltf.named_animations[name].id());\n        }\n    }\n\n    #[test]\n    fn unchanged_frames_preserve_player_progress() {\n        let mut app = animation_app();\n        let asset = courier_asset(\u0026mut app);\n        let (_, visual, player) = spawn_courier(\u0026mut app, asset);\n        notify_ready(\u0026mut app, visual);\n        app.update();\n        let idle = app\n            .world()\n            .get::\u003cCourierAnimation\u003e(player)\n            .unwrap()\n            .nodes\n            .idle;\n        app.world_mut()\n            .get_mut::\u003cAnimationPlayer\u003e(player)\n            .unwrap()\n            .animation_mut(idle)\n            .unwrap()\n            .set_seek_time(0.65);\n        for _ in 0..3 {\n            app.update();\n            let active = app.world().get::\u003cAnimationPlayer\u003e(player).unwrap();\n            assert_eq!(active.animation(idle).unwrap().seek_time(), 0.65);\n            assert_eq!(active.playing_animations().count(), 1);\n            assert_eq!(\n                app.world()\n                    .get::\u003cAnimationTransitions\u003e(player)\n                    .unwrap()\n                    .get_main_animation(),\n                Some(idle)\n            );\n        }\n    }\n\n    #[test]\n    fn ready_scene_waits_for_gltf_asset() {\n        let mut app = animation_app();\n        let asset = courier_asset(\u0026mut app);\n        let gltf = app\n            .world_mut()\n            .resource_mut::\u003cAssets\u003cGltf\u003e\u003e()\n            .remove(\u0026asset)\n            .unwrap();\n        let (_, visual, player) = spawn_courier(\u0026mut app, asset.clone());\n        notify_ready(\u0026mut app, visual);\n        app.update();\n        assert!(app.world().get::\u003cCourierAnimation\u003e(player).is_none());\n        app.world_mut()\n            .resource_mut::\u003cAssets\u003cGltf\u003e\u003e()\n            .insert(asset.id(), gltf)\n            .unwrap();\n        app.update();\n        assert_eq!(current_state(\u0026app, player), CourierAnimationState::Idle);\n        assert!(app.world().get::\u003cCourierAnimationPending\u003e(visual).is_none());\n    }\n\n    #[test]\n    fn missing_character_detaches_surviving_player() {\n        let mut app = animation_app();\n        let asset = courier_asset(\u0026mut app);\n        let (character, visual, player) = spawn_courier(\u0026mut app, asset);\n        notify_ready(\u0026mut app, visual);\n        app.update();\n        // 模拟视觉被外部重挂后旧角色销毁，播放器不能继续读取失效关联。\n        app.world_mut().entity_mut(visual).remove::\u003cChildOf\u003e();\n        app.world_mut().despawn(character);\n        app.update();\n        assert!(app.world().get::\u003cCourierAnimation\u003e(player).is_none());\n        assert!(app.world().get::\u003cAnimationGraphHandle\u003e(player).is_none());\n        assert!(app.world().get::\u003cAnimationTransitions\u003e(player).is_none());\n        assert_eq!(\n            app.world()\n                .get::\u003cAnimationPlayer\u003e(player)\n                .unwrap()\n                .playing_animations()\n                .count(),\n            0\n        );\n    }\n}\n"},{"path":"src/gameplay.rs","text":"//! 固定步把角色意图转换为力与冲量，物理持握保留箱子的碰撞和动量。\n\nuse avian3d::prelude::*;\nuse bevy::{ecs::relationship::RelationshipTarget, prelude::*};\nuse std::collections::HashSet;\n\nuse crate::physics::{DemoPhysicsPlugin, held_collision_layers, parcel_collision_layers};\n\n/// 独立于运行时实体标识的玩家身份，便于后续多人输入路由。\n#[derive(Component, Reflect, Clone, Copy, Debug, PartialEq, Eq, Hash)]\n#[reflect(Component)]\npub struct PlayerId(pub u64);\n\n/// 控制者当前操作的角色；输入设备和角色状态分别存储。\n#[derive(Component, Reflect)]\n#[reflect(Component)]\npub struct ControlsCharacter(#[entities] pub Entity);\n\n/// 具有移动和跳跃能力的角色。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct Character;\n\n/// 来自控制者的玩法意图；输入状态跨帧保留，供固定步模拟读取。\n///\n/// PreUpdate 与 FixedUpdate 不一一对应：移动轴持续有效，跳跃和交互请求只消费一次。\n/// 输入 Observer 仅更新意图，不按输入事件次数积分位置，避免运动速度依赖渲染帧率。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct CharacterIntent {\n    /// 角色局部水平输入轴：x 表示左右横移，y 表示前后移动。\n    pub movement: Vec2,\n    pub jump_pending: bool,\n    pub interact_pending: bool,\n}\n\n/// 接地状态由物理查询派生；实际速度直接读取 Avian 的 LinearVelocity。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct CharacterMotion {\n    pub grounded: bool,\n}\n\n/// 可搬运快递身份；纸箱与木箱的美术种类由场景组件表达。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct Parcel;\n\n/// 允许被拾取的能力标签。\n#[derive(Component, Reflect, Default, Clone)]\n#[reflect(Component)]\npub struct Pickable;\n\n/// 模型对应的手前偏移；未指定时继续使用原型配置，纸箱对齐持箱动作的双手。\n#[derive(Component, Reflect, Default, Clone, Copy)]\n#[reflect(Component)]\npub(crate) struct CarryGrip(pub Vec3);\n\n/// 物体的持有者；只由交互系统插入或移除。\n#[derive(Component)]\n#[relationship(relationship_target = HoldingItems)]\npub struct HeldBy(Entity);\n\n/// Bevy 根据 HeldBy 自动维护的反向索引，业务代码只读取。\n#[derive(Component)]\n#[relationship_target(relationship = HeldBy)]\npub struct HoldingItems(Vec\u003cEntity\u003e);\n\n/// 手前的目标姿态；呈现同步只更新目标，箱子的实际位置仍由物理解算。\n#[derive(Component, Reflect)]\n#[reflect(Component)]\npub(crate) struct HeldTarget {\n    pub translation: Vec3,\n    pub rotation: Quat,\n}\n\n/// 原型的运动、平地和持箱参数。\n#[derive(Resource, Reflect, Clone, Debug)]\n#[reflect(Resource)]\npub struct PrototypeConfig {\n    pub move_speed: f32,\n    pub acceleration: f32,\n    pub braking_acceleration: f32,\n    pub air_acceleration: f32,\n    pub jump_speed: f32,\n    pub gravity: f32,\n    pub pickup_radius: f32,\n    pub hold_offset: Vec3,\n    pub ground_y: f32,\n    pub parcel_half_height: f32,\n    pub character_mass: f32,\n    pub character_height: f32,\n    pub character_radius: f32,\n    pub parcel_mass: f32,\n    pub hold_frequency: f32,\n    pub hold_damping_ratio: f32,\n    pub hold_max_force: f32,\n}\n\nimpl Default for PrototypeConfig {\n    fn default() -\u003e Self {\n        Self {\n            move_speed: 4.5,\n            acceleration: 30.0,\n            braking_acceleration: 45.0,\n            air_acceleration: 6.0,\n            jump_speed: 5.0,\n            gravity: 9.81,\n            pickup_radius: 1.8,\n            hold_offset: Vec3::new(0.0, 1.0, -0.9),\n            ground_y: 0.0,\n            parcel_half_height: 0.3,\n            character_mass: 75.0,\n            character_height: 1.9,\n            character_radius: 0.32,\n            parcel_mass: 3.0,\n            hold_frequency: 3.0,\n            hold_damping_ratio: 1.0,\n            hold_max_force: 450.0,\n        }\n    }\n}\n\n/// 注册固定步控制、交互与物理解算后的状态观察；不加载游戏窗口。\npub struct GameplayPlugin;\n\n/// 固定步先同步朝向，再准备力、冲量和持握目标，随后由 Avian 求解。\n#[derive(SystemSet, Clone, Copy, Debug, PartialEq, Eq, Hash)]\npub enum GameplaySystems {\n    Simulate,\n}\n\nimpl Plugin for GameplayPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.register_type::\u003cPlayerId\u003e()\n            .register_type::\u003cControlsCharacter\u003e()\n            .register_type::\u003cCharacter\u003e()\n            .register_type::\u003cCharacterIntent\u003e()\n            .register_type::\u003cCharacterMotion\u003e()\n            .register_type::\u003cParcel\u003e()\n            .register_type::\u003cPickable\u003e()\n            .register_type::\u003cCarryGrip\u003e()\n            .register_type::\u003cHeldTarget\u003e()\n            .register_type::\u003cPrototypeConfig\u003e()\n            .init_resource::\u003cPrototypeConfig\u003e()\n            .add_plugins(DemoPhysicsPlugin)\n            .add_systems(\n                FixedUpdate,\n                (\n                    update_grounded,\n                    move_characters,\n                    jump_characters,\n                    handle_interaction,\n                    release_orphaned_items,\n                    sync_held_objects,\n                    apply_grip_forces,\n                )\n                    // 拿放的关系与碰撞层命令必须在本步施力前可见。\n                    .chain()\n                    .in_set(GameplaySystems::Simulate),\n            )\n            .add_systems(\n                FixedPostUpdate,\n                (update_grounded, log_character_velocity)\n                    .chain()\n                    .after(PhysicsSystems::Writeback),\n            );\n    }\n}\n\n/// 脚底附近的小球向下探测支撑面；墙面法线和上升中的角色不能算接地。\nfn update_grounded(\n    config: Res\u003cPrototypeConfig\u003e,\n    spatial_query: SpatialQuery,\n    colliders: Query\u003c(Option\u003c\u0026CollisionLayers\u003e, Has\u003cHeldBy\u003e, Has\u003cSensor\u003e)\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            \u0026Position,\n            \u0026LinearVelocity,\n            Option\u003c\u0026CollisionLayers\u003e,\n            \u0026mut CharacterMotion,\n        ),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    let probe = Collider::sphere(config.character_radius * 0.8);\n    for (entity, position, velocity, layers, mut motion) in \u0026mut characters {\n        let filter = SpatialQueryFilter::from_excluded_entities([entity]);\n        let character_layers = layers.copied().unwrap_or_default();\n        let mut grounded = false;\n        if velocity.y \u003c= 0.5 {\n            // 空间查询只按目标所属层过滤；支撑还必须满足双方碰撞掩码并排除持握物和传感器。\n            // 遍历所有命中，避免最近的侧墙挡住稍远的有效地面。\n            spatial_query.shape_hits_callback(\n                \u0026probe,\n                position.0 + Vec3::Y * config.character_radius,\n                Quat::IDENTITY,\n                Dir3::NEG_Y,\n                \u0026ShapeCastConfig::from_max_distance(0.12),\n                \u0026filter,\n                |hit| {\n                    if let Ok((layers, held, sensor)) = colliders.get(hit.entity) {\n                        grounded |= !held\n                            \u0026\u0026 !sensor\n                            \u0026\u0026 character_layers.interacts_with(layers.copied().unwrap_or_default())\n                            \u0026\u0026 hit.normal1.y \u003e= 0.65;\n                    }\n                    !grounded\n                },\n            );\n        }\n        if grounded != motion.grounded {\n            info!(\n                ?entity,\n                before = motion.grounded,\n                after = grounded,\n                vertical_velocity = velocity.y,\n                reason = \"support_probe\",\n                \"Character grounded state changed\"\n            );\n            if grounded {\n                info!(\n                    ?entity,\n                    landing_velocity = velocity.y,\n                    reason = \"ground_contact\",\n                    \"Character landed\"\n                );\n            }\n            motion.grounded = grounded;\n        }\n    }\n}\n\n/// 用有上限的加速度趋近目标水平速度，保留碰撞和外部冲量造成的实际运动。\nfn move_characters(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    mut characters: Query\u003c\n        (Forces, \u0026Transform, \u0026CharacterIntent, \u0026CharacterMotion),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    for (mut forces, transform, intent, motion) in \u0026mut characters {\n        let axes = intent.movement.clamp_length_max(1.0);\n        // 空中松键保留惯性，地面松键使用较快的主动刹车。\n        if !motion.grounded \u0026\u0026 axes == Vec2::ZERO {\n            continue;\n        }\n        let limit = if !motion.grounded {\n            config.air_acceleration\n        } else if axes == Vec2::ZERO {\n            config.braking_acceleration\n        } else {\n            config.acceleration\n        };\n        let target = transform.rotation * Vec3::new(axes.x, 0.0, -axes.y) * config.move_speed;\n        let velocity = forces.linear_velocity();\n        let horizontal = Vec3::new(velocity.x, 0.0, velocity.z);\n        let acceleration = ((target - horizontal) / time.delta_secs()).clamp_length_max(limit);\n        forces.apply_linear_acceleration(acceleration);\n    }\n}\n\n/// 跳跃只消费一次，通过冲量改变速度；重力和位置积分全部交给 Avian。\nfn jump_characters(\n    config: Res\u003cPrototypeConfig\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            Forces,\n            \u0026ComputedMass,\n            \u0026mut CharacterIntent,\n            \u0026mut CharacterMotion,\n        ),\n        With\u003cCharacter\u003e,\n    \u003e,\n) {\n    for (entity, mut forces, mass, mut intent, mut motion) in \u0026mut characters {\n        if !std::mem::take(\u0026mut intent.jump_pending) {\n            continue;\n        }\n        if motion.grounded {\n            let speed_before = forces.linear_velocity().y;\n            forces\n                .apply_linear_impulse(Vec3::Y * mass.value() * (config.jump_speed - speed_before));\n            motion.grounded = false;\n            info!(\n                ?entity,\n                before = \"grounded\",\n                after = \"airborne\",\n                jump_speed = config.jump_speed,\n                reason = \"jump_action\",\n                \"Character jumped\"\n            );\n        } else {\n            info!(?entity, reason = \"already_airborne\", \"Jump request ignored\");\n        }\n    }\n}\n\n/// 拾取建立物理持握关系；释放只解除控制，保留刚体姿态、线速度和角速度。\nfn handle_interaction(\n    mut commands: Commands,\n    config: Res\u003cPrototypeConfig\u003e,\n    spatial_query: SpatialQuery,\n    mut reserved: Local\u003cHashSet\u003cEntity\u003e\u003e,\n    mut characters: Query\u003c\n        (\n            Entity,\n            \u0026Position,\n            \u0026Transform,\n            \u0026mut CharacterIntent,\n            Option\u003c\u0026HoldingItems\u003e,\n        ),\n        (With\u003cCharacter\u003e, Without\u003cPickable\u003e),\n    \u003e,\n    pickables: Query\u003c(Entity, \u0026Position), (With\u003cPickable\u003e, Without\u003cHeldBy\u003e, Without\u003cCharacter\u003e)\u003e,\n    held_items: Query\u003c\n        (\u0026Position, \u0026LinearVelocity, \u0026AngularVelocity),\n        (With\u003cPickable\u003e, With\u003cHeldBy\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    reserved.clear();\n    for (character, position, transform, mut intent, holding) in \u0026mut characters {\n        if !std::mem::take(\u0026mut intent.interact_pending) {\n            continue;\n        }\n        if let Some(item) = holding.and_then(|items| items.iter().next()) {\n            if let Ok((item_position, velocity, angular_velocity)) = held_items.get(item) {\n                commands\n                    .entity(item)\n                    .remove::\u003c(HeldBy, HeldTarget)\u003e()\n                    .insert(parcel_collision_layers());\n                info!(?character, ?item, position = ?item_position.0, velocity = ?velocity.0,\n                    angular_velocity = ?angular_velocity.0, before = \"held\", after = \"free\",\n                    reason = \"interact_action_release\", \"Carryable item released\");\n            }\n            continue;\n        }\n        let origin = position.0 + Vec3::Y * config.hold_offset.y;\n        let nearest = pickables\n            .iter()\n            .filter(|(item, _)| !reserved.contains(item))\n            .filter_map(|(item, item_position)| {\n                let distance = position.0.distance_squared(item_position.0);\n                if distance \u003e config.pickup_radius.powi(2) {\n                    return None;\n                }\n                // 碰撞世界也约束拾取视线，不能隔着墙抓取箱子。\n                let offset = item_position.0 - origin;\n                if let Ok(direction) = Dir3::new(offset)\n                    \u0026\u0026 let Some(hit) = spatial_query.cast_ray(\n                        origin,\n                        direction,\n                        offset.length(),\n                        true,\n                        \u0026SpatialQueryFilter::from_excluded_entities([character]),\n                    )\n                    \u0026\u0026 hit.entity != item\n                {\n                    return None;\n                }\n                Some((item, distance))\n            })\n            .min_by(|(_, a), (_, b)| a.total_cmp(b));\n        if let Some((item, distance_squared)) = nearest {\n            // 同批次延迟命令尚未应用，预留集合防止两个角色同时占用一件物体。\n            reserved.insert(item);\n            commands.entity(item).insert((\n                HeldBy(character),\n                HeldTarget {\n                    translation: position.0 + transform.rotation * config.hold_offset,\n                    rotation: transform.rotation,\n                },\n                held_collision_layers(),\n            ));\n            info!(\n                ?character,\n                ?item,\n                before = \"free\",\n                after = \"held\",\n                distance = distance_squared.sqrt(),\n                reason = \"interact_action_pickup\",\n                \"Carryable item picked up\"\n            );\n        } else {\n            info!(\n                ?character,\n                reason = \"no_visible_pickable_in_range\",\n                \"No pickable item in range\"\n            );\n        }\n    }\n}\n\n/// 持有者销毁或关系被外部解除后清理目标，恢复自由碰撞；刚体始终继续模拟。\nfn release_orphaned_items(\n    mut commands: Commands,\n    characters: Query\u003c(), With\u003cCharacter\u003e\u003e,\n    items: Query\u003c(Entity, Option\u003c\u0026HeldBy\u003e), With\u003cHeldTarget\u003e\u003e,\n) {\n    for (item, held_by) in \u0026items {\n        let reason = match held_by {\n            Some(held_by) if characters.contains(held_by.0) =\u003e continue,\n            Some(_) =\u003e \"holder_missing\",\n            None =\u003e \"holding_relation_removed\",\n        };\n        commands\n            .entity(item)\n            .remove::\u003c(HeldBy, HeldTarget)\u003e()\n            .insert(parcel_collision_layers());\n        info!(\n            ?item,\n            before = \"held\",\n            after = \"free\",\n            reason,\n            \"Carryable item released\"\n        );\n    }\n}\n\n/// 固定步和本帧显示复用同一目标计算，不瞬移箱子，也不积分或消费请求。\npub(crate) fn sync_held_objects(\n    config: Res\u003cPrototypeConfig\u003e,\n    characters: Query\u003c\u0026Transform, (With\u003cCharacter\u003e, Without\u003cPickable\u003e)\u003e,\n    mut items: Query\u003c\n        (\u0026HeldBy, \u0026mut HeldTarget, Option\u003c\u0026CarryGrip\u003e),\n        (With\u003cPickable\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    for (held_by, mut target, grip) in \u0026mut items {\n        if let Ok(character) = characters.get(held_by.0) {\n            let offset = grip.map_or(config.hold_offset, |grip| grip.0);\n            target.translation = character.translation + character.rotation * offset;\n            target.rotation = character.rotation;\n        }\n    }\n}\n\n/// 弹簧阻尼手约束施加有限的力与转动驱动，碰撞求解仍能阻挡箱体。\nfn apply_grip_forces(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    config: Res\u003cPrototypeConfig\u003e,\n    gravity: Res\u003cGravity\u003e,\n    mut characters: Query\u003c(Forces, \u0026Transform), (With\u003cCharacter\u003e, Without\u003cPickable\u003e)\u003e,\n    mut items: Query\u003c\n        (Forces, \u0026ComputedMass, \u0026HeldBy, Option\u003c\u0026CarryGrip\u003e),\n        (With\u003cPickable\u003e, Without\u003cCharacter\u003e),\n    \u003e,\n) {\n    let omega = std::f32::consts::TAU * config.hold_frequency;\n    let stiffness = omega * omega;\n    let damping = 2.0 * config.hold_damping_ratio * omega;\n    // 隐式弹簧系数避免固定步较长时的高频振荡，实际力仍由质量换算并限制。\n    let denominator = 1.0 + damping * time.delta_secs() + stiffness * time.delta_secs().powi(2);\n    for (mut item, mass, held_by, grip) in \u0026mut items {\n        let Ok((mut holder, transform)) = characters.get_mut(held_by.0) else {\n            continue;\n        };\n        // 模拟读取 Position 而非已经插值的显示目标，防止呈现反馈污染物理。\n        let offset = grip.map_or(config.hold_offset, |grip| grip.0);\n        let target = holder.position().0 + transform.rotation * offset;\n        let acceleration = (stiffness * (target - item.position().0)\n            + damping * (holder.linear_velocity() - item.linear_velocity())\n            - gravity.0)\n            / denominator;\n        let force = (acceleration * mass.value()).clamp_length_max(config.hold_max_force);\n        item.apply_force(force);\n        // 持有者承受相反的力，箱子的重量和撞墙阻力会反馈到动态角色。\n        holder.apply_force(-force);\n        // q 与 -q 表示同一姿态，选择短弧，避免箱子绕一整圈追向手部朝向。\n        let mut rotation_error = transform.rotation * item.rotation().0.inverse();\n        if rotation_error.w \u003c 0.0 {\n            rotation_error = -rotation_error;\n        }\n        let error = rotation_error.to_scaled_axis();\n        let angular_acceleration = ((stiffness * error - damping * item.angular_velocity())\n            / denominator)\n            .clamp_length_max(80.0);\n        item.apply_angular_acceleration(angular_acceleration);\n    }\n}\n\n/// 采样物理解算后的实际速度，便于检查加速度、刹车和碰撞反馈。\nfn log_character_velocity(\n    time: Res\u003cTime\u003cFixed\u003e\u003e,\n    mut next_log_time: Local\u003cf64\u003e,\n    characters: Query\u003c(Entity, \u0026LinearVelocity, \u0026CharacterMotion), With\u003cCharacter\u003e\u003e,\n) {\n    if time.elapsed_secs_f64() \u003c *next_log_time {\n        return;\n    }\n    *next_log_time = time.elapsed_secs_f64() + 0.5;\n    for (entity, velocity, motion) in \u0026characters {\n        debug!(?entity, velocity = ?velocity.0, grounded = motion.grounded,\n            reason = \"physics_sample\", \"Character velocity sampled\");\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::physics::{character_body, ground_body, parcel_body, world_collision_layers};\n    use bevy::time::TimeUpdateStrategy;\n    use std::time::Duration;\n\n    fn test_app() -\u003e App {\n        let mut app = App::new();\n        app.add_plugins((MinimalPlugins, TransformPlugin, GameplayPlugin))\n            .insert_resource(Time::\u003cFixed\u003e::from_hz(60.0))\n            .insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n                1.0 / 60.0,\n            )));\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut().spawn((\n            ground_body(\u0026config),\n            Transform::from_xyz(0.0, config.ground_y, 0.0),\n        ));\n        // 手动 update 不经过 App::run，需先完成物理插件的资源初始化。\n        app.finish();\n        app.cleanup();\n        app.update();\n        app\n    }\n\n    fn step(app: \u0026mut App, count: usize) {\n        for _ in 0..count {\n            app.update();\n        }\n    }\n\n    fn spawn_character(app: \u0026mut App, position: Vec3, intent: CharacterIntent) -\u003e Entity {\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut()\n            .spawn((\n                Character,\n                intent,\n                CharacterMotion::default(),\n                Transform::from_translation(position),\n                character_body(\u0026config),\n            ))\n            .id()\n    }\n\n    fn spawn_box(app: \u0026mut App, position: Vec3) -\u003e Entity {\n        let config = app.world().resource::\u003cPrototypeConfig\u003e().clone();\n        app.world_mut()\n            .spawn((\n                Parcel,\n                Pickable,\n                Transform::from_translation(position),\n                parcel_body(\u0026config),\n            ))\n            .id()\n    }\n\n    fn interact(app: \u0026mut App, character: Entity) {\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .interact_pending = true;\n        step(app, 1);\n    }\n\n    #[test]\n    fn ground_probe_respects_collision_layers_and_excludes_held_boxes() {\n        let mut app = test_app();\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, 0.0));\n        let character = spawn_character(\u0026mut app, Vec3::new(0.0, 0.6, 0.0), default());\n        step(\u0026mut app, 30);\n        let grounded = |app: \u0026App| {\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        };\n        assert!(grounded(\u0026app), \"Free box must support the character\");\n\n        // 单独重跑探测，避免改变碰撞层后物理移动影响支撑过滤的断言。\n        let mut schedule = Schedule::default();\n        schedule.add_systems(update_grounded);\n        let character_layers = *app.world().get::\u003cCollisionLayers\u003e(character).unwrap();\n        app.world_mut()\n            .entity_mut(character)\n            .insert(CollisionLayers::NONE);\n        schedule.run(app.world_mut());\n        assert!(\n            !grounded(\u0026app),\n            \"Character collision filters must be respected\"\n        );\n        app.world_mut()\n            .entity_mut(character)\n            .insert(character_layers);\n        schedule.run(app.world_mut());\n        assert!(grounded(\u0026app));\n\n        let item_layers = parcel_collision_layers();\n        app.world_mut()\n            .entity_mut(item)\n            .insert(CollisionLayers::new(\n                item_layers.memberships,\n                LayerMask::NONE,\n            ));\n        schedule.run(app.world_mut());\n        assert!(\n            !grounded(\u0026app),\n            \"Support collision filters must be respected\"\n        );\n        app.world_mut().entity_mut(item).insert(item_layers);\n        schedule.run(app.world_mut());\n        assert!(grounded(\u0026app));\n\n        app.world_mut()\n            .entity_mut(item)\n            .insert((HeldBy(character), held_collision_layers()));\n        schedule.run(app.world_mut());\n        assert!(!grounded(\u0026app), \"Held box cannot support the character\");\n        // 即使外部代码误改持握碰撞层，持握身份也不能成为支撑。\n        app.world_mut().entity_mut(item).insert(item_layers);\n        schedule.run(app.world_mut());\n        assert!(!grounded(\u0026app));\n        app.world_mut().entity_mut(item).remove::\u003cHeldBy\u003e();\n        schedule.run(app.world_mut());\n        assert!(\n            grounded(\u0026app),\n            \"Released box must become valid support again\"\n        );\n    }\n\n    #[test]\n    fn ground_probe_finds_floor_after_a_nearer_wall_hit() {\n        let mut app = test_app();\n        let wall = app\n            .world_mut()\n            .spawn((\n                RigidBody::Static,\n                Collider::cuboid(0.04, 2.0, 2.0),\n                world_collision_layers(),\n                Transform::from_xyz(0.26, 1.0, 0.0),\n            ))\n            .id();\n        step(\u0026mut app, 2);\n        // 先初始化墙面，再生成角色并只跑探测，避免墙面求解先推开角色。\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let mut schedule = Schedule::default();\n        schedule.add_systems(\n            (\n                move |config: Res\u003cPrototypeConfig\u003e, spatial_query: SpatialQuery| {\n                    let closest = spatial_query\n                        .cast_shape(\n                            \u0026Collider::sphere(config.character_radius * 0.8),\n                            Vec3::Y * config.character_radius,\n                            Quat::IDENTITY,\n                            Dir3::NEG_Y,\n                            \u0026ShapeCastConfig::from_max_distance(0.12),\n                            \u0026SpatialQueryFilter::from_excluded_entities([character]),\n                        )\n                        .unwrap();\n                    assert_eq!(closest.entity, wall);\n                    assert!(closest.normal1.y \u003c 0.65);\n                },\n                update_grounded,\n            )\n                .chain(),\n        );\n        schedule.run(app.world_mut());\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded,\n            \"Side wall must not hide valid floor support\"\n        );\n    }\n\n    #[test]\n    fn movement_accelerates_brakes_and_diagonal_speed_is_bounded() {\n        let mut app = test_app();\n        let straight = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let diagonal = spawn_character(\u0026mut app, Vec3::X * 5.0, default());\n        step(\u0026mut app, 30);\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(straight)\n            .unwrap()\n            .movement = Vec2::Y;\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(diagonal)\n            .unwrap()\n            .movement = Vec2::ONE;\n        step(\u0026mut app, 1);\n        let first_speed = app\n            .world()\n            .get::\u003cLinearVelocity\u003e(straight)\n            .unwrap()\n            .0\n            .length();\n        assert!(first_speed \u003e 0.0 \u0026\u0026 first_speed \u003c 1.0, \"{first_speed}\");\n        step(\u0026mut app, 20);\n        let a = app.world().get::\u003cLinearVelocity\u003e(straight).unwrap().0;\n        let b = app.world().get::\u003cLinearVelocity\u003e(diagonal).unwrap().0;\n        assert!((a.xz().length() - 4.5).abs() \u003c 0.05, \"{a:?}\");\n        assert!(\n            (a.xz().length() - b.xz().length()).abs() \u003c 0.05,\n            \"{a:?} {b:?}\"\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(straight)\n            .unwrap()\n            .movement = Vec2::ZERO;\n        step(\u0026mut app, 1);\n        let braking = app\n            .world()\n            .get::\u003cLinearVelocity\u003e(straight)\n            .unwrap()\n            .0\n            .xz()\n            .length();\n        assert!(braking \u003e 0.0 \u0026\u0026 braking \u003c a.xz().length());\n        step(\u0026mut app, 12);\n        assert!(\n            app.world()\n                .get::\u003cLinearVelocity\u003e(straight)\n                .unwrap()\n                .0\n                .xz()\n                .length()\n                \u003c 0.05\n        );\n    }\n\n    #[test]\n    fn collision_blocks_character_and_dynamic_boxes_receive_momentum() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.2));\n        step(\u0026mut app, 30);\n        app.world_mut().spawn((\n            RigidBody::Static,\n            Collider::cuboid(8.0, 3.0, 0.5),\n            world_collision_layers(),\n            Transform::from_xyz(0.0, 1.5, -4.0),\n        ));\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .movement = Vec2::Y;\n        step(\u0026mut app, 100);\n        let position = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n        assert!(position.z \u003e -3.5, \"Character crossed wall: {position:?}\");\n        let box_position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(\n            box_position.z \u003c -1.4 \u0026\u0026 box_position.z \u003e -3.8,\n            \"{box_position:?}\"\n        );\n    }\n\n    #[test]\n    fn jump_is_consumed_once_and_gravity_lands_on_collider() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        step(\u0026mut app, 30);\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .jump_pending = true;\n        step(\u0026mut app, 1);\n        let velocity = app.world().get::\u003cLinearVelocity\u003e(character).unwrap().y;\n        assert!((velocity - (5.0 - 9.81 / 60.0)).abs() \u003c 0.05, \"{velocity}\");\n        assert!(\n            !app.world()\n                .get::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .jump_pending\n        );\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .jump_pending = true;\n        step(\u0026mut app, 1);\n        assert!(app.world().get::\u003cLinearVelocity\u003e(character).unwrap().y \u003c velocity);\n        step(\u0026mut app, 100);\n        assert!(\n            app.world()\n                .get::\u003cCharacterMotion\u003e(character)\n                .unwrap()\n                .grounded\n        );\n        assert!(app.world().get::\u003cPosition\u003e(character).unwrap().y.abs() \u003c 0.03);\n    }\n\n    #[test]\n    fn item_specific_grips_converge_through_physics_to_the_presented_targets() {\n        for grip in [Vec3::new(0.0, 1.3, -0.48), Vec3::new(0.0, 1.3, -0.62)] {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n            app.world_mut().entity_mut(item).insert(CarryGrip(grip));\n            step(\u0026mut app, 30);\n            let before_pickup = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            interact(\u0026mut app, character);\n            assert_eq!(app.world().get::\u003cHeldBy\u003e(item).unwrap().0, character);\n            assert_eq!(\n                app.world().get::\u003cRigidBody\u003e(item),\n                Some(\u0026RigidBody::Dynamic)\n            );\n            let after_pickup = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n            assert!(\n                after_pickup.distance(before_pickup) \u003c 0.2,\n                \"Pickup teleported the item: {before_pickup:?} {after_pickup:?}\"\n            );\n            let initial_error =\n                after_pickup.distance(app.world().get::\u003cHeldTarget\u003e(item).unwrap().translation);\n            assert!(initial_error \u003e 0.5);\n            let fixed_before = app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed();\n            // 执行真实 FixedPostUpdate，让施力、重力、反作用与碰撞共同产生收敛结果。\n            step(\u0026mut app, 120);\n            assert!(\n                app.world().resource::\u003cTime\u003cFixed\u003e\u003e().elapsed() - fixed_before\n                    \u003e Duration::from_secs(1)\n            );\n            let world = app.world();\n            let target = world.get::\u003cHeldTarget\u003e(item).unwrap();\n            let actual = world.get::\u003cPosition\u003e(item).unwrap().0;\n            assert!(\n                actual.distance(target.translation) \u003c 0.1,\n                \"Physics grip did not reach the presented target: {grip:?} {actual:?} {:?}\",\n                target.translation\n            );\n            // 静止角色面向 -Z；分别验证真实箱体的高度和距离，不只断言派生目标的公式。\n            let relative = actual - world.get::\u003cPosition\u003e(character).unwrap().0;\n            assert!((relative.y - 1.3).abs() \u003c 0.1, \"{grip:?} {relative:?}\");\n            assert!((relative.z - grip.z).abs() \u003c 0.08, \"{grip:?} {relative:?}\");\n            assert!(world.get::\u003cLinearVelocity\u003e(item).unwrap().0.length() \u003c 0.1);\n            let displayed_offset =\n                target.translation - world.get::\u003cTransform\u003e(character).unwrap().translation;\n            assert!(displayed_offset.abs_diff_eq(grip, 0.00001));\n        }\n    }\n\n    #[test]\n    fn grip_preserves_dynamic_body_blocks_at_wall_and_release_keeps_velocity() {\n        let mut app = test_app();\n        let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n        let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n        step(\u0026mut app, 30);\n        let before = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        interact(\u0026mut app, character);\n        assert_eq!(app.world().get::\u003cHeldBy\u003e(item).unwrap().0, character);\n        assert_eq!(\n            app.world().get::\u003cRigidBody\u003e(item),\n            Some(\u0026RigidBody::Dynamic)\n        );\n        let after = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(\n            after.distance(before) \u003c 0.2,\n            \"Pickup teleported: {before:?} {after:?}\"\n        );\n        step(\u0026mut app, 100);\n        assert!((app.world().get::\u003cPosition\u003e(item).unwrap().y - 1.0).abs() \u003c 0.12);\n        app.world_mut().spawn((\n            RigidBody::Static,\n            Collider::cuboid(8.0, 3.0, 0.2),\n            world_collision_layers(),\n            Transform::from_xyz(0.0, 1.5, -1.6),\n        ));\n        app.world_mut()\n            .resource_mut::\u003cPrototypeConfig\u003e()\n            .hold_offset\n            .z = -2.4;\n        step(\u0026mut app, 90);\n        let position = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        assert!(position.z \u003e -1.3, \"Held box crossed wall: {position:?}\");\n        // 直接运行交互系统验证释放瞬间不修改任何速度或位置，不混入随后重力。\n        app.world_mut().get_mut::\u003cLinearVelocity\u003e(item).unwrap().0 = Vec3::new(1.0, 2.0, 0.5);\n        app.world_mut().get_mut::\u003cAngularVelocity\u003e(item).unwrap().0 = Vec3::new(0.5, 1.0, 0.0);\n        let before_release = app.world().get::\u003cPosition\u003e(item).unwrap().0;\n        let rotation_before_release = app.world().get::\u003cRotation\u003e(item).unwrap().0;\n        app.world_mut()\n            .get_mut::\u003cCharacterIntent\u003e(character)\n            .unwrap()\n            .interact_pending = true;\n        let mut schedule = Schedule::default();\n        schedule.add_systems(handle_interaction);\n        schedule.run(app.world_mut());\n        assert!(app.world().get::\u003cHeldBy\u003e(item).is_none());\n        assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n        assert_eq!(\n            app.world().get::\u003cLinearVelocity\u003e(item).unwrap().0,\n            Vec3::new(1.0, 2.0, 0.5)\n        );\n        assert_eq!(app.world().get::\u003cPosition\u003e(item).unwrap().0, before_release);\n        assert_eq!(\n            app.world().get::\u003cAngularVelocity\u003e(item).unwrap().0,\n            Vec3::new(0.5, 1.0, 0.0)\n        );\n        assert_eq!(\n            app.world().get::\u003cRotation\u003e(item).unwrap().0,\n            rotation_before_release\n        );\n        step(\u0026mut app, 120);\n        assert!(app.world().get::\u003cPosition\u003e(item).unwrap().y \u003c 0.5);\n    }\n\n    #[test]\n    fn holder_despawn_and_external_relation_removal_restore_free_collisions() {\n        for despawn in [false, true] {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            let item = spawn_box(\u0026mut app, Vec3::new(0.0, 0.3, -1.3));\n            step(\u0026mut app, 30);\n            interact(\u0026mut app, character);\n            step(\u0026mut app, 60);\n            if despawn {\n                app.world_mut().despawn(character);\n            } else {\n                app.world_mut().entity_mut(item).remove::\u003cHeldBy\u003e();\n            }\n            step(\u0026mut app, 1);\n            assert!(app.world().get::\u003cHeldTarget\u003e(item).is_none());\n            assert_eq!(\n                *app.world().get::\u003cCollisionLayers\u003e(item).unwrap(),\n                parcel_collision_layers()\n            );\n            step(\u0026mut app, 120);\n            assert!(app.world().get::\u003cPosition\u003e(item).unwrap().y \u003c 0.5);\n        }\n    }\n\n    #[test]\n    fn no_fixed_step_preserves_requests_and_render_rates_share_physics() {\n        let simulate = |frame_hz: f64| {\n            let mut app = test_app();\n            let character = spawn_character(\u0026mut app, Vec3::ZERO, default());\n            step(\u0026mut app, 30);\n            app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::ZERO));\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .jump_pending = true;\n            let before = app.world().get::\u003cPosition\u003e(character).unwrap().0;\n            step(\u0026mut app, 3);\n            assert_eq!(app.world().get::\u003cPosition\u003e(character).unwrap().0, before);\n            assert!(\n                app.world()\n                    .get::\u003cCharacterIntent\u003e(character)\n                    .unwrap()\n                    .jump_pending\n            );\n            app.world_mut()\n                .get_mut::\u003cCharacterIntent\u003e(character)\n                .unwrap()\n                .movement = Vec2::Y;\n            app.insert_resource(TimeUpdateStrategy::ManualDuration(Duration::from_secs_f64(\n                1.0 / frame_hz,\n            )));\n            step(\u0026mut app, frame_hz as usize);\n            app.world().get::\u003cPosition\u003e(character).unwrap().0\n        };\n        let a = simulate(60.0);\n        let b = simulate(120.0);\n        assert!(a.abs_diff_eq(b, 0.1), \"{a:?} {b:?}\");\n    }\n}\n"},{"path":"src/input.rs","text":"//! 注册 Enhanced Input 动作；键盘意图按控制者路由，观察与视角切换动作由相机模块消费。\n\nuse bevy::prelude::*;\nuse bevy_enhanced_input::prelude::{Cancel, Press, *};\n\nuse crate::gameplay::{Character, CharacterIntent, ControlsCharacter, PlayerId};\n\n/// 注册玩家输入上下文和动作观察者。\npub struct PlayerInputPlugin;\n\nimpl Plugin for PlayerInputPlugin {\n    fn build(\u0026self, app: \u0026mut App) {\n        app.add_plugins(EnhancedInputPlugin)\n            // 默认在 PreUpdate 评估；玩法请求交给 FixedUpdate，相机动作在同帧更新。\n            .add_input_context::\u003cGameplayContext\u003e()\n            .add_observer(record_movement)\n            .add_observer(clear_completed_movement)\n            .add_observer(clear_cancelled_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n    }\n}\n\n/// 控制者的步行输入上下文；角色实体不直接持有设备绑定。\n#[derive(Component)]\npub struct GameplayContext;\n\n/// 地面移动方向，X 为左右、Y 为前后。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct MoveAction;\n\n/// 鼠标观察动作，输出本帧汇总位移，由相机 Observer 直接处理。\n#[derive(InputAction)]\n#[action_output(Vec2)]\npub struct LookAction;\n\n/// 每次按下产生一次跳跃请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct JumpAction;\n\n/// 每次按下产生一次拾取或放下请求。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct InteractAction;\n\n/// 每次按下请求切换第一人称与第三人称，由相机 Observer 接收，再由同帧系统消费。\n#[derive(InputAction)]\n#[action_output(bool)]\npub struct TogglePerspectiveAction;\n\n/// 为指定玩家与角色创建键盘控制者，返回本次运行的控制者实体。\n///\n/// 场景只为获得键盘控制权的玩家调用一次；后续手柄或远程控制者单独配置。\npub fn spawn_keyboard_controller(\n    commands: \u0026mut Commands,\n    player_id: PlayerId,\n    character: Entity,\n) -\u003e Entity {\n    let id = player_id.0;\n    let controller = commands\n        .spawn((\n            Name::new(format!(\"Keyboard controller {id}\")),\n            player_id,\n            ControlsCharacter(character),\n            keyboard_context(),\n        ))\n        .id();\n    info!(\n        target: \"demo::input\",\n        player_id = id,\n        ?controller,\n        ?character,\n        \"Keyboard controller spawned: WASD to move, Space to jump, E to pick up or drop, I to toggle perspective\"\n    );\n    controller\n}\n\nfn keyboard_context() -\u003e impl Bundle {\n    (\n        GameplayContext,\n        GamepadDevice::None,\n        actions!(GameplayContext[\n            (\n                Action::\u003cLookAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                bindings![Binding::mouse_motion()],\n            ),\n            (\n                Action::\u003cMoveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    ..default()\n                },\n                Bindings::spawn(Cardinal::wasd_keys()),\n            ),\n            (\n                Action::\u003cJumpAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::Space],\n            ),\n            (\n                Action::\u003cInteractAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyE],\n            ),\n            (\n                Action::\u003cTogglePerspectiveAction\u003e::new(),\n                ActionSettings {\n                    consume_input: true,\n                    require_reset: true,\n                    ..default()\n                },\n                Press::default(),\n                bindings![KeyCode::KeyI],\n            ),\n        ]),\n    )\n}\n\n/// 按事件所属的上下文查找角色，避免把一个玩家的动作写给其他角色。\nfn record_movement(\n    event: On\u003cFire\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != event.value {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?event.value, reason = \"move_action\",\n            \"Character movement input changed\");\n        intent.movement = event.value;\n    }\n}\n\nfn clear_completed_movement(\n    event: On\u003cComplete\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_completed\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\nfn clear_cancelled_movement(\n    event: On\u003cCancel\u003cMoveAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    if intent.movement != Vec2::ZERO {\n        info!(target: \"demo::input\", controller = ?event.context, character = ?controlled.0,\n            before = ?intent.movement, after = ?Vec2::ZERO, reason = \"move_action_cancelled\",\n            \"Character movement input changed\");\n        intent.movement = Vec2::ZERO;\n    }\n}\n\n/// 一次性请求保留到固定步消费，即使本渲染帧没有固定步也不会丢失。\nfn request_jump(\n    event: On\u003cFire\u003cJumpAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.jump_pending = true;\n}\n\nfn request_interaction(\n    event: On\u003cFire\u003cInteractAction\u003e\u003e,\n    controllers: Query\u003c\u0026ControlsCharacter, With\u003cGameplayContext\u003e\u003e,\n    mut characters: Query\u003c\u0026mut CharacterIntent, With\u003cCharacter\u003e\u003e,\n) {\n    let Ok(controlled) = controllers.get(event.context) else {\n        return;\n    };\n    let Ok(mut intent) = characters.get_mut(controlled.0) else {\n        return;\n    };\n    intent.interact_pending = true;\n}\n\n#[cfg(test)]\nmod tests {\n    use std::time::Duration;\n\n    use avian3d::prelude::{LinearVelocity, Physics, Position, RigidBody};\n    use bevy::{\n        ecs::relationship::RelationshipTarget, input::InputPlugin, time::TimeUpdateStrategy,\n    };\n\n    use crate::{\n        gameplay::{\n            CharacterMotion, GameplayPlugin, HeldBy, HeldTarget, HoldingItems, Parcel, Pickable,\n            PrototypeConfig,\n        },\n        physics::{character_body, ground_body, parcel_body},\n    };\n\n    use super::*;\n\n    fn fire\u003cA: InputAction\u003e(context: Entity, value: A::Output) -\u003e Fire\u003cA\u003e {\n        Fire {\n            context,\n            action: Entity::PLACEHOLDER,\n            value,\n            state: TriggerState::Fired,\n            fired_secs: 0.0,\n            elapsed_secs: 0.0,\n        }\n    }\n\n    #[test]\n    fn actions_are_routed_to_their_own_character() {\n        let mut app = App::new();\n        app.add_observer(record_movement)\n            .add_observer(request_jump)\n            .add_observer(request_interaction);\n        let first = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let second = app\n            .world_mut()\n            .spawn((Character, CharacterIntent::default()))\n            .id();\n        let first_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(first)))\n            .id();\n        let second_context = app\n            .world_mut()\n            .spawn((GameplayContext, ControlsCharacter(second)))\n            .id();\n\n        app.world_mut()\n            .trigger(fire::\u003cMoveAction\u003e(first_context, Vec2::X));\n        app.world_mut()\n            .trigger(fire::\u003cJumpAction\u003e(second_context, true));\n        app.world_mut()\n            .trigger(fire::\u003cInteractAction\u003e(first_context, true));\n\n        let first_intent = app.world().get::\u003cCharacterIntent\u003e(first).unwrap();\n        let second_intent = app.world().get::\u003cCharacterIntent\u003e(second).unwrap();\n        assert_eq!(first_intent.movement, Vec2::X);\n        ass
