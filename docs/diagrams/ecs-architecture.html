":488}},{"id":"held_update","name":"sync_held_objects","kind":"system","phase":"RunFixedMainLoop · AfterFixedMainLoop（每帧一次）","module":"gameplay","description":"按角色当前呈现 Transform 更新 HeldTarget；不搬动箱体、不施力、不消费请求。","reads":["resource.PrototypeConfig","character.Transform","parcel.HeldBy"],"writes":["parcel.HeldTarget"],"filters":["角色：(With\u003cCharacter>, Without\u003cPickable>)","物体：(With\u003cPickable>, Without\u003cCharacter>)，具有 HeldBy 与 HeldTarget"],"events":[],"notes":["物理插值和本帧角色朝向同步之后更新呈现目标，零固定步帧也执行。","HeldTarget 是呈现/检查器数据，不是物理位置来源；实际箱体可因惯性和碰撞偏离目标。"],"source":{"path":"src/gameplay.rs","line":422}},{"id":"camera_follow","name":"follow_orbit_camera","kind":"system","phase":"RunFixedMainLoop · AfterFixedMainLoop（每帧一次）","module":"camera","description":"读取本帧已经插值的角色 Transform 和模式角度，更新同一台镜头。","reads":["character.Transform","camera.OrbitCamera"],"writes":["camera.Transform"],"filters":["角色：With\u003cCharacter>","相机查询：Without\u003cCharacter>，具有 OrbitCamera 与 Transform；没有额外 With\u003cCamera3d> 过滤"],"events":[],"notes":["位于插值后的显示链；角色朝向 → HeldTarget → 镜头 → 人物可见性。","不读取未插值 Position；零固定步帧仍使用本帧呈现位置。"],"source":{"path":"src/camera.rs","line":511}},{"id":"transform_propagate","name":"TransformSystems::Propagate","kind":"engine","phase":"PostUpdate（启动时也在 PostStartup）","module":"bevy_transform","description":"同步独立根实体并按 ChildOf/Children 传播局部变换，更新 GlobalTransform。","reads":["character.Transform","parcel.Transform","camera.Transform","visual.Transform","character.Children","parcel.Children","visual.ChildOf"],"writes":["character.GlobalTransform","parcel.GlobalTransform","camera.GlobalTransform","visual.GlobalTransform"],"filters":[],"events":[],"notes":["概览包含根同步与层级传播，不是单个项目函数。","渲染使用传播后的世界变换；视觉子实体不直接保存玩法位置。"],"source":null},{"id":"render","name":"RenderApp / 渲染流程","kind":"engine","phase":"渲染子应用","module":"bevy_render","description":"提取本帧可见性、世界变换、相机和资产，准备并执行渲染。","reads":["character.GlobalTransform","parcel.GlobalTransform","camera.GlobalTransform","visual.GlobalTransform","character.Vi re\u003cJumpAction>","system":"observe_jump","target":"事件的 context（controller）","description":"设置 jump_pending，留待固定模拟消费。"},{"event":"Fire\u003cInteractAction>","system":"observe_interact","target":"事件的 context（controller）","description":"设置 interact_pending，留待固定交互消费。"},{"event":"Fire\u003cLookAction>","system":"observe_look","target":"事件的 context（controller）","description":"从 ControlsCamera 路由到相机；捕获有效且非跳过帧时直接更新环绕角。"},{"event":"Fire\u003cTogglePerspectiveAction>","system":"observe_perspective","target":"事件的 context（controller）","description":"确认窗口聚焦与控制关联有效后暂存切换请求；实际切换在动作命令应用后的 PreUpdate 系统执行。"}],"startup_notes":["main 先创建 App 和会话日志守护对象，再配置 DefaultPlugins 的 LogPlugin 文件输出与 WindowPlugin；设置加载失败回退默认。会话日志不是玩法 ECS 状态。","main 插入 GameSettings、WinitSettings::continuous() 与固定 60 Hz 的 Time\u003cFixed>，再注册 EguiPlugin、WorldInspectorPlugin、SettingsPlugin、GameplayPlugin、GameAudioPlugin、PlayerInputPlugin、CameraControlPlugin、PrototypeScenePlugin、StartupLogPlugin；Egui 在检查器之前构建。","PlayerInputPlugin 注册 GameplayContext 与五个角色意图 Observer；CameraControlPlugin 注册观察与视角切换两个 Observer、窗口焦点消息与显示系统。GameplayPlugin 注册玩法数据反射类型，支持世界检查器。","PrototypeScenePlugin 构建时插入 ClearColor 与 GlobalAmbientLight；spawn_scene 在 Startup 使用 Commands 生成场景并添加网格、材质资产。","默认启动阶段为 PreStartup → Startup → PostStartup。StartupLogPlugin 集中注册四个启动日志，PrototypeScenePlugin 注册场景生成；六个系统（含 GameAudioPlugin 的预加载）没有显式相互顺序，插件注册顺序不构成系统串行依赖。","Startup 结束会应用场景生成命令，关系钩子维护 Actions、Bindings 与 Children；引擎还在 PostStartup 完成启动变换同步。四个启动日志系统只报告实际玩法配置、固定时间步与当前功能约定，不依赖已生成实体；启动日志插件不初始化配置或添加功能插件。","当前场景创建 1 个控制者、1 个角色、1 个木箱、1 台相机、6 个视觉子实体、5 个动作、8 条绑定；WindowPlugin 创建 1 个主窗口。另生成 2 个静态世界实体（地面、墙体）与日光，未并入 visual；检查器复用主窗口与相机，不添加第二套玩法实体。","spawn_keyboard_controller、keyboard_context 和 OrbitCamera::transform 是生成或计算辅助函数，不是独立注册的 Schedule 系统。Action、Binding 的生成辅助宏与关系由插件实现。","SessionWriter 只在日志插件初始化期间作为临时 Resource 存在，随后取出交给文件输出层；SessionLogGuard 是 main 持有的普通 Rust 对象，App::run 返回后记录退出并刷新。","EguiPlugin 默认把 EguiContext 与 PrimaryEguiContext 自动附加到首个相机，当前只有一台相机。其 required components 与插入钩子补入 UI 设置、输入、输出及多轮 Schedule；这些由插件初始化，不由 spawn_scene 手工生成，检查器不另建游戏窗口。","GameplayPlugin 内部注册 DemoPhysicsPlugin，再由它安装 PhysicsPlugins::default()，默认物理调度 FixedPostUpdate；不是 main 中额外注册两个插件。","GameplayPlugin 内部注册 SoundEventsPlugin 与 SoundRequest；GameAudioPlugin 独立安装 Kira 0.26.0、两个类型通道与 SoundBank，DefaultPlugins 显式禁用 Bevy 默认 AudioPlugin，避免双输出设备。"],"general_notes":["systems 的固定 ID 用于布局。kind=engine 是引擎或输入框架阶段的概览，kind=sync 是延迟命令应用点，kind=observer 是触发式响应，其余为项目系统。","业务系统列出访问声明和实际用途；可变访问中读取的数据也列入 reads。EguiContext 的可变接口用于查询 UI，其 writes 表示调度访问权限，不意味着项目修改 UI 内容。With/Without 是筛选而非数据读取；Commands 结构变更在同步点才可见。","引擎概览的 reads/writes 只列与当前原型有关的数据，未展开全部内部组件、资源、条件函数表、消息游标与局部缓存。部分组件通过 required components 自动出现，部分关系反向索引只在关联存在时出现；组件列表不表示所有组件始终同时存在。","source.path 使用仓库相对路径。项目类型引用声明行，引擎或插件类型引用项目内的使用、生成或注册行；kind=engine 概览 source=null。父图应把这些位置标为源码入口，不能宣称是引擎类型定义。","默认逐帧主阶段包括 First → PreUpdate → RunFixedMainLoop → Update → SpawnScene → PostUpdate → Last。图中仅展示相关阶段；自定义 spawn_scene 在 Startup，名称并不意味着它运行于引擎 SpawnScene 阶段。","RunFixedMainLoop 每个渲染帧执行 0..N 次固定阶段；固定步不是渲染帧的一对一后续步骤。当前 fixed 为 60 Hz，默认渲染上限 60 FPS，自定义上限可高于 60，性能不足也可能低于上限。","EnhancedInputSystems::Apply 写入动作输出并调用 Commands::trigger；这个 Apply 阶段不是 ECS 的 ApplyDeferred。排入的动作事件在下一命令同步点触发，默认 PreUpdate 完成时已经应用，随后固定循环可读到最新意图。","World::trigger 在调用期间触发 Observer；Commands::trigger 延迟到命令应用。Observer 注册先后不定义执行顺序；不得把七个业务 Observer 排成串行链。Fire、Complete、Cancel 包含 context、action 与动作值，当前路由使用 context。视角请求通过随后有显式依赖的系统消费。","MouseButtonInput、WindowFocused 等是缓冲 Message，拥有独立读取游标，默认缓冲不是永久队列。Enhanced Input 的 Fire、Complete、Cancel 是触发式 EntityEvent；两类通信必须使用不同图例。","跳跃与交互用布尔请求跨零固定步帧保留，固定步用 mem::take 消费一次；多次到达而尚未消费的同类请求会合并。移动轴保持到 Complete 或 Cancel；镜头角度直接按本帧像素位移更新，不积分角色位置。","同一 Schedule 的 .before/.after/.chain 才表达先后；数据访问冲突、元组顺序、插件注册顺序及 .in_set 本身都不定义完整执行顺序，跨 Schedule 的先后来自主调度顺序。","普通 Entity 引用不提供 Bevy 关系生命周期；#[entities] 只参与实体映射。ActionOf、BindingOf、ChildOf 与 HeldBy 是关系，反向索引的成员由 Bevy 自动维护；只有前三者启用 linked_spawn。","RenderApp 包含提取、准备、排序与 GPU 渲染等步骤，也可能使用流水线；render 节点是渲染概览，不是紧接 PostUpdate 的单个普通系统。日志通过 tracing 文件输出，不是 ECS Event 或 Message。","该文件记录源码结构，未启动游戏，未执行窗口或视觉验收。","视角切换不是 Observer 内立即切换：request_perspective_toggle 只记录请求，apply_perspective_toggle 在 EnhancedInputSystems::Apply 之后同帧消费，避免 I 与鼠标同帧时依赖动作遍历或 Observer 顺序。","世界检查器由 EguiPlugin 与 WorldInspectorPlugin 提供，数据留在 ECS 内，通过反射动态读取和可选编辑。Egui 输入映射、BeginPass 集合与嵌套 EguiPrimaryContextPass 以概览节点表示；未展开全部输入、提取和绘制系统。","PreUpdate 的已核对相关路线为 InputSystems → Egui ProcessInput → filter_captured_egui_input → Egui BeginPass 集合 → sync_mouse_capture → 自动 ApplyDeferred → EnhancedInput Prepare → Update → Apply → 事件命令应用 → apply_perspective_toggle。只描述相关显式依赖，未展开全部引擎系统。","EguiPlugin::default() 默认 multipass=true；主上下文的 EguiPrimaryContextPass 在 PostUpdate 的上下文循环内部运行，可一帧多轮。PreUpdate BeginPass 排序边界不等于主检查器 UI 在该时刻开始或完成。","PostUpdate 的 UI 嵌套 Schedule 与变换传播都属于本帧后处理，但源码与已核对插件未建立二者的显式顺序。应画成并行分支或同阶段无序节点，避免将 UI 动态反射编辑包装成与模拟保证同步的过程。","UI 输入隔离用不可变 ContextActivity 的延迟替换，不清空共享底层键鼠资源；窗口捕获、动作上下文启用与视角模式是三份不同状态。Esc 释放不直接停用键盘动作，检查器占用才停用整个 GameplayContext。","EguiInput 内部的 egui::Event 只是 UI RawInput 的事件枚举，不等同于 Bevy ECS Event、EntityEvent 或缓冲 Message。捕获期间的 UI 过滤与 UI 占用时的 GameplayContext 停用构成两个方向的输入边界。","项目固定准备链：update_grounded → move_characters → jump_characters → handle_interaction → release_orphaned_items → sync_held_objects → apply_grip_forces。sync_gravity 与 sync_character_facing 均 before(GameplaySystems::Simulate)，二者无彼此顺序。","Avian 0.7 默认在 FixedPostUpdate 执行 Prepare → StepSimulation（嵌套 PhysicsSchedule 与求解子步）→ Writeback；接地与速度日志链 after(Writeback)。碰撞日志只 after(StepSimulation)，与回写链不设额外顺序。","插值边界：FixedFirst 重置起点 → 物理步 → FixedLast 记录终点 → RunFixedMainLoop / AfterFixedMainLoop 的 Ease → 朝向 → HeldTarget → 相机 → 可见性 → UpdateEasingTick。零固定步帧仍完成插值后的显示链。","Position/Rotation/LinearVelocity/AngularVelocity 是真实物理状态；Transform 为插值呈现。HeldTarget 仅显示检查，持握施力直接由 holder.position() 与当前水平朝向计算，不能把插值目标回输模拟。","拾取和释放只增删 HeldBy/HeldTarget 与碰撞层；不瞬移箱体，不清除线/角速度。持握以有上限的弹簧阻尼力追随，箱体始终动态，允许惯性和碰撞偏离目标并向人物施加反作用力。","同批次拾取 Local 预留防止重复占用；持有者消失或关系异常解除时清理目标并恢复自由碰撞。多角色公平裁决/退出前交接及只过滤持有者仍暂缓。","World / Character / Parcel 为碰撞分类；持握箱忽略整个 Character 层，保留 World / Parcel。支撑探测检查双方掩码、支撑法线、传感器与 HeldBy，避免墙面或手中箱体充当地面。","Forces 是 Avian QueryData，SpatialQuery 是 SystemParam；二者均不是新增实体组件。组件清单只列真实刚体数据/内部累计与插值状态，内部引擎字段不穷举。","SoundRequest 是缓冲 Message，当前由成功拿放命令、固定步持握观察、真实支撑撞击写入，Update 的播放系统读取；不会从原始按键猜测业务成功。","音频观察和物理规则分开：警告只提示不改变持握；落地锁存涵盖活动与休眠支撑。Kira 声音输出与无设备事件测试分开；12 种 cue 中四种已接入，菜单、交接、推车、弹开和交付尚无玩法。","GameAudioPlugin 的 Update 内显式链为 log_load_failures → play_requests → stop_on_exit；其与 Kira 插件内部系统没有额外指定全序，播放命令可以排队后由插件消费。"]},"registry":{"app-main":{"name":"main / App","kind":"App","description":"创建 App 与会话日志，配置默认插件，加载设置，装配功能插件后进入主循环。退出时记录结果并刷新日志。","notes":["main 先创建 App 和会话日志守护对象，再配置 DefaultPlugins 的 LogPlugin 文件输出与 WindowPlugin；设置加载失败回退默认。会话日志不是玩法 ECS 状态。","main 插入 GameSettings、WinitSettings::continuous() 与固定 60 Hz 的 Time\u003cFixed>，再注册 EguiPlugin、WorldInspectorPlugin、SettingsPlugin、GameplayPlugin、GameAudioPlugin、PlayerInputPlugin、CameraControlPlugin、PrototypeScenePlugin、StartupLogPlugin；Egui 在检查器之前构建。","PlayerInputPlugin 注册 GameplayContext 与五个角色意图 Observer；CameraControlPlugin 注册观察与视角切换两个 Observer、窗口焦点消息与显示系统。GameplayPlugin 注册玩法数据反射类型，支持世界检查器。","PrototypeScenePlugin 构建时插入 ClearColor 与 GlobalAmbientLight；spawn_scene 在 Startup 使用 Commands 生成场景并添加网格、材质资产。","默认启动阶段为 PreStartup → Startup → PostStartup。StartupLogPlugin 集中注册四个启动日志，PrototypeScenePlugin 注册场景生成；六个系统（含 GameAudioPlugin 的预加载）没有显式相互顺序，插件注册顺序不构成系统串行依赖。","Startup 结束会应用场景生成命令，关系钩子维护 Actions、Bindings 与 Children；引擎还在 PostStartup 完成启动变换同步。四个启动日志系统只报告实际玩法配置、固定时间步与当前功能约定，不依赖已生成实体；启动日志插件不初始化配置或添加功能插件。","当前场景创建 1 个控制者、1 个角色、1 个木箱、1 台相机、6 个视觉子实体、5 个动作、8 条绑定；WindowPlugin 创建 1 个主窗口。另生成 2 个静态世界实体（地面、墙体）与日光，未并入 visual；检查器复用主窗口与相机，不添加第二套玩法实体。","spawn_keyboard_controller、keyboard_context 和 OrbitCamera::transform 是生成或计算辅助函数，不是独立注册的 Schedule 系统。Action、Binding 的生成辅助宏与关系由插件实现。","SessionWriter 只在日志插件初始化期间作为临时 Resource 存在，随后取出交给文件输出层；SessionLogGuard 是 main 持有的普通 Rust 对象，App::run 返回后记录退出并刷新。","EguiPlugin 默认把 EguiContext 与 PrimaryEguiContext 自动附加到首个相机，当前只有一台相机。其 required components 与插入钩子补入 UI 设置、输入、输出及多轮 Schedule；这些由插件初始化，不由 spawn_scene 手工生成，检查器不另建游戏窗口。","GameplayPlugin 内部注册 DemoPhysicsPlugin，再由它安装 PhysicsPlugins::default()，默认物理调度 FixedPostUpdate；不是 main 中额外注册两个插件。","GameplayPlugin 内部注册 SoundEventsPlugin 与 SoundRequest；GameAudioPlugin 独立安装 Kira 0.26.0、两个类型通道与 SoundBank，DefaultPlugins 显式禁用 Bevy 默认 AudioPlugin，避免双输出设备。"],"source":{"path":"src/main.rs","line":26}},"plugin-DefaultPlugins":{"id":"plugin-DefaultPlugins","name":"DefaultPlugins","kind":"Plugin","description":"引擎输入、窗口、时间、变换、渲染与日志。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":38}},"plugin-EguiPlugin":{"id":"plugin-EguiPlugin","name":"EguiPlugin","kind":"Plugin","description":"准备 Egui 上下文与界面绘制。","notes":["注册顺序不等于系统执行顺序。","EguiPlugin 必须先于 WorldInspectorPlugin 构建。"],"source":{"path":"src/main.rs","line":66}},"plugin-WorldInspectorPlugin":{"id":"plugin-WorldInspectorPlugin","name":"WorldInspectorPlugin","kind":"Plugin","description":"通过反射检查 ECS；复用当前窗口与相机。","notes":["注册顺序不等于系统执行顺序。","EguiPlugin 必须先于 WorldInspectorPlugin 构建。"],"source":{"path":"src/main.rs","line":67}},"plugin-SettingsPlugin":{"id":"plugin-SettingsPlugin","name":"SettingsPlugin","kind":"Plugin","description":"设置资源与限帧。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":68}},"plugin-GameplayPlugin":{"id":"plugin-GameplayPlugin","name":"GameplayPlugin","kind":"Plugin","description":"玩法资源、反射类型和固定模拟链。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":69}},"plugin-GameAudioPlugin":{"id":"plugin-GameAudioPlugin","name":"GameAudioPlugin","kind":"Plugin","description":"Kira 输出、预加载、短音限制与退出停止。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":70}},"plugin-PlayerInputPlugin":{"id":"plugin-PlayerInputPlugin","name":"PlayerInputPlugin","kind":"Plugin","description":"输入上下文、动作与角色意图 Observer。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":71}},"plugin-CameraControlPlugin":{"id":"plugin-CameraControlPlugin","name":"CameraControlPlug e\">R\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"audio_play|resource.SoundBank\">\u003cpath d=\"M1315,2160 L1315,2090\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"1293\" y=\"2112\" width=\"44\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"1315\" y=\"2129\" class=\"edge-label\" text-anchor=\"middle\">W\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"audio_play|kira-output\">\u003cpath d=\"M1214,2290 L1214,2350\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"1189\" y=\"2307\" width=\"50\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"1214\" y=\"2324\" class=\"edge-label\" text-anchor=\"middle\">排队\u003c/text>\u003c/g>\u003ctext x=\"52\" y=\"2516\" class=\"small\" text-anchor=\"start\">当前接入：pickup / release / land / instability_warning；菜单、交接、推车、弹开、交付 cue 仅预留。\u003c/text>\u003ctext x=\"52\" y=\"2551\" class=\"small\" text-anchor=\"start\">反馈测试只安装消息与最小物理 App；Kira 输出仅在用户启动游戏时安装。\u003c/text>\u003c/svg>","summary":"输入使用 EntityEvent / Observer；窗口、碰撞与声音反馈使用缓冲 Message；Kira 消费声音请求。"}]}</script><script>
const DATA=JSON.parse(document.getElementById('architecture-data').textContent);const canvas=document.getElementById('canvas'),diagram=document.getElementById('diagram'),details=document.getElementById('details');let view=DATA.views[0],scale=1,panX=0,panY=0,selected=null,drag=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function transform(){diagram.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';document.getElementById('zoom-label').textContent=Math.round(scale*100)+'%'}
function fit(){scale=Math.min((canvas.clientWidth-28)/view.width,(canvas.clientHeight-28)/view.height,1);panX=(canvas.clientWidth-view.width*scale)/2;panY=(canvas.clientHeight-view.height*scale)/2;transform()}
function list(title,items){return items&&items.length?'<h3>'+safe(title)+'</h3><ul>'+items.map(x=>{const key=DATA.registry[x]?x:String(x).split(' ')[0],d=DATA.registry[key];return '<li>'+(d?'<button class="data-link" data-open="'+safe(key)+'">'+safe(d.name)+' '+safe(String(x).slice(key.length))+'</button>':'<code>'+safe(x)+'</code>')+'</li>'}).join('')+'</ul>':''}
function guide(){details.innerHTML='<span class="badge">读图指南</span><h2>'+safe(view.label)+'</h2><p>'+safe(view.summary)+'</p><div class="legend"><div><i class="line"></i>调度先后与执行依赖</div><div><i class="line read"></i>R：数据 → 系统</div><div><i class="line write"></i>W：系统 → 数据</div><div><i class="line event"></i>事件触发 Observer</div><div><i class="line ref"></i>普通 Entity 引用</div><div><i class="line rel"></i>Bevy 关系及反向索引</div></div><h3>类型框</h3><p>«Entity» 包含组件框；«System» 是调度运行的函数；«Observer» 按事件响应；«Resource» 共享，«Local» 为系统私有。</p><div class="help">固定步每帧 0～N 次。角色朝向和持物同步在固定步与逐帧更新中复用；数据访问连线不代表执行顺序。</div><h3>范围与抽象</h3><p class="footnote">业务系统与组件来自当前源码；引擎输入、时钟、变换传播和渲染以必要概览节点表示。普通引用不自动成为 Bevy 关系。</p><button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null)}
function sourceLink(source){return '<h3>源码位置</h3><a class="source" href="ecs-source.html?file='+encodeURIComponent(source.path)+'#L'+encodeURIComponent(source.line)+'" target="_blank" rel="noopener noreferrer" title="在新标签页查看源码并定位此行">'+safe(source.path)+':'+safe(source.line)+'</a>'}
function showDetail(id){const d=DATA.registry[id];if(!d){guide();return}details.innerHTML='<span class="badge">'+safe(d.kind||'数据')+(d.phase?' · '+safe(d.phase):'')+'</span><h2>'+safe(d.name||id)+'</h2><p>'+safe(d.description||'')+'</p>'+(d.owner?'<p>所属实体：'+safe(d.owner)+'</p>':'')+list('R · 读取',d.reads)+list('W · 修改',d.writes)+list('Query · 过滤',d.filters)+list('事件 / 消息',d.events)+list('字段',d.fields)+list('约束与说明',d.notes)+(d.components?list('实体组件',d.components.map(c=>c.id)):'')+(d.source?sourceLink(d.source):'')+'<button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null);details.scrollTop=0}
details.addEventListener('click',e=>{const n=e.target.closest('[data-open]');if(n)select(n.dataset.open)});
function select(id){selected=id;const d=DATA.registry[id];const relevant=new Set([id,...(d?.reads||[]),...(d?.writes||[])]);diagram.querySelectorAll('[data-id]').forEach(n=>{n.classList.toggle('selected',n.dataset.id===id);n.classList.toggle('dim',!!id&&!relevant.has(n.dataset.id))});diagram.querySelectorAll('.edge').forEach(n=>{const active=n.dataset.connect.split('|').some(v=>relevant.has(v));n.classList.toggle('focused',!!id&&active);n.classList.toggle('dim',!!id&&!active)});id?showDetail(id):guide()}
function switchView(id){view=DATA.views.find(v=>v.id===id);if(!view)return;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));diagram.innerHTML=view.svg;document.getElementById('caption').textContent=view.summary;document.getElementById('search').value='';selected=null;guide();requestAnimationFrame(fit)}
function zoom(factor,x=canvas.clientWidth/2,y=canvas.clientHeight/2){const old=scale;scale=Math.min(2.4,Math.max(.2,scale*factor));panX=x-(x-panX)*scale/old;panY=y-(y-panY)*scale/old;transform()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('fit').onclick=fit;document.getElementById('zoom-in').onclick=()=>zoom(1.2);document.getElementById('zoom-out').onclick=()=>zoom(1/1.2);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  // 自定义平移接管左键手势，阻止浏览器同时开始文字选择或原生拖动。
  e.preventDefault();
  drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){panX=drag.px+dx;panY=drag.py+dy;canvas.classList.add('dragging');transform()}});
canvas.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved){
    const n=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');
    // pointerdown 取消了默认聚焦；点击节点时补回焦点，保留 Enter / 空格操作。
    n?.focus({preventScroll:true});select(n?n.dataset.id:null);
  }
  drag=null;canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging')});
diagram.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-id]');if(n){e.preventDefault();select(n.dataset.id)}}});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();selected=null;const hits=[];diagram.querySelectorAll('[data-id]').forEach(n=>{const d=DATA.registry[n.dataset.id],hit=!q||JSON.stringify(d).toLowerCase().includes(q);n.classList.toggle('dim',!hit);n.classList.toggle('selected',!!q&&hit);if(hit)hits.push(n.dataset.id)});diagram.querySelectorAll('.edge').forEach(n=>n.classList.remove('dim','focused'));if(q){details.innerHTML='<span class="badge">搜索结果</span><h2>'+hits.length+' 个匹配节点</h2><p>当前视图中匹配的卡片已高亮。点击卡片查看详情。</p><p class="footnote">搜索仅覆盖当前视图；可切换其他视图继续查找。</p>'}else guide()});
document.getElementById('export').onclick=()=>{const blob=new Blob([view.svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ecs-'+view.id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.addEventListener('resize',fit);switchView('overview');
</script></body></html>
