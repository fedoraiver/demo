</style></head><body><header><div class="eyebrow">DEMO / ECS ARCHITECTURE · V1</div><h1>从输入到画面，当前 App 如何运作</h1><p class="sub">UML 风格的实体、组件、系统与关系 · 基于生成时的源码快照 · 不执行游戏</p></header><div class="toolbar"><nav class="tabs" aria-label="架构视图"><button data-view="overview" class="active">总览</button><button data-view="schedules">调度与读写</button><button data-view="relationships">实体关系</button><button data-view="events">事件与 Observer</button></nav><div class="tools"><input id="search" placeholder="搜索系统、组件或字段" aria-label="搜索架构节点"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适合窗口</button><button id="export">导出 SVG</button></div></div><main class="workspace"><section class="canvas-wrap"><div id="caption" class="caption"></div><div id="canvas" class="canvas"><div id="diagram" class="diagram"></div><div class="canvas-hint">滚轮缩放 · 拖动平移 · 点击卡片查看数据与源码</div></div></section><aside id="details" class="side" aria-live="polite"></aside></main><script id="architecture-data" type="application/json">{"model":{"title":"当前原型的 ECS 架构","snapshot_note":"按英文 BSN 菜单、主菜单/游戏/暂停生命周期与 Avian 0.7.0 物理原型维护；正式 HTML/SVG/源码快照由本次 pre-commit 从候选索引生成。","systems":[{"id":"startup_spawn","name":"spawn_scene","kind":"system","phase":"OnEnter(AppState::InGame) · StateTransition","module":"scene","description":"仅进入游戏会话时生成物理角色、快递、地面/墙体、控制者与玩法相机；暂停不重建，返回主菜单清理会话实体。","reads":["resource.PrototypeConfig"],"writes":["controller.Name","controller.PlayerId","controller.GameplayContext","controller.GamepadDevice","controller.ControlsCharacter","controller.ControlsCamera","controller.Actions","controller.ContextPriority","controller.ContextActivity","character.Name","character.Character","character.CharacterIntent","character.CharacterMotion","character.Transform","character.GlobalTransform","character.Visibility","character.Children","parcel.Name","parcel.Parcel","parcel.Pickable","parcel.Transform","parcel.GlobalTransform","parcel.Visibility","parcel.Children","camera.Name","camera.Camera3d","camera.OrbitCamera","camera.MouseLookState","camera.Transform","camera.GlobalTransform","visual.Name","visual.Mesh3d","visual.MeshMaterial3d","visual.Transform","visual.GlobalTransform","visual.ChildOf","visual.Visibility","action.Name","action.Action","action.ActionSettings","action.ActionOf","action.Bindings","action.Press","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime","action.ActionMock","action.ActionFns","action.ConditionFns","binding.Binding","binding.BindingOf","binding.FirstActivation","binding.Negate","binding.SwizzleAxis","binding.ModifierFns","resource.AssetsMesh","resource.AssetsStandardMaterial","visual.CharacterVisual","character.RigidBody","character.Collider","character.Mass","character.ComputedMass","character.ComputedCenterOfMass","character.CollisionLayers","character.CollisionEventsEnabled","character.SweptCcd","character.Friction","character.Restitution","character.TranslationInterpolation","character.LockedAxes","parcel.RigidBody","parcel.Collider","parcel.Mass","parcel.ComputedMass","parcel.ComputedCenterOfMass","parcel.CollisionLayers","parcel.CollisionEventsEnabled","parcel.SweptCcd","parcel.Friction","parcel.Restitution","parcel.TranslationInterpolation","parcel.LockedAxes","parcel.AngularDamping","parcel.TransformInterpolation","parcel.RotationInterpolation","parcel.ScaleInterpolation","world.RigidBody","world.Collider","world.CollisionLayers","world.Transform","world.Mesh3d","world.MeshMaterial3d","controller.DespawnOnExit","character.DespawnOnExit","parcel.DespawnOnExit","camera.DespawnOnExit","world.DespawnOnExit","camera.IsDefaultUiCamera","camera.PrimaryEguiContext"],"filters":[],"events":[],"notes":["Commands 生成业务实体，Assets 添加直接发生；碰撞体和刚体只放在业务根。","地面与墙体各有一个静态盒形 Collider；日光另行生成，主窗口由 WindowPlugin 创建。","character_body / parcel_body 是 Bundle 构造辅助函数，不是系统；反向索引由关系钩子维护。","所有玩法业务根、控制者、相机及日光使用 DespawnOnExit(AppState::InGame)；视觉子树由 ChildOf 连带销毁。","玩法相机显式标记 IsDefaultUiCamera 与 PrimaryEguiContext，接替主菜单展示相机。"],"source":{"path":"src/scene.rs","line":32}},{"id":"startup_config","name":"log_configuration","kind":"system","phase":"Startup","module":"startup_log","description":"记录实际玩法配置、Avian 版本、动态刚体、弹簧持握和保留速度的释放方式。","reads":["resource.PrototypeConfig"],"writes":[],"filters":[],"events":[],"notes":["与其他项目 Startup 系统没有显式先后依赖；日志是外部输出。","由 StartupLogPlugin 注册；保留日志 target demo::gameplay。"],"source":{"path":"src/startup_log.rs","line":26}},{"id":"startup_timestep","name":"log_simulation_timestep","kind":"system","phase":"Startup","module":"startup_log","description":"记录固定模拟频率。","reads":["resource.TimeFixed"],"writes":[],"filters":[],"events":[],"notes":["只读固定时间步，不修改模拟时钟。","由 StartupLogPlugin 注册；保留日志 target demo::settings。"],"source":{"path":"src/startup_log.rs","line":36}},{"id":"startup_pose","name":"log_pose_synchronization","kind":"system","phase":"Startup","module":"startup_log","description":"记录准备力、物理解算和插值后显示同步的各个调度阶段及顺序。","reads":[],"writes":[],"filters":[],"events":[],"notes":["FixedUpdate 准备运动/持握力；FixedPostUpdate 求解；RunFixedMainLoop 插值 → 朝向 → 目标 → 镜头 → 可见性。","仅记录装配约定，不执行同步或规定其他 Startup 系统先后；保留 demo::camera target。"],"source":{"path":"src/startup_log.rs","line":45}},{"id":"frame_limit","name":"limit_frame_rate","kind":"system","phase":"First","module":"settings","description":"补足上一帧起点以来剩余间隔并更新局部计时。","reads":["resource.GameSettings","local.FramePacing"],"writes":["local.FramePacing"],"filters":[],"events":[],"notes":["显式 .before(TimeSystems)。","默认上限 60；等待超过目标间隔时不会继续补等；不修改 Time\u003cFixed>。"],"source":{"path":"src/settings.rs","line":281}},{"id":"time_update","name":"TimeSystems / time_system","kind":"engine","phase":"First","module":"bevy_time","description":"引擎更新真实、虚拟与当前阶段通用时钟。","reads":["resource.TimeFixed","resource.TimeReal","resource.TimeVirtual"],"writes":["resource.TimeReal","resource.TimeVirtual","resource.Time"],"filters":[],"events":[],"notes":["limit_frame_rate 在此之前等待。","RunFixedMainLoop 根据累计时间执行 0..N 个固定步；固定循环还会更新 Time\u003cFixed> 并切换通用 Time，此处没有把循环折叠成一次时间更新。"],"source":null},{"id":"input_update","name":"InputSystems","kind":"engine","phase":"PreUpdate","module":"bevy_input","description":"引擎从缓冲消息更新键盘、鼠标按钮和本帧鼠标位移。","reads":["resource.KeyboardInputMessages","resource.KeyboardFocusLostMessages","resource.MouseButtonInputMessages","resource.MouseMotionMessages"],"writes":["resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion"],"filters":[],"events":["读取缓冲 Message：KeyboardInput、KeyboardFocusLost、MouseButtonInput、MouseMotion"],"notes":["展示相关输入系统集合，集合内部不是本图指定的串行顺序。","每种 MessageReader 有独立读取游标；消息读取不会使另一读者失去消息。"],"source":null},{"id":"mouse_capture","name":"sync_mouse_capture","kind":"system","phase":"PreUpdate","module":"camera","description":"按窗口焦点、当前游戏状态、控制关联与检查器占用统一更新捕获和 GameplayContext；主菜单与暂停始终释放光标。","reads":["resource.ButtonInputKeyCode","resource.MouseButtonInputMessages","resource.WindowFocusedMessages","window.Window","controller.ControlsCharacter","controller.ControlsCamera","camera.OrbitCamera","camera.MouseLookState","camera.EguiContext","controller.ContextActivity","resource.AppState","resource.PlayState"],"writes":["window.CursorOptions","camera.MouseLookState","camera.EguiContext","controller.ContextActivity"],"filters":["窗口：With\u003cPrimaryWindow>，要求唯一","控制者：With\u003cGameplayContext>","角色：Query\u003c(), With\u003cCharacter>>，只验证实体存在","相机：具有 OrbitCamera 与 MouseLookState","UI：With\u003cPrimaryEguiContext>，只在查询唯一上下文成功时读取"],"events":["读取缓冲 Message：MouseButtonInput、WindowFocused"],"notes":["显式 .after(InputSystems).after(EguiPreUpdateSet::BeginPass).before(EnhancedInputSystems::Prepare)。","CursorOptions 与 MouseLookState 在系统中直接更新；ContextActivity 是不可变组件，替换通过 Commands 延迟执行，必须在 Prepare 前应用。","EguiContext 以 &mut 查询，writes 表示调度层面的可变访问权限；此系统只查询 UI 状态，不构建面板或修改检查器字段。","点击当前 UI 面板、拖拽仍占用指针或弹窗打开时，不把左键视为恢复游戏捕获；当前 Window 光标命中已缓存的 UI 层。","UI 要求键盘、弹窗、指针拖拽或自由鼠标悬于面板时停用整个 GameplayContext；失焦或关联失效也停用。Esc 的暂停业务由菜单 Enhanced Input 执行；底层 Esc 只处理光标生命周期。","停用动作上下文不清空 ButtonInput；动作完成或取消清除持续移动轴，重新启用继续遵循按钮动作的 require_reset。","默认主上下文是 multipass，BeginPass 系统过滤掉它；此依赖是集合边界，不表示主检查器已经完成本帧 UI。实际 EguiPrimaryContextPass 由 PostUpdate 循环调用。"],"source":{"path":"src/camera.rs","line":288}},{"id":"enhanced_prepare","name":"EnhancedInputSystems::Prepare","kind":"engine","phase":"PreUpdate","module":"bevy_enhanced_input","description":"清理待重置输入，准备动作评估的输入忽略状态。","reads":["resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion","resource.ActionSources","resource.ConsumedInputs","resource.PendingBindings"],"writes":["resource.PendingBindings"],"filters":[],"events":[],"notes":["由 EnhancedInputPlugin 的 update_pending 完成。","Prepare 在 InputSystems、Egui BeginPass 集合与 sync_mouse_capture 的上下文命令应用之后；接着进入框架 Update。","图中列出当前输入相关资源，未展开框架所有设备与局部缓存。"],"source":null},{"id":"enhanced_evaluate","name":"EnhancedInputSystems::Update","kind":"engine","phase":"PreUpdate","module":"bevy_enhanced_input","description":"评估上下文、绑定、修饰器与 Press，更新动作值、触发状态及计时。","reads":["resource.Time","resource.TimeReal","resource.ContextInstances","resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion","resource.ActionSources","resource.ConsumedInputs","resource.PendingBindings","controller.Actions","controller.ContextActivity","controller.GamepadDevice","action.Name","action.ActionSettings","action.Bindings","action.ActionMock","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime","action.ConditionFns","action.Press","binding.Binding","binding.FirstActivation","binding.ModifierFns","binding.Negate","binding.SwizzleAxis"],"writes":["resource.ConsumedInputs","controller.Actions","action.ActionMock","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime","action.Press","binding.FirstActivation"],"filters":["按 ContextInstances\u003cPreUpdate> 索引访问上下文","动作：Without\u003cExternallyMocked>","绑定：Without\u003cActionSettings>","当前 JumpAction、I ocalAcceleration","parcel.SleepTimer"],"filters":["角色：(With\u003cCharacter>, Without\u003cPickable>)","箱体：(With\u003cPickable>, Without\u003cCharacter>)，具有 HeldBy","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["不读 HeldTarget；模拟目标直接由 holder.position() 与水平朝向计算，防止呈现反馈进物理。","动态箱体始终参与世界和其他箱体碰撞，隐式弹簧系数与力上限限制振荡；短弧旋转驱动。","Forces 是可变 QueryData，不是组件；访问速度、质量、位姿及引擎力累计/唤醒数据。图列出访问权限，具体施力只写本步累计量，冲量立即改变速度；引擎内部非业务字段仅作摘要。"],"source":{"path":"src/gameplay.rs","line":435}},{"id":"velocity_log","name":"log_character_velocity","kind":"system","phase":"FixedPostUpdate · after(PhysicsSystems::Writeback)","module":"gameplay","description":"每 0.5 模拟秒采样一次实际速度和接地状态。","reads":["resource.TimeFixed","character.LinearVelocity","character.CharacterMotion","local.VelocityLog","resource.AppState","resource.PlayState"],"writes":["local.VelocityLog"],"filters":["With\u003cCharacter>","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["与 grounded_after 使用 .chain()；先更新接地，再记录解算后的速度。"],"source":{"path":"src/gameplay.rs","line":475}},{"id":"collision_log","name":"log_collisions","kind":"system","phase":"FixedPostUpdate · after(PhysicsSystems::StepSimulation)","module":"physics","description":"读取碰撞开始/结束缓冲消息，通过统一文件日志记录碰撞双方。","reads":["resource.CollisionStartMessages","resource.CollisionEndMessages"],"writes":[],"filters":[],"events":[],"notes":["MessageReader 自有游标；这些是缓冲 Message，不是输入 EntityEvent/Observer。","与 Writeback 及其后接地/速度日志之间没有额外显式先后，图画独立分支。"],"source":{"path":"src/physics.rs","line":112}},{"id":"physics_prepare","name":"PhysicsSystems::Prepare","kind":"engine","phase":"FixedPostUpdate","module":"avian3d","description":"准备物理位姿、质量、碰撞体与查询数据（引擎集合概览）。","reads":["character.Transform","parcel.Transform","world.Transform"],"writes":["character.Position","character.Rotation","character.LinearVelocity","character.AngularVelocity","parcel.Position","parcel.Rotation","parcel.LinearVelocity","parcel.AngularVelocity" 概览的 reads/writes 只列与当前原型有关的数据，未展开全部内部组件、资源、条件函数表、消息游标与局部缓存。部分组件通过 required components 自动出现，部分关系反向索引只在关联存在时出现；组件列表不表示所有组件始终同时存在。","source.path 使用仓库相对路径。项目类型引用声明行，引擎或插件类型引用项目内的使用、生成或注册行；kind=engine 概览 source=null。父图应把这些位置标为源码入口，不能宣称是引擎类型定义。","相关主阶段为 First → PreUpdate → StateTransition → RunFixedMainLoop → Update → SpawnScene → PostUpdate → Last；项目 spawn_scene 属于 OnEnter(InGame)，不是 Startup 或引擎 SpawnScene 系统。","RunFixedMainLoop 每个渲染帧执行 0..N 次固定阶段；固定步不是渲染帧的一对一后续步骤。当前 fixed 为 60 Hz，默认渲染上限 60 FPS，自定义上限可高于 60，性能不足也可能低于上限。","EnhancedInputSystems::Apply 写入动作输出并调用 Commands::trigger；这个 Apply 阶段不是 ECS 的 ApplyDeferred。排入的动作事件在下一命令同步点触发，默认 PreUpdate 完成时已经应用，随后固定循环可读到最新意图。","World::trigger 在调用期间触发 Observer；Commands::trigger 在命令应用时触发。玩法/相机的八个动作 Observer 与菜单六个动作 Observer、指针滚动及模型 Ready Observer 按事件响应，不组成注册顺序流水线。","MouseButtonInput、WindowFocused 等是缓冲 Message，拥有独立读取游标，默认缓冲不是永久队列。Enhanced Input 的 Fire、Complete、Cancel 是触发式 EntityEvent；两类通信必须使用不同图例。","跳跃与交互用布尔请求跨零固定步帧保留，固定步用 mem::take 消费一次；多次到达而尚未消费的同类请求会合并。移动轴保持到 Complete 或 Cancel；镜头角度直接按本帧像素位移更新，不积分角色位置。","同一 Schedule 的 .before/.after/.chain 才表达先后；数据访问冲突、元组顺序、插件注册顺序及 .in_set 本身都不定义完整执行顺序，跨 Schedule 的先后来自主调度顺序。","普通 Entity 引用不提供 Bevy 关系生命周期；#[entities] 只参与实体映射。ActionOf、BindingOf、ChildOf 与 HeldBy 是关系，反向索引的成员由 Bevy 自动维护；只有前三者启用 linked_spawn。","RenderApp 包含提取、准备、排序与 GPU 渲染等步骤，也可能使用流水线；render 节点是渲染概览，不是紧接 PostUpdate 的单个普通系统。日志通过 tracing 文件输出，不是 ECS Event 或 Message。","该文件记录源码结构，未启动游戏，未执行窗口或视觉验收。","视角切换不是 Observer 内立即切换：request_perspective_toggle 只记录请求，apply_perspective_toggle 在 EnhancedInputSystems::Apply 之后同帧消费，避免 I 与鼠标同帧时依赖动作遍历或 Observer 顺序。","世界检查器由 EguiPlugin 与 WorldInspectorPlugin 提供，数据留在 ECS 内，通过反射动态读取和可选编辑。Egui 输入映射、BeginPass 集合与嵌套 EguiPrimaryContextPass 以概览节点表示；未展开全部输入、提取和绘制系统。","PreUpdate 相关依赖：InputSystems 后更新 MenuContext；Egui ProcessInput → 过滤 → BeginPass → 捕获/命令应用在 Enhanced Prepare 前。动作 Apply 后消费菜单与视角请求，二者未设置彼此顺序；StateTransition 随后在固定循环前执行。","EguiPlugin::default() 默认 multipass=true；主上下文的 EguiPrimaryContextPass 在 PostUpdate 的上下文循环内部运行，可一帧多轮。PreUpdate BeginPass 排序边界不等于主检查器 UI 在该时刻开始或完成。","PostUpdate 的 UI 嵌套 Schedule 与变换传播都属于本帧后处理，但源码与已核对插件未建立二者的显式顺序。应画成并行分支或同阶段无序节点，避免将 UI 动态反射编辑包装成与模拟保证同步的过程。","菜单与暂停强制停用 GameplayContext；检查器占用、失焦或关联失效也停用。F3 释放光标后未操作检查器仍可使用玩法键盘；Esc 的业务暂停由菜单 Enhanced Input 处理，底层读取仅负责光标生命周期。","EguiInput 内部的 egui::Event 只是 UI RawInput 的事件枚举，不等同于 Bevy ECS Event、EntityEvent 或缓冲 Message。捕获期间的 UI 过滤与 UI 占用时的 GameplayContext 停用构成两个方向的输入边界。","项目固定准备链：update_grounded → move_characters → jump_characters → handle_interaction → release_orphaned_items → sync_held_objects → apply_grip_forces。sync_gravity 与 sync_character_facing 均 before(GameplaySystems::Simulate)，二者无彼此顺序。","Avian 0.7 默认在 FixedPostUpdate 执行 Prepare → StepSimulation（嵌套 PhysicsSchedule 与求解子步）→ Writeback；接地与速度日志链 after(Writeback)。碰撞日志只 after(StepSimulation)，与回写链不设额外顺序。","插值边界：FixedFirst 重置起点 → 物理步 → FixedLast 记录终点 → RunFixedMainLoop / AfterFixedMainLoop 的 Ease → 朝向 → HeldTarget → 相机 → 可见性 → UpdateEasingTick。零固定步帧仍完成插值后的显示链。","Position/Rotation/LinearVelocity/AngularVelocity 是真实物理状态；Transform 为插值呈现。HeldTarget 仅显示检查，持握施力直接由 holder.position() 与当前水平朝向计算，不能把插值目标回输模拟。","拾取和释放只增删 HeldBy/HeldTarget 与碰撞层；不瞬移箱体，不清除线/角速度。持握以有上限的弹簧阻尼力追随，箱体始终动态，允许惯性和碰撞偏离目标并向人物施加反作用力。","同批次拾取 Local 预留防止重复占用；持有者消失或关系异常解除时清理目标并恢复自由碰撞。多角色公平裁决/退出前交接及只过滤持有者仍暂缓。","World / Character / Parcel 为碰撞分类；持握箱忽略整个 Character 层，保留 World / Parcel。支撑探测检查双方掩码、支撑法线、传感器与 HeldBy，避免墙面或手中箱体充当地面。","Forces 是 Avian QueryData，SpatialQuery 是 SystemParam；二者均不是新增实体组件。组件清单只列真实刚体数据/内部累计与插值状态，内部引擎字段不穷举。","菜单 Update 顺序为 UiSystems::Build → 延迟命令同步 → pointer_interaction → UiSystems::Style。Style 中样式、说明与焦点滚入没有彼此显式全序；原生 UI PostUpdate 计算布局，焦点滚入等待有效尺寸。","可操作按钮带 Button/MenuButton；Continue、Multiplayer 及未实现设置是静态 Coming Soon 节点，不带动作、不保存虚构设置、不参与键盘序号。","状态类型 AppState/PlayState 对应 State 与 NextState 资源；MenuPage/SettingsTab 是 MenuState 内部值。UiRequest 是缓冲 Message，Fire/Pointer/WorldInstanceReady 是触发事件，不混用图例。","展示 WorldAssetRoot 异步展开 GLB，字体使用预加载句柄；BSN 构造辅助函数不是 Schedule 系统。模型 Ready 与滚动回调用 on(...) 在具体实体注册 Observer。","文字叶节点保留默认自动最小宽度，避免 Bevy 0.19 在自动横排测量中把显式 min_width:0 解析为零宽；布局计算与真实字形的无窗口回归不替代用户最终视觉验收。"]},"registry":{"resource.GameSettings":{"id":"resource.GameSettings","name":"GameSettings","fields":["max_fps: NonZeroU32 = 60","camera.mouse_sensitivity: f32 = 0.003","camera.invert_y: bool = false"],"description":"全局玩家设置；配置帧率须为不小于 60 的整数，120 是合法自定义值。无效文件警告并回退默认 60，保留原文件；CameraSettings 是嵌套值，不是另一个 Resource。","source":{"path":"src/settings.rs","line":17}},"resource.PrototypeConfig":{"id":"resource.PrototypeConfig","name":"PrototypeConfig","fields":["move_speed: f32 = 4.5","acceleration: f32 = 30","braking_acceleration: f32 = 45","air_acceleration: f32 = 6","jump_speed: f32 = 5","gravity: f32 = 9.81","pickup_radius: f32 = 1.8","hold_offset: Vec3 = (0, 1, -0.9)","ground_y: f32 = 0","parcel_half_height: f32 = 0.3","character_mass: f32 = 75","character_height: f32 = 1.9","character_radius: f32 = 0.32","parcel_mass: f32 = 3","hold_frequency: f32 = 3","hold_damping_ratio: f32 = 1","hold_max_force: f32 = 450"],"description":"共享动态刚体、运动控制、重力、拾取与弹簧持握参数；检查器修改只影响当前会话。","source":{"path":"src/gameplay.rs","line":76}},"resource.TimeFixed":{"id":"resource.TimeFixed","name":"Time\u003cFixed>","fields":["timestep: Duration = 1/60 秒","delta / elapsed / overstep"],"description":"固定 60 Hz 模拟时钟，由引擎固定循环推进；每个渲染帧执行 0..N 个固定步。帧率上限不会修改此时间步。","source":{"path":"src/main.rs","line":62}},"resource.Time":{"id":"resource.Time","name":"Time","fields":["delta / elapsed"],"description":"引擎按当前阶段提供的通用时钟；PreUpdate 使用虚拟时间，固定阶段切换为固定时间。观察日志采样读取此资源，但鼠标角度不乘 delta。","source":{"path":"src/camera.rs","line":455}},"resource.TimeReal":{"id":"resource.TimeReal","name":"Time\u003cReal>","fields":["真实时间 delta / elapsed"],"description":"引擎真实时钟；Enhanced Input 的 ContextTime 可读取，与 Time 的自动阶段语义不同。","source":{"path":"src/main.rs","line":38}},"resource.TimeVirtual":{"id":"resource.TimeVirtual","name":"Time\u003cVirtual>","fields":["虚拟时间 delta / elapsed","暂停与缩放状态"],"description":"引擎游戏时钟，为固定步累计时间提供来源。 主菜单保持运行以播放展示动画；暂停游戏时冻结，恢复 Running 时继续。","sou \u003ctext x=\"2767\" y=\"696\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"2767\" y=\"734\" class=\"small\" text-anchor=\"start\">指针点击也写同一队列\u003c/text>\u003ctext x=\"2767\" y=\"772\" class=\"small\" text-anchor=\"start\">UI 滚轮只改视口位置\u003c/text>\u003ctext x=\"2767\" y=\"810\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"2767\" y=\"848\" class=\"small\" text-anchor=\"start\">WorldInstanceReady\u003c/text>\u003ctext x=\"2767\" y=\"886\" class=\"small\" text-anchor=\"start\">↓ 遍历 GLB 骨架子树\u003c/text>\u003ctext x=\"2767\" y=\"924\" class=\"small\" text-anchor=\"start\">AnimationPlayer 循环播放\u003c/text>\u003ctext x=\"2767\" y=\"962\" class=\"small\" text-anchor=\"start\">Commands 插入图句柄\u003c/text>\u003cg>\u003crect x=\"1540\" y=\"1535\" width=\"1470\" height=\"525\" rx=\"12\" fill=\"#fff\" stroke=\"#526477\" stroke-width=\"1.5\"/>\u003cpath d=\"M1540,1592H3010\" stroke=\"#dae2e8\"/>\u003ctext x=\"1560\" y=\"1565\" class=\"group-title\" text-anchor=\"start\">UiRequest · 从输入到页面、设置与状态\u003c/text>\u003ctext x=\"1560\" y=\"1584\" class=\"small\" text-anchor=\"start\">确认、调整、返回与指针点击产生消息；焦点、滚动与动画直接更新 ECS；未接通功能为禁用 Coming Soon。\u003c/text>\u003c/g>\u003cg class=\"node message\" data-id=\"resource.UiRequestMessages\" tabindex=\"0\" role=\"button\" aria-label=\"Messages&lt;UiRequest&gt;\">\u003crect x=\"1560\" y=\"1620\" width=\"360\" height=\"130\" rx=\"3\" fill=\"#fff\" stroke=\"#367b96\" stroke-width=\"1.7\" />\u003ctext x=\"1574\" y=\"1641\" class=\"stereotype\" text-anchor=\"start\">«Message»\u003c/text>\u003ctext x=\"1574\" y=\"1668\" class=\"node-title\" text-anchor=\"start\">UiRequest 消息缓冲\u003c/text>\u003ctext x=\"1574\" y=\"1693\" class=\"small\" text-anchor=\"start\">导航确认 / 调整 / Back\u003c/text>\u003ctext x=\"1574\" y=\"1716\" class=\"small\" text-anchor=\"start\">与 pointer_interactions 共用 UiAction\u003c/text>\u003c/g>\u003cg class=\"node system\" data-id=\"menu_handle_requests\" tabindex=\"0\" role=\"button\" aria-label=\"handle_requests\">\u003crect x=\"2040\" y=\"1620\" width=\"430\" height=\"130\" rx=\"10\" fill=\"#fff\" stroke=\"#234f80\" stroke-width=\"1.7\" />\u003ctext x=\"2054\" y=\"1641\" class=\"stereotype\" text-anchor=\"start\">«System»\u003c/text>\u003ctext x=\"2054\" y=\"1668\" class=\"node-title\" text-anchor=\"start\">handle_requests\u003c/text>\u003ctext x=\"2054\" y=\"1693\" class=\"small\" text-anchor=\"start\">MessageReader 统一消费请求\u003c/text>\u003ctext x=\"2054\" y=\"1716\" class=\"small\" text-anchor=\"start\">更新 MenuState / Draft / NextState\u003c/text>\u003c/g>\u003cg class=\"node resource\" data-id=\"resource.SettingsDraft\" tabindex=\"0\" role=\"button\" aria-label=\"SettingsDraft\">\u003crect x=\"2600\" y=\"1620\" width=\"385\" height=\"130\" rx=\"3\" fill=\"#fffaf0\" stroke=\"#8b6130\" stroke-width=\"1.7\" />\u003ctext x=\"2614\" y=\"1641\" class=\"stereotype\" text-anchor=\"start\">«Resource»\u003c/text>\u003ctext x=\"2614\" y=\"1668\" class=\"node-title\" text-anchor=\"start\">设置草稿\u003c/text>\u003ctext x=\"2614\" y=\"1693\" class=\"small\" text-anchor=\"start\">Apply：校验、保存成功才热生效\u003c/text>\u003ctext x=\"2614\" y=\"1716\" class=\"small\" text-anchor=\"start\">Back：丢弃；保存失败保留原文件\u003c/text>\u003c/g>\u003cg class=\"edge read\" data-connect=\"resource.UiRequestMessages|menu_handle_requests\">\u003cpath d=\"M1920,1685 L2040,1685\" stroke=\"#2d72ad\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow-read)\"/>\u003crect x=\"1955\" y=\"1672\" width=\"50\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"1980\" y=\"1689\" class=\"edge-label\" text-anchor=\"middle\">读取\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"menu_handle_requests|resource.SettingsDraft\">\u003cpath d=\"M2470,1685 L2600,1685\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"2501\" y=\"1672\" width=\"68\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"2535\" y=\"1689\" class=\"edge-label\" text-anchor=\"middle\">W 草稿\u003c/text>\u003c/g>\u003cg class=\"node resource\" data-id=\"resource.MenuState\" tabindex=\"0\" role=\"button\" aria-label=\"MenuState\">\u003crect x=\"1560\" y=\"1855\" width=\"660\" height=\"130\" rx=\"3\" fill=\"#fffaf0\" stroke=\"#8b6130\" stroke-width=\"1.7\" />\u003ctext x=\"1574\" y=\"1876\" class=\"stereotype\" text-anchor=\"start\">«Resource»\u003c/text>\u003ctext x=\"1574\" y=\"1903\" class=\"node-title\" text-anchor=\"start\">页面与返回来源\u003c/text>\u003ctext x=\"1574\" y=\"1928\" class=\"small\" text-anchor=\"start\">Main / Hidden / Pause / Settings / Help\u003c/text>\u003ctext x=\"1574\" y=\"1951\" class=\"small\" text-anchor=\"start\">Settings / Help 返回来源保存在 return_page\u003c/text>\u003c/g>\u003cg class=\"node engine\" data-id=\"ui-next-state\" tabindex=\"0\" role=\"button\" aria-label=\"NextState → StateTransition\">\u003crect x=\"2335\" y=\"1855\" width=\"650\" height=\"130\" rx=\"10\" fill=\"#fff\" stroke=\"#667085\" stroke-width=\"1.7\" />\u003ctext x=\"2349\" y=\"1876\" class=\"stereotype\" text-anchor=\"start\">«Engine»\u003c/text>\u003ctext x=\"2349\" y=\"1903\" class=\"node-title\" text-anchor=\"start\">NextState → StateTransition\u003c/text>\u003ctext x=\"2349\" y=\"1928\" class=\"small\" text-anchor=\"start\">Start Game / ReturnToMenu：AppState\u003c/text>\u003ctext x=\"2349\" y=\"1951\" class=\"small\" text-anchor=\"start\">Pause / Resume：InGame 内 PlayState\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"menu_handle_requests|resource.MenuState\">\u003cpath d=\"M2145,1750 L2145,1800 L1890,1800 L1890,1855\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"1856\" y=\"1787\" width=\"68\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"1890\" y=\"1804\" class=\"edge-label\" text-anchor=\"middle\">W 页面\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"menu_handle_requests|ui-next-state|resource.AppState|resource.PlayState\">\u003cpath d=\"M2370,1750 L2370,1800 L2660,1800 L2660,1855\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"2618\" y=\"1787\" width=\"84\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"2660\" y=\"1804\" class=\"edge-label\" text-anchor=\"middle\">状态请求\u003c/text>\u003c/g>\u003c/svg>","summary":"左侧保留玩法、窗口与碰撞；右侧显示菜单动作、滚动、展示动画及 UiRequest 的统一业务路由。"}]}</script><script>
const DATA=JSON.parse(document.getElementById('architecture-data').textContent);const canvas=document.getElementById('canvas'),diagram=document.getElementById('diagram'),details=document.getElementById('details');let view=DATA.views[0],scale=1,panX=0,panY=0,selected=null,drag=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function transform(){diagram.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';document.getElementById('zoom-label').textContent=Math.round(scale*100)+'%'}
function fit(){scale=Math.min((canvas.clientWidth-28)/view.width,(canvas.clientHeight-28)/view.height,1);panX=(canvas.clientWidth-view.width*scale)/2;panY=(canvas.clientHeight-view.height*scale)/2;transform()}
function list(title,items){return items&&items.length?'<h3>'+safe(title)+'</h3><ul>'+items.map(x=>{const key=DATA.registry[x]?x:String(x).split(' ')[0],d=DATA.registry[key];return '<li>'+(d?'<button class="data-link" data-open="'+safe(key)+'">'+safe(d.name)+' '+safe(String(x).slice(key.length))+'</button>':'<code>'+safe(x)+'</code>')+'</li>'}).join('')+'</ul>':''}
function guide(){details.innerHTML='<span class="badge">读图指南</span><h2>'+safe(view.label)+'</h2><p>'+safe(view.summary)+'</p><div class="legend"><div><i class="line"></i>调度先后与执行依赖</div><div><i class="line read"></i>R：数据 → 系统</div><div><i class="line write"></i>W：系统 → 数据</div><div><i class="line event"></i>事件触发 Observer</div><div><i class="line ref"></i>普通 Entity 引用</div><div><i class="line rel"></i>Bevy 关系及反向索引</div></div><h3>类型框</h3><p>«Entity» 包含组件框；«System» 是调度运行的函数；«Observer» 按事件响应；«Resource» 共享，«Local» 为系统私有。</p><div class="help">固定步每帧 0～N 次。角色朝向和持物同步在固定步与逐帧更新中复用；数据访问连线不代表执行顺序。</div><h3>范围与抽象</h3><p class="footnote">业务系统与组件来自当前源码；引擎输入、时钟、变换传播和渲染以必要概览节点表示。普通引用不自动成为 Bevy 关系。</p><button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null)}
function sourceLink(source){return '<h3>源码位置</h3><a class="source" href="ecs-source.html?file='+encodeURIComponent(source.path)+'#L'+encodeURIComponent(source.line)+'" target="_blank" rel="noopener noreferrer" title="在新标签页查看源码并定位此行">'+safe(source.path)+':'+safe(source.line)+'</a>'}
function showDetail(id){const d=DATA.registry[id];if(!d){guide();return}details.innerHTML='<span class="badge">'+safe(d.kind||'数据')+(d.phase?' · '+safe(d.phase):'')+'</span><h2>'+safe(d.name||id)+'</h2><p>'+safe(d.description||'')+'</p>'+(d.owner?'<p>所属实体：'+safe(d.owner)+'</p>':'')+list('R · 读取',d.reads)+list('W · 修改',d.writes)+list('Query · 过滤',d.filters)+list('事件 / 消息',d.events)+list('字段',d.fields)+list('约束与说明',d.notes)+(d.components?list('实体组件',d.components.map(c=>c.id)):'')+(d.source?sourceLink(d.source):'')+'<button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null);details.scrollTop=0}
details.addEventListener('click',e=>{const n=e.target.closest('[data-open]');if(n)select(n.dataset.open)});
function select(id){selected=id;const d=DATA.registry[id];const relevant=new Set([id,...(d?.reads||[]),...(d?.writes||[])]);diagram.querySelectorAll('[data-id]').forEach(n=>{n.classList.toggle('selected',n.dataset.id===id);n.classList.toggle('dim',!!id&&!relevant.has(n.dataset.id))});diagram.querySelectorAll('.edge').forEach(n=>{const active=n.dataset.connect.split('|').some(v=>relevant.has(v));n.classList.toggle('focused',!!id&&active);n.classList.toggle('dim',!!id&&!active)});id?showDetail(id):guide()}
function switchView(id){view=DATA.views.find(v=>v.id===id);if(!view)return;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));diagram.innerHTML=view.svg;document.getElementById('caption').textContent=view.summary;document.getElementById('search').value='';selected=null;guide();requestAnimationFrame(fit)}
function zoom(factor,x=canvas.clientWidth/2,y=canvas.clientHeight/2){const old=scale;scale=Math.min(2.4,Math.max(.2,scale*factor));panX=x-(x-panX)*scale/old;panY=y-(y-panY)*scale/old;transform()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('fit').onclick=fit;document.getElementById('zoom-in').onclick=()=>zoom(1.2);document.getElementById('zoom-out').onclick=()=>zoom(1/1.2);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  // 自定义平移接管左键手势，阻止浏览器同时开始文字选择或原生拖动。
  e.preventDefault();
  drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){panX=drag.px+dx;panY=drag.py+dy;canvas.classList.add('dragging');transform()}});
canvas.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved){
    const n=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');
    // pointerdown 取消了默认聚焦；点击节点时补回焦点，保留 Enter / 空格操作。
    n?.focus({preventScroll:true});select(n?n.dataset.id:null);
  }
  drag=null;canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging')});
diagram.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-id]');if(n){e.preventDefault();select(n.dataset.id)}}});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();selected=null;const hits=[];diagram.querySelectorAll('[data-id]').forEach(n=>{const d=DATA.registry[n.dataset.id],hit=!q||JSON.stringify(d).toLowerCase().includes(q);n.classList.toggle('dim',!hit);n.classList.toggle('selected',!!q&&hit);if(hit)hits.push(n.dataset.id)});diagram.querySelectorAll('.edge').forEach(n=>n.classList.remove('dim','focused'));if(q){details.innerHTML='<span class="badge">搜索结果</span><h2>'+hits.length+' 个匹配节点</h2><p>当前视图中匹配的卡片已高亮。点击卡片查看详情。</p><p class="footnote">搜索仅覆盖当前视图；可切换其他视图继续查找。</p>'}else guide()});
document.getElementById('export').onclick=()=>{const blob=new Blob([view.svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ecs-'+view.id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.addEventListener('resize',fit);switchView('overview');
</script></body></html>
