</style></head><body><header><div class="eyebrow">DEMO / ECS ARCHITECTURE · V1</div><h1>从输入到画面，当前 App 如何运作</h1><p class="sub">UML 风格的实体、组件、系统与关系 · 基于生成时的源码快照 · 不执行游戏</p></header><div class="toolbar"><nav class="tabs" aria-label="架构视图"><button data-view="overview" class="active">总览</button><button data-view="schedules">调度与读写</button><button data-view="relationships">实体关系</button><button data-view="events">事件与 Observer</button></nav><div class="tools"><input id="search" placeholder="搜索系统、组件或字段" aria-label="搜索架构节点"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适合窗口</button><button id="export">导出 SVG</button></div></div><main class="workspace"><section class="canvas-wrap"><div id="caption" class="caption"></div><div id="canvas" class="canvas"><div id="diagram" class="diagram"></div><div class="canvas-hint">滚轮缩放 · 拖动平移 · 点击卡片查看数据与源码</div></div></section><aside id="details" class="side" aria-live="polite"></aside></main><script id="architecture-data" type="application/json">{"model":{"title":"当前原型的 ECS 架构","snapshot_note":"源码结构快照：英文菜单／暂停、真实海岛资源装配、五件动态可搬物、主角动画、落水恢复、CCD、Kira 音效与后台会话日志；不表示已完成游戏运行或游戏视觉验收。","systems":[{"id":"startup_spawn","name":"spawn_lighting","kind":"system","phase":"OnEnter(AppState::InGame)；无状态测试使用 Startup","module":"scene","description":"进入游戏会话时以 BSN 创建日光与加载相机；资源与海岛静态碰撞准备成功后由 Update 链复用相机并生成动态业务实体。","reads":[],"writes":["camera.Camera3d","camera.LoadingCamera","camera.Transform","camera.DespawnOnExit","camera.IsDefaultUiCamera","camera.PrimaryEguiContext"],"filters":[],"events":[],"notes":["日光与加载相机标记 DespawnOnExit(InGame)；退出会话清理，暂停不重建。","准备完成后复用加载相机，不创建第二台玩法相机。","最小无窗口测试未安装 State\u003cAppState> 时沿用 Startup 入口。"],"source":{"path":"src/scene.rs","line":94}},{"id":"startup_config","name":"log_configuration","kind":"system","phase":"Startup","module":"startup_log","description":"记录实际玩法配置、Avian 版本、动态刚体、弹簧持握和保留速度的释放方式。","reads":["resource.PrototypeConfig"],"writes":[],"filters":[],"events":[],"notes":["与其他项目 Startup 系统没有显式先后依赖；日志是外部输出。","由 StartupLogPlugin 注册；保留日志 target demo::gameplay。"],"source":{"path":"src/startup_log.rs","line":26}},{"id":"startup_timestep","name":"log_simulation_timestep","kind":"system","phase":"Startup","module":"startup_log","description":"记录固定模拟频率。","reads":["resource.TimeFixed"],"writes":[],"filters":[],"events":[],"notes":["只读固定时间步，不修改模拟时钟。","由 StartupLogPlugin 注册；保留日志 target demo::settings。"],"source":{"path":"src/startup_log.rs","line":36}},{"id":"startup_pose","name":"log_pose_synchronization","kind":"system","phase":"Startup","module":"startup_log","description":"记录准备力、物理解算和插值后显示同步的各个调度阶段及顺序。","reads":[],"writes":[],"filters":[],"events":[],"notes":["FixedUpdate 准备运动/持握力；FixedPostUpdate 求解；RunFixedMainLoop 插值 → 朝向 → 目标 → 镜头 → 可见性。","仅记录装配约定，不执行同步或规定其他 Startup 系统先后；保留 demo::camera target。"],"source":{"path":"src/startup_log.rs","line":45}},{"id":"frame_limit","name":"limit_frame_rate","kind":"system","phase":"First","module":"settings","description":"补足上一帧起点以来剩余间隔并更新局部计时。","reads":["resource.GameSettings","local.FramePacing"],"writes":["local.FramePacing"],"filters":[],"events":[],"notes":["显式 .before(TimeSystems)。","默认上限 60；等待超过目标间隔时不会继续补等；不修改 Time\u003cFixed>。"],"source":{"path":"src/settings.rs","line":281}},{"id":"time_update","name":"TimeSystems / time_system","kind":"engine","phase":"First","module":"bevy_time","description":"引擎更新真实、虚拟与当前阶段通用时钟。","reads":["resource.TimeFixed","resource.TimeReal","resource.TimeVirtual"],"writes":["resource.TimeReal","resource.TimeVirtual","resource.Time"],"filters":[],"events":[],"notes":["limit_frame_rate 在此之前等待。","RunFixedMainLoop 根据累计时间执行 0..N 个固定步；固定循环还会更新 Time\u003cFixed> 并切换通用 Time，此处没有把循环折叠成一次时间更新。"],"source":null},{"id":"input_update","name":"InputSystems","kind":"engine","phase":"PreUpdate","module":"bevy_input","description":"引擎从缓冲消息更新键盘、鼠标按钮和本帧鼠标位移。","reads":["resource.KeyboardInputMessages","resource.KeyboardFocusLostMessages","resource.MouseButtonInputMessages","resource.MouseMotionMessages"],"writes":["resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion"],"filters":[],"events":["读取缓冲 Message：KeyboardInput、KeyboardFocusLost、MouseButtonInput、MouseMotion"],"notes":["展示相关输入系统集合，集合内部不是本图指定的串行顺序。","每种 MessageReader 有独立读取游标；消息读取不会使另一读者失去消息。"],"source":null},{"id":"mouse_capture","name":"sync_mouse_capture","kind":"system","phase":"PreUpdate","module":"camera","description":"按窗口焦点、当前游戏状态、控制关联与检查器占用统一更新捕获和 GameplayContext；主菜单与暂停始终释放光标。","reads":["resource.ButtonInputKeyCode","resource.MouseButtonInputMessages","resource.WindowFocusedMessages","window.Window","controller.ControlsCharacter","controller.ControlsCamera","camera.OrbitCamera","camera.MouseLookState","camera.EguiContext","controller.ContextActivity","resource.AppState","resource.PlayState"],"writes":["window.CursorOptions","camera.MouseLookState","camera.EguiContext","controller.ContextActivity"],"filters":["窗口：With\u003cPrimaryWindow>，要求唯一","控制者：With\u003cGameplayContext>","角色：Query\u003c(), With\u003cCharacter>>，只验证实体存在","相机：具有 OrbitCamera 与 MouseLookState","UI：With\u003cPrimaryEguiContext>，只在查询唯一上下文成功时读取"],"events":["读取缓冲 Message：MouseButtonInput、WindowFocused"],"notes":["显式 .after(InputSystems).after(EguiPreUpdateSet::BeginPass).before(EnhancedInputSystems::Prepare)。","CursorOptions 与 MouseLookState 在系统中直接更新；ContextActivity 是不可变组件，替换通过 Commands 延迟执行，必须在 Prepare 前应用。","EguiContext 以 &mut 查询，writes 表示调度层面的可变访问权限；此系统只查询 UI 状态，不构建面板或修改检查器字段。","点击当前 UI 面板、拖拽仍占用指针或弹窗打开时，不把左键视为恢复游戏捕获；当前 Window 光标命中已缓存的 UI 层。","UI 要求键盘、弹窗、指针拖拽或自由鼠标悬于面板时停用整个 GameplayContext；失焦或关联失效也停用。Esc 的暂停业务由菜单 Enhanced Input 执行；底层 Esc 只处理光标生命周期。","停用动作上下文不清空 ButtonInput；动作完成或取消清除持续移动轴，重新启用继续遵循按钮动作的 require_reset。","默认主上下文是 multipass，BeginPass 系统过滤掉它；此依赖是集合边界，不表示主检查器已经完成本帧 UI。实际 EguiPrimaryContextPass 由 PostUpdate 循环调用。"],"source":{"path":"src/camera.rs","line":288}},{"id":"enhanced_prepare","name":"EnhancedInputSystems::Prepare","kind":"engine","phase":"PreUpdate","module":"bevy_enhanced_input","description":"清理待重置输入，准备动作评估的输入忽略状态。","reads":["resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion","resource.ActionSources","resource.ConsumedInputs","resource.PendingBindings"],"writes":["resource.PendingBindings"],"filters":[],"events":[],"notes":["由 EnhancedInputPlugin 的 update_pending 完成。","Prepare 在 InputSystems、Egui BeginPass 集合与 sync_mouse_capture 的上下文命令应用之后；接着进入框架 Update。","图中列出当前输入相关资源，未展开框架所有设备与局部缓存。"],"source":null},{"id":"enhanced_evaluate","name":"EnhancedInputSystems::Update","kind":"engine","phase":"PreUpdate","module":"bevy_enhanced_input","description":"评估上下文、绑定、修饰器与 Press，更新动作值、触发状态及计时。","reads":["resource.Time","resource.TimeReal","resource.ContextInstances","resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion","resource.ActionSources","resource.ConsumedInputs","resource.PendingBindings","controller.Actions","controller.ContextActivity","controller.GamepadDevice","action.Name","action.ActionSettings","action.Bindings","action.ActionMock","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime","action.ConditionFns","action.Press","binding.Binding","binding.FirstActivation","binding.ModifierFns","binding.Negate","binding.SwizzleAxis"],"writes":["resource.ConsumedInputs","controller.Actions","action.ActionMock","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime","action.Press","binding.FirstActivation"],"filters":["按 ContextInstances\u003cPreUpdate> 索引访问上下文","动作：Without\u003cExternallyMocked>","绑定：Without\u003cActionSettings>","当前 JumpAction、InteractAction、TogglePerspectiveAction 带 Press"],"events":[],"notes":["框架可按修饰键数量调整 Actions 内评估顺序；这种排序不是业务维护关系成员。","消费输入只更新框架消费索引；不写 ButtonInput。","MoveAction 的四条 WASD 绑定合成为 Vec2，LookAction 使用本帧像素位移。"],"source":null},{"id":"input_apply","name":"EnhancedInputSystems::Apply","kind":"engine","phase":"PreUpdate","module":"bevy_enhanced_input","description":"把类型擦除动作值写入 Action\u003cA>，通过 Commands::trigger 排入动作事件。","reads":["resource.ContextInstances","controller.Actions","action.ActionFns","action.ActionValue","action.TriggerState","action.ActionEvents","action.ActionTime"],"writes":["action.Action"],"filters":["上下文：Without\u003cActionFns>","动作：With\u003cActionFns>"],"events":["排入 EntityEvent：Fire\u003cMoveAction>、Complete\u003cMoveAction>、Cancel\u003cMoveAction>、Fire\u003cJumpAction>、Fire\u003cInteractAction>、Fire\u003cLookAction>","排入 EntityEvent：Fire\u003cTogglePerspectiveAction>"],"notes":["Update → Apply 为框架显式链。","此 Apply 是动作写回阶段，不是 ApplyDeferred。","Commands::trigger 在命令应用时才触发 Observer；默认 PreUpdate 结束前已应用，固定循环读取最新意图。","框架还可产生 Start、Ongoing 等动作事件；本项目未注册相应业务 Observer。","apply_perspective_toggle.after(EnhancedInputSystems::Apply) 使框架事件命令在切换系统前应用，切换请求与本帧观察已经完成；不是假定 Observer 注册顺序。"],"source":null},{"id":"observe_move","name":"record_movement","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"input","description":"按控制者路由移动动作值并保存持续移动轴。","reads":["controller.ControlsCharacter","character.CharacterIntent"],"writes":["character.CharacterIntent"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","角色：With\u003cCharacter>，按 ControlsCharacter 查询"],"events":["响应 EntityEvent：Fire\u003cMoveAction>"],"notes":["修改 movement；不积分运动。","不是与其他 Observer 的串行链。"],"source":{"path":"src/input.rs","line":151}},{"id":"observe_complete","name":"clear_completed_movement","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"input","description":"移动动作正常结束时清零角色移动轴。","reads":["controller.ControlsCharacter","character.CharacterIntent"],"writes":["character.CharacterIntent"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","角色：With\u003cCharacter>，按 ControlsCharacter 查询"],"events":["响应 EntityEvent：Complete\u003cMoveAction>"],"notes":["只清零 movement；不消费跳跃或交互请求。"],"source":{"path":"src/input.rs","line":170}},{"id":"observe_cancel","name":"clear_cancelled_movement","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"input","description":"移动动作取消时清零角色移动轴。","reads":["controller.ControlsCharacter","character.CharacterIntent"],"writes":["character.CharacterIntent"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","角色：With\u003cCharacter>，按 ControlsCharacter 查询"],"events":["响应 EntityEvent：Cancel\u003cMoveAction>"],"notes":["只清零 movement；不消费跳跃或交互请求。"],"source":{"path":"src/input.rs","line":189}},{"id":"observe_jump","name":"request_jump","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"input","description":"设置目标角色 jump_pending=true。","reads":["controller.ControlsCharacter"],"writes":["character.CharacterIntent"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","角色：With\u003cCharacter>，按 ControlsCharacter 查询"],"events":["响应 EntityEvent：Fire\u003cJumpAction>"],"notes":["请求跨零固定步帧保留；多次未消费请求合并为一个布尔状态。"],"source":{"path":"src/input.rs","line":209}},{"id":"observe_interact","name":"request_interaction","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"input","description":"设置目标角色 interact_pending=true。","reads":["controller.ControlsCharacter"],"writes":["character.CharacterIntent"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","角色：With\u003cCharacter>，按 ControlsCharacter 查询"],"events":["响应 EntityEvent：Fire\u003cInteractAction>"],"notes":["请求留待固定步消费，不在输入事件内拿放物体。"],"source":{"path":"src/input.rs","line":223}},{"id":"observe_look","name":"on_camera_look","kind":"observer","phase":"命令应用时（通常在 PreUpdate）","module":"camera","description":"按控制者关联更新共享 yaw 和当前视角的俯仰；只有有效捕获且非跳过帧才处理。","reads":["resource.GameSettings","resource.Time","local.LookLog","controller.ControlsCamera","camera.OrbitCamera","camera.MouseLookState"],"writes":["camera.OrbitCamera","local.LookLog"],"filters":["控制者：With\u003cGameplayContext>，按 event.context 查询","相机：具有 OrbitCamera 与 MouseLookState，按 ControlsCamera 查询"],"events":["响应 EntityEvent：Fire\u003cLookAction>"],"notes":["鼠标像素位移乘 mouse_sensitivity，不乘帧时间或固定时间步。","第三人称俯仰限定 5°..80°，第一人称限定 -85°..85°；Time 仅用于日志采样。"],"source":{"path":"src/camera.rs","line":453}},{"id":"facing_fixed","name":"sync_character_facing","kind":"system","phase":"FixedUpdate（0..N 步）","module":"camera","description":"固定模拟前把相机水平环绕角同步为角色旋转。","reads":["controller.ControlsCharacter","controller.ControlsCamera","camera.OrbitCamera","character.Transform","resource.AppState","resource.PlayState"],"writes":["character.Transform"],"filters":["控制者：With\u003cGameplayContext>","角色：With\u003cCharacter>","要求 OrbitCamera.target == ControlsCharacter.0","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["显式 before(GameplaySystems::Simulate)，与 sync_gravity 之间没有显式顺序。","只同步水平 rotation，随后移动施力和持握使用最新朝向；呈现链复用相同函数。","落水恢复显式在本系统之前；恢复出生姿态后按当前视角重设朝向。"],"source":{"path":"src/camera.rs","line":538}},{"id":"movement","name":"move_characters","kind":"system","phase":"FixedUpdate（0..N 步）","module":"gameplay","description":"由输入和实际速度计算有上限的水平加速度，通过 Forces 施力；不手动积分位置。","reads":["resource.TimeFixed","resource.PrototypeConfig","character.Transform","character.CharacterIntent","character.CharacterMotion","character.Position","character.Rotation","character.LinearVelocity","character.AngularVelocity","character.ComputedMass","character.ComputedAngularInertia","character.ComputedCenterOfMass","character.LockedAxes","character.VelocityIntegrationData","character.AccumulatedLocalAcceleration","character.SleepTimer","resource.AppState","resource.PlayState"],"writes":["character.LinearVelocity","character.AngularVelocity","character.VelocityIntegrationData","character.AccumulatedLocalAcceleration","character.SleepTimer"],"filters":["With\u003cCharacter>","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["grounded_fixed → movement → gravity 为显式玩法链。","接地松键主动制动，空中松键保留惯性，输入轴限制长度。","Forces 是可变 QueryData，不是组件；访问速度、质量、位姿及引擎力累计/唤醒数据。图列出访问权限，具体施力只写本步累计量，冲量立即改变速度；引擎内部非业务字段仅作摘要。"],"source":{"path":"src/gameplay.rs","l  event.context 查询","角色：Query\u003c(), With\u003cCharacter>>，只验证存在","相机：具有 OrbitCamera 与 MouseLookState，目标须等于 ControlsCharacter"],"events":["响应 EntityEvent：Fire\u003cTogglePerspectiveAction>"],"notes":["写 toggle_requested_by，不直接改变 perspective；不依赖其他 Observer 注册顺序。","focused=true 是 Observer 接受条件；实际设备输入还须 GameplayContext 启用。F3 释放后仍可切换视角，主菜单、暂停与检查器占用停用玩法上下文。"],"source":{"path":"src/camera.rs","line":492}},{"id":"perspective_apply","name":"apply_perspective_toggle","kind":"system","phase":"PreUpdate","module":"camera","description":"在所有动作写回和事件命令应用后，取出请求并切换同一相机的视角模式。","reads":["camera.OrbitCamera","resource.AppState","resource.PlayState"],"writes":["camera.OrbitCamera"],"filters":["具有 OrbitCamera","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["显式 .after(EnhancedInputSystems::Apply)，其依赖会应用框架延迟触发命令。","同一 PreUpdate 消费一次请求；不依赖固定步，本帧观察先完成而切换随后发生。","保留共享 yaw 与两种模式各自俯仰；不修改捕获、位置积分或角色意图。"],"source":{"path":"src/camera.rs","line":519}},{"id":"visibility_update","name":"sync_character_visibility","kind":"system","phase":"RunFixedMainLoop · AfterFixedMainLoop（每帧一次）","module":"camera","description":"依据有效相机的模式隐藏对应角色视觉，切回或失去关联时恢复；木箱保持可见。","reads":["controller.ControlsCharacter","controller.ControlsCamera","camera.OrbitCamera","visual.ChildOf","visual.Visibility","resource.AppState","resource.PlayState"],"writes":["visual.Visibility"],"filters":["视觉：With\u003cCharacterVisual>","控制者：With\u003cGameplayContext>","按 ChildOf 查所属角色并确认 OrbitCamera.target 匹配","角色：Query\u003c(), With\u003cCharacter>>，检查所属业务角色存在","run_if(gameplay_running)：AppState::InGame 且 PlayState::Running；独立无状态测试兼容运行。"],"events":[],"notes":["插值后的显示链最后执行；不隐藏木箱或角色业务根。","相机或控制关联失效时恢复人物视觉；随后记录插值变化 tick，并在 PostUpdate 传播可见性。"],"source":{"path":"src/camera.rs","line":573}},{"id":"startup_inspector","name":"log_world_inspector","kind":"system","phase":"Startup","module":"startup_log","description":"记录世界检查器已启用的初始化日志。","reads":[],"writes":[],"filters":[],"events":[],"notes":["仅记录日志，不执行检查器界面；与其他项目 Startup 日志没有显式顺序。","由 StartupLogPlugin 注册；保留日志 target demo::inspector。"],"source":{"path":"src/startup_log.rs","line":54}},{"id":"egui_input","name":"EguiPreUpdateSet::ProcessInput","kind":"engine","phase":"PreUpdate","module":"bevy_egui","description":"引擎把窗口与设备输入映射为 UI 的 EguiInput，随后抵达 BeginPass 集合边界。","reads":["resource.EguiGlobalSettings","resource.KeyboardInputMessages","resource.MouseButtonInputMessages","window.Window","camera.EguiContextSettings","resource.TimeReal"],"writes":["camera.EguiInput"],"filters":[],"events":["读取相关窗口/设备缓冲 Message"],"notes":["输入处理集合显式 .after(InputSystems)，并与 InitContexts、BeginPass 使用 .chain()。","这是当前窗口输入路线的概览，未展开全部 Message 类型、上下文映射、指针、IME 和剪贴板系统。","默认 enable_absorb_bevy_input_system=false；不能画成清空 ButtonInput 的操作。"],"source":null},{"id":"egui_begin","name":"EguiPreUpdateSet::BeginPass","kind":"engine","phase":"PreUpdate","module":"bevy_egui","description":"Egui 输入准备后的集合边界；项目捕获系统显式等待此集合完成。","reads":[],"writes":[],"filters":["begin_pass_system 仅作用于 Without\u003cEguiMultipassSchedule> 的上下文"],"events":[],"notes":["默认 EguiPlugin 启用主上下文 multipass，当前主相机具有 EguiMultipassSchedule，所以这里不对主 UI 执行 begin_pass。","主检查器的本帧 UI 在 PostUpdate 的上下文循环内部计算；此节点表示排序边界，不能标为主 UI 本帧已处理完成。","单轮上下文的 begin_pass_system 会读 EguiContextSettings、取出 EguiInput 并可变访问 EguiContext；这些是过滤条件下的引擎行为，此图不把它们算作当前主相机访问。","filter_captured_egui_input.before(BeginPass) 与 sync_mouse_capture.after(BeginPass) 在该集合两侧明确排序；即使当前主上下文采用 multipass，这仍是相关系统的排序边界。"],"source":null},{"id":"capture_apply","name":"ApplyDeferred（捕获 → 动作准备）","kind":"sync","phase":"PreUpdate","module":"bevy_ecs","description":"应用 sync_mouse_capture 排入的 ContextActivity 替换，让动作框架看到本帧输入启停。","reads":[],"writes":["controller.ContextActivity"],"filters":[],"events":[],"notes":["由 sync_mouse_capture.before(EnhancedInputSystems::Prepare) 的延迟命令依赖自动插入。","窗口、光标和 MouseLookState 的直接修改无需等到此处；这里只突出上下文结构替换的可见性。","之后框架评估会根据停用状态产生动作完成或取消，不是在这里由项目手工清零移动意图。"],"source":{"path":"src/camera.rs","line":164}},{"id":"inspector_pass","name" dOf（原地图美术实例）","kind":"relationship","reverse":"Children","cardinality":"每个静态碰撞对应一个美术实例；实例可有三角碰撞和坡道","linked_spawn":true,"description":"碰撞与视觉分离，沿地图原始层级清理。","source":{"path":"src/scene.rs","line":133}},{"id":"npc_map_tree","from":"npc","to":"island","name":"ChildOf（地图子树）","kind":"relationship","reverse":"Children","cardinality":"四名 NPC 保持地图子树；不宣称直属地图根","linked_spawn":true,"description":"导入后的原始节点层级。","source":{"path":"src/scene.rs","line":133}},{"id":"animation_character","from":"animation_player","to":"character","name":"CourierAnimation.character","kind":"reference","reverse":null,"cardinality":"主角播放器引用一个业务 Character","linked_spawn":null,"description":"普通引用；角色消失时停止并解绑，播放器自身通常随视觉子树销毁。","source":{"path":"src/character_animation.rs","line":43}},{"id":"menu_camera_child","from":"menu_camera","to":"menu_backdrop","name":"ChildOf","kind":"relationship","reverse":"menu_backdrop.Children","cardinality":"每个展示相机属于一个舞台根","linked_spawn":true,"description":"BSN 直接子节点；退出 MainMenu 清理舞台时相机与主上下文一同销毁。","source":{"path":"src/ui/backdrop.rs","line":55}},{"id":"menu_models_child","from":"menu_model","to":"menu_backdrop","name":"ChildOf 层级","kind":"relationship","reverse":"menu_backdrop.Children","cardinality":"11个模型根及其间接 GLB/包裹子树归属一个展示舞台","linked_spawn":true,"description":"图按视觉类别汇总多层真实 ChildOf；携带包裹直接属于快递员，GLB 子树逐层挂接，不能解释为所有节点直接指向舞台。","source":{"path":"src/ui/backdrop.rs","line":36}},{"id":"menu_page_hierarchy","from":"menu_button","to":"menu_root","name":"ChildOf 层级","kind":"relationship","reverse":"menu_root.Children","cardinality":"每个可操作按钮通过页面内容与布局层归属唯一当前页面","linked_spawn":true,"description":"聚合多层 BSN 子树，不宣称按钮直接 ChildOf 页面根；重建或 Hidden 时沿层级清理。","source":{"path":"src/ui/screens.rs","line":29}},{"id":"menu_scroll_hierarchy","from":"menu_scroll","to":"menu_root","name":"ChildOf","kind":"relationship","reverse":"menu_root.Children","cardinality":"当前页面内容视口直接属于 MenuRoot","linked_spawn":true,"description":"page_area 的 MenuScroll 是根内容子节点，固定页脚为并列兄弟节点。","source":{"path":"src/ui/screens.rs","line":80}},{"id":"menu_text_hierarchy","from":"menu_text","to":"menu_root","name":"ChildOf 层级","kind":"relationship","reverse":"menu_root.Children","cardinality":"每个文字叶节点经控件/布局层属于当前页面","linked_spawn":true,"description":"聚合多层 BSN 子树；文字可以直接属于按钮、按键框、编号块或正文容器，根清理时沿层级销毁。","source":{"path":"src/ui/widgets.rs","line":28}}],"observers":[{"event":"Fire\u003cMoveAction>","system":"observe_move","target":"事件的 context（controller）","description":"从 GameplayContext 控制者路由到 ControlsCharacter，写入持续移动轴。"},{"event":"Complete\u003cMoveAction>","system":"observe_complete","target":"事件的 context（controller）","description":"移动动作正常结束时清零该角色的移动轴。"},{"event":"Cancel\u003cMoveAction>","system":"observe_cancel","target":"事件的 context（controller）","description":"移动动作取消时清零该角色的移动轴。"},{"event":"Fire\u003cJumpAction>","system":"observe_jump","target":"事件的 context（controller）","description":"设置 jump_pending，留待固定模拟消费。"},{"event":"Fire\u003cInteractAction>","system":"observe_interact","target":"事件的 context（controller）","description":"设置 interact_pending，留待固定交互消费。"},{"event":"Fire\u003cLookAction>","system":"observe_look","target":"事件的 context（controller）","description":"从 ControlsCamera 路由到相机；捕获有效且非跳过帧时直接更新环绕角。"},{"event":"Fire\u003cTogglePerspectiveAction>","system":"observe_perspective","target":"事件的 context（controller）","description":"确认窗口聚焦与控制关联有效后暂存切换请求；实际切换在动作命令应用后的 PreUpdate 系统执行。"},{"event":"WorldInstanceReady","system":"island_ready_observer","target":"IslandMap 根","description":"标记未准备地图，随后 Update 读取 CPU 几何。"},{"event":"WorldInstanceReady","system":"courier_ready_observer","target":"CourierVisual 根","description":"标记主角视觉，随后 Update 绑定命名动作。"},{"event":"Fire\u003cReleasePointerAction>","system":"observe_release_pointer","target":"事件 context 的 GameplayContext 控制者","description":"F3 按下经控制者路由释放光标并跳过运动，为检查器交互做准备；保持游戏运行。"},{"event":"Fire\u003cPreviousAction>","system":"observe_menu_previous","target":"MenuContext 动作事件","description":"向上循环选择可操作按钮。"},{"event":"Fire\u003cNextAction>","system":"observe_menu_next","target":"MenuContext 动作事件","description":"向下循环选择可操作按钮。"},{"event":"Fire\u003cLeftAction>","system":"observe_menu_left","target":"MenuContext 动作事件","description":"向左调整当前聚焦的真实设置字段。"},{"event":"Fire\u003cRightAction>","system":"observe_menu_right","target":"MenuContext 动作事件","description":"向右调整当前聚焦的真实设置字段。"},{"event":"Fire\u003cConfirmAction>","system":"observe_menu_confirm","target":"MenuContext 动作事件","description":"确认当前聚焦按钮的 UiAction。"},{"event":"Fire\u003cBackAction>","system":"observe_menu_back","target":"MenuContext 动作事件","description":"产生 Back 请求；Hidden 时为暂停、Pause 时为恢复，子页面按返回来源返回。"},{"event":"Pointer\u003cScroll>","system":"observe_menu_scroll","target":"事件 entity 的 MenuScroll 视口","description":"原生 UI 滚轮事件在当前 MenuScroll 视口更新夹紧滚动位置并停止继续冒泡。"},{"event":"WorldInstanceReady","system":"observe_courier_ready","target":"展示快递员 WorldAssetRoot","description":"展示快递员 GLB 展开后查找骨架 AnimationPlayer，循环播放 Carry_Idle 并插入动画图句柄。"}],"startup_notes":["main 创建 App 与独立会话日志；DefaultPlugins 禁用 Bevy 默认 AudioPlugin，由 Kira 提供音频设备输出。","EguiPlugin 先于 WorldInspectorPlugin；检查器只在 InGame / Running 显示。功能插件装配顺序不等于系统全序。","AppFlowPlugin 默认进入 MainMenu；当前 State\u003cPlayState> 只在 InGame 存在，NextState\u003cPlayState> 从插件注册起跨会话保留。Startup 创建持久 MenuContext 控制者、预加载短音、记录四项启动日志与美术请求。","ArtAssetsPlugin 保持五份运行 GLB 强句柄，Update 轮询 Loading / Ready / Failed；地图 CPU 网格保留以生成静态碰撞。","OnEnter(InGame) 创建日光和加载相机。Running 的 Update 海岛链 begin_island → prepare_island → spawn_actors 在各依赖处应用延迟命令。","海岛资源与全部静态碰撞就绪后生成一名主角、一名控制者、普通纸箱与易碎纸箱各一件及三只木箱，并复用加载相机。NPC 沿原地图层级保留。","Pause 清空玩法意图、停用上下文、释放光标并冻结虚拟与物理时间，保留全部会话实体；返回 MainMenu 用 DespawnOnExit(InGame) / ChildOf 清理。","菜单相机与独立 GLB 展示舞台属于 MainMenu；退出主菜单后销毁，由玩法相机接管 UI 与 Egui 上下文。","主角 WorldInstanceReady 添加 pending；Update initialize_ready_couriers → sync_courier_animation 读取真实速度与持有关系，仅在 Running 绑定和切换命名动画。","GameplayPlugin 内部安装 DemoPhysicsPlugin、Avian PhysicsPlugins 和无设备 SoundEventsPlugin；GameAudioPlugin 安装 Kira 0.26.0。","BSN 与 Bundle 辅助数据、MapAsset / ItemPlacement、动画节点和 QueryData 不作为独立玩法 ECS 组件列出。","统一 tracing 的文件与控制台各有后台线程和无界队列，属于外部 I/O；SessionLogGuard 由 main 持有，退出 Flush，Drop 排空并 join，panic 文件屏障 sync_data。"],"general_notes":["systems 的固定 ID 用于布局。kind=engine 是引擎或输入框架阶段的概览，kind=sync 是延迟命令应用点，kind=observer 是触发式响应，其余为项目系统。","业务系统列出访问声明和实际用途；可变访问中读取的数据也列入 reads。EguiContext 的可变接口用于查询 UI，其 writes 表示调度访问权限，不意味着项目修改 UI 内容。With/Without 是筛选而非数据读取；Commands 结构变更在同步点才可见。","引擎概览的 reads/writes 只列与当前原型有关的数据，未展开全部内部组件、资源、条件函数表、消息游标与局部缓存。部分组件通过 required components 自动出现，部分关系反向索引只在关联存在时出现；组件列表不表示所有组件始终同时存在。","source.path 使用仓库相对路径。项目类型引用声明行，引擎或插件类型引用项目内的使用、生成或注册行；kind=engine 概览 source=null。父图应把这些位置标为源码入口，不能宣称是引擎类型定义。","RunFixedMainLoop 每个渲染帧执行 0..N 次固定阶段；固定步不是渲染帧的一对一后续步骤。当前 fixed 为 60 Hz，默认渲染上限 60 FPS，自定义上限可高于 60，性能不足也可能低于上限。","EnhancedInputSystems::Apply 写入动作输出并调用 Commands::trigger；这个 Apply 阶段不是 ECS 的 ApplyDeferred。排入的动作事件在下一命令同步点触发，默认 PreUpdate 完成时已经应用，随后固定循环可读到最新意图。","MouseButtonInput、WindowFocused 等是缓冲 Message，拥有独立读取游标，默认缓冲不是永久队列。Enhanced Input 的 Fire、Complete、Cancel 是触发式 EntityEvent；两类通信必须使用不同图例。","跳跃与交互用布尔请求跨零固定步帧保留，固定步用 mem::take 消费一次；多次到达而尚未消费的同类请求会合并。移动轴保持到 Complete 或 Cancel；镜头角度直接按本帧像素位移更新，不积分角色位置。","同一 Schedule 的 .before/.after/.chain 才表达先后；数据访问冲突、元组顺序、插件注册顺序及 .in_set 本身都不定义完整执行顺序，跨 Schedule 的先后来自主调度顺序。","普通 Entity 引用不提供 Bevy 关系生命周期；#[entities] 只参与实体映射。ActionOf、BindingOf、ChildOf 与 HeldBy 是关系，反向索引的成员由 Bevy 自动维护；只有前三者启用 linked_spawn。","该文件记录源码结构，未启动游戏，未执行窗口或视觉验收。","视角切换不是 Observer 内立即切换：request_perspective_toggle 只记录请求，apply_perspective_toggle 在 EnhancedInputSystems::Apply 之后同帧消费，避免 I 与鼠标同帧时依赖动作遍历或 Observer 顺序。","世界检查器由 EguiPlugin 与 WorldInspectorPlugin 提供，数据留在 ECS 内，通过反射动态读取和可选编辑。Egui 输入映射、BeginPass 集合与嵌套 EguiPrimaryContextPass 以概览节点表示；未展开全部输入、提取和绘制系统。","PreUpdate 的已核对相关路线为 InputSystems → Egui ProcessInput → filter_captured_egui_input → Egui BeginPass 集合 → sync_mouse_capture → 自动 ApplyDeferred → EnhancedInput Prepare → Update → Apply → 事件命令应用 → apply_perspective_toggle。只描述相关显式依赖，未展开全部引擎系统。","EguiPlugin::default() 默认 multipass=true；主上下文的 EguiPrimaryContextPass 在 PostUpdate 的上下文循环内部运行，可一帧多轮。PreUpdate BeginPass 排序边界不等于主检查器 UI 在该时刻开始或完成。","EguiInput 内部的 egui::Event 只是 UI RawInput 的事件枚举，不等同于 Bevy ECS Event、EntityEvent 或缓冲 Message。捕获期间的 UI 过滤与 UI 占用时的 GameplayContext 停用构成两个方向的输入边界。","Avian 0.7 默认在 FixedPostUpdate 执行 Prepare → StepSimulation（嵌套 PhysicsSchedule 与求解子步）→ Writeback；接地与速度日志链 after(Writeback)。碰撞日志只 after(StepSimulation)，与回写链不设额外顺序。","Position/Rotation/LinearVelocity/AngularVelocity 是真实物理状态；Transform 为插值呈现。HeldTarget 仅显示检查，持握施力直接由 holder.position() 与当前水平朝向计算，不能把插值目标回输模拟。","拾取和释放只增删 HeldBy/HeldTarget 与碰撞层；不瞬移箱体，不清除线/角速度。持握以有上限的弹簧阻尼力追随，箱体始终动态，允许惯性和碰撞偏离目标并向人物施加反作用力。","同批次拾取 Local 预留防止重复占用；持有者消失或关系异常解除时清理目标并恢复自由碰撞。多角色公平裁决/退出前交接及只过滤持有者仍暂缓。","World / Character / Parcel 为碰撞分类；持握箱忽略整个 Character 层，保留 World / Parcel。支撑探测检查双方掩码、支撑法线、传感器与 HeldBy，避免墙面或手中箱体充当地面。","Forces 是 Avian QueryData，SpatialQuery 是 SystemParam；二者均不是新增实体组件。组件清单只列真实刚体数据/内部累计与插值状态，内部引擎字段不穷举。","主阶段 First → PreUpdate → RunFixedMainLoop → Update → SpawnScene → PostUpdate → Last；Update 内资源轮询、海岛链、主角动画链彼此未建立显式全序，不能按图中文字顺序串联。","固定阶段 Reset → resume_interpolation → 命令应用 → UpdateStart，然后 recover_from_water → sync_character_facing → GameplaySystems::Simulate。sync_gravity 也 before(Simulate)，与恢复/朝向无额外全序。","GameplaySystems::Simulate 内 update_grounded → move_characters → jump_characters → handle_interaction → release_orphaned_items → sync_held_objects → apply_grip_forces；拿放和恢复的延迟关系在后续依赖处可见。","落水阈值 Position.y \u003c -1.5。业务根回各自 SpawnPoint，清速度与单次请求，保留持续输入；临时暂停插值跨过零固定步帧，下一 FixedFirst 仅撤销本模块添加的暂停。","角色 NON_LINEAR CCD 速度门槛 8m/s 与 0.1rad/s，常规运动由推测接触覆盖；非零 yaw 下不能用 LINEAR 替代。纸箱与木箱保持默认零门槛非线性扫掠。","CarryGrip 是每件物品的握持偏移，模拟与显示共同读取，缺省回退 PrototypeConfig.hold_offset。持物仍动态，不瞬移，不将 HeldTarget 输入物理解算。","FixedLast 记录插值终点，AfterFixedMainLoop 的 Ease → 朝向 → HeldTarget → 镜头 → 可见性 → UpdateEasingTick 每帧执行。PostUpdate 的 AnimationSystems before(TransformSystems::Propagate)，检查器为未设全序的独立分支。","引擎资产实例化、AnimationSystems 与 GLB 层级为相关流程概览，未准确展开的全部 loader/骨骼内部系统、内部动画缓存、渲染批次、灯光组件与 GPU 流程不声称完整建模。","World::trigger 在调用期间触发 Observer；Commands::trigger 在命令应用时触发。玩法/相机的八个动作 Observer 与菜单六个动作 Observer、指针滚动及模型 Ready Observer 按事件响应，不组成注册顺序流水线。","RenderApp 包含提取、准备、排序与 GPU 渲染等步骤，也可能使用流水线；render 节点是渲染概览，不是紧接 PostUpdate 的单个普通系统。日志通过 tracing 文件输出，不是 ECS Event 或 Message。","PreUpdate 相关依赖：InputSystems 后更新 MenuContext；Egui ProcessInput → 过滤 → BeginPass → 捕获/命令应用在 Enhanced Prepare 前。动作 Apply 后消费菜单与视角请求，二者未设置彼此顺序；StateTransition 随后在固定循环前执行。","菜单与暂停强制停用 GameplayContext；检查器占用、失焦或关联失效也停用。F3 释放光标后未操作检查器仍可使用玩法键盘；Esc 的业务暂停由菜单 Enhanced Input 处理，底层读取仅负责光标生命周期。","项目固定准备链：update_grounded → move_characters → jump_characters → handle_interaction → release_orphaned_items → sync_held_objects → apply_grip_forces。sync_gravity 与 sync_character_facing 均 before(GameplaySystems::Simulate)，二者无彼此顺序。","插值边界：FixedFirst 重置起点 → 物理步 → FixedLast 记录终点 → RunFixedMainLoop / AfterFixedMainLoop 的 Ease → 朝向 → HeldTarget → 相机 → 可见性 → UpdateEasingTick。零固定步帧仍完成插值后的显示链。","菜单 Update 顺序为 UiSystems::Build → 延迟命令同步 → pointer_interaction → UiSystems::Style。Style 中样式、说明与焦点滚入没有彼此显式全序；原生 UI PostUpdate 计算布局，焦点滚入等待有效尺寸。","可操作按钮带 Button/MenuButton；Continue、Multiplayer 及未实现设置是静态 Coming Soon 节点，不带动作、不保存虚构设置、不参与键盘序号。","状态类型 AppState/PlayState 对应 State 与 NextState 资源；MenuPage/SettingsTab 是 MenuState 内部值。UiRequest 是缓冲 Message，Fire/Pointer/WorldInstanceReady 是触发事件，不混用图例。","展示 WorldAssetRoot 异步展开 GLB，字体使用预加载句柄；BSN 构造辅助函数不是 Schedule 系统。模型 Ready 与滚动回调用 on(...) 在具体实体注册 Observer。","文字叶节点保留默认自动最小宽度，避免 Bevy 0.19 在自动横排测量中把显式 min_width:0 解析为零宽；布局计算与真实字形的无窗口回归不替代用户最终视觉验收。","SoundRequest 是缓冲 Message，由真实菜单焦点、接受的菜单请求、成功拿放命令、固定步持握观察与真实支撑撞击写入；Update 在 UI Style 后播放，不从原始按键猜测业务成功。","音频观察和物理规则分开：警告只提示不改变持握；落地锁存涵盖活动与休眠支撑，暂停/主菜单不采集。Kira 输出与无设备事件测试分开；12 种 cue 中菜单三种及物理四种已接入，交接、推车、弹开与交付共五种预留。","GameAudioPlugin 的 Update 链在 UiSystems::Style 后显式运行 log_load_failures → play_requests → stop_on_exit；节流用 Time\u003cReal>，总并发 4、SFX 最多 3。与 Kira 内部系统不指定额外全序，通道排队后由插件消费。","实例就绪共有地图、玩法主角和菜单快递员三种 Observer；动态事件数量以清单为准。菜单与 Kira 的时间门控不会改变海岛资产、落水恢复、CarryGrip 或 NON_LINEAR CCD 规则。"]},"registry":{"resource.Gam l=\"none\" stroke=\"#7851a9\" stroke-opacity=\".28\"/>\u003ctext x=\"985\" y=\"2161\" class=\"stereotype\" text-anchor=\"start\">«Observer»\u003c/text>\u003ctext x=\"985\" y=\"2188\" class=\"node-title\" text-anchor=\"start\">mark_courier_animation_ready\u003c/text>\u003ctext x=\"985\" y=\"2213\" class=\"small\" text-anchor=\"start\">CourierVisual → CourierAnimationPending\u003c/text>\u003c/g>\u003cg class=\"edge trigger\" data-connect=\"world-ready-event|courier_ready_observer\" data-source-anchor=\"{&quot;box&quot;:&quot;world-ready-event&quot;,&quot;side&quot;:&quot;right&quot;,&quot;slot&quot;:2,&quot;count&quot;:2}\" data-target-anchor=\"{&quot;box&quot;:&quot;courier_ready_observer&quot;,&quot;side&quot;:&quot;left&quot;,&quot;slot&quot;:1,&quot;count&quot;:1}\">\u003cpath d=\"M868,2096.6666666666665 L920,2096.6666666666665 L920,2190 L971,2190\" stroke=\"#bf651e\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow-trigger)\"/>\u003crect x=\"878\" y=\"2148\" width=\"84\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"920\" y=\"2165\" class=\"edge-label\" text-anchor=\"middle\">匹配目标\u003c/text>\u003c/g>\u003ctext x=\"52\" y=\"2270\" class=\"small\" text-anchor=\"start\">两个 Observer 按标记筛选；无注册顺序链。地图/NPC 和主角动画保持各自生命周期。\u003c/text>\u003cg>\u003crect  x=\"30\" y=\"2350\" width=\"1460\" height=\"485\" rx=\"12\" fill=\"#fff\" stroke=\"#526477\" stroke-width=\"1.5\"/>\u003cpath d=\"M30,2407H1490\" stroke=\"#dae2e8\"/>\u003ctext x=\"50\" y=\"2380\" class=\"group-title\" text-anchor=\"start\">统一 tracing 输出 · 文件与控制台后台线程\u003c/text>\u003ctext x=\"50\" y=\"2399\" class=\"small\" text-anchor=\"start\">两路无界队列是外部 I/O，不是 ECS Component / Resource / Event / Message。\u003c/text>\u003c/g>\u003cg class=\"node external\" data-id=\"log-producer\" tabindex=\"0\" role=\"button\" aria-label=\"tracing producer\">\u003crect data-box-id=\"log-producer\" x=\"50\" y=\"2480\" width=\"374\" height=\"140\" rx=\"3\" fill=\"#fff\" stroke=\"#234f80\" stroke-width=\"1.7\" />\u003ctext x=\"64\" y=\"2501\" class=\"stereotype\" text-anchor=\"start\">«External I/O»\u003c/text>\u003ctext x=\"64\" y=\"2528\" class=\"node-title\" text-anchor=\"start\">玩法 / 引擎 tracing\u003c/text>\u003ctext x=\"64\" y=\"2553\" class=\"small\" text-anchor=\"start\">时间 / level / target / 字段\u003c/text>\u003ctext x=\"64\" y=\"2576\" class=\"small\" text-anchor=\"start\">统一 EnvFilter；不丢弃队列记录\u003c/text>\u003ctext x=\"64\" y=\"2599\" class=\"small\" text-anchor=\"start\">普通调用不等待设备 I/O\u003c/text>\u003c/g>\u003cg class=\"node external\" data-id=\"log-file-worker\" tabindex=\"0\" role=\"button\" aria-label=\"File worker\">\u003crect data-box-id=\"log-file-worker\" x=\"600\" y=\"2420\" width=\"857\" height=\"130\" rx=\"3\" fill=\"#fff\" stroke=\"#234f80\" stroke-width=\"1.7\" />\u003ctext x=\"614\" y=\"2441\" class=\"stereotype\" text-anchor=\"start\">«External I/O»\u003c/text>\u003ctext x=\"614\" y=\"2468\" class=\"node-title\" text-anchor=\"start\">文件队列 → File worker\u003c/text>\u003ctext x=\"614\" y=\"2493\" class=\"small\" text-anchor=\"start\">独立会话文件 logs/unix-&lt;时间戳&gt;_&lt;UUID&gt;.log\u003c/text>\u003ctext x=\"614\" y=\"2516\" class=\"small\" text-anchor=\"start\">write_all + flush；panic 文件 Sync barrier → sync_data\u003c/text>\u003c/g>\u003cg class=\"node external\" data-id=\"log-console-worker\" tabindex=\"0\" role=\"button\" aria-label=\"Console worker\">\u003crect data-box-id=\"log-console-worker\" x=\"600\" y=\"2600\" width=\"857\" height=\"130\" rx=\"3\" fill=\"#fff\" stroke=\"#234f80\" stroke-width=\"1.7\" />\u003ctext x=\"614\" y=\"2621\" class=\"stereotype\" text-anchor=\"start\">«External I/O»\u003c/text>\u003ctext x=\"614\" y=\"2648\" class=\"node-title\" text-anchor=\"start\">控制台队列 → Stderr worker\u003c/text>\u003ctext x=\"614\" y=\"2673\" class=\"small\" text-anchor=\"start\">与文件队列隔离；同一过滤规则\u003c/text>\u003ctext x=\"614\" y=\"2696\" class=\"small\" text-anchor=\"start\">record_exit：文件 Flush → 控制台 Flush\u003c/text>\u003c/g>\u003cg clas function fit(){scale=Math.min((canvas.clientWidth-28)/view.width,(canvas.clientHeight-28)/view.height,1);panX=(canvas.clientWidth-view.width*scale)/2;panY=(canvas.clientHeight-view.height*scale)/2;transform()}
function list(title,items){return items&&items.length?'<h3>'+safe(title)+'</h3><ul>'+items.map(x=>{const key=DATA.registry[x]?x:String(x).split(' ')[0],d=DATA.registry[key];return '<li>'+(d?'<button class="data-link" data-open="'+safe(key)+'">'+safe(d.name)+' '+safe(String(x).slice(key.length))+'</button>':'<code>'+safe(x)+'</code>')+'</li>'}).join('')+'</ul>':''}
function guide(){details.innerHTML='<span class="badge">读图指南</span><h2>'+safe(view.label)+'</h2><p>'+safe(view.summary)+'</p><div class="legend"><div><i class="line"></i>调度先后与执行依赖</div><div><i class="line read"></i>R：数据 → 系统</div><div><i class="line write"></i>W：系统 → 数据</div><div><i class="line event"></i>事件触发 Observer</div><div><i class="line ref"></i>普通 Entity 引用</div><div><i class="line rel"></i>Bevy 关系及反向索引</div></div><h3>类型框</h3><p>«Entity» 包含组件框；«System» 是调度运行的函数；«Observer» 按事件响应；«Resource» 共享，«Local» 为系统私有。</p><div class="help">固定步每帧 0～N 次。角色朝向和持物同步在固定步与逐帧更新中复用；数据访问连线不代表执行顺序。</div><h3>范围与抽象</h3><p class="footnote">业务系统与组件来自当前源码；引擎输入、时钟、变换传播和渲染以必要概览节点表示。普通引用不自动成为 Bevy 关系。</p><button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null)}
function sourceLink(source){return '<h3>源码位置</h3><a class="source" href="ecs-source.html?file='+encodeURIComponent(source.path)+'#L'+encodeURIComponent(source.line)+'" target="_blank" rel="noopener noreferrer" title="在新标签页查看源码并定位此行">'+safe(source.path)+':'+safe(source.line)+'</a>'}
function showDetail(id){const d=DATA.registry[id];if(!d){guide();return}details.innerHTML='<span class="badge">'+safe(d.kind||'数据')+(d.phase?' · '+safe(d.phase):'')+'</span><h2>'+safe(d.name||id)+'</h2><p>'+safe(d.description||'')+'</p>'+(d.owner?'<p>所属实体：'+safe(d.owner)+'</p>':'')+list('R · 读取',d.reads)+list('W · 修改',d.writes)+list('Query · 过滤',d.filters)+list('事件 / 消息',d.events)+list('字段',d.fields)+list('约束与说明',d.notes)+(d.components?list('实体组件',d.components.map(c=>c.id)):'')+(d.source?sourceLink(d.source):'')+'<button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null);details.scrollTop=0}
details.addEventListener('click',e=>{const n=e.target.closest('[data-open]');if(n)select(n.dataset.open)});
function select(id){selected=id;const d=DATA.registry[id];const relevant=new Set([id,...(d?.reads||[]),...(d?.writes||[])]);diagram.querySelectorAll('[data-id]').forEach(n=>{n.classList.toggle('selected',n.dataset.id===id);n.classList.toggle('dim',!!id&&!relevant.has(n.dataset.id))});diagram.querySelectorAll('.edge').forEach(n=>{const active=n.dataset.connect.split('|').some(v=>relevant.has(v));n.classList.toggle('focused',!!id&&active);n.classList.toggle('dim',!!id&&!active)});id?showDetail(id):guide()}
function switchView(id){view=DATA.views.find(v=>v.id===id);if(!view)return;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));diagram.innerHTML=view.svg;document.getElementById('caption').textContent=view.summary;document.getElementById('search').value='';selected=null;guide();requestAnimationFrame(fit)}
function zoom(factor,x=canvas.clientWidth/2,y=canvas.clientHeight/2){const old=scale;scale=Math.min(2.4,Math.max(.2,scale*factor));panX=x-(x-panX)*scale/old;panY=y-(y-panY)*scale/old;transform()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('fit').onclick=fit;document.getElementById('zoom-in').onclick=()=>zoom(1.2);document.getElementById('zoom-out').onclick=()=>zoom(1/1.2);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  // 自定义平移接管左键手势，阻止浏览器同时开始文字选择或原生拖动。
  e.preventDefault();
  drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){panX=drag.px+dx;panY=drag.py+dy;canvas.classList.add('dragging');transform()}});
canvas.addEventListener('pointerup',e=>{
  if(drag&&!drag.moved){
    const n=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');
    // pointerdown 取消了默认聚焦；点击节点时补回焦点，保留 Enter / 空格操作。
    n?.focus({preventScroll:true});select(n?n.dataset.id:null);
  }
  drag=null;canvas.classList.remove('dragging');
});
canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging')});
diagram.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-id]');if(n){e.preventDefault();select(n.dataset.id)}}});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();selected=null;const hits=[];diagram.querySelectorAll('[data-id]').forEach(n=>{const d=DATA.registry[n.dataset.id],hit=!q||JSON.stringify(d).toLowerCase().includes(q);n.classList.toggle('dim',!hit);n.classList.toggle('selected',!!q&&hit);if(hit)hits.push(n.dataset.id)});diagram.querySelectorAll('.edge').forEach(n=>n.classList.remove('dim','focused'));if(q){details.innerHTML='<span class="badge">搜索结果</span><h2>'+hits.length+' 个匹配节点</h2><p>当前视图中匹配的卡片已高亮。点击卡片查看详情。</p><p class="footnote">搜索仅覆盖当前视图；可切换其他视图继续查找。</p>'}else guide()});
document.getElementById('export').onclick=()=>{const blob=new Blob([view.svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ecs-'+view.id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.addEventListener('resize',fit);switchView('overview');
</script></body></html>
