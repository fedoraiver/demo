</style></head><body><header><div class="eyebrow">DEMO / ECS ARCHITECTURE · V1</div><h1>从输入到画面，当前 App 如何运作</h1><p class="sub">UML 风格的实体、组件、系统与关系 · 基于生成时的源码快照 · 不执行游戏</p></header><div class="toolbar"><nav class="tabs" aria-label="架构视图"><button data-view="overview" class="active">总览</button><button data-view="schedules">调度与读写</button><button data-view="relationships">实体关系</button><button data-view="events">事件与 Observer</button></nav><div class="tools"><input id="search" placeholder="搜索系统、组件或字段" aria-label="搜索架构节点"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适合窗口</button><button id="export">导出 SVG</button></div></div><main class="workspace"><section class="canvas-wrap"><div id="caption" class="caption"></div><div id="canvas" class="canvas"><div id="diagram" class="diagram"></div><div class="canvas-hint">滚轮缩放 · 拖动平移 · 点击卡片查看数据与源码</div></div></section><aside id="details" class="side" aria-live="polite"></aside></main><script id="architecture-data" type="application/json">{"model":{"title":"当前原型的 ECS 架构","snapshot_note":"依据已加入第一／第三人称切换、世界检查器、UI 输入上下文启停边界与集中启动日志插件的对应源码整理。依赖为 Bevy 0.19.1、bevy_enhanced_input 0.26.0、bevy-inspector-egui 0.37.0（bevy_egui 0.40.1）。引擎与插件节点是明确标注的相关数据流概览，不代表全部系统的精确全序。","systems":[{"id":"startup_spawn","name":"spawn_scene","kind":"system","phase":"Startup","module":"scene","description":"生成业务根、视觉子实体、控制者、动作、绑定与相机；结构命令在后续同步点生效。","reads":["resource.PrototypeConfig"],"writes":["controller.Name","controller.PlayerId","controller.GameplayContext","controller.GamepadDevice","controller.ControlsCharacter","controller.ControlsCamera","controller.Actions","controller.ContextPriority","controller.ContextActivity","character.Name","character.Character","character.CharacterIntent","character.CharacterMotion","character.Transform","character.GlobalTransform","character.Visibility","character.Children","parcel.Name","parcel.Parcel","parcel.Pickable","parcel.Transfor eplayPlugin 注册玩法数据反射类型，支持世界检查器。","PrototypeScenePlugin 构建时插入 ClearColor 与 GlobalAmbientLight；spawn_scene 在 Startup 使用 Commands 生成场景并添加网格、材质资产。","默认启动阶段为 PreStartup → Startup → PostStartup。StartupLogPlugin 集中注册四个启动日志，PrototypeScenePlugin 注册场景生成；五个系统没有显式相互顺序，插件注册顺序不构成系统串行依赖。","Startup 结束会应用场景生成命令，关系钩子维护 Actions、Bindings 与 Children；引擎还在 PostStartup 完成启动变换同步。四个启动日志系统只报告实际玩法配置、固定时间步与当前功能约定，不依赖已生成实体；启动日志插件不初始化配置或添加功能插件。","当前场景创建 1 个控制者、1 个角色、1 个木箱、1 台相机、6 个视觉子实体、5 个动作、8 条绑定；WindowPlugin 创建 1 个主窗口。地面与日光另行生成，未并入 visual；检查器复用主窗口与相机，不添加第二套玩法实体。","spawn_keyboard_controller、keyboard_context 和 OrbitCamera::transform 是生成或计算辅助函数，不是独立注册的 Schedule 系统。Action、Binding 的生成辅助宏与关系由插件实现。","SessionWriter 只在日志插件初始化期间作为临时 Resource 存在，随后取出交给文件输出层；SessionLogGuard 是 main 持有的普通 Rust 对象，App::run 返回后记录退出并刷新。","EguiPlugin 默认把 EguiContext 与 PrimaryEguiContext 自动附加到首个相机，当前只有一台相机。其 required components 与插入钩子补入 UI 设置、输入、输出及多轮 Schedule；这些由插件初始化，不由 spawn_scene 手工生成，检查器不另建游戏窗口。"],"general_notes":["systems 的固定 ID 用于布局。kind=engine 是引擎或输入框架阶段的概览，kind=sync 是延迟命令应用点，kind=observer 是触发式响应，其余为项目系统。","业务系统列出访问声明和实际用途；可变访问中读取的数据也列入 reads。EguiContext 的可变接口用于查询 UI，其 writes 表示调度访问权限，不意味着项目修改 UI 内容。With/Without 是筛选而非数据读取；Commands 结构变更在同步点才可见。","引擎概览的 reads/writes 只列与当前原型有关的数据，未展开全部内部组件、资源、条件函数表、消息游标与局部缓存。部分组件通过 required components 自动出现，部分关系反向索引只在关联存在时出现；组件列表不表示所有组件始终同时存在。","source.path 使用仓库相对路径。项目类型引用声明行，引擎或插件类型引用项目内的使用、生成或注册行；kind=engine 概览 source=null。父图应把这些位置标为源码入口，不能宣称是引擎类型定义。","默认逐帧主阶段包括 First → PreUpdate → RunFixedMainLoop → Update → SpawnScene → PostUpdate → Last。图中仅展示相关阶段；自定义 spawn_scene 在 Startup，名称并不意味着它运行于引擎 SpawnScene 阶段。","RunFixedMainLoop 每个渲染帧执行 0..N 次固定阶段；固定步不是渲染帧的一对一后续步骤。当前 fixed 为 60 Hz，默认渲染上限 60 FPS，自定义上限可高于 60，性能不足也可能低于上限。","EnhancedInputSystems::Apply 写入动作输出并调用 Commands::trigger；这个 Apply 阶段不是 ECS 的 ApplyDeferred。排入的动作事件在下一命令同步点触发，默认 PreUpdate 完成时已经应用，随后固定循环可读到最新意图。","World::trigger 在调用期间触发 Observer；Commands::trigger 延迟到命令应用。Observer 注册先后不定义执行顺序；不得把七个业务 Observer 排成串行链。Fire、Complete、Cancel 包含 context、action 与动作值，当前路由使用 context。视角请求通过随后有显式依赖的系统消费。","MouseButtonInput、WindowFocused 等是缓冲 Message，拥有独立读取游标，默认缓冲不是永久队列。Enhanced Input 的 Fire、Complete、Cancel 是触发式 EntityEvent；两类通信必须使用不同图例。","跳跃与交互用布尔请求跨零固定步帧保留，固定步用 mem::take 消费一次；多次到达而尚未消费的同类请求会合并。移动轴保持到 Complete 或 Cancel；镜头角度直接按本帧像素位移更新，不积分角色位置。","sync_character_facing 与 sync_held_objects 分别在 FixedUpdate、Update 注册为独立系统实例，虽然复用同一函数。两者只同步当前姿态，不额外积分、消费请求或执行交互；图中要保留两处调度节点。","FixedUpdate 的玩法链显式建立顺序；交互 Commands 在持物同步前应用，HeldBy 与 HoldingItems 同步可见。Update 按角色朝向 → 持物姿态 → 相机 → 人物可见性同步，再在 PostUpdate 传播世界变换与可见性。","同一 Schedule 的 .before/.after/.chain 才表达先后；数据访问冲突、元组顺序、插件注册顺序及 .in_set 本身都不定义完整执行顺序，跨 Schedule 的先后来自主调度顺序。","普通 Entity 引用不提供 Bevy 关系生命周期；#[entities] 只参与实体映射。ActionOf、BindingOf、ChildOf 与 HeldBy 是关系，反向索引的成员由 Bevy 自动维护；只有前三者启用 linked_spawn。","HeldBy 不是 ChildOf；拿起木箱不改变模型层级。当前关系容器支持多件，但业务只拿放第一件；多人同时争抢、持有者销毁前主动放箱与异常解除后的落地恢复尚未实现。","RenderApp 包含提取、准备、排序与 GPU 渲染等步骤，也可能使用流水线；render 节点是渲染概览，不是紧接 PostUpdate 的单个普通系统。日志通过 tracing 文件输出，不是 ECS Event 或 Message。","该文件记录源码结构，未启动游戏，未执行窗口或视觉验收。","视角切换不是 Observer 内立即切换：request_perspective_toggle 只记录请求，apply_perspective_toggle 在 EnhancedInputSystems::Apply 之后同帧消费，避免 I 与鼠标同帧时依赖动作遍历或 Observer 顺序。","世界检查器由 EguiPlugin 与 WorldInspectorPlugin 提供，数据留在 ECS 内，通过反射动态读取和可选编辑。Egui 输入映射、BeginPass 集合与嵌套 EguiPrimaryContextPass 以概览节点表示；未展开全部输入、提取和绘制系统。","原约定的 28 个系统 ID 均保留；新增视角切换、可见性、检查器日志、Egui 输入阶段与上下文命令应用节点。布局应按当前清单显示，不应把首版节点数当作全部当前系统。","PreUpdate 的已核对相关路线为 InputSystems → Egui ProcessInput → filter_captured_egui_input → Egui BeginPass 集合 → sync_mouse_capture → 自动 ApplyDeferred → EnhancedInput Prepare → Update → Apply → 事件命令应用 → apply_perspective_toggle。只描述相关显式依赖，未展开全部引擎系统。","EguiPlugin::default() 默认 multipass=true；主上下文的 EguiPrimaryContextPass 在 PostUpdate 的上下文循环内部运行，可一帧多轮。PreUpdate BeginPass 排序边界不等于主检查器 UI 在该时刻开始或完成。","PostUpdate 的 UI 嵌套 Schedule 与变换传播都属于本帧后处理，但源码与已核对插件未建立二者的显式顺序。应画成并行分支或同阶段无序节点，避免将 UI 动态反射编辑包装成与模拟保证同步的过程。","UI 输入隔离用不可变 ContextActivity 的延迟替换，不清空共享底层键鼠资源；窗口捕获、动作上下文启用与视角模式是三份不同状态。Esc 释放不直接停用键盘动作，检查器占用才停用整个 GameplayContext。","EguiInput 内部的 egui::Event 只是 UI RawInput 的事件枚举，不等同于 Bevy ECS Event、EntityEvent 或缓冲 Message。捕获期间的 UI 过滤与 UI 占用时的 GameplayContext 停用构成两个方向的输入边界。"]},"registry":{"app-main":{"name":"main / App","kind":"App","description":"创建 App 与会话日志，配置默认插件，加载设置，装配功能插件后进入主循环。退出时记录结果并刷新日志。","notes":["main 先创建 App 和会话日志守护对象，再配置 DefaultPlugins 的 LogPlugin 文件输出与 WindowPlugin；设置加载失败回退默认。会话日志不是玩法 ECS 状态。","main 插入 GameSettings、WinitSettings::continuous() 与固定 60 Hz 的 Time\u003cFixed>，再注册 EguiPlugin、WorldInspectorPlugin、SettingsPlugin、GameplayPlugin、PlayerInputPlugin、CameraControlPlugin、PrototypeScenePlugin、StartupLogPlugin；Egui 在检查器之前构建。","PlayerInputPlugin 注册 GameplayContext 与五个角色意图 Observer；CameraControlPlugin 注册观察与视角切换两个 Observer、窗口焦点消息与显示系统。GameplayPlugin 注册玩法数据反射类型，支持世界检查器。","PrototypeScenePlugin 构建时插入 ClearColor 与 GlobalAmbientLight；spawn_scene 在 Startup 使用 Commands 生成场景并添加网格、材质资产。","默认启动阶段为 PreStartup → Startup → PostStartup。StartupLogPlugin 集中注册四个启动日志，PrototypeScenePlugin 注册场景生成；五个系统没有显式相互顺序，插件注册顺序不构成系统串行依赖。","Startup 结束会应用场景生成命令，关系钩子维护 Actions、Bindings 与 Children；引擎还在 PostStartup 完成启动变换同步。四个启动日志系统只报告实际玩法配置、固定时间步与当前功能约定，不依赖已生成实体；启动日志插件不初始化配置或添加功能插件。","当前场景创建 1 个控制者、1 个角色、1 个木箱、1 台相机、6 个视觉子实体、5 个动作、8 条绑定；WindowPlugin 创建 1 个主窗口。地面与日光另行生成，未并入 visual；检查器复用主窗口与相机，不添加第二套玩法实体。","spawn_keyboard_controller、keyboard_context 和 OrbitCamera::transform 是生成或计算辅助函数，不是独立注册的 Schedule 系统。Action、Binding 的生成辅助宏与关系由插件实现。","SessionWriter 只在日志插件初始化期间作为临时 Resource 存在，随后取出交给文件输出层；SessionLogGuard 是 main 持有的普通 Rust 对象，App::run 返回后记录退出并刷新。","EguiPlugin 默认把 EguiContext 与 PrimaryEguiContext 自动附加到首个相机，当前只有一台相机。其 required components 与插入钩子补入 UI 设置、输入、输出及多轮 Schedule；这些由插件初始化，不由 spawn_scene 手工生成，检查器不另建游戏窗口。"],"source":{"path":"src/main.rs","line":20}},"plugin-DefaultPlugins":{"id":"plugin-DefaultPlugins","name":"DefaultPlugins","kind":"Plugin","description":"引擎输入、窗口、时间、变换、渲染与日志。","notes":["注册顺序不等于系统执行顺序。"],"source":{"path":"src/main.rs","line":32}},"plugin-EguiPlugin":{"id":"plugin-EguiPlugin :"move_characters","kind":"system","phase":"FixedUpdate（0..N 步）","module":"gameplay","description":"限制移动轴长度并转换为世界速度，按固定时间步积分水平位置。","reads":["resource.TimeFixed","resource.PrototypeConfig","local.VelocityLog","character.CharacterIntent","character.CharacterMotion","character.Transform"],"writes":["local.VelocityLog","character.CharacterMotion","character.Transform"],"filters":["With\u003cCharacter>"],"events":[],"notes":["属于 GameplaySystems::Simulate，与 gravity、interaction、held_fixed 使用 .chain()。","写 horizontal_velocity 与 translation；不改变角色朝向。"],"source":{"path":"src/gameplay.rs","line":127}},"gravity":{"id":"gravity","name":"update_jump_and_gravity","kind":"system","phase":"FixedUpdate（0..N 步）","module":"gameplay","description":"消费一次跳跃请求，按固定步推进竖直速度和位置，在平地着陆。","reads":["resource.TimeFixed","resource.PrototypeConfig","character.CharacterIntent","character.CharacterMotion","character.Transform"],"writes":["character.CharacterIntent","character.CharacterMotion","character.Transform"],"filters":["With\u003cCharacter>"],"events":[],"notes":["movement → gravity → interaction 为显式玩法链。","mem::take 消费 jump_pending；已经腾空时忽略请求。","当前是平地高度判断，没有通用碰撞或物理求解。"],"source":{"path":"src/gameplay.rs","line":165}},"interaction":{"id":"interaction","name":"handle_interaction","kind":"system","phase":"FixedUpdate（0..N 步）","module":"gameplay","description":"消费交互请求；持有时放下第一件物体，否则选择范围内最近的可拾取物。","reads":["resource.PrototypeConfig","character.CharacterIntent","character.Transform","character.HoldingItems","parcel.Transform"],"writes":["character.CharacterIntent","parcel.Transform","parcel.HeldBy"],"filters":["角色：(With\u003cCharacter>, Without\u003cPickable>)","候选物：(With\u003cPickable>, Without\u003cHeldBy>, Without\u003cCharacter>)","已持有物：(With\u003cPickable>, With\u003cHeldBy>, Without\u003cCharacter>)"],"events":[],"notes":["Transform 与意图修改直接发生；HeldBy 插入或移除是延迟 Commands。","HoldingItems 成员由命令应用时的关系钩子更新，当前系统只读取。","单次拿放一件；不实施多人争抢裁决。"],"source":{"path":"src/gameplay.rs","line":217}},"held_apply":{"id":"he )，具有 HeldBy"],"events":[],"notes":["位于 facing_update 之后、camera_follow 之前。","解除 HeldBy 的物体不再跟随；仅同步当前状态，不重复交互。"],"source":{"path":"src/gameplay.rs","line":294}},"camera_follow":{"id":"camera_follow","name":"follow_orbit_camera","kind":"system","phase":"Update","module":"camera","description":"用角色最新位置与当前视角计算相机 Transform。","reads":["character.Transform","camera.OrbitCamera"],"writes":["camera.Transform"],"filters":["角色：With\u003cCharacter>","相机查询：Without\u003cCharacter>，具有 OrbitCamera 与 Transform；没有额外 With\u003cCamera3d> 过滤"],"events":[],"notes":["位于 held_update 之后。","只读角色 Transform，与相机写查询互斥，避免 Transform 访问冲突。","第一人称镜头位于角色脚底上方 1.65；当前 yaw 与对应俯仰生成旋转，第三人称使用环绕参数。"],"source":{"path":"src/camera.rs","line":507}},"visibility_update":{"id":"visibility_update","name":"sync_character_visibility","kind":"system","phase":"Update","module":"camera","description":"依据有效相机的模式隐藏对应角色视觉，切回或失去关联时恢复；木箱保持可见。","reads":["controller.ControlsCharacter","controller.ControlsCamera","camera.OrbitCamera","visual.ChildOf","visual.Visibility"],"writes":["visual.Visibility"],"filters":["视觉：With\u003cCharacterVisual>","控制者：With\u003cGameplayContext>","按 ChildOf 查所属角色并确认 OrbitCamera.target 匹配","角色：Query\u003c(), With\u003cCharacter>>，检查所属业务角色存在"],"events":[],"notes":["位于 camera_follow 之后，属于同一 Update .chain()。","只改三个角色视觉实体的 Visibility；角色业务根和木箱没有被隐藏。","PostUpdate 引擎还会传播层级可见性；Transform 传播不会代替可见性计算。","缺失角色、相机或控制关联时恢复显示；角色存在查询只有过滤语义。"],"source":{"path":"src/camera.rs","line":519}},"input_update":{"id":"input_update","name":"InputSystems","kind":"engine","phase":"PreUpdate","module":"bevy_input","description":"引擎从缓冲消息更新键盘、鼠标按钮和本帧鼠标位移。","reads":["resource.KeyboardInputMessages","resource.KeyboardFocusLostMessages","resource.MouseButtonInputMessages","resource.MouseMotionMessages"],"writes":["resource.ButtonInputKeyCode","resource.ButtonInputMouseButton","resource.AccumulatedMouseMotion"],"filters":[],"events":["读取缓冲 Message：KeyboardInput、KeyboardFocusLost、MouseButtonInput、MouseMotion"],"notes":["展示相关输入系统集合，集合内 003c/g>\u003ctext x=\"1257\" y=\"392\" class=\"small\" text-anchor=\"start\">event.context → 控制者\u003c/text>\u003ctext x=\"1257\" y=\"430\" class=\"small\" text-anchor=\"start\">ControlsCharacter → 角色\u003c/text>\u003ctext x=\"1257\" y=\"468\" class=\"small\" text-anchor=\"start\">↓ CharacterIntent\u003c/text>\u003ctext x=\"1257\" y=\"506\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"1257\" y=\"544\" class=\"small\" text-anchor=\"start\">movement → 移动系统\u003c/text>\u003ctext x=\"1257\" y=\"582\" class=\"small\" text-anchor=\"start\">jump_pending → 跳跃重力\u003c/text>\u003ctext x=\"1257\" y=\"620\" class=\"small\" text-anchor=\"start\">interact_pending → 交互\u003c/text>\u003ctext x=\"1257\" y=\"658\" class=\"small\" text-anchor=\"start\">布尔请求一次消费后清零\u003c/text>\u003ctext x=\"1257\" y=\"696\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"1257\" y=\"734\" class=\"small\" text-anchor=\"start\">观察 / 切换另走：\u003c/text>\u003ctext x=\"1257\" y=\"772\" class=\"small\" text-anchor=\"start\">ControlsCamera → 相机\u003c/text>\u003ctext x=\"1257\" y=\"810\" class=\"small\" text-anchor=\"start\">↓ OrbitCamera\u003c/text>\u003ctext x=\"1257\" y=\"848\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"1257\" y=\"886\" class=\"small\" text-anchor=\"start\">观察：直接更新角度\u003c/text>\u003ctext x=\"1257\" y=\"924\" class=\"small\" text-anchor=\"start\">切换：先记请求来源\u003c/text>\u003ctext textLength=\"216\" lengthAdjust=\"spacingAndGlyphs\" x=\"1257\" y=\"962\" class=\"small\" text-anchor=\"start\">↓ apply_perspective_toggle\u003c/text>\u003ctext x=\"1257\" y=\"1000\" class=\"small\" text-anchor=\"start\">在事件命令应用后切换\u003c/text>\u003ctext x=\"1257\" y=\"1038\" class=\"small\" text-anchor=\"start\">\u003c/text>\u003ctext x=\"1257\" y=\"1076\" class=\"small\" text-anchor=\"start\">目标或组件缺失 → 返回\u003c/text>\u003ctext x=\"1257\" y=\"1114\" class=\"small\" text-anchor=\"start\">零固定步帧保留玩法请求\u003c/text>\u003ctext x=\"45\" y=\"1273\" class=\"note\" text-anchor=\"start\">移动轴持续保留至 Complete / Cancel；跳跃与交互的同类未消费请求会合并为一次。\u003c/text>\u003cg>\u003crect x=\"30\" y=\"1320\" width=\"1460\" height=\"280\" rx=\"12\" fill=\"#fff\" stroke=\"#526477\" stroke-width=\"1.5\"/>\u003cpath d=\"M30,1377H1490\" stroke=\"#dae2e8\"/>\u003ctext x=\"50\" y=\"1350\" class=\"group-title\" text-anchor=\"start\">窗口通信 · 缓冲 Message、输入 Resource 与 Egui 上下文\u003c/text>\u003ctext x=\"50\" y=\"1369\" class=\"small\" text-anchor=\"start\">窗口消息有独立读取游标；UI 占用通过输入上下文停用，避免与玩法动作重复触发。\u003c/text>\u003c/g>\u003cg class=\"node message\" data-id=\"window-messages\" tabindex=\"0\" role=\"button\" aria-label=\"WindowFocused / MouseButtonInput\">\u003crect x=\"50\" y=\"1410\" width=\"374\" height=\"130\" rx=\"3\" fill=\"#fff\" stroke=\"#367b96\" stroke-width=\"1.7\" />\u003ctext x=\"64\" y=\"1431\" class=\"stereotype\" text-anchor=\"start\">«Message»\u003c/text>\u003ctext x=\"64\" y=\"1458\" class=\"node-title\" text-anchor=\"start\">窗口消息缓冲\u003c/text>\u003ctext x=\"64\" y=\"1483\" class=\"small\" text-anchor=\"start\">WindowFocused / MouseButtonInput\u003c/text>\u003ctext x=\"64\" y=\"1506\" class=\"small\" text-anchor=\"start\">MessageReader 读取\u003c/text>\u003ctext x=\"64\" y=\"1529\" class=\"small\" text-anchor=\"start\">Esc / Window / Egui 另由参数访问\u003c/text>\u003c/g>\u003cg class=\"node system\" data-id=\"mouse_capture\" tabindex=\"0\" role=\"button\" aria-label=\"sync_mouse_capture\">\u003crect x=\"512\" y=\"1410\" width=\"356\" height=\"130\" rx=\"10\" fill=\"#fff\" stroke=\"#234f80\" stroke-width=\"1.7\" />\u003ctext x=\"526\" y=\"1431\" class=\"stereotype\" text-anchor=\"start\">«System»\u003c/text>\u003ctext x=\"526\" y=\"1458\" class=\"node-title\" text-anchor=\"start\">sync_mouse_capture\u003c/text>\u003ctext x=\"526\" y=\"1483\" class=\"small\" text-anchor=\"start\">R 消息 / Esc / Window / Egui\u003c/text>\u003ctext x=\"526\" y=\"1506\" class=\"small\" text-anchor=\"start\">W MouseLookState / CursorOptions\u003c/text>\u003ctext x=\"526\" y=\"1529\" class=\"small\" text-anchor=\"start\">Commands：ContextActivity 开 / 关\u003c/text>\u003c/g>\u003cg class=\"node component\" data-id=\"capture-state\" tabindex=\"0\" role=\"button\" aria-label=\"捕获与输入上下文\">\u003crect x=\"971\" y=\"1410\" width=\"486\" height=\"130\" rx=\"3\" fill=\"#f2faf5\" stroke=\"#2a7156\" stroke-width=\"1.7\" />\u003ctext x=\"985\" y=\"1431\" class=\"stereotype\" text-anchor=\"start\">«Component»\u003c/text>\u003ctext x=\"985\" y=\"1458\" class=\"node-title\" text-anchor=\"start\">捕获与输入上下文\u003c/text>\u003ctext x=\"985\" y=\"1483\" class=\"small\" text-anchor=\"start\">MouseLookState：active / skip_motion / focused\u003c/text>\u003ctext x=\"985\" y=\"1506\" class=\"small\" text-anchor=\"start\">CursorOptions：visible / grab_mode\u003c/text>\u003ctext x=\"985\" y=\"1529\" class=\"small\" text-anchor=\"start\">ContextActivity：ACTIVE / INACTIVE（延迟命令）\u003c/text>\u003c/g>\u003cg class=\"edge read\" data-connect=\"window-messages|mouse_capture\">\u003cpath d=\"M424,1474 L512,1474\" stroke=\"#2d72ad\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"6 5\" marker-end=\"url(#arrow-read)\"/>\u003crect x=\"443\" y=\"1461\" width=\"50\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"468\" y=\"1478\" class=\"edge-label\" text-anchor=\"middle\">读取\u003c/text>\u003c/g>\u003cg class=\"edge write\" data-connect=\"mouse_capture|capture-state\">\u003cpath d=\"M868,1474 L971,1474\" stroke=\"#288554\" stroke-width=\"2\" fill=\"none\"  marker-end=\"url(#arrow-write)\"/>\u003crect x=\"897\" y=\"1461\" width=\"44\" height=\"24\" rx=\"4\" fill=\"#fffdf9\"/>\u003ctext x=\"919\" y=\"1478\" class=\"edge-label\" text-anchor=\"middle\">W\u003c/text>\u003c/g>\u003ctext x=\"52\" y=\"1577\" class=\"small\" text-anchor=\"start\">恢复鼠标捕获当帧跳过位移；检查器编辑直接作用于 ECS 内存，界面绘制见调度视图。\u003c/text>\u003c/svg>","summary":"点击 Observer 看事件目标与数据访问；查看请求如何跨输入、模拟和显示阶段流动。"}]}</script><script>
const DATA=JSON.parse(document.getElementById('architecture-data').textContent);const canvas=document.getElementById('canvas'),diagram=document.getElementById('diagram'),details=document.getElementById('details');let view=DATA.views[0],scale=1,panX=0,panY=0,selected=null,drag=null;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function transform(){diagram.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';document.getElementById('zoom-label').textContent=Math.round(scale*100)+'%'}
function fit(){scale=Math.min((canvas.clientWidth-28)/view.width,(canvas.clientHeight-28)/view.height,1);panX=(canvas.clientWidth-view.width*scale)/2;panY=(canvas.clientHeight-view.height*scale)/2;transform()}
function list(title,items){return items&&items.length?'<h3>'+safe(title)+'</h3><ul>'+items.map(x=>{const key=DATA.registry[x]?x:String(x).split(' ')[0],d=DATA.registry[key];return '<li>'+(d?'<button class="data-link" data-open="'+safe(key)+'">'+safe(d.name)+' '+safe(String(x).slice(key.length))+'</button>':'<code>'+safe(x)+'</code>')+'</li>'}).join('')+'</ul>':''}
function guide(){details.innerHTML='<span class="badge">读图指南</span><h2>'+safe(view.label)+'</h2><p>'+safe(view.summary)+'</p><div class="legend"><div><i class="line"></i>调度先后与执行依赖</div><div><i class="line read"></i>R：数据 → 系统</div><div><i class="line write"></i>W：系统 → 数据</div><div><i class="line event"></i>事件触发 Observer</div><div><i class="line ref"></i>普通 Entity 引用</div><div><i class="line rel"></i>Bevy 关系及反向索引</div></div><h3>类型框</h3><p>«Entity» 包含组件框；«System» 是调度运行的函数；«Observer» 按事件响应；«Resource» 共享，«Local» 为系统私有。</p><div class="help">固定步每帧 0～N 次。角色朝向和持物同步在固定步与逐帧更新中复用；数据访问连线不代表执行顺序。</div><h3>范围与抽象</h3><p class="footnote">业务系统与组件来自当前源码；引擎输入、时钟、变换传播和渲染以必要概览节点表示。普通引用不自动成为 Bevy 关系。</p><button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null)}
function sourceLink(source){return '<h3>源码位置</h3><a class="source" href="ecs-source.html?file='+encodeURIComponent(source.path)+'#L'+encodeURIComponent(source.line)+'" target="_blank" rel="noopener noreferrer" title="在新标签页查看源码并定位此行">'+safe(source.path)+':'+safe(source.line)+'</a>'}
function showDetail(id){const d=DATA.registry[id];if(!d){guide();return}details.innerHTML='<span class="badge">'+safe(d.kind||'数据')+(d.phase?' · '+safe(d.phase):'')+'</span><h2>'+safe(d.name||id)+'</h2><p>'+safe(d.description||'')+'</p>'+(d.owner?'<p>所属实体：'+safe(d.owner)+'</p>':'')+list('R · 读取',d.reads)+list('W · 修改',d.writes)+list('Query · 过滤',d.filters)+list('事件 / 消息',d.events)+list('字段',d.fields)+list('约束与说明',d.notes)+(d.components?list('实体组件',d.components.map(c=>c.id)):'')+(d.source?sourceLink(d.source):'')+'<button class="reset" id="clear-selection">清除选择</button>';document.getElementById('clear-selection').onclick=()=>select(null);details.scrollTop=0}
details.addEventListener('click',e=>{const n=e.target.closest('[data-open]');if(n)select(n.dataset.open)});
function select(id){selected=id;const d=DATA.registry[id];const relevant=new Set([id,...(d?.reads||[]),...(d?.writes||[])]);diagram.querySelectorAll('[data-id]').forEach(n=>{n.classList.toggle('selected',n.dataset.id===id);n.classList.toggle('dim',!!id&&!relevant.has(n.dataset.id))});diagram.querySelectorAll('.edge').forEach(n=>{const active=n.dataset.connect.split('|').some(v=>relevant.has(v));n.classList.toggle('focused',!!id&&active);n.classList.toggle('dim',!!id&&!active)});id?showDetail(id):guide()}
function switchView(id){view=DATA.views.find(v=>v.id===id);if(!view)return;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));diagram.innerHTML=view.svg;document.getElementById('caption').textContent=view.summary;document.getElementById('search').value='';selected=null;guide();requestAnimationFrame(fit)}
function zoom(factor,x=canvas.clientWidth/2,y=canvas.clientHeight/2){const old=scale;scale=Math.min(2.4,Math.max(.2,scale*factor));panX=x-(x-panX)*scale/old;panY=y-(y-panY)*scale/old;transform()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('fit').onclick=fit;document.getElementById('zoom-in').onclick=()=>zoom(1.2);document.getElementById('zoom-out').onclick=()=>zoom(1/1.2);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){panX=drag.px+dx;panY=drag.py+dy;canvas.classList.add('dragging');transform()}});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const n=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-id]');select(n?n.dataset.id:null)}drag=null;canvas.classList.remove('dragging')});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging')});
diagram.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const n=e.target.closest('[data-id]');if(n){e.preventDefault();select(n.dataset.id)}}});document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();selected=null;const hits=[];diagram.querySelectorAll('[data-id]').forEach(n=>{const d=DATA.registry[n.dataset.id],hit=!q||JSON.stringify(d).toLowerCase().includes(q);n.classList.toggle('dim',!hit);n.classList.toggle('selected',!!q&&hit);if(hit)hits.push(n.dataset.id)});diagram.querySelectorAll('.edge').forEach(n=>n.classList.remove('dim','focused'));if(q){details.innerHTML='<span class="badge">搜索结果</span><h2>'+hits.length+' 个匹配节点</h2><p>当前视图中匹配的卡片已高亮。点击卡片查看详情。</p><p class="footnote">搜索仅覆盖当前视图；可切换其他视图继续查找。</p>'}else guide()});
document.getElementById('export').onclick=()=>{const blob=new Blob([view.svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ecs-'+view.id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.addEventListener('resize',fit);switchView('overview');
</script></body></html>
