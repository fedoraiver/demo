<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="987" viewBox="0 0 1560 987" role="img" aria-labelledby="title"><title id="title">当前 App · ECS 总览</title><defs><marker id="arrow-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#324153"/></marker><marker id="arrow-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#2d72ad"/></marker><marker id="arrow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#288554"/></marker><marker id="arrow-trigger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#bf651e"/></marker><marker id="arrow-reference" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#7b65a6"/></marker><marker id="arrow-relationship" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#7b65a6"/></marker><marker id="arrow-registration" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#89939f"/></marker><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#263648}.body{font-size:18px}.small{font-size:15px;fill:#576779}.stereotype{font-size:13px;fill:#687886;letter-spacing:.6px}.node-title{font-size:19px;font-weight:600}.group-title{font-size:21px;font-weight:600}.edge-label{font-size:16px}.page-title{font-size:32px;font-weight:650}.section-title{font-size:24px;font-weight:650}.note{font-size:17px;fill:#526477}.node{cursor:pointer}.node:focus{outline:none}.node.selected>rect,.node.selected>path{stroke:#db7521;stroke-width:4}.node.dim{opacity:.20}.edge.dim{opacity:.13}.edge.focused>path{stroke-width:3.5}</style></defs><rect width="100%" height="100%" fill="#f7f8fa"/><text x="36" y="48" class="page-title" text-anchor="start">当前 App · ECS 总览</text><text x="36" y="78" class="note" text-anchor="start">先沿粗箭头看执行顺序，再沿 R / W 看数据；点击卡片查看源码与完整访问声明。</text><g class="node entity" data-id="app-main" tabindex="0" role="button" aria-label="main / App"><g><rect x="30" y="102" width="1500" height="170" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M30,159H1530" stroke="#dae2e8"/><text x="50" y="132" class="group-title" text-anchor="start">«App» main：装配应用与共享 World</text><text x="50" y="151" class="small" text-anchor="start">Plugin 负责注册；下方位置不代表插件内部系统的执行先后。</text></g></g><g class="node plugin" data-id="plugin-DefaultPlugins" tabindex="0" role="button" aria-label="DefaultPlugins"><rect x="44" y="165" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="56" y="192" class="node-title" text-anchor="start">DefaultPlugins</text></g><g class="node plugin" data-id="plugin-EguiPlugin" tabindex="0" role="button" aria-label="EguiPlugin"><rect x="340" y="165" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="352" y="192" class="node-title" text-anchor="start">EguiPlugin</text></g><g class="node plugin" data-id="plugin-WorldInspectorPlugin" tabindex="0" role="button" aria-label="WorldInspectorPlugin"><rect x="636" y="165" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="648" y="192" class="node-title" text-anchor="start">WorldInspectorPlugin</text></g><g class="node plugin" data-id="plugin-SettingsPlugin" tabindex="0" role="button" aria-label="SettingsPlugin"><rect x="932" y="165" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="944" y="192" class="node-title" text-anchor="start">SettingsPlugin</text></g><g class="node plugin" data-id="plugin-GameplayPlugin" tabindex="0" role="button" aria-label="GameplayPlugin"><rect x="1228" y="165" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="1240" y="192" class="node-title" text-anchor="start">GameplayPlugin</text></g><g class="node plugin" data-id="plugin-PlayerInputPlugin" tabindex="0" role="button" aria-label="PlayerInputPlugin"><rect x="44" y="217" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="56" y="244" class="node-title" text-anchor="start">PlayerInputPlugin</text></g><g class="node plugin" data-id="plugin-CameraControlPlugin" tabindex="0" role="button" aria-label="CameraControlPlugin"><rect x="340" y="217" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="352" y="244" class="node-title" text-anchor="start">CameraControlPlugin</text></g><g class="node plugin" data-id="plugin-PrototypeScenePlugin" tabindex="0" role="button" aria-label="PrototypeScenePlugin"><rect x="636" y="217" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="648" y="244" class="node-title" text-anchor="start">PrototypeScenePlugin</text></g><g class="node plugin" data-id="plugin-StartupLogPlugin" tabindex="0" role="button" aria-label="StartupLogPlugin"><rect x="932" y="217" width="284" height="42" rx="4" fill="#fff" stroke="#234f80"/><text x="944" y="244" class="node-title" text-anchor="start">StartupLogPlugin</text></g><g transform="translate(0 52)"><g><rect x="30" y="240" width="1500" height="108" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M30,297H1530" stroke="#dae2e8"/><text x="50" y="270" class="group-title" text-anchor="start">«Schedule» Startup · 启动一次</text><text x="50" y="289" class="small" text-anchor="start">场景插件生成场景，启动日志插件注册四项日志；五个系统无彼此顺序约束，阶段结束应用场景命令。</text></g><g class="node system" data-id="startup_spawn" tabindex="0" role="button" aria-label="spawn_scene"><rect x="48" y="303" width="274" height="32" rx="4" fill="#fff" stroke="#234f80"/><text x="60" y="325" class="node-title" text-anchor="start">spawn_scene</text></g><g class="node system" data-id="startup_config" tabindex="0" role="button" aria-label="log_configuration"><rect x="341" y="303" width="274" height="32" rx="4" fill="#fff" stroke="#234f80"/><text x="353" y="325" class="node-title" text-anchor="start">log_configuration</text></g><g class="node system" data-id="startup_timestep" tabindex="0" role="button" aria-label="log_simulation_timestep"><rect x="634" y="303" width="274" height="32" rx="4" fill="#fff" stroke="#234f80"/><text x="646" y="325" class="node-title" text-anchor="start">log_simulation_timestep</text></g><g class="node system" data-id="startup_pose" tabindex="0" role="button" aria-label="log_pose_synchronization"><rect x="927" y="303" width="274" height="32" rx="4" fill="#fff" stroke="#234f80"/><text textLength="250" lengthAdjust="spacingAndGlyphs" x="939" y="325" class="node-title" text-anchor="start">log_pose_synchronization</text></g><g class="node system" data-id="startup_inspector" tabindex="0" role="button" aria-label="log_world_inspector"><rect x="1220" y="303" width="274" height="32" rx="4" fill="#fff" stroke="#234f80"/><text x="1232" y="325" class="node-title" text-anchor="start">log_world_inspector</text></g><g><rect x="30" y="382" width="235" height="180" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M30,439H265" stroke="#dae2e8"/><text x="50" y="412" class="group-title" text-anchor="start">First</text><text x="50" y="431" class="small" text-anchor="start">«Schedule» · 每个渲染帧</text></g><text textLength="201" lengthAdjust="spacingAndGlyphs" x="47" y="469" class="body" text-anchor="start">limit_frame_rate → 时间更新</text><text textLength="201" lengthAdjust="spacingAndGlyphs" x="47" y="500" class="body" text-anchor="start">默认上限 60 FPS；最低 60</text><text x="47" y="531" class="body" text-anchor="start">Local：帧间计时</text><g><rect x="302" y="382" width="285" height="180" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M302,439H587" stroke="#dae2e8"/><text x="322" y="412" class="group-title" text-anchor="start">PreUpdate</text><text x="322" y="431" class="small" text-anchor="start">«Schedule» · 输入与界面准备</text></g><text x="319" y="469" class="body" text-anchor="start">捕获 / 上下文 → 动作评估</text><text x="319" y="500" class="body" text-anchor="start">应用事件 → Observer</text><text x="319" y="531" class="body" text-anchor="start">写意图 / 角度 → 视角切换</text><g><rect x="626" y="382" width="340" height="180" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M626,439H966" stroke="#dae2e8"/><text x="646" y="412" class="group-title" text-anchor="start">FixedUpdate</text><text x="646" y="431" class="small" text-anchor="start">«Schedule» · 60 Hz · 每帧 0～N 次</text></g><text x="643" y="469" class="body" text-anchor="start">朝向 → 移动 → 跳跃重力</text><text x="643" y="500" class="body" text-anchor="start">→ 交互 → 应用命令 → 持物</text><text x="643" y="531" class="body" text-anchor="start">积分位置，消费单次请求</text><g><rect x="1005" y="382" width="250" height="180" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M1005,439H1255" stroke="#dae2e8"/><text x="1025" y="412" class="group-title" text-anchor="start">Update</text><text x="1025" y="431" class="small" text-anchor="start">«Schedule» · 每个渲染帧</text></g><text x="1022" y="469" class="body" text-anchor="start">朝向 → 持物 → 镜头</text><text x="1022" y="500" class="body" text-anchor="start">→ 人物模型可见性</text><text x="1022" y="531" class="body" text-anchor="start">仅同步派生姿态</text><g><rect x="1294" y="382" width="236" height="180" rx="12" fill="#fff" stroke="#526477" stroke-width="1.5"/><path d="M1294,439H1530" stroke="#dae2e8"/><text x="1314" y="412" class="group-title" text-anchor="start">PostUpdate</text><text textLength="196" lengthAdjust="spacingAndGlyphs" x="1314" y="431" class="small" text-anchor="start">«Schedule» · 变换传播与渲染交接</text></g><text x="1311" y="469" class="body" text-anchor="start">Transform</text><text x="1311" y="500" class="body" text-anchor="start">→ GlobalTransform</text><text x="1311" y="531" class="body" text-anchor="start">→ 渲染子应用</text><g class="edge order" data-connect=""><path d="M265,420 L302,420" stroke="#324153" stroke-width="2.7" fill="none"  marker-end="url(#arrow-order)"/></g><g class="edge order" data-connect=""><path d="M587,420 L626,420" stroke="#324153" stroke-width="2.7" fill="none"  marker-end="url(#arrow-order)"/></g><g class="edge order" data-connect=""><path d="M966,420 L1005,420" stroke="#324153" stroke-width="2.7" fill="none"  marker-end="url(#arrow-order)"/></g><g class="edge order" data-connect=""><path d="M1255,420 L1294,420" stroke="#324153" stroke-width="2.7" fill="none"  marker-end="url(#arrow-order)"/></g><text x="650" y="609" class="note" text-anchor="start">固定循环由时间累积决定；没有固定步时，Update 仍同步显示姿态。</text><g class="node component" data-id="character.CharacterIntent" tabindex="0" role="button" aria-label="CharacterIntent"><rect x="302" y="697" width="285" height="151" rx="3" fill="#f2faf5" stroke="#2a7156" stroke-width="1.7" /><text x="316" y="718" class="stereotype" text-anchor="start">«Component»</text><text x="316" y="745" class="node-title" text-anchor="start">CharacterIntent</text><text x="316" y="770" class="small" text-anchor="start">movement：持续输入</text><text textLength="251" lengthAdjust="spacingAndGlyphs" x="316" y="793" class="small" text-anchor="start">jump_pending / interact_pending</text><text x="316" y="816" class="small" text-anchor="start">固定步消费后清除请求</text></g><g class="node component" data-id="character.Transform" tabindex="0" role="button" aria-label="角色状态与 Transform"><rect x="626" y="697" width="340" height="151" rx="3" fill="#f2faf5" stroke="#2a7156" stroke-width="1.7" /><text x="640" y="718" class="stereotype" text-anchor="start">«Component»</text><text x="640" y="745" class="node-title" text-anchor="start">角色状态与 Transform</text><text x="640" y="770" class="small" text-anchor="start">CharacterMotion：速度 / 着地</text><text x="640" y="793" class="small" text-anchor="start">角色 Transform：位置 / 朝向</text><text x="640" y="816" class="small" text-anchor="start">组件挂在角色实体上</text></g><g class="node component" data-id="camera.OrbitCamera" tabindex="0" role="button" aria-label="OrbitCamera"><rect x="1005" y="697" width="250" height="151" rx="3" fill="#f2faf5" stroke="#2a7156" stroke-width="1.7" /><text x="1019" y="718" class="stereotype" text-anchor="start">«Component»</text><text x="1019" y="745" class="node-title" text-anchor="start">OrbitCamera</text><text textLength="216" lengthAdjust="spacingAndGlyphs" x="1019" y="770" class="small" text-anchor="start">目标 / 模式 / yaw / 两组 pitch</text><text x="1019" y="793" class="small" text-anchor="start">MouseLookState：捕获状态</text><text x="1019" y="816" class="small" text-anchor="start">相机 Transform：最终姿态</text></g><g class="node component" data-id="visual.GlobalTransform" tabindex="0" role="button" aria-label="视觉子实体"><rect x="1294" y="697" width="236" height="151" rx="3" fill="#f2faf5" stroke="#2a7156" stroke-width="1.7" /><text x="1308" y="718" class="stereotype" text-anchor="start">«Component»</text><text x="1308" y="745" class="node-title" text-anchor="start">视觉子实体</text><text x="1308" y="770" class="small" text-anchor="start">Mesh3d / 材质</text><text x="1308" y="793" class="small" text-anchor="start">ChildOf → 业务根实体</text><text x="1308" y="816" class="small" text-anchor="start">GlobalTransform → 渲染</text></g><g class="node resource" data-id="resource.GameSettings" tabindex="0" role="button" aria-label="GameSettings"><rect x="30" y="697" width="235" height="151" rx="3" fill="#fffaf0" stroke="#8b6130" stroke-width="1.7" /><text x="44" y="718" class="stereotype" text-anchor="start">«Resource»</text><text x="44" y="745" class="node-title" text-anchor="start">共享 Resource</text><text textLength="201" lengthAdjust="spacingAndGlyphs" x="44" y="770" class="small" text-anchor="start">GameSettings：帧率 / 相机</text><text textLength="201" lengthAdjust="spacingAndGlyphs" x="44" y="793" class="small" text-anchor="start">PrototypeConfig：玩法参数</text><text x="44" y="816" class="small" text-anchor="start">max_fps ≥ 60；默认 60</text></g><g class="edge read" data-connect="resource.GameSettings|frame_limit"><path d="M147,697 L147,562" stroke="#2d72ad" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow-read)"/><rect x="113" y="617" width="68" height="24" rx="4" fill="#fffdf9"/><text x="147" y="634" class="edge-label" text-anchor="middle">R 设置</text></g><g class="edge write" data-connect="observe_move|character.CharacterIntent"><path d="M410,562 L410,697" stroke="#288554" stroke-width="2" fill="none"  marker-end="url(#arrow-write)"/><rect x="376" y="617" width="68" height="24" rx="4" fill="#fffdf9"/><text x="410" y="634" class="edge-label" text-anchor="middle">W 意图</text></g><g class="edge write" data-connect="observe_look|perspective_apply|camera.OrbitCamera"><path d="M566,562 L566,675 L1040,675 L1040,697" stroke="#288554" stroke-width="2" fill="none"  marker-end="url(#arrow-write)"/><rect x="857.5" y="662" width="129" height="24" rx="4" fill="#fffdf9"/><text x="922" y="679" class="edge-label" text-anchor="middle">W 角度 / 模式</text></g><g class="edge read" data-connect="character.CharacterIntent|movement"><path d="M587,754 L607,754 L607,582 L650,582 L650,562" stroke="#2d72ad" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow-read)"/><rect x="573" y="636" width="68" height="24" rx="4" fill="#fffdf9"/><text x="607" y="653" class="edge-label" text-anchor="middle">R 意图</text></g><g class="edge write" data-connect="movement|character.Transform"><path d="M791,562 L791,697" stroke="#288554" stroke-width="2" fill="none"  marker-end="url(#arrow-write)"/><rect x="757" y="627" width="68" height="24" rx="4" fill="#fffdf9"/><text x="791" y="644" class="edge-label" text-anchor="middle">W 运动</text></g><g class="edge read" data-connect="camera.OrbitCamera|facing_update"><path d="M1140,697 L1140,562" stroke="#2d72ad" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow-read)"/><rect x="1106" y="627" width="68" height="24" rx="4" fill="#fffdf9"/><text x="1140" y="644" class="edge-label" text-anchor="middle">R 角度</text></g><g class="edge read" data-connect="character.Transform|camera_follow"><path d="M930,697 L930,648 L1024,648 L1024,562" stroke="#2d72ad" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#arrow-read)"/><rect x="923" y="635" width="102" height="24" rx="4" fill="#fffdf9"/><text x="974" y="652" class="edge-label" text-anchor="middle">R 角色姿态</text></g><g class="edge write" data-connect="transform_propagate|visual.GlobalTransform"><path d="M1412,562 L1412,697" stroke="#288554" stroke-width="2" fill="none"  marker-end="url(#arrow-write)"/><rect x="1361" y="628" width="102" height="24" rx="4" fill="#fffdf9"/><text x="1412" y="645" class="edge-label" text-anchor="middle">W 世界变换</text></g><text x="36" y="900" class="note" text-anchor="start">图例：粗箭头＝执行顺序　R 蓝虚线＝读取　W 绿实线＝写入　Event 橙虚线＝触发　紫线＝引用 / 关系</text></g></svg>