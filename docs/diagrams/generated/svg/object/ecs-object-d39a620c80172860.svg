anslate(0, -17.200000762939453)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style="fill:#1F3340 !important"><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="bold">IrradianceVolume</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="normal">用三维环境光体素提供局部间接照明。</tspan></tspan></text></g></g></g><g class="node default node_system internal" id="object-d39a620c80172860-flowchart-n1-2" data-look="classic" transform="translate(482.5, 48.89999771118164)" data-id="schedule-system-5d351c62c30ed08e" data-instance="object-d39a620c80172860--n1" data-role="internal" data-feature="infrastructure" data-mermaid-id="n1" data-visual-type="system" data-shape="rounded" tabindex="0" role="button" aria-pressed="false" aria-label="gather_light_probes&lt;bevy_light::probe::IrradianceVolume&gt; · 系统" data-center-x="482.5" data-center-y="48.89999771118164"><title>gather_light_probes&lt;bevy_light::probe::IrradianceVolume&gt; · 逐视图筛选可见集合中指定类型的探针，跳过图像未加载的候选并按相机距离排序，构建该视图的探针与纹理映射；结果为空时移除旧探针组件。</title><rect class="basic label-container" style="fill:#EFF3F8 !important;stroke:#3567A6 !important;stroke-width:1.6px !important" rx="5" ry="5" x="-156.5" y="-40.89999961853027" width="313" height="81.79999923706055" data-shape-part="object-d39a620c80172860--n1"/><g class="label" style="color:#1F3340 !important" transform="translate(0, -24.899999618530273)"><rect/><g><rect class="background" style="stroke: none"/><text y="-10.1" style="fill:#1F3340 !important"><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="bold">gather_light_probes&lt;bevy_light::</tspan></tspan><tspan class="text-outer-tspan row" x="0" y="1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="bold">probe::IrradianceVolume&gt;</tspan></tsp