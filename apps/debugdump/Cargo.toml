[package]
name = "demo-debugdump"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[[bin]]
name = "demo-debugdump"
path = "src/main.rs"
required-features = ["debugdump"]
test = false

[features]
default = ["debugdump"]
debugdump = ["dep:analysis-contract", "dep:bevy_mod_debugdump", "dep:sha2"]

[dependencies]
bevy.workspace = true
bevy_enhanced_input.workspace = true
bevy_framepace.workspace = true
avian3d.workspace = true
bevy_kira_audio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
analysis-contract = { path = "../../tools/rustc-analysis/contract", optional = true }
bevy_mod_debugdump = { version = "=0.17.0", default-features = false, optional = true }
sha2 = { version = "0.10.9", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
