[package]
name = "demo-acceptance"
version = "0.1.0"
edition = "2024"
publish = false
build = "../build.rs"

[[bin]]
name = "demo-acceptance"
path = "src/main.rs"
required-features = ["acceptance-test"]

[features]
default = ["acceptance-test"]
acceptance-test = ["bevy/bevy_remote", "dep:bevy-acceptance-test"]

[dependencies]
bevy.workspace = true
bevy_enhanced_input.workspace = true
bevy_framepace.workspace = true
avian3d.workspace = true
bevy_kira_audio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
bevy-acceptance-test = { git = "https://github.com/fedoraiver/bevy-acceptance-test.git", branch = "master", optional = true }
