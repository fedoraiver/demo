[package]
name = "check-named-fields"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
default-run = "check-named-fields"

[[bin]]
name = "check-named-fields-driver"
path = "src/driver.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
