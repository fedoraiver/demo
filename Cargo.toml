[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19.1"

# Keep project code quick to compile and easy to debug.
[profile.dev]
opt-level = 1
debug = 2

# Optimize Bevy and other dependencies for usable runtime performance.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
