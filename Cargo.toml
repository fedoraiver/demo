[package]
name = "demo"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
bevy = "0.19.1"
bevy-inspector-egui = { version = "0.37.0", features = ["highlight_changes"] }
bevy_enhanced_input = "0.26.0"
bevy_kira_audio = { version = "=0.26.0", default-features = false, features = ["ogg", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }

# Keep project code quick to compile and easy to debug.
[profile.dev]
opt-level = 1
debug = 2

# Optimize Bevy and other dependencies for usable runtime performance.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
