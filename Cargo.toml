[workspace]
members = ["apps/game", "apps/inspector", "apps/acceptance", "apps/debugdump"]
default-members = ["apps/game"]
exclude = [
    "tools/check-entity-names",
    "tools/check-named-fields",
    "tools/rustc-analysis",
    "tools/rustc-analysis/contract",
]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.20.1", features = ["bevy_settings"] }
bevy_enhanced_input = "0.27.0"
bevy_framepace = { version = "0.23.0", default-features = false }
avian3d = { version = "0.8.0", default-features = false, features = ["3d", "parry-f32"] }
bevy_kira_audio = { version = "=0.27.1", default-features = false, features = ["ogg", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
raw-window-handle = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSView", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[profile.dev]
opt-level = 1
debug = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
