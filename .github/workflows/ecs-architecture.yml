name: ECS architecture

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/build.rs'
      - 'apps/*/Cargo.toml'
      - 'apps/game/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build_configuration.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/ecs-architecture.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecs-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: fedoraiver/bevy-cicd/.github/workflows/architecture-build.yml@f33c4563900ae0725bdc199ef84d0f23d4bbcb09

  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build
    uses: fedoraiver/bevy-cicd/.github/workflows/architecture-pages.yml@f33c4563900ae0725bdc199ef84d0f23d4bbcb09
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      verify-ecs-site: true
