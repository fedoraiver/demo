name: Rust checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare formatter
        uses: ./.github/actions/setup-rust-checks
        with:
          prepare-build: 'false'

      - name: Check Rust formatting
        run: |
          $manifests = @(
            'Cargo.toml',
            'tools/rustc-analysis/Cargo.toml',
            'tools/check-entity-names/Cargo.toml',
            'tools/check-named-fields/Cargo.toml'
          )
          foreach ($manifest in $manifests) {
            cargo fmt --manifest-path $manifest --all -- --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  quality:
    name: rust (${{ matrix.configuration }})
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, debugdump]
    defaults:
      run:
        shell: pwsh
    env:
      CHECK_CONFIGURATION: ${{ matrix.configuration }}
      CARGO_TERM_COLOR: always
      # 完整 Bevy 测试需要链接；CI 省略调试符号以控制磁盘占用。
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare Rust build
        uses: ./.github/actions/setup-rust-checks

      - name: Check all Cargo targets
        id: check
        run: |
          $cargoArgs = @('check', '--locked', '--all-targets')
          if ($env:CHECK_CONFIGURATION -eq 'debugdump') { $cargoArgs += @('--features', 'debugdump') }
          cargo @cargoArgs
          exit $LASTEXITCODE

      - name: Run Clippy with pedantic warnings
        id: clippy
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          $cargoArgs = @('clippy', '--locked', '--all-targets')
          if ($env:CHECK_CONFIGURATION -eq 'debugdump') { $cargoArgs += @('--features', 'debugdump') }
          $cargoArgs += @('--', '--no-deps', '-W', 'clippy::pedantic')
          cargo @cargoArgs
          exit $LASTEXITCODE

      - name: Run headless tests
        id: test
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: |
          $cargoArgs = @('test', '--locked')
          if ($env:CHECK_CONFIGURATION -eq 'debugdump') { $cargoArgs += @('--features', 'debugdump') }
          $cargoArgs += @('--', '--test-threads=1')
          cargo @cargoArgs
          exit $LASTEXITCODE

      - name: Summarize checks and disk space
        if: ${{ always() }}
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          $summary = @(
            "## Rust ($env:CHECK_CONFIGURATION)",
            "Compilation: $env:CHECK_OUTCOME",
            "Clippy (default levels and pedantic warnings): $env:CLIPPY_OUTCOME",
            "Headless tests: $env:TEST_OUTCOME",
            '',
            '### Remaining disk space',
            '| Drive | Free GiB |',
            '| --- | ---: |'
          )
          foreach ($drive in Get-PSDrive -PSProvider FileSystem) {
            $summary += ('| {0} | {1:N2} |' -f $drive.Name, ($drive.Free / 1GB))
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table

  rules:
    name: ${{ matrix.rule }}
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        rule: [entity-names, named-fields]
    defaults:
      run:
        shell: pwsh
    env:
      ANALYSIS_RULE: ${{ matrix.rule }}
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare Rust build
        id: dependencies
        uses: ./.github/actions/setup-rust-checks

      - name: Verify regressions and default configuration
        id: default
        run: |
          pwsh -NoProfile -File "./scripts/check-$env:ANALYSIS_RULE.ps1"
          exit $LASTEXITCODE

      - name: Check debugdump configuration
        id: debugdump
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          pwsh -NoProfile -File ./scripts/rustc-analysis.ps1 check --rule $env:ANALYSIS_RULE --workspace $env:GITHUB_WORKSPACE --features debugdump
          exit $LASTEXITCODE

      - name: Summarize checks and disk space
        if: ${{ always() }}
        env:
          DEFAULT_OUTCOME: ${{ steps.default.outcome }}
          DEBUGDUMP_OUTCOME: ${{ steps.debugdump.outcome }}
        run: |
          $summary = @(
            "## $env:ANALYSIS_RULE",
            "Default configuration and regressions: $env:DEFAULT_OUTCOME",
            "debugdump configuration: $env:DEBUGDUMP_OUTCOME",
            '',
            '### Remaining disk space',
            '| Drive | Free GiB |',
            '| --- | ---: |'
          )
          foreach ($drive in Get-PSDrive -PSProvider FileSystem) {
            $summary += ('| {0} | {1:N2} |' -f $drive.Name, ($drive.Free / 1GB))
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free | Format-Table
