name: Rust checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build_configuration.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/rust-rules.yml'
      - '!**/*.md'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build_configuration.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/rust-rules.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: fedoraiver/bevy-cicd/.github/workflows/rust-checks.yml@08401c3e82659ab80b42ccb5f82ded757be20ea6

  rules:
    uses: fedoraiver/bevy-cicd/.github/workflows/bevy-rules.yml@08401c3e82659ab80b42ccb5f82ded757be20ea6
    with:
      package-path: apps/game
