name: Rust checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build_configuration.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/rust-rules.yml'
      - '!**/*.md'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'apps/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build_configuration.rs'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/rust-rules.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: fedoraiver/bevy-cicd/.github/workflows/rust-checks.yml@f33c4563900ae0725bdc199ef84d0f23d4bbcb09

  rules:
    uses: fedoraiver/bevy-cicd/.github/workflows/bevy-rules.yml@f33c4563900ae0725bdc199ef84d0f23d4bbcb09
    with:
      package-path: apps/game
